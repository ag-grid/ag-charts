name: tidy-nx-cache
description: Reset the Nx cache before a build when it grows past a branch-type size threshold, and log the final cache size.

inputs:
    branch_type:
        description: 'Type of branch (pr, latest, release)'
        required: false
        default: 'pr'
    pr_threshold_mb:
        description: 'On-disk size in MB above which a PR run resets the Nx cache.'
        required: false
        default: '700'

runs:
    using: 'node24'
    main: 'main.mjs'
    post: 'post.mjs'
