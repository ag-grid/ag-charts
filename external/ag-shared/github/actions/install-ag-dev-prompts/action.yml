name: 'Install @ag-grid/dev-prompts'
description: Install the private @ag-grid/dev-prompts package from GitHub Packages into .ag-dev-prompts/ so its shipped composite actions can be used via local-path uses:.

inputs:
    channel:
        description: 'npm dist-tag to install (e.g. canary, latest)'
        required: true
    github-token:
        description: 'Token with packages:read scope'
        required: false
        default: ${{ github.token }}
    node-version:
        description: 'Optional Node version override; defaults to the repo package.json via node-version-file.'
        required: false
        default: ''

runs:
    using: composite
    steps:
        - name: Setup Node (GitHub Packages for @ag-grid scope)
          uses: actions/setup-node@v7
          with:
              node-version: ${{ inputs.node-version || '' }}
              node-version-file: ${{ inputs.node-version == '' && 'package.json' || '' }}
              registry-url: https://npm.pkg.github.com
              scope: '@ag-grid'

        - name: Install @ag-grid/dev-prompts@${{ inputs.channel }}
          shell: bash
          env:
              NODE_AUTH_TOKEN: ${{ inputs.github-token }}
              DEV_PROMPTS_CHANNEL: ${{ inputs.channel }}
          run: |
              set -euo pipefail
              mkdir -p "$GITHUB_WORKSPACE/.ag-dev-prompts"
              cd "$GITHUB_WORKSPACE/.ag-dev-prompts"
              echo '{"name":"ag-dev-prompts-install","private":true}' > package.json

              # npm.pkg.github.com occasionally stalls a request mid-flight (observed:
              # zero output for 5+ minutes, no 4xx/5xx, just a hung DNS/connect phase)
              # rather than failing fast. `timeout` bounds each attempt so a stall
              # costs one retry instead of the whole job's timeout budget.
              for attempt in 1 2 3; do
                  if timeout 60 npm install --no-save --silent \
                      --fetch-timeout=20000 \
                      --fetch-retries=1 \
                      --fetch-retry-mintimeout=2000 \
                      --fetch-retry-maxtimeout=10000 \
                      "@ag-grid/dev-prompts@${DEV_PROMPTS_CHANNEL}"; then
                      exit 0
                  fi
                  if [ "$attempt" -lt 3 ]; then
                      echo "::warning::npm install of @ag-grid/dev-prompts@${DEV_PROMPTS_CHANNEL} attempt ${attempt} timed out or failed; retrying"
                      sleep 5
                  fi
              done

              echo "::error::npm install of @ag-grid/dev-prompts@${DEV_PROMPTS_CHANNEL} failed after 3 attempts"
              exit 1
