<div class="example-controls">
    <div class="controls-row">
        <span>Rotation:</span>
        <div class="button-group" role="group" aria-label="Rotation">
            <input
                type="radio"
                id="rotation-none"
                name="label-rotation"
                value="none"
                onchange="rotationChange(event)"
            />
            <label for="rotation-none">No rotation</label>
            <input
                type="radio"
                id="rotation-fixed"
                name="label-rotation"
                value="fixed"
                onchange="rotationChange(event)"
            />
            <label for="rotation-fixed">Fixed rotation</label>
            <input
                type="radio"
                id="rotation-auto"
                name="label-rotation"
                value="auto"
                checked
                onchange="rotationChange(event)"
            />
            <label for="rotation-auto">Auto rotation (default)</label>
        </div>
    </div>
    <div class="controls-row">
        <span>Values:</span>
        <div class="button-group" role="group" aria-label="Values">
            <input
                type="radio"
                id="values-uniform"
                name="label-values"
                value="uniform"
                checked
                onchange="valuesChange(event)"
            />
            <label for="values-uniform">Uniform labels</label>
            <input
                type="radio"
                id="values-irregular"
                name="label-values"
                value="irregular"
                onchange="valuesChange(event)"
            />
            <label for="values-irregular">Irregular labels</label>
        </div>
    </div>
    <div class="controls-row">
        <span>Avoid Collisions:</span>
        <div class="button-group" role="group" aria-label="Avoid Collisions">
            <input
                type="radio"
                id="collisions-off"
                name="collision-avoidance"
                value="off"
                onchange="collisionsChange(event)"
            />
            <label for="collisions-off">Off</label>
            <input
                type="radio"
                id="collisions-on"
                name="collision-avoidance"
                value="on"
                checked
                onchange="collisionsChange(event)"
            />
            <label for="collisions-on">On (default)</label>
        </div>
        <button class="push-right" onclick="reset()">Default</button>
    </div>
</div>
<div id="myChart"></div>
