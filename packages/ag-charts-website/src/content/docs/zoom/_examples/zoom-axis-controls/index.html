<div class="example-controls">
    <div class="controls-row">
        <select onchange="setAxisDragging(event.target.value)">
            <option value="zoom">Axis Dragging Mode: Zoom</option>
            <option value="pan">Axis Dragging Mode: Pan</option>
            <option value="off">Axis Dragging Mode: Off</option>
        </select>
        <select onchange="setAxisScrolling(event.target.value)">
            <option value="on">Axis Scrolling: On</option>
            <option value="off">Axis Scrolling: Off</option>
        </select>
    </div>
</div>
<div id="myChart"></div>
