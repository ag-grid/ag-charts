<div class="example-controls">
    <div class="controls-row">
        <span>Axis Dragging:</span>
        <div class="button-group gap-right" role="group" aria-label="Axis Dragging">
            <input
                type="radio"
                id="axis-dragging-enabled"
                name="axis-dragging"
                value="true"
                checked
                onchange="enableAxisDragging(event)"
            />
            <label for="axis-dragging-enabled">Enabled</label>
            <input
                type="radio"
                id="axis-dragging-disabled"
                name="axis-dragging"
                value="false"
                onchange="enableAxisDragging(event)"
            />
            <label for="axis-dragging-disabled">Disabled</label>
        </div>
        <fieldset id="axisDraggingModeGroup" class="control-group">
            <span>Axis Dragging Mode:</span>
            <div class="button-group gap-right" role="group" aria-label="Axis Dragging Mode">
                <input
                    type="radio"
                    id="axis-dragging-mode-zoom"
                    name="axis-dragging-mode"
                    value="zoom"
                    checked
                    onchange="setAxisDragging(event)"
                />
                <label for="axis-dragging-mode-zoom">Zoom</label>
                <input
                    type="radio"
                    id="axis-dragging-mode-pan"
                    name="axis-dragging-mode"
                    value="pan"
                    onchange="setAxisDragging(event)"
                />
                <label for="axis-dragging-mode-pan">Pan</label>
            </div>
        </fieldset>
        <span>Axis Scrolling:</span>
        <div class="button-group" role="group" aria-label="Axis Scrolling">
            <input
                type="radio"
                id="axis-scrolling-enabled"
                name="axis-scrolling"
                value="true"
                checked
                onchange="enableAxisScrolling(event)"
            />
            <label for="axis-scrolling-enabled">Enabled</label>
            <input
                type="radio"
                id="axis-scrolling-disabled"
                name="axis-scrolling"
                value="false"
                onchange="enableAxisScrolling(event)"
            />
            <label for="axis-scrolling-disabled">Disabled</label>
        </div>
    </div>
</div>
<div id="myChart"></div>
