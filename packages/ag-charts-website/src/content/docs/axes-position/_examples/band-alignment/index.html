<div class="example-controls">
    <div class="controls-row">
        <div class="button-group" role="group" aria-label="Band Alignment">
            <input
                type="radio"
                id="alignment-justify"
                name="band-alignment"
                value="justify"
                onchange="alignmentChange(event)"
            />
            <label for="alignment-justify">Justify</label>
            <input
                type="radio"
                id="alignment-start"
                name="band-alignment"
                value="start"
                checked
                onchange="alignmentChange(event)"
            />
            <label for="alignment-start">Start</label>
            <input
                type="radio"
                id="alignment-center"
                name="band-alignment"
                value="center"
                onchange="alignmentChange(event)"
            />
            <label for="alignment-center">Center</label>
            <input
                type="radio"
                id="alignment-end"
                name="band-alignment"
                value="end"
                onchange="alignmentChange(event)"
            />
            <label for="alignment-end">End</label>
        </div>
    </div>
</div>
<div id="myChart"></div>
