<div class="example-controls">
    <div class="controls-row">
        <label>
            <input type="checkbox" role="switch" onchange="toggleFeature('navigator', event.target.checked)" />
            Navigator
        </label>
        <label>
            <input type="checkbox" role="switch" checked onchange="toggleFeature('toolbar', event.target.checked)" />
            Toolbar
        </label>
        <label>
            <input
                type="checkbox"
                role="switch"
                checked
                onchange="toggleFeature('rangeButtons', event.target.checked)"
            />
            Range Buttons
        </label>
        <label>
            <input type="checkbox" role="switch" checked onchange="toggleFeature('volume', event.target.checked)" />
            Volume
        </label>
        <label>
            <input type="checkbox" role="switch" checked onchange="toggleFeature('statusBar', event.target.checked)" />
            Status Bar
        </label>
        <label>
            <input type="checkbox" role="switch" checked onchange="toggleFeature('zoom', event.target.checked)" />
            Zoom
        </label>
        <label>
            <input type="checkbox" role="switch" onchange="toggleVolumeProfile(event.target.checked)" />
            Volume Profile
        </label>
    </div>
</div>
<div id="myChart"></div>
