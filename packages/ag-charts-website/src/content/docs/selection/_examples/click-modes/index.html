<div class="example-controls">
    <div class="controls-row">
        <span>Click mode:</span>
        <div class="button-group gap-right" role="group" aria-label="Click mode">
            <input
                type="radio"
                id="click-mode-single"
                name="click-mode"
                value="single"
                checked
                onchange="setClickMode(event)"
            />
            <label for="click-mode-single"><code>'single'</code></label>
            <input
                type="radio"
                id="click-mode-multiple"
                name="click-mode"
                value="multiple"
                onchange="setClickMode(event)"
            />
            <label for="click-mode-multiple"><code>'multiple'</code></label>
        </div>
        <span>Click-away to clear:</span>
        <div class="button-group" role="group" aria-label="Click-away to clear">
            <input
                type="radio"
                id="click-away-true"
                name="click-away"
                value="true"
                checked
                onchange="setClickAway(event)"
            />
            <label for="click-away-true"><code>true</code></label>
            <input type="radio" id="click-away-false" name="click-away" value="false" onchange="setClickAway(event)" />
            <label for="click-away-false"><code>false</code></label>
        </div>
    </div>
</div>
<div id="myChart"></div>
