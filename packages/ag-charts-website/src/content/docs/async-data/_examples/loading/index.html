<div class="example-controls">
    <div class="controls-row">
        Loading:
        <div class="button-group" role="group" aria-label="Loading">
            <input type="radio" id="loading-true" name="loading-state" value="true" onchange="loadingChange(event)" />
            <label for="loading-true"><code>true</code></label>
            <input type="radio" id="loading-false" name="loading-state" value="false" onchange="loadingChange(event)" />
            <label for="loading-false"><code>false</code></label>
            <input
                type="radio"
                id="loading-undefined"
                name="loading-state"
                value="undefined"
                checked
                onchange="loadingChange(event)"
            />
            <label for="loading-undefined"><code>undefined</code></label>
        </div>
    </div>
    <div class="controls-row">
        <button onclick="reload()">Reload</button>
    </div>
</div>
<div id="myChart"></div>
