<div class="example-controls">
    <div class="controls-row">
        <span>Interval:</span>
        <div class="button-group" role="group" aria-label="Interval">
            <input
                type="radio"
                id="spacing-default"
                name="interval-spacing"
                value="default"
                checked
                onchange="spacingChange(event)"
            />
            <label for="spacing-default">Default Spacing</label>
            <input
                type="radio"
                id="spacing-min-max"
                name="interval-spacing"
                value="min-max"
                onchange="spacingChange(event)"
            />
            <label for="spacing-min-max">Min Spacing = 15, Max Spacing = 25</label>
        </div>
    </div>
</div>
<div class="resizable-container">
    <div id="myChart" class="resizable"></div>
</div>
