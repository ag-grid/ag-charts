<div class="example-controls">
    <div class="controls-row">
        <div class="button-group" role="group" aria-label="Highlighted Item Shadow">
            <input
                type="radio"
                id="highlight-shadow-on"
                name="highlight-shadow"
                value="true"
                checked
                onchange="setHighlightShadow(event)"
            />
            <label for="highlight-shadow-on">Shadow On</label>
            <input
                type="radio"
                id="highlight-shadow-off"
                name="highlight-shadow"
                value="false"
                onchange="setHighlightShadow(event)"
            />
            <label for="highlight-shadow-off">Shadow Off</label>
        </div>
    </div>
</div>
<div id="myChart"></div>
