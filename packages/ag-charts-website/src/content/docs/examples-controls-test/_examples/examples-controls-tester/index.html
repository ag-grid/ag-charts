<div class="style-guide toolbar">
    <div class="style-guide-item">
        <code>p</code>
        <p>I'm a paragraph.</p>
        <p>I'm a paragraph with <code>some code</code></p>
    </div>

    <div class="style-guide-item">
        <code>label</code>
        <label>I'm a label</label>
    </div>

    <div class="style-guide-item">
        <code>pre</code>
        <pre>I'm a pre</pre>
    </div>

    <div class="style-guide-item">
        <code>button</code>
        <button>I'm a button</button>
        <button>I'm a button with <code>`some code`</code></button>
    </div>

    <div class="style-guide-item">
        <code>input type="submit"</code>
        <input type="submit" value="I'm a `submit` input" />
    </div>

    <div class="style-guide-item">
        <code>input type="text"</code>
        <input type="text" placeholder="I'm a text input" />
    </div>

    <div class="style-guide-item">
        <code>input type="checkbox"</code>
        <input type="checkbox" id="checked-c" name="checked" checked />
        <label for="checked-c">I'm a checked checkbox with label</label>
        <input type="checkbox" id="unchecked-c" name="unchecked" />
        <label for="unchecked-c">I'm an unchecked checkbox with label</label>
    </div>

    <div class="style-guide-item">
        <code>input type="radio"</code>
        <input type="radio" id="checked-r" name="radio" checked />
        <label for="checked-r">I'm a checked radio button with label</label>
        <input type="radio" id="unchecked-r" name="radio" />
        <label for="unchecked-r">I'm an unchecked radio button with label</label>
    </div>

    <div class="style-guide-item">
        <code>input type="number"</code>
        <input type="number" id="number" value="999" />
        <label for="number">I'm a number input with label</label>
    </div>

    <div class="style-guide-item">
        <code>input type="range"</code>
        <input type="range" min="0" max="10" step="1" value="5" />
        <label for="number">I'm a range input (slider) with label</label>
    </div>

    <div class="style-guide-item">
        <code>textarea</code>
        <textarea placeholder="I'm a textarea"></textarea>
    </div>

    <div class="style-guide-item">
        <code>select</code>
        <label for="select">I'm a select with a label</label>
        <select name="select" id="select">
            <option value="Alpha">Alpha</option>
            <option value="Beta">Beta</option>
            <option value="Gamma">Alpha</option>
        </select>
    </div>
</div>
