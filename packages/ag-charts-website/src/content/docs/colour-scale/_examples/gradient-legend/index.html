<div class="example-controls">
    <div class="controls-row">
        Position:
        <div class="button-group" role="group" aria-label="Position">
            <input
                type="radio"
                id="gradient-legend-position-bottom"
                name="gradient-legend-position"
                value="bottom"
                onchange="positionChange(event)"
            />
            <label for="gradient-legend-position-bottom">Bottom</label>
            <input
                type="radio"
                id="gradient-legend-position-right"
                name="gradient-legend-position"
                value="right"
                checked
                onchange="positionChange(event)"
            />
            <label for="gradient-legend-position-right">Right</label>
            <input
                type="radio"
                id="gradient-legend-position-left"
                name="gradient-legend-position"
                value="left"
                onchange="positionChange(event)"
            />
            <label for="gradient-legend-position-left">Left</label>
            <input
                type="radio"
                id="gradient-legend-position-top"
                name="gradient-legend-position"
                value="top"
                onchange="positionChange(event)"
            />
            <label for="gradient-legend-position-top">Top</label>
        </div>
    </div>
    <div class="controls-row">
        Thickness: <input type="range" min="5" max="60" value="16" step="1" oninput="setThickness(event)" />
        <span id="thicknessValue">16</span> <span class="gap-left">Length:</span>
        <input type="range" min="50" max="500" value="100" step="10" oninput="setLength(event)" />
        <span id="lengthValue">100</span> <span class="gap-left">Padding:</span>
        <input type="range" min="0" max="40" value="10" step="1" oninput="setPadding(event)" />
        <span id="paddingValue">10</span>
    </div>
</div>
<div id="myChart"></div>
