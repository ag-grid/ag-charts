<div class="example-controls">
    <div class="controls-row">
        <select onchange="setSeries(event.target.value)">
            <option value="area">Area</option>
            <option value="bar">Bar</option>
            <option value="line" selected>Line</option>
            <option value="range-area">Range Area</option>
            <option value="range-bar">Range Bar</option>
            <option value="candlestick">Candlestick</option>
            <option value="ohlc">OHLC</option>
        </select>
        <select onchange="setAxes(event.target.value)">
            <option value="time">Continuous Time</option>
            <option value="ordinal-time">Ordinal Time</option>
            <option value="ordinal-time-parent" selected>Ordinal Time (Parent Level)</option>
            <option value="unit-time">Unit Time</option>
        </select>
        <div class="button-group" role="group" aria-label="Data Size">
            <input type="radio" id="data-size-1k" name="data-size" value="1000" onchange="setData(event)" />
            <label for="data-size-1k">1k</label>
            <input type="radio" id="data-size-10k" name="data-size" value="10000" checked onchange="setData(event)" />
            <label for="data-size-10k">10k</label>
            <input type="radio" id="data-size-100k" name="data-size" value="100000" onchange="setData(event)" />
            <label for="data-size-100k">100k</label>
            <input type="radio" id="data-size-1m" name="data-size" value="1000000" onchange="setData(event)" />
            <label for="data-size-1m">1m</label>
        </div>
    </div>
</div>
<div id="myChart"></div>
