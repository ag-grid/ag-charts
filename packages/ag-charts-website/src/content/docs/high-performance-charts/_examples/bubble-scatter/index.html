<div class="example-controls">
    <div class="controls-row">
        <select onchange="setSeries(event.target.value)">
            <option value="bubble" selected>Bubble</option>
            <option value="scatter">Scatter</option>
        </select>
        <select onchange="setShape(event.target.value)">
            <option value="circle" selected>Circle</option>
            <option value="cross">Cross</option>
            <option value="diamond">Diamond</option>
            <option value="heart">Heart</option>
            <option value="plus">Plus</option>
            <option value="square">Square</option>
            <option value="star">Star</option>
            <option value="triangle">Triangle</option>
        </select>
        <div class="button-group" role="group" aria-label="Data Size">
            <input type="radio" id="data-size-1k" name="data-size" value="1000" onchange="setData(event)" />
            <label for="data-size-1k">1k</label>
            <input type="radio" id="data-size-10k" name="data-size" value="10000" checked onchange="setData(event)" />
            <label for="data-size-10k">10k</label>
            <input type="radio" id="data-size-100k" name="data-size" value="100000" onchange="setData(event)" />
            <label for="data-size-100k">100k</label>
            <input type="radio" id="data-size-1m" name="data-size" value="1000000" onchange="setData(event)" />
            <label for="data-size-1m">1m</label>
        </div>
        <label>
            <span>Max Visible Items</span>
            <input
                type="range"
                min="500"
                max="10000"
                step="500"
                value="2000"
                onchange="setMaxVisibleItems(event.target.valueAsNumber)"
            />
        </label>
    </div>
</div>
<div id="myChart"></div>
