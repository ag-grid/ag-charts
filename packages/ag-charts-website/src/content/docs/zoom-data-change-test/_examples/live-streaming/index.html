<div class="example-controls">
    <div class="controls-row">
        <span>Strategy:</span>
        <div class="button-group gap-right" role="group" aria-label="Strategy">
            <input
                type="radio"
                id="strategy-preserveDomain"
                name="strategy"
                value="preserveDomain"
                checked
                onchange="setStrategy(event)"
            />
            <label for="strategy-preserveDomain">preserveDomain</label>
            <input
                type="radio"
                id="strategy-preserveRatios"
                name="strategy"
                value="preserveRatios"
                onchange="setStrategy(event)"
            />
            <label for="strategy-preserveRatios">preserveRatios</label>
            <input type="radio" id="strategy-reset" name="strategy" value="reset" onchange="setStrategy(event)" />
            <label for="strategy-reset">reset</label>
        </div>
        <button onclick="startStreaming()">Start Streaming</button>
        <button onclick="stopStreaming()">Stop Streaming</button>
        <button onclick="resetData()">Reset Data</button>
    </div>
</div>
<div id="myChart"></div>
