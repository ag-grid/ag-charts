<div class="example-controls">
    <div class="controls-row">
        <span> Placement: </span>
        <div class="button-group gap-right" role="group" aria-label="Placement">
            <input type="radio" id="placement-left" name="placement" value="left" onchange="placementChange(event)" />
            <label for="placement-left"><code>'left'</code></label>
            <input
                type="radio"
                id="placement-right"
                name="placement"
                value="right"
                checked
                onchange="placementChange(event)"
            />
            <label for="placement-right"><code>'right'</code></label>
            <input
                type="radio"
                id="placement-center"
                name="placement"
                value="center"
                onchange="placementChange(event)"
            />
            <label for="placement-center"><code>'center'</code></label>
        </div>
        <span> Edge Placement: </span>
        <div class="button-group" role="group" aria-label="Edge Placement">
            <input
                type="radio"
                id="edge-placement-outside"
                name="edge-placement"
                value="outside"
                checked
                onchange="edgePlacementChange(event)"
            />
            <label for="edge-placement-outside"><code>'outside'</code></label>
            <input
                type="radio"
                id="edge-placement-inside"
                name="edge-placement"
                value="inside"
                onchange="edgePlacementChange(event)"
            />
            <label for="edge-placement-inside"><code>'inside'</code></label>
            <input
                type="radio"
                id="edge-placement-default"
                name="edge-placement"
                value="default"
                onchange="edgePlacementChange(event)"
            />
            <label for="edge-placement-default"><code>undefined</code></label>
        </div>
    </div>
</div>
<div id="myChart"></div>
