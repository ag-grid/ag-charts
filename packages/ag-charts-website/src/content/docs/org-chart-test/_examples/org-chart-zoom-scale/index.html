<div class="example-controls">
    <div class="controls-row">
        <span>Scale:</span>
        <div class="button-group" role="group" aria-label="Scale">
            <input type="radio" id="scale-100" name="scale" value="100" checked onchange="scaleChange(event)" />
            <label for="scale-100">100</label>
            <input type="radio" id="scale-1000" name="scale" value="1000" onchange="scaleChange(event)" />
            <label for="scale-1000">1K</label>
            <input type="radio" id="scale-10000" name="scale" value="10000" onchange="scaleChange(event)" />
            <label for="scale-10000">10K</label>
            <input type="radio" id="scale-100000" name="scale" value="100000" onchange="scaleChange(event)" />
            <label for="scale-100000">100K</label>
        </div>
        <span id="scale-status" style="margin-left: 1em; font-style: italic"></span>
    </div>
</div>
<div id="myChart"></div>
