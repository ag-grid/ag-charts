<div class="example-controls">
    <div class="controls-row">
        <span>Axis Domain:</span>
        <div class="button-group" role="group" aria-label="Axis Domain">
            <input type="radio" id="domain-min-max" name="axis-domain" value="min-max" onchange="domainChange(event)" />
            <label for="domain-min-max">Min = -50, Max = 150</label>
            <input
                type="radio"
                id="domain-default"
                name="axis-domain"
                value="default"
                checked
                onchange="domainChange(event)"
            />
            <label for="domain-default">Default</label>
        </div>
    </div>
</div>
<div id="myChart"></div>
