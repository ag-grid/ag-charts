<div class="example-controls">
    <div class="controls-row">
        <label>Reverse Axis:</label>
        <button onclick="toggleRadiusReverse()">Toggle Radius</button>
        <button onclick="toggleAngleReverse()">Toggle Angle</button>
    </div>
    <div class="controls-row">
        <label>Data:</label>
        <button onclick="toggleDataSign()">Toggle Data Sign</button>

    <div class="controls-row">
        <label>Series:</label>
        <button onclick="toggleStacked()">Toggle Stacked</button>
    </div>
</div>
