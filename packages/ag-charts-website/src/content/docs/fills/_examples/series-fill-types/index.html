<div class="example-controls">
    <div class="controls-row">
        Fill Type:
        <div class="button-group" role="group" aria-label="Fill Type">
            <input
                type="radio"
                id="fill-default"
                name="fill-type"
                value="default"
                checked
                onchange="fillChange(event)"
            />
            <label for="fill-default">Default</label>
            <input type="radio" id="fill-gradient" name="fill-type" value="gradient" onchange="fillChange(event)" />
            <label for="fill-gradient">Gradient</label>
            <input type="radio" id="fill-pattern" name="fill-type" value="pattern" onchange="fillChange(event)" />
            <label for="fill-pattern">Pattern</label>
            <input type="radio" id="fill-image" name="fill-type" value="image" onchange="fillChange(event)" />
            <label for="fill-image">Image</label>
        </div>
    </div>
</div>
<div id="myChart"></div>
