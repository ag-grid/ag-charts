<div class="example-controls">
    <div class="controls-row">
        <div class="button-group gap-right" role="group" aria-label="Series Type">
            <input
                type="radio"
                id="series-type-line"
                name="series-type"
                value="line"
                checked
                onchange="seriesTypeChange(event)"
            />
            <label for="series-type-line">Line</label>
            <input
                type="radio"
                id="series-type-bar"
                name="series-type"
                value="bar"
                onchange="seriesTypeChange(event)"
            />
            <label for="series-type-bar">Bar</label>
        </div>
        <button onclick="removeOdds()">No Odd Months</button>
        <button onclick="removeOddsErrors()">No Odd Errors</button>
        <button onclick="randomiseData()">Randomise Data</button>
        <button onclick="randomiseErrors()">Randomise Errors</button>
        <button class="push-right" onclick="resetData()">Reset Data</button>
    </div>
</div>
<div id="myChart"></div>
