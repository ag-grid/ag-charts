<div class="example-controls">
    <div class="controls-row">
        <select id="myCountry" onchange="onCountryChange(event.target.value)">
            <option value="Spain">Spain</option>
            <option value="UK">UK</option>
            <option value="Ireland">Ireland</option>
            <option value="France">France</option>
            <option value="Germany">Germany</option>
        </select>
        <select id="myYear" onchange="onYearChange(event.target.value)">
            <option value="2010">2010</option>
            <option value="2011">2011</option>
            <option value="2012">2012</option>
            <option value="2013">2013</option>
            <option value="2014">2014</option>
            <option value="2015">2015</option>
            <option value="2016">2016</option>
            <option value="2017">2017</option>
            <option value="2018">2018</option>
            <option value="2019">2019</option>
            <option value="2020">2020</option>
            <option value="2021">2021</option>
            <option value="2022">2022</option>
            <option value="2023">2023</option>
            <option value="2024">2024</option>
        </select>
        <button onclick="logState()"><code>getState()</code> (1s delay)</button>
        <input type="checkbox" onchange="onFreezeChange(event.target.checked)">Freeze</input>
    </div>
</div>
<div id="myChart"></div>
