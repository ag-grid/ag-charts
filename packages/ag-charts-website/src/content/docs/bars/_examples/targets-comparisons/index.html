<div class="example-controls">
    <div class="controls-row">
        <label for="widthRatioSliderInput">Width Ratio:</label>
        <input
            type="range"
            id="widthRatioSliderInput"
            min="0.1"
            max="1.0"
            value="0.8"
            step="0.1"
            oninput="updateWidthRatio(event)"
            onchange="updateWidthRatio(event)"
        />
        <span id="widthRatioSliderValue">0.8</span>
    </div>
</div>
<div id="myChart"></div>
