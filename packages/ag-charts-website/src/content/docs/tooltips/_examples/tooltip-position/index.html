<div class="example-controls">
    <div class="controls-row">
        <span>Anchor to:</span>
        <select class="gap-right" onchange="setAnchorTo(event.target.value)">
            <option value="node">Node</option>
            <option value="pointer">Pointer</option>
            <option value="chart">Chart</option>
        </select>
        <span>Placement:</span>
        <select class="gap-right" onchange="setPlacement(event.target.value)">
            <option value="top">Top</option>
            <option value="top-right">Top Right</option>
            <option value="right">Right</option>
            <option value="bottom-right">Bottom Right</option>
            <option value="bottom">Bottom</option>
            <option value="bottom-left">Bottom Left</option>
            <option value="left">Left</option>
            <option value="top-left">Top Left</option>
            <hr />
            <option value="left, right">Left + Right fallback</option>
            <option value="right, left">Right + Left fallback</option>
        </select>
        <label for="offsetSlider">Offset:</label>
        <input
            type="range"
            id="offsetSlider"
            min="0"
            max="40"
            value="12"
            oninput="setOffset(event)"
            onchange="setOffset(event)"
        />
        <span id="offsetValue" style="display: inline-block; min-width: 3ch; text-align: right">12</span>
    </div>
</div>
<div id="myChart"></div>
