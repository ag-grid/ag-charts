<div class="example-controls">
    <div class="controls-row">
        <span>Series Type:</span>
        <div class="button-group" role="group" aria-label="Series Type">
            <input type="radio" id="type-line" name="series-type" value="line" checked onchange="typeChange(event)" />
            <label for="type-line">Line</label>
            <input type="radio" id="type-bar" name="series-type" value="bar" onchange="typeChange(event)" />
            <label for="type-bar">Bar</label>
        </div>
    </div>
</div>
<div id="myChart"></div>
