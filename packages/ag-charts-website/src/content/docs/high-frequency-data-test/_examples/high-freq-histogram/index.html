<div class="example-controls">
    <div class="controls-row">
        <button id="toggleFeedBtn" onclick="toggleFeed()">Start Feed</button>
        <button id="toggleRapidFeedBtn" onclick="toggleRapidFeed()">Start Rapid Feed</button>
        <button onclick="tickFeed()">Tick Feed</button>
        <select onchange="use(this.value)">
            <option value="applyTransaction-append">applyTransaction (append)</option>
            <option value="applyTransaction-prepend">applyTransaction (prepend)</option>
            <option value="applyTransaction-remove-first">applyTransaction (remove first)</option>
            <option value="applyTransaction-remove-last">applyTransaction (remove last)</option>
            <option value="updateDelta-append">updateDelta (append)</option>
            <option value="updateDelta-prepend">updateDelta (prepend)</option>
            <option value="updateDelta-remove-first">updateDelta (remove first)</option>
            <option value="updateDelta-remove-last">updateDelta (remove last)</option>
        </select>
        <span id="cpuUsage" style="margin-left: 10px">CPU: 0%</span>
    </div>
</div>
<div id="myChart"></div>
