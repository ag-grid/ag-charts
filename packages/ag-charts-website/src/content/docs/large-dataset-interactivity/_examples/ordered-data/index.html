<div class="example-controls">
    <div class="controls-row">
        <span>Series Type:</span>
        <select onchange="setSeries(event.target.value, event.target.selectedOptions[0].text)">
            <option value="line" selected>Line</option>
            <option value="area">Area</option>
            <option value="bar">Bar</option>
            <hr />
            <option value="stacked-bar">Stacked Bar</option>
            <option value="stacked-area">Stacked Area</option>
            <hr />
            <option value="range-area">Range Area</option>
            <option value="range-bar">Range Bar</option>
            <hr />
            <option value="candlestick">Candlestick</option>
            <option value="ohlc">OHLC</option>
            <hr />
            <option value="scatter">Scatter</option>
            <option value="bubble">Bubble</option>
            <hr />
            <option value="histogram">Histogram</option>
        </select>
        <span class="gap-left">Data Size:</span>
        <div class="button-group" role="group" aria-label="Data Size">
            <input
                type="radio"
                id="data-size-1k"
                name="data-size"
                value="1000"
                data-label="1K"
                checked
                onchange="setData(event)"
            />
            <label for="data-size-1k">1K</label>
            <input
                type="radio"
                id="data-size-10k"
                name="data-size"
                value="10000"
                data-label="10K"
                onchange="setData(event)"
            />
            <label for="data-size-10k">10K</label>
            <input
                type="radio"
                id="data-size-100k"
                name="data-size"
                value="100000"
                data-label="100K"
                onchange="setData(event)"
            />
            <label for="data-size-100k">100K</label>
            <input
                type="radio"
                id="data-size-500k"
                name="data-size"
                value="500000"
                data-label="500K"
                onchange="setData(event)"
            />
            <label for="data-size-500k">500K</label>
            <input
                type="radio"
                id="data-size-1m"
                name="data-size"
                value="1000000"
                data-label="1M"
                onchange="setData(event)"
            />
            <label for="data-size-1m">1M</label>
        </div>
    </div>
</div>
<div id="myChart"></div>
