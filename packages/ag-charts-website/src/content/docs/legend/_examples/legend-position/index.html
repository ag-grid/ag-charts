<div class="example-controls">
    <div class="controls-row">
        <div class="button-group gap-right" role="group" aria-label="Legend">
            <input
                type="radio"
                id="legend-show"
                name="legend-enabled"
                value="show"
                checked
                onchange="legendChange(event)"
            />
            <label for="legend-show">Show Legend</label>
            <input type="radio" id="legend-hide" name="legend-enabled" value="hide" onchange="legendChange(event)" />
            <label for="legend-hide">Hide Legend</label>
        </div>
        <fieldset id="legendPlacementGroup" class="control-group">
            <label for="legend-placement">Legend Placement:</label>
            <select id="legend-placement" onchange="updateLegendPlacement(event.target.value)">
                <option value="right">right</option>
                <option value="right-top">right-top</option>
                <option value="right-bottom">right-bottom</option>
                <option value="left">left</option>
                <option value="left-top">left-top</option>
                <option value="left-bottom">left-bottom</option>
                <option value="top">top</option>
                <option value="top-right">top-right</option>
                <option value="top-left">top-left</option>
                <option value="bottom">bottom</option>
                <option value="bottom-right">bottom-right</option>
                <option value="bottom-left">bottom-left</option>
            </select>
        </fieldset>
    </div>
</div>
<div id="myChart"></div>
