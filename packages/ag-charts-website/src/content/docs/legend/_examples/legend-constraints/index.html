<div class="example-controls">
    <div class="controls-row">
        <label for="xPaddingLabel"><code>item.padding.x:</code></label>
        <input
            type="range"
            id="xPaddingLabel"
            min="0"
            max="50"
            value="32"
            oninput="updateLegendItemPaddingX(event)"
            onchange="updateLegendItemPaddingX(event)"
        />
        <span id="xPaddingValue" class="gap-right">32</span>
        <label for="yPaddingLabel"><code>item.padding.y:</code></label>
        <input
            type="range"
            id="yPaddingLabel"
            min="0"
            max="30"
            value="8"
            oninput="updateLegendItemPaddingY(event)"
            onchange="updateLegendItemPaddingY(event)"
        />
        <span id="yPaddingValue">8</span>
    </div>
    <div class="controls-row">
        <label for="markerPaddingLabel"><code>item.marker.padding:</code></label>
        <input
            type="range"
            id="markerPaddingLabel"
            min="0"
            max="30"
            value="8"
            oninput="updateLegendMarkerPadding(event)"
            onchange="updateLegendMarkerPadding(event)"
        />
        <span id="markerPaddingValue">8</span>
    </div>
    <div class="controls-row">
        <label for="maxWidthLabel"><code>item.maxWidth:</code></label>
        <input
            type="range"
            id="maxWidthLabel"
            min="0"
            max="130"
            value="130"
            oninput="updateLegendItemMaxWidth(event)"
            onchange="updateLegendItemMaxWidth(event)"
        />
        <span id="maxWidthValue">130</span>
    </div>
</div>
<div id="myChart" class="chart"></div>
