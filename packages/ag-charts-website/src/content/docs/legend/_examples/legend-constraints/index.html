<div class="example-controls">
    <div class="controls-row">
        <label for="leftPaddingLabel"><code>item.padding.left:</code></label>
        <input
            type="range"
            id="leftPaddingLabel"
            min="0"
            max="25"
            value="16"
            oninput="updateLegendItemPaddingLeft(event)"
            onchange="updateLegendItemPaddingLeft(event)"
        />
        <span id="leftPaddingValue" class="gap-right">16</span>
        <label for="rightPaddingLabel"><code>item.padding.right:</code></label>
        <input
            type="range"
            id="rightPaddingLabel"
            min="0"
            max="25"
            value="16"
            oninput="updateLegendItemPaddingRight(event)"
            onchange="updateLegendItemPaddingRight(event)"
        />
        <span id="rightPaddingValue" class="gap-right">16</span>
    </div>
    <div class="controls-row">
        <label for="topPaddingLabel"><code>item.padding.top:</code></label>
        <input
            type="range"
            id="topPaddingLabel"
            min="0"
            max="15"
            value="4"
            oninput="updateLegendItemPaddingTop(event)"
            onchange="updateLegendItemPaddingTop(event)"
        />
        <span id="topPaddingValue">4</span>
        <label for="bottomPaddingLabel"><code>item.padding.bottom:</code></label>
        <input
            type="range"
            id="bottomPaddingLabel"
            min="0"
            max="15"
            value="4"
            oninput="updateLegendItemPaddingBottom(event)"
            onchange="updateLegendItemPaddingBottom(event)"
        />
        <span id="bottomPaddingValue">4</span>
    </div>
    <div class="controls-row">
        <label for="markerPaddingLabel"><code>item.marker.padding:</code></label>
        <input
            type="range"
            id="markerPaddingLabel"
            min="0"
            max="30"
            value="8"
            oninput="updateLegendItemSpacing(event)"
            onchange="updateLegendItemSpacing(event)"
        />
        <span id="markerPaddingValue">8</span>
    </div>
    <div class="controls-row">
        <label for="maxWidthLabel"><code>item.maxWidth:</code></label>
        <input
            type="range"
            id="maxWidthLabel"
            min="0"
            max="130"
            value="130"
            oninput="updateLegendItemMaxWidth(event)"
            onchange="updateLegendItemMaxWidth(event)"
        />
        <span id="maxWidthValue">130</span>
    </div>
</div>
<div id="myChart" class="chart"></div>
