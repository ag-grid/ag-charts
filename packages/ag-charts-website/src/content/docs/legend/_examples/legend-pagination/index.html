<div class="example-controls">
    <div class="controls-row">
        Legend Position:
        <div class="button-group" role="group" aria-label="Legend Position">
            <input
                type="radio"
                id="legend-position-right"
                name="legend-position"
                value="right"
                onchange="updateLegendPosition(event)"
            />
            <label for="legend-position-right"><code>'right'</code></label>
            <input
                type="radio"
                id="legend-position-bottom"
                name="legend-position"
                value="bottom"
                checked
                onchange="updateLegendPosition(event)"
            />
            <label for="legend-position-bottom"><code>'bottom'</code></label>
            <input
                type="radio"
                id="legend-position-left"
                name="legend-position"
                value="left"
                onchange="updateLegendPosition(event)"
            />
            <label for="legend-position-left"><code>'left'</code></label>
            <input
                type="radio"
                id="legend-position-top"
                name="legend-position"
                value="top"
                onchange="updateLegendPosition(event)"
            />
            <label for="legend-position-top"><code>'top'</code></label>
        </div>
    </div>
</div>
<div id="myChart"></div>
