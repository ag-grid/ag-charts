        <span>Mode:</span>
        <div class="button-group" role="group" aria-label="Mode">
            <input type="radio" id="mode-stops" name="colour-mode" value="stops" onchange="modeChange(event)" />

                id="mode-gradient"

        </div>
    </div>
</div>
