<div class="example-controls">
    <div class="controls-row">
        <span>Position:</span>
        <div class="button-group" role="group" aria-label="Position">
            <input
                type="radio"
                id="position-top-left"
                name="position"
                value="top-left"
                onchange="changePosition(event)"
            />
            <label for="position-top-left">Top Left</label>
            <input type="radio" id="position-top" name="position" value="top" onchange="changePosition(event)" />
            <label for="position-top">Top</label>
            <input
                type="radio"
                id="position-top-right"
                name="position"
                value="top-right"
                checked
                onchange="changePosition(event)"
            />
            <label for="position-top-right">Top Right</label>
            <input
                type="radio"
                id="position-bottom-left"
                name="position"
                value="bottom-left"
                onchange="changePosition(event)"
            />
            <label for="position-bottom-left">Bottom Left</label>
            <input type="radio" id="position-bottom" name="position" value="bottom" onchange="changePosition(event)" />
            <label for="position-bottom">Bottom</label>
            <input
                type="radio"
                id="position-bottom-right"
                name="position"
                value="bottom-right"
                onchange="changePosition(event)"
            />
            <label for="position-bottom-right">Bottom Right</label>
        </div>
    </div>
</div>
<div id="myChart"></div>
