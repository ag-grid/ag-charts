<div class="example-controls">
    <div class="controls-row">
        <span>Dropdown:</span>
        <div class="button-group" role="group" aria-label="Dropdown">
            <input
                type="radio"
                id="dropdown-auto"
                name="dropdown-visible"
                value="auto"
                checked
                onchange="changeDropdown(event)"
            />
            <label for="dropdown-auto">Auto</label>
            <input
                type="radio"
                id="dropdown-always"
                name="dropdown-visible"
                value="always"
                onchange="changeDropdown(event)"
            />
            <label for="dropdown-always">Always</label>
            <input
                type="radio"
                id="dropdown-never"
                name="dropdown-visible"
                value="never"
                onchange="changeDropdown(event)"
            />
            <label for="dropdown-never">Never</label>
        </div>
    </div>
</div>
<div class="resizable-container">
    <div id="myChart" class="resizable"></div>
</div>
