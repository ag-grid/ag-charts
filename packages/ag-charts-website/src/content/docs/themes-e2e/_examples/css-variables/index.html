<div class="example-controls">
    <div class="controls-row">
        <button onclick="changeCSSVariable()">Change CSS variable</button>
    </div>
    <div class="controls-row">
        Theme:
        <div class="button-group" role="group" aria-label="Theme">
            <input type="radio" id="theme-default" name="theme" value="default" onchange="themeChange(event)" />
            <label for="theme-default" title="Change to Default Theme">Default</label>
            <input type="radio" id="theme-paper" name="theme" value="paper" checked onchange="themeChange(event)" />
            <label for="theme-paper" title="Change to Paper Theme">Paper</label>
        </div>
    </div>
</div>
<div id="myChart"></div>
