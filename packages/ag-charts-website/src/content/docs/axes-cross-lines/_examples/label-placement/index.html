<div class="example-controls">
    <div class="controls-row">
        <span class="gap-right">X Axis:</span>
        <input type="checkbox" id="xLine" checked onchange="toggleCrossLine('x', 'line', event.target.checked)" />
        <label for="xLine">Line</label>
        <input
            type="checkbox"
            id="xRange"
            class="gap-left"
            onchange="toggleCrossLine('x', 'range', event.target.checked)"
        />
        <label for="xRange" class="gap-right">Range</label>
        <label for="xLinePlacement">Line Placement:</label>
        <select id="xLinePlacement" class="gap-right" onchange="setPlacement('x', 'line', event.target.value)">
            <option value="left-top">left-top</option>
            <option value="top">top</option>
            <option value="bottom">bottom</option>
            <option value="left">left</option>
            <option value="left-bottom">left-bottom</option>
            <option value="right">right</option>
            <option value="right-top">right-top</option>
            <option value="right-bottom">right-bottom</option>
            <option value="inside">inside</option>
            <option value="inside-top">inside-top</option>
            <option value="inside-bottom">inside-bottom</option>
        </select>
        <label for="xRangePlacement">Range Placement:</label>
        <select id="xRangePlacement" onchange="setPlacement('x', 'range', event.target.value)">
            <option value="top">top</option>
            <option value="top-left">top-left</option>
            <option value="top-right">top-right</option>
            <option value="bottom">bottom</option>
            <option value="bottom-left">bottom-left</option>
            <option value="bottom-right">bottom-right</option>
            <option value="left">left</option>
            <option value="left-top">left-top</option>
            <option value="left-bottom">left-bottom</option>
            <option value="right">right</option>
            <option value="right-top">right-top</option>
            <option value="right-bottom">right-bottom</option>
            <option value="inside">inside</option>
            <option value="inside-top">inside-top</option>
            <option value="inside-bottom">inside-bottom</option>
            <option value="inside-left">inside-left</option>
            <option value="inside-right">inside-right</option>
            <option value="inside-top-left">inside-top-left</option>
            <option value="inside-top-right">inside-top-right</option>
            <option value="inside-bottom-left">inside-bottom-left</option>
            <option value="inside-bottom-right">inside-bottom-right</option>
        </select>
    </div>
    <div class="controls-row">
        <span class="gap-right">Y Axis:</span>
        <input type="checkbox" id="yLine" onchange="toggleCrossLine('y', 'line', event.target.checked)" />
        <label for="yLine">Line</label>
        <input
            type="checkbox"
            id="yRange"
            class="gap-left"
            checked
            onchange="toggleCrossLine('y', 'range', event.target.checked)"
        />
        <label for="yRange" class="gap-right">Range</label>
        <label for="yLinePlacement">Line Placement:</label>
        <select id="yLinePlacement" class="gap-right" onchange="setPlacement('y', 'line', event.target.value)">
            <option value="top">top</option>
            <option value="top-left">top-left</option>
            <option value="top-right">top-right</option>
            <option value="bottom">bottom</option>
            <option value="bottom-left">bottom-left</option>
            <option value="bottom-right">bottom-right</option>
            <option value="left">left</option>
            <option value="right">right</option>
            <option value="inside">inside</option>
            <option value="inside-left">inside-left</option>
            <option value="inside-right">inside-right</option>
        </select>
        <label for="yRangePlacement">Range Placement:</label>
        <select id="yRangePlacement" onchange="setPlacement('y', 'range', event.target.value)">
            <option value="inside-top-left">inside-top-left</option>
            <option value="top">top</option>
            <option value="top-left">top-left</option>
            <option value="top-right">top-right</option>
            <option value="bottom">bottom</option>
            <option value="bottom-left">bottom-left</option>
            <option value="bottom-right">bottom-right</option>
            <option value="left">left</option>
            <option value="left-top">left-top</option>
            <option value="left-bottom">left-bottom</option>
            <option value="right">right</option>
            <option value="right-top">right-top</option>
            <option value="right-bottom">right-bottom</option>
            <option value="inside">inside</option>
            <option value="inside-top">inside-top</option>
            <option value="inside-bottom">inside-bottom</option>
            <option value="inside-left">inside-left</option>
            <option value="inside-right">inside-right</option>
            <option value="inside-top-right">inside-top-right</option>
            <option value="inside-bottom-left">inside-bottom-left</option>
            <option value="inside-bottom-right">inside-bottom-right</option>
        </select>
    </div>
</div>
<div id="myChart"></div>
