<div class="example-controls">
    <div class="controls-row">
        <span>Type:</span>
        <div class="button-group gap-right" role="group" aria-label="Cross Line Type">
            <input
                type="radio"
                id="type-line"
                name="cross-line-type"
                value="line"
                checked
                onchange="setCrossLineType(event)"
            />
            <label for="type-line"><code>line</code></label>
            <input
                type="radio"
                id="type-range"
                name="cross-line-type"
                value="range"
                onchange="setCrossLineType(event)"
            />
            <label for="type-range"><code>range</code></label>
        </div>
        <span>Axis:</span>
        <div class="button-group" role="group" aria-label="Axis">
            <input type="radio" id="axis-x" name="cross-line-axis" value="x" onchange="setCrossLineAxis(event)" />
            <label for="axis-x"><code>x</code></label>
            <input
                type="radio"
                id="axis-y"
                name="cross-line-axis"
                value="y"
                checked
                onchange="setCrossLineAxis(event)"
            />
            <label for="axis-y"><code>y</code></label>
        </div>
    </div>
    <div class="controls-row">
        <fieldset id="lineYPlacementGroup" class="control-group">
            <label for="lineYPlacementSelect">Line Y Placement:</label>
            <select id="lineYPlacementSelect" onchange="updateCrossLine()">
                <option value="top" selected>top</option>
                <option value="top-left">top-left</option>
                <option value="top-right">top-right</option>
                <option value="bottom">bottom</option>
                <option value="bottom-left">bottom-left</option>
                <option value="bottom-right">bottom-right</option>
                <option value="left">left</option>
                <option value="right">right</option>
                <option value="inside">inside</option>
                <option value="inside-left">inside-left</option>
                <option value="inside-right">inside-right</option>
            </select>
        </fieldset>
        <fieldset id="lineXPlacementGroup" class="control-group" disabled>
            <label for="lineXPlacementSelect">Line X Placement:</label>
            <select id="lineXPlacementSelect" onchange="updateCrossLine()">
                <option value="top" selected>top</option>
                <option value="bottom">bottom</option>
                <option value="left">left</option>
                <option value="left-top">left-top</option>
                <option value="left-bottom">left-bottom</option>
                <option value="right">right</option>
                <option value="right-top">right-top</option>
                <option value="right-bottom">right-bottom</option>
                <option value="inside">inside</option>
                <option value="inside-top">inside-top</option>
                <option value="inside-bottom">inside-bottom</option>
            </select>
        </fieldset>
        <fieldset id="rangePlacementGroup" class="control-group" disabled>
            <label for="rangePlacementSelect">Range Placement:</label>
            <select id="rangePlacementSelect" onchange="updateCrossLine()">
                <option value="top" selected>top</option>
                <option value="top-left">top-left</option>
                <option value="top-right">top-right</option>
                <option value="bottom">bottom</option>
                <option value="bottom-left">bottom-left</option>
                <option value="bottom-right">bottom-right</option>
                <option value="left">left</option>
                <option value="left-top">left-top</option>
                <option value="left-bottom">left-bottom</option>
                <option value="right">right</option>
                <option value="right-top">right-top</option>
                <option value="right-bottom">right-bottom</option>
                <option value="inside">inside</option>
                <option value="inside-top">inside-top</option>
                <option value="inside-bottom">inside-bottom</option>
                <option value="inside-left">inside-left</option>
                <option value="inside-right">inside-right</option>
                <option value="inside-top-left">inside-top-left</option>
                <option value="inside-top-right">inside-top-right</option>
                <option value="inside-bottom-left">inside-bottom-left</option>
                <option value="inside-bottom-right">inside-bottom-right</option>
            </select>
        </fieldset>
    </div>
</div>
<div id="myChart"></div>
