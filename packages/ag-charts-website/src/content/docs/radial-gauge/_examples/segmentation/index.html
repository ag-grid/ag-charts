<div class="example-controls">
    <div class="controls-row">
        <div class="button-group" role="group" aria-label="Segmentation Interval">
            <input
                type="radio"
                id="segmentation-step"
                name="segmentation-interval"
                value="step"
                onchange="setSegmentationInterval(event)"
            />
            <label for="segmentation-step">Step: 10</label>
            <input
                type="radio"
                id="segmentation-count"
                name="segmentation-interval"
                value="count"
                checked
                onchange="setSegmentationInterval(event)"
            />
            <label for="segmentation-count">Count: 4</label>
            <input
                type="radio"
                id="segmentation-values"
                name="segmentation-interval"
                value="values"
                onchange="setSegmentationInterval(event)"
            />
            <label for="segmentation-values">Values: [40, 50, 60]</label>
        </div>
    </div>
</div>
<div id="myChart"></div>
