<div class="example-controls">
    <div class="controls-row">
        <label for="linkIndentationInput">Link Indentation:</label>
        <input
            type="range"
            id="linkIndentationInput"
            min="0"
            max="150"
            value="50"
            step="1"
            oninput="updateLinkIndentation(event)"
            onchange="updateLinkIndentation(event)"
        />
        <span id="linkIndentationValue">50</span>
        <label for="nodeIndentationInput" class="gap-left">Node Indentation:</label>
        <input
            type="range"
            id="nodeIndentationInput"
            min="0"
            max="150"
            value="30"
            step="10"
            oninput="updateNodeIndentation(event)"
            onchange="updateNodeIndentation(event)"
        />
        <span id="nodeIndentationValue">30</span>
    </div>
    <div class="controls-row">
        <label for="stackAtDepthIndentation">Stack At Depth:</label>
        <input
            type="range"
            id="stackAtDepthIndentation"
            min="2"
            max="4"
            value="4"
            step="1"
            oninput="updateStackAtDepth(event)"
            onchange="updateStackAtDepth(event)"
        />
        <span id="stackAtDepthValue">4</span>
    </div>
</div>
<div id="myChart"></div>
