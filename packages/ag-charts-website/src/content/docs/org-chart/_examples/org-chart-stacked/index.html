<div class="example-controls">
    <div class="controls-row">
        <label for="linkIndentationInput">Link Indentation:</label>
        <input
            type="range"
            id="linkIndentationInput"
            min="0"
            max="150"
            value="26"
            step="1"
            oninput="updateLinkIndentation(event)"
            onchange="updateLinkIndentation(event)"
        />
        <span id="linkIndentationValue">26</span>
        <label for="nodeIndentationInput" class="gap-left">Node Indentation:</label>
        <input
            type="range"
            id="nodeIndentationInput"
            min="0"
            max="150"
            value="26"
            step="1"
            oninput="updateNodeIndentation(event)"
            onchange="updateNodeIndentation(event)"
        />
        <span id="nodeIndentationValue">26</span>
    </div>
    <div class="controls-row">
        <label for="stackFromDepthIndentation">Stack At Depth:</label>
        <input
            type="range"
            id="stackFromDepthIndentation"
            min="2"
            max="4"
            value="4"
            step="1"
            oninput="updatestackFromDepth(event)"
            onchange="updatestackFromDepth(event)"
        />
        <span id="stackFromDepthValue">4</span>
    </div>
</div>
<div id="myChart"></div>
