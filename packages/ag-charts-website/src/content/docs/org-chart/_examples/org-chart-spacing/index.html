<div class="example-controls">
    <div class="controls-row">
        Sibling:
        <input
            type="range"
            id="innerSpacingInput"
            min="1"
            max="60"
            value="20"
            step="1"
            oninput="changeInnerSpacing(event)"
            onchange="changeInnerSpacing(event)"
        />
        <span id="innerSpacingValue" style="display: inline-block; min-width: 3ch; text-align: right">20</span>
        <span class="gap-left">
            Cousin:
            <input
                type="range"
                id="outerSpacingInput"
                min="1"
                max="80"
                value="40"
                step="1"
                oninput="changeOuterSpacing(event)"
                onchange="changeOuterSpacing(event)"
            />
            <span id="outerSpacingValue" style="display: inline-block; min-width: 3ch; text-align: right">40</span>
        </span>
        <span class="gap-left">
            Vertical:
            <input
                type="range"
                id="verticalSpacingInput"
                min="20"
                max="100"
                value="52"
                step="2"
                oninput="changeDepthSpacing(event)"
                onchange="changeDepthSpacing(event)"
            />
            <span id="depthSpacing" style="display: inline-block; min-width: 3ch; text-align: right">52</span>
        </span>
    </div>
</div>
<div id="myChart"></div>
