<div class="example-controls">
    <div class="controls-row">
        Position:
        <div class="button-group" role="group" aria-label="Position">
            <input type="radio" id="position-top" name="position" value="top" onchange="changePosition(event)" />
            <label for="position-top">Top</label>
            <input type="radio" id="position-right" name="position" value="right" onchange="changePosition(event)" />
            <label for="position-right">Right</label>
            <input type="radio" id="position-bottom" name="position" value="bottom" onchange="changePosition(event)" />
            <label for="position-bottom">Bottom</label>
            <input
                type="radio"
                id="position-left"
                name="position"
                value="left"
                checked
                onchange="changePosition(event)"
            />
            <label for="position-left">Left</label>
        </div>
        <span class="gap-left">
            Corner Radius:
            <input
                type="range"
                id="cornerRadiusInput"
                min="0"
                max="25"
                value="25"
                step="1"
                oninput="changeCornerRadius(event)"
                onchange="changeCornerRadius(event)"
            />
            <span id="cornerRadiusValue" style="display: inline-block; min-width: 3ch; text-align: right">25</span>
        </span>
    </div>
</div>
<div id="myChart"></div>
