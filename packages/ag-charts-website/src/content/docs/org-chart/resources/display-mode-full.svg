<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 280" font-family="system-ui, sans-serif">
  <!-- Level 0 - full card -->
  <rect x="160" y="10" width="200" height="70" rx="8" fill="#1a3a5c" stroke="#0d2137" stroke-width="1.5"/>
  <circle cx="195" cy="45" r="18" fill="#2d5f8a" stroke="#4a90c4" stroke-width="1"/>
  <text x="195" y="49" text-anchor="middle" font-size="8" fill="#a8c8e8">IMG</text>
  <text x="225" y="30" font-size="12" font-weight="bold" fill="white">Alice Chen</text>
  <text x="225" y="46" font-size="10" fill="#a8c8e8">Chief Executive Officer</text>
  <text x="225" y="60" font-size="9" fill="#7ba8cc">Engineering · London</text>

  <!-- Connectors -->
  <path d="M260,80 L260,105 L130,105 L130,125" fill="none" stroke="#aaa" stroke-width="1.5"/>
  <path d="M260,80 L260,105 L390,105 L390,125" fill="none" stroke="#aaa" stroke-width="1.5"/>

  <!-- Level 1 - CTO full -->
  <rect x="30" y="125" width="200" height="70" rx="8" fill="#2d5f8a" stroke="#1a3a5c" stroke-width="1.5"/>
  <circle cx="65" cy="160" r="18" fill="#1a3a5c" stroke="#4a90c4" stroke-width="1"/>
  <text x="65" y="164" text-anchor="middle" font-size="8" fill="#a8c8e8">IMG</text>
  <text x="95" y="145" font-size="12" font-weight="bold" fill="white">Bob Smith</text>
  <text x="95" y="161" font-size="10" fill="#a8c8e8">CTO</text>
  <text x="95" y="175" font-size="9" fill="#7ba8cc">Engineering · Berlin</text>

  <!-- Level 1 - CFO full -->
  <rect x="290" y="125" width="200" height="70" rx="8" fill="#2d5f8a" stroke="#1a3a5c" stroke-width="1.5"/>
  <circle cx="325" cy="160" r="18" fill="#1a3a5c" stroke="#4a90c4" stroke-width="1"/>
  <text x="325" y="164" text-anchor="middle" font-size="8" fill="#a8c8e8">IMG</text>
  <text x="355" y="145" font-size="12" font-weight="bold" fill="white">Carol Wu</text>
  <text x="355" y="161" font-size="10" fill="#a8c8e8">CFO</text>
  <text x="355" y="175" font-size="9" fill="#7ba8cc">Finance · London</text>

  <!-- L1 → L2 connectors -->
  <path d="M130,195 L130,210 L80,210 L80,225" fill="none" stroke="#aaa" stroke-width="1.5"/>
  <path d="M130,195 L130,210 L180,210 L180,225" fill="none" stroke="#aaa" stroke-width="1.5"/>

  <!-- Level 2 - full -->
  <rect x="5" y="225" width="150" height="50" rx="8" fill="#4a90c4" stroke="#2d5f8a" stroke-width="1.5"/>
  <circle cx="35" cy="250" r="14" fill="#2d5f8a" stroke="#6ab0e8" stroke-width="1"/>
  <text x="35" y="254" text-anchor="middle" font-size="7" fill="#a8c8e8">IMG</text>
  <text x="60" y="243" font-size="11" font-weight="bold" fill="white">Dave Jones</text>
  <text x="60" y="257" font-size="9" fill="#a8c8e8">Dev Lead</text>

  <rect x="165" y="225" width="150" height="50" rx="8" fill="#4a90c4" stroke="#2d5f8a" stroke-width="1.5"/>
  <circle cx="195" cy="250" r="14" fill="#2d5f8a" stroke="#6ab0e8" stroke-width="1"/>
  <text x="195" y="254" text-anchor="middle" font-size="7" fill="#a8c8e8">IMG</text>
  <text x="220" y="243" font-size="11" font-weight="bold" fill="white">Eve Park</text>
  <text x="220" y="257" font-size="9" fill="#a8c8e8">QA Lead</text>
