<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 180" font-family="system-ui, sans-serif">
  <!-- Level 0 -->
  <rect x="210" y="10" width="100" height="40" rx="6" fill="#1a3a5c" stroke="#0d2137" stroke-width="1.5"/>
  <text x="260" y="28" text-anchor="middle" font-size="11" font-weight="bold" fill="white">Alice Chen</text>
  <text x="260" y="42" text-anchor="middle" font-size="9" fill="#a8c8e8">CEO</text>

  <!-- L0 to L1 connectors -->
  <path d="M260,50 L260,72 L100,72 L100,90" fill="none" stroke="#aaa" stroke-width="1.5"/>
  <path d="M260,50 L260,72 L260,90" fill="none" stroke="#aaa" stroke-width="1.5"/>
  <path d="M260,50 L260,72 L420,72 L420,90" fill="none" stroke="#aaa" stroke-width="1.5"/>

  <!-- Level 1 - CTO collapsed with badge -->
  <rect x="50" y="90" width="100" height="40" rx="6" fill="#2d5f8a" stroke="#1a3a5c" stroke-width="1.5"/>
  <text x="100" y="108" text-anchor="middle" font-size="11" font-weight="bold" fill="white">Bob Smith</text>
  <text x="100" y="122" text-anchor="middle" font-size="9" fill="#a8c8e8">CTO</text>
  <!-- Yellow circle badge inside card -->
  <circle cx="138" cy="100" r="10" fill="#e8913a" stroke="#d4791f" stroke-width="1"/>
  <text x="138" y="104" text-anchor="middle" font-size="8" font-weight="bold" fill="white">+2</text>

  <!-- Level 1 - CFO collapsed with badge -->
  <rect x="210" y="90" width="100" height="40" rx="6" fill="#2d5f8a" stroke="#1a3a5c" stroke-width="1.5"/>
  <text x="260" y="108" text-anchor="middle" font-size="11" font-weight="bold" fill="white">Carol Wu</text>
  <text x="260" y="122" text-anchor="middle" font-size="9" fill="#a8c8e8">CFO</text>
  <!-- Yellow circle badge inside card -->
  <circle cx="298" cy="100" r="10" fill="#e8913a" stroke="#d4791f" stroke-width="1"/>
  <text x="298" y="104" text-anchor="middle" font-size="8" font-weight="bold" fill="white">+1</text>

  <!-- Level 1 - COO leaf (no badge) -->
  <rect x="370" y="90" width="100" height="40" rx="6" fill="#2d5f8a" stroke="#1a3a5c" stroke-width="1.5"/>
  <text x="420" y="108" text-anchor="middle" font-size="11" font-weight="bold" fill="white">Dan Lee</text>
  <text x="420" y="122" text-anchor="middle" font-size="9" fill="#a8c8e8">COO</text>
</svg>