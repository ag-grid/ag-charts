<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 200" font-family="system-ui, sans-serif">
  <!-- Level 0 -->
  <rect x="210" y="10" width="100" height="40" rx="6" fill="#1a3a5c" stroke="#0d2137" stroke-width="1.5"/>
  <text x="260" y="28" text-anchor="middle" font-size="11" font-weight="bold" fill="white">Alice Chen</text>
  <text x="260" y="42" text-anchor="middle" font-size="9" fill="#a8c8e8">CEO</text>

  <!-- Expander pill - expanded (showing children) -->
  <rect x="243" y="46" width="34" height="18" rx="9" fill="none" stroke="#999" stroke-width="1"/>
  <text x="260" y="58" text-anchor="middle" font-size="9" fill="#999">▴</text>

  <!-- L0 → L1 connectors -->
  <path d="M260,64 L260,80 L100,80 L100,95" fill="none" stroke="#aaa" stroke-width="1.5"/>
  <path d="M260,64 L260,80 L260,95" fill="none" stroke="#aaa" stroke-width="1.5"/>
  <path d="M260,64 L260,80 L420,80 L420,95" fill="none" stroke="#aaa" stroke-width="1.5"/>

  <!-- Level 1 - CTO collapsed -->
  <rect x="50" y="95" width="100" height="40" rx="6" fill="#2d5f8a" stroke="#1a3a5c" stroke-width="1.5"/>
  <text x="100" y="113" text-anchor="middle" font-size="11" font-weight="bold" fill="white">Bob Smith</text>
  <text x="100" y="127" text-anchor="middle" font-size="9" fill="#a8c8e8">CTO</text>

  <!-- Expander pill - collapsed (filled, shows count) -->
  <rect x="75" y="131" width="50" height="18" rx="9" fill="#3366CC" stroke="none"/>
  <text x="95" y="143" text-anchor="middle" font-size="9" font-weight="bold" fill="white">2 ▾</text>

  <!-- Level 1 - CFO collapsed -->
  <rect x="210" y="95" width="100" height="40" rx="6" fill="#2d5f8a" stroke="#1a3a5c" stroke-width="1.5"/>
  <text x="260" y="113" text-anchor="middle" font-size="11" font-weight="bold" fill="white">Carol Wu</text>
  <text x="260" y="127" text-anchor="middle" font-size="9" fill="#a8c8e8">CFO</text>

  <!-- Expander pill - collapsed (filled, shows count) -->
  <rect x="235" y="131" width="50" height="18" rx="9" fill="#3366CC" stroke="none"/>
  <text x="255" y="143" text-anchor="middle" font-size="9" font-weight="bold" fill="white">1 ▾</text>

  <!-- Level 1 - COO (leaf, no pill) -->
  <rect x="370" y="95" width="100" height="40" rx="6" fill="#2d5f8a" stroke="#1a3a5c" stroke-width="1.5"/>
  <text x="420" y="113" text-anchor="middle" font-size="11" font-weight="bold" fill="white">Dan Lee</text>
  <text x="420" y="127" text-anchor="middle" font-size="9" fill="#a8c8e8">COO</text>

  <text x="260" y="180" text-anchor="middle" font-size="10" fill="#999">expandedDepth: 1 — children collapsed, pills show child count</text>
</svg>