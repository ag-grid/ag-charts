<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 220" font-family="system-ui, sans-serif">
  <text x="200" y="20" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">Linear (Straight/Diagonal)</text>

  <!-- Parent node -->
  <rect x="150" y="35" width="100" height="40" rx="6" fill="#2d5f8a" stroke="#1a3a5c" stroke-width="1.5"/>
  <text x="200" y="60" text-anchor="middle" font-size="12" fill="white">Alice</text>

  <!-- Connectors: straight lines -->
  <line x1="200" y1="75" x2="60" y2="130" stroke="#888" stroke-width="1.5"/>
  <line x1="200" y1="75" x2="200" y2="130" stroke="#888" stroke-width="1.5"/>
  <line x1="200" y1="75" x2="340" y2="130" stroke="#888" stroke-width="1.5"/>

  <!-- Child nodes -->
  <rect x="10" y="130" width="100" height="40" rx="6" fill="#4a90c4" stroke="#2d5f8a" stroke-width="1.5"/>
  <text x="60" y="155" text-anchor="middle" font-size="12" fill="white">Bob</text>

  <rect x="150" y="130" width="100" height="40" rx="6" fill="#4a90c4" stroke="#2d5f8a" stroke-width="1.5"/>
  <text x="200" y="155" text-anchor="middle" font-size="12" fill="white">Carol</text>

  <rect x="290" y="130" width="100" height="40" rx="6" fill="#4a90c4" stroke="#2d5f8a" stroke-width="1.5"/>
  <text x="340" y="155" text-anchor="middle" font-size="12" fill="white">Dave</text>

  <text x="200" y="200" text-anchor="middle" font-size="11" fill="#666">Direct lines from parent to each child</text>
  <text x="200" y="215" text-anchor="middle" font-size="11" fill="#666">interpolation: { type: 'linear' }</text>
</svg>