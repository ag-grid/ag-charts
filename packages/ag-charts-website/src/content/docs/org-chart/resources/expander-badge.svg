<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 200" font-family="system-ui, sans-serif">
  <!-- Level 0 -->
  <rect x="210" y="10" width="100" height="40" rx="6" fill="#1a3a5c" stroke="#0d2137" stroke-width="1.5"/>
  <text x="260" y="28" text-anchor="middle" font-size="11" font-weight="bold" fill="white">Alice Chen</text>
  <text x="260" y="42" text-anchor="middle" font-size="9" fill="#a8c8e8">CEO</text>
  <!-- Badge - expanded (chevron only) -->
  <text x="260" y="62" text-anchor="middle" font-size="10" fill="#999">&#x25B4;</text>

  <!-- L0 → L1 connectors -->
  <path d="M260,66 L260,80 L100,80 L100,95" fill="none" stroke="#aaa" stroke-width="1.5"/>
  <path d="M260,66 L260,80 L420,80 L420,95" fill="none" stroke="#aaa" stroke-width="1.5"/>

  <!-- Level 1 - CTO collapsed -->
  <rect x="50" y="95" width="100" height="40" rx="6" fill="#2d5f8a" stroke="#1a3a5c" stroke-width="1.5"/>
  <text x="100" y="113" text-anchor="middle" font-size="11" font-weight="bold" fill="white">Bob Smith</text>
  <text x="100" y="127" text-anchor="middle" font-size="9" fill="#a8c8e8">CTO</text>
  <!-- Badge - collapsed (circle with count) -->
  <circle cx="100" cy="147" r="11" fill="#e0e0e0" stroke="#999" stroke-width="1"/>
  <text x="100" y="151" text-anchor="middle" font-size="9" font-weight="bold" fill="#333">+2</text>

  <!-- Level 1 - CFO collapsed -->
  <rect x="370" y="95" width="100" height="40" rx="6" fill="#2d5f8a" stroke="#1a3a5c" stroke-width="1.5"/>
  <text x="420" y="113" text-anchor="middle" font-size="11" font-weight="bold" fill="white">Carol Wu</text>
  <text x="420" y="127" text-anchor="middle" font-size="9" fill="#a8c8e8">CFO</text>
  <!-- Badge - collapsed (circle with count) -->
  <circle cx="420" cy="147" r="11" fill="#e0e0e0" stroke="#999" stroke-width="1"/>
  <text x="420" y="151" text-anchor="middle" font-size="9" font-weight="bold" fill="#333">+1</text>

  <text x="260" y="180" text-anchor="middle" font-size="10" fill="#999">Badge: circular count indicator below collapsed nodes</text>
</svg>