<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 280" font-family="system-ui, sans-serif">
  <!-- Level 0 -->
  <rect x="160" y="10" width="200" height="60" rx="8" fill="#1a3a5c" stroke="#0d2137" stroke-width="1.5"/>
  <circle cx="195" cy="40" r="18" fill="#2d5f8a" stroke="#4a90c4" stroke-width="1"/>
  <text x="195" y="44" text-anchor="middle" font-size="8" fill="#a8c8e8">IMG</text>
  <text x="225" y="32" font-size="12" font-weight="bold" fill="white">Alice Chen</text>
  <text x="225" y="48" font-size="10" fill="#a8c8e8">Chief Executive Officer</text>

  <!-- Connectors -->
  <path d="M260,70 L260,95 L130,95 L130,115" fill="none" stroke="#aaa" stroke-width="1.5"/>
  <path d="M260,70 L260,95 L390,95 L390,115" fill="none" stroke="#aaa" stroke-width="1.5"/>

  <!-- Level 1 - CTO -->
  <rect x="30" y="115" width="200" height="60" rx="8" fill="#2d5f8a" stroke="#1a3a5c" stroke-width="1.5"/>
  <circle cx="65" cy="145" r="18" fill="#1a3a5c" stroke="#4a90c4" stroke-width="1"/>
  <text x="65" y="149" text-anchor="middle" font-size="8" fill="#a8c8e8">IMG</text>
  <text x="95" y="137" font-size="12" font-weight="bold" fill="white">Bob Smith</text>
  <text x="95" y="153" font-size="10" fill="#a8c8e8">CTO</text>

  <!-- Level 1 - CFO -->
  <rect x="290" y="115" width="200" height="60" rx="8" fill="#2d5f8a" stroke="#1a3a5c" stroke-width="1.5"/>
  <circle cx="325" cy="145" r="18" fill="#1a3a5c" stroke="#4a90c4" stroke-width="1"/>
  <text x="325" y="149" text-anchor="middle" font-size="8" fill="#a8c8e8">IMG</text>
  <text x="355" y="137" font-size="12" font-weight="bold" fill="white">Carol Wu</text>
  <text x="355" y="153" font-size="10" fill="#a8c8e8">CFO</text>

  <!-- L1 → L2 connectors -->
  <path d="M130,175 L130,195 L80,195 L80,215" fill="none" stroke="#aaa" stroke-width="1.5"/>
  <path d="M130,175 L130,195 L180,195 L180,215" fill="none" stroke="#aaa" stroke-width="1.5"/>

  <!-- Level 2 -->
  <rect x="5" y="215" width="150" height="50" rx="8" fill="#4a90c4" stroke="#2d5f8a" stroke-width="1.5"/>
  <circle cx="35" cy="240" r="14" fill="#2d5f8a" stroke="#6ab0e8" stroke-width="1"/>
  <text x="35" y="244" text-anchor="middle" font-size="7" fill="#a8c8e8">IMG</text>
  <text x="60" y="234" font-size="11" font-weight="bold" fill="white">Dave Jones</text>
  <text x="60" y="248" font-size="9" fill="#a8c8e8">Dev Lead</text>

  <rect x="165" y="215" width="150" height="50" rx="8" fill="#4a90c4" stroke="#2d5f8a" stroke-width="1.5"/>
  <circle cx="195" cy="240" r="14" fill="#2d5f8a" stroke="#6ab0e8" stroke-width="1"/>
  <text x="195" y="244" text-anchor="middle" font-size="7" fill="#a8c8e8">IMG</text>
  <text x="220" y="234" font-size="11" font-weight="bold" fill="white">Eve Park</text>
  <text x="220" y="248" font-size="9" fill="#a8c8e8">QA Lead</text>
