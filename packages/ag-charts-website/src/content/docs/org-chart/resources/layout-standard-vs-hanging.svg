<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 280" font-family="system-ui, sans-serif">
  <!-- STANDARD LAYOUT -->
  <text x="200" y="20" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">Standard Layout</text>

  <rect x="150" y="35" width="100" height="36" rx="6" fill="#2d5f8a" stroke="#1a3a5c" stroke-width="1.5"/>
  <text x="200" y="58" text-anchor="middle" font-size="11" fill="white">CEO</text>

  <!-- Connectors -->
  <path d="M200,71 L200,88 L40,88 L40,105" fill="none" stroke="#aaa" stroke-width="1.5"/>
  <path d="M200,71 L200,88 L120,88 L120,105" fill="none" stroke="#aaa" stroke-width="1.5"/>
  <path d="M200,71 L200,105" fill="none" stroke="#aaa" stroke-width="1.5"/>
  <path d="M200,71 L200,88 L280,88 L280,105" fill="none" stroke="#aaa" stroke-width="1.5"/>
  <path d="M200,71 L200,88 L360,88 L360,105" fill="none" stroke="#aaa" stroke-width="1.5"/>

  <rect x="-5" y="105" width="90" height="36" rx="6" fill="#4a90c4" stroke="#2d5f8a" stroke-width="1.5"/>
  <text x="40" y="128" text-anchor="middle" font-size="10" fill="white">VP Sales</text>

  <rect x="77" y="105" width="90" height="36" rx="6" fill="#4a90c4" stroke="#2d5f8a" stroke-width="1.5"/>
  <text x="122" y="128" text-anchor="middle" font-size="10" fill="white">VP Eng</text>

  <rect x="157" y="105" width="90" height="36" rx="6" fill="#4a90c4" stroke="#2d5f8a" stroke-width="1.5"/>
  <text x="202" y="128" text-anchor="middle" font-size="10" fill="white">VP Design</text>

  <rect x="237" y="105" width="90" height="36" rx="6" fill="#4a90c4" stroke="#2d5f8a" stroke-width="1.5"/>
  <text x="282" y="128" text-anchor="middle" font-size="10" fill="white">VP Ops</text>

  <rect x="317" y="105" width="90" height="36" rx="6" fill="#4a90c4" stroke="#2d5f8a" stroke-width="1.5"/>
  <text x="362" y="128" text-anchor="middle" font-size="10" fill="white">VP Finance</text>

  <text x="200" y="165" text-anchor="middle" font-size="10" fill="#999">Children spread horizontally — uses wide space</text>

  <!-- HANGING LAYOUT -->
  <text x="600" y="20" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">Hanging/Compact Layout</text>

  <rect x="550" y="35" width="100" height="36" rx="6" fill="#2d5f8a" stroke="#1a3a5c" stroke-width="1.5"/>
  <text x="600" y="58" text-anchor="middle" font-size="11" fill="white">CEO</text>

  <!-- Vertical stem -->
  <line x1="600" y1="71" x2="600" y2="88" stroke="#aaa" stroke-width="1.5"/>
  <!-- Horizontal bar -->
  <line x1="530" y1="88" x2="670" y2="88" stroke="#aaa" stroke-width="1.5"/>

  <!-- Drop lines -->
  <line x1="530" y1="88" x2="530" y2="105" stroke="#aaa" stroke-width="1.5"/>
  <line x1="565" y1="88" x2="565" y2="147" stroke="#aaa" stroke-width="1.5"/>
  <line x1="600" y1="88" x2="600" y2="189" stroke="#aaa" stroke-width="1.5"/>
  <line x1="635" y1="88" x2="635" y2="231" stroke="#aaa" stroke-width="1.5"/>
  <line x1="670" y1="88" x2="670" y2="273" stroke="#aaa" stroke-width="1.5"/>

  <rect x="485" y="105" width="90" height="36" rx="6" fill="#4a90c4" stroke="#2d5f8a" stroke-width="1.5"/>
  <text x="530" y="128" text-anchor="middle" font-size="10" fill="white">VP Sales</text>

  <rect x="520" y="147" width="90" height="36" rx="6" fill="#4a90c4" stroke="#2d5f8a" stroke-width="1.5"/>
  <text x="565" y="170" text-anchor="middle" font-size="10" fill="white">VP Eng</text>

  <rect x="555" y="189" width="90" height="36" rx="6" fill="#4a90c4" stroke="#2d5f8a" stroke-width="1.5"/>
  <text x="600" y="212" text-anchor="middle" font-size="10" fill="white">VP Design</text>

  <rect x="590" y="231" width="90" height="36" rx="6" fill="#4a90c4" stroke="#2d5f8a" stroke-width="1.5"/>
  <text x="635" y="254" text-anchor="middle" font-size="10" fill="white">VP Ops</text>

  <rect x="625" y="273" width="90" height="36" rx="6" fill="#4a90c4" stroke="#2d5f8a" stroke-width="1.5"/>
  <text x="670" y="296" text-anchor="middle" font-size="10" fill="white">VP Finance</text>

  <!-- Divider -->
  <line x1="420" y1="10" x2="420" y2="310" stroke="#ddd" stroke-width="1" stroke-dasharray="4,4"/>
</svg>