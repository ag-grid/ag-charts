<div class="example-controls">
    <div class="controls-row">
        <label for="status-bar-placement">Placement:</label>
        <select id="status-bar-placement" onchange="updatePlacement(event.target.value)">
            <option value="top">top</option>
            <option value="top-right">top-right</option>
            <option value="top-left">top-left</option>
            <option value="bottom">bottom</option>
            <option value="bottom-right">bottom-right</option>
            <option value="bottom-left">bottom-left</option>
            <option value="left">left</option>
            <option value="right">right</option>
        </select>
        <label for="status-bar-inactive" class="gap-left">Inactive:</label>
        <select id="status-bar-inactive" onchange="updateInactive(event.target.value)">
            <option value="last">last</option>
            <option value="recent">recent</option>
            <option value="hidden">hidden</option>
        </select>
        <button class="gap-left" onclick="toggleFloating()">Toggle Floating</button>
    </div>
</div>
<div id="myChart"></div>
