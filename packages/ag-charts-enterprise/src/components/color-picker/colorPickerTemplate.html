<div class="ag-charts-color-picker__palette" role="slider" tabindex="0"></div>
<div class="ag-charts-color-picker__color-row" role="presentation">
    <button class="ag-charts-color-picker__multi-color-button" tabindex="0" type="button" role="switch"></button>
    <input class="ag-charts-color-picker__hue-input" tabindex="0" type="range" min="0" max="360" value="0" />
</div>
<input class="ag-charts-color-picker__alpha-input" tabindex="0" type="range" min="0" max="1" value="1" step="0.01" />
<label class="ag-charts-color-picker__color-field" role="presentation">
    <span class="ag-charts-color-picker__color-label" aria-hidden="true"></span>
    <input class="ag-charts-color-picker__color-input" tabindex="0" value="#000" />
</label>
