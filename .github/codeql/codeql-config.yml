paths:
    - 'packages/ag-charts-community/dist'
    - 'packages/ag-charts-core/dist'
    - 'packages/ag-charts-enterprise/dist'
    - 'packages/ag-charts-locale/dist'
    - 'packages/ag-charts-angular/dist'
    - 'packages/ag-charts-react/dist'
    - 'packages/ag-charts-vue3/dist'
    - 'packages/ag-charts-types/dist'
paths-ignore:
    - '**/*.test.js'
    - '**/*.test.ts'
    - '**/*.test.tsx'
    - '**/__tests__/**'
    - '**/test/**'
    - '**/test-harness/**'
    - '**/node_modules/**'
query-filters:
    - exclude:
          problem.severity:
              - warning
              - recommendation
