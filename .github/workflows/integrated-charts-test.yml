name: Integrated Charts Test

on:
    workflow_dispatch: {}
    schedule:
        - cron: '0 6 * * *' # Every morning UTC, incl. weekends so Fri/weekend breaks are caught next day

env:
    # Disable git's post-fetch background gc/maintenance for every git invocation
    # (injected via git's GIT_CONFIG_* protocol). Otherwise it rewrites .git/shallow
    # concurrently with the next chained `git fetch --depth 1`, intermittently failing
    # job setup with "fatal: shallow file has changed since we read it".
    GIT_CONFIG_COUNT: 2
    GIT_CONFIG_KEY_0: gc.auto
    GIT_CONFIG_VALUE_0: '0'
    GIT_CONFIG_KEY_1: maintenance.auto
    GIT_CONFIG_VALUE_1: 'false'
    NX_NO_CLOUD: true
    AG_SKIP_NATIVE_DEP_VERSION_CHECK: 1

permissions:
    contents: read
    # read is sufficient: the only actions-scope consumer is `gh run list` below, which is
    # read-only. `permissions:` replaces the defaults, so the scope has to be named here.
    actions: read

jobs:
    test-ag-grid-integration:
        runs-on: ubuntu-24.04
        timeout-minutes: 60
        steps:
            - name: Checkout ag-charts
              uses: actions/checkout@v7

            - name: Setup
              uses: ./.github/actions/setup-nx
              with:
                  cache_mode: ro
                  yarn_postinstall: false

            # Skip the nx cache: a cache hit can pack stale type declarations, letting the gate
            # type-check ag-grid against charts types that differ from current `latest`.
            - name: Build ag-charts packages
              run: |
                  yarn nx run-many -t build -p ag-charts-types,ag-charts-locale,ag-charts-core,ag-charts-community,ag-charts-enterprise --skip-nx-cache

            - name: Pack ag-charts tarballs
              id: pack
              run: |
                  TARBALL_DIR=$(mktemp -d)
                  for pkg in ag-charts-types ag-charts-locale ag-charts-core ag-charts-community ag-charts-enterprise; do
                      cd packages/$pkg
                      TARBALL=$(npm pack --pack-destination "$TARBALL_DIR" 2>/dev/null | tail -1)
                      echo "${pkg}_tarball=${TARBALL_DIR}/${TARBALL}" >> $GITHUB_OUTPUT
                      cd ../..
                  done
                  echo "tarball_dir=${TARBALL_DIR}" >> $GITHUB_OUTPUT

            - name: Clone ag-grid
              run: |
                  git clone --depth 1 --branch latest https://github.com/ag-grid/ag-grid.git /tmp/ag-grid

            - name: Replace ag-charts deps with local tarballs
              run: |
                  node tools/integration/set-charts-dep-paths.js /tmp/ag-grid "${{ steps.pack.outputs.tarball_dir }}"

            - name: Install ag-grid dependencies
              working-directory: /tmp/ag-grid
              run: |
                  npm run bootstrap

            - name: Build ag-grid-enterprise
              working-directory: /tmp/ag-grid
              env:
                  NODE_ENV: production
              run: |
                  yarn nx build ag-grid-enterprise

            - name: Build with Real Implementation
              working-directory: /tmp/ag-grid
              env:
                  NODE_ENV: production
              run: |
                  ./scripts/ci/substituteAgChartsTypesScene.sh
                  yarn nx build ag-grid-enterprise --skip-nx-cache

            - name: Check previous run status
              id: prev_run
              if: always()
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  # The current run is still in_progress, so --status completed gives us
                  # the last finished run - i.e. the one before this one.
                  PREV_CONCLUSION=$(gh run list \
                    --workflow integrated-charts-test.yml \
                    --branch ${{ github.ref_name }} \
                    --status completed \
                    --limit 1 \
                    --json conclusion \
                    --jq '.[0].conclusion // ""')

                  # On a re-run, this same run is still in_progress, so the query above skips
                  # it and answers with whatever finished *before* the failing attempt - not
                  # the failure that triggered the re-run. There's no way to query a run's own
                  # earlier attempt, so assume the common case: a re-run follows a failure.
                  if [[ "${GITHUB_RUN_ATTEMPT}" -ge 2 ]]; then
                    PREV_CONCLUSION="failure"
                  fi

                  echo "conclusion=${PREV_CONCLUSION}" >> "$GITHUB_OUTPUT"

            - name: Slack Notification (failure)
              if: failure()
              uses: rtCamp/action-slack-notify@v2
              env:
                  SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
                  SLACK_COLOR: failure
                  SLACK_ICON: https://avatars.slack-edge.com/2020-11-25/1527503386626_319578f21381f9641cd8_192.png
                  SLACK_USERNAME: ag-charts CI
                  SLACK_FOOTER: ''
                  SLACK_TITLE: Integrated Charts Pre-Integration Test Failed
                  SLACK_MESSAGE: >
                      The ag-grid integration build check failed. AG Charts changes
                      on the `latest` branch are likely to break the next Charts
                      Pre-Integration Build in TeamCity.
                      ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
                  SLACK_CHANNEL: '#charts_teamcity_status'

            - name: Slack Notification (recovery)
              # Only announce a return to green, not every routine pass - a daily
              # "still fine" ping would just be noise. Mirrors the back-to-green gate in
              # post-deploy-verification.yml.
              if: success() && steps.prev_run.outputs.conclusion == 'failure'
              uses: rtCamp/action-slack-notify@v2
              env:
                  SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
                  SLACK_COLOR: good
                  SLACK_ICON: https://avatars.slack-edge.com/2020-11-25/1527503386626_319578f21381f9641cd8_192.png
                  SLACK_USERNAME: ag-charts CI
                  SLACK_FOOTER: ''
                  SLACK_TITLE: Integrated Charts Pre-Integration Test Recovered
                  SLACK_MESSAGE: >
                      The ag-grid integration build check is passing again after a
                      previous failure.
                      ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
                  SLACK_CHANNEL: '#charts_teamcity_status'
