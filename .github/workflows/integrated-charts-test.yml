name: Integrated Charts Test

on:
    workflow_dispatch: {}
    schedule:
        - cron: '0 6 * * *' # Every morning UTC, incl. weekends so Fri/weekend breaks are caught next day

env:
    # Disable git's post-fetch background gc/maintenance for every git invocation
    # (injected via git's GIT_CONFIG_* protocol). Otherwise it rewrites .git/shallow
    # concurrently with the next chained `git fetch --depth 1`, intermittently failing
    # job setup with "fatal: shallow file has changed since we read it".
    GIT_CONFIG_COUNT: 2
    GIT_CONFIG_KEY_0: gc.auto
    GIT_CONFIG_VALUE_0: '0'
    GIT_CONFIG_KEY_1: maintenance.auto
    GIT_CONFIG_VALUE_1: 'false'
    NX_NO_CLOUD: true
    AG_SKIP_NATIVE_DEP_VERSION_CHECK: 1
    # Used by the webhook recovery notification below.
    SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
    SLACK_ICON: https://avatars.slack-edge.com/2020-11-25/1527503386626_319578f21381f9641cd8_192.png
    SLACK_USERNAME: ag-charts CI
    SLACK_FOOTER: ''
    SLACK_CHANNEL: '#charts_teamcity_status'
    IBM_TELEMETRY_DISABLED: 'true'

permissions:
    contents: read
    # read is sufficient: the only actions-scope consumer is `gh run list` below, which is
    # read-only. `permissions:` replaces the defaults, so the scope has to be named here.
    actions: read

jobs:
    test-ag-grid-integration:
        runs-on: ubuntu-24.04
        timeout-minutes: 60
        steps:
            - name: Checkout ag-charts
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Setup
              uses: ./.github/actions/setup-nx
              with:
                  cache_mode: ro
                  yarn_postinstall: false

            # Skip the nx cache: a cache hit can pack stale type declarations, letting the gate
            # type-check ag-grid against charts types that differ from current `latest`.
            - name: Build ag-charts packages
              run: |
                  yarn nx run-many -t build -p ag-charts-types,ag-charts-locale,ag-charts-core,ag-charts-community,ag-charts-enterprise --skip-nx-cache

            - name: Pack ag-charts tarballs
              id: pack
              run: |
                  TARBALL_DIR=$(mktemp -d)
                  for pkg in ag-charts-types ag-charts-locale ag-charts-core ag-charts-community ag-charts-enterprise; do
                      cd packages/$pkg
                      TARBALL=$(npm pack --pack-destination "$TARBALL_DIR" 2>/dev/null | tail -1)
                      echo "${pkg}_tarball=${TARBALL_DIR}/${TARBALL}" >> $GITHUB_OUTPUT
                      cd ../..
                  done
                  echo "tarball_dir=${TARBALL_DIR}" >> $GITHUB_OUTPUT

            - name: Clone ag-grid
              run: |
                  git clone --depth 1 --branch latest https://github.com/ag-grid/ag-grid.git /tmp/ag-grid

            - name: Replace ag-charts deps with local tarballs
              run: |
                  node tools/integration/set-charts-dep-paths.js /tmp/ag-grid "${{ steps.pack.outputs.tarball_dir }}"

            - name: Install ag-grid dependencies
              working-directory: /tmp/ag-grid
              env:
                  # The local tarball paths set above change package.json, so the lockfile can't match.
                  # Yarn 4 makes installs immutable on CI by default, which would fail the install.
                  YARN_ENABLE_IMMUTABLE_INSTALLS: false
              run: |
                  npm run bootstrap

            - name: Build ag-grid-enterprise
              working-directory: /tmp/ag-grid
              env:
                  NODE_ENV: production
              run: |
                  yarn nx build ag-grid-enterprise

            - name: Check previous run status
              id: prev_run
              # A flaky `gh` call here must never redden a build that actually
              # passed, so it can't trip the job-level failure() check below.
              continue-on-error: true
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  if [[ "${GITHUB_RUN_ATTEMPT}" -ge 2 ]]; then
                    # A re-run's own earlier attempt is directly queryable, unlike
                    # --status completed below (which only sees prior runs).
                    PREV_CONCLUSION=$(gh api \
                      "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/$((GITHUB_RUN_ATTEMPT - 1))" \
                      --jq '.conclusion // ""' || true)
                  else
                    # --status completed also matches cancelled/skipped runs, so skip
                    # those and take the last run that actually passed or failed.
                    PREV_CONCLUSION=$(gh run list \
                      --workflow integrated-charts-test.yml \
                      --branch "${{ github.ref_name }}" \
                      --status completed \
                      --limit 10 \
                      --json conclusion \
                      --jq '[.[] | select(.conclusion == "success" or .conclusion == "failure")][0].conclusion // ""' || true)
                  fi

                  echo "conclusion=${PREV_CONCLUSION}" >> "$GITHUB_OUTPUT"

            # Bot token rather than webhook: chat.postMessage returns the ts that lets
            # ci-failure-handler reply in this alert's thread (same anchor as ci.yml).
            # Best-effort: without an anchor the handler posts its own root message.
            - name: Slack Notification (failure, thread anchor)
              id: failure_alert
              if: failure()
              continue-on-error: true
              env:
                  SLACK_BOT_OAUTH_TOKEN: ${{ secrets.SLACK_BOT_OAUTH_TOKEN }}
                  SLACK_ALERT_CHANNEL: ${{ vars.CI_FAILURE_SLACK_CHANNEL }}
                  RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
              run: |
                  set -euo pipefail
                  TEXT=":x: *Integrated Charts Pre-Integration Test failed*
                  The ag-grid integration build check failed. AG Charts changes on the \`latest\` branch are likely to break the next Charts Pre-Integration Build in TeamCity.
                  <${RUN_URL}|Failed run>"
                  PAYLOAD=$(jq -nc --arg ch "$SLACK_ALERT_CHANNEL" --arg text "$TEXT" '{channel:$ch, text:$text}')
                  RESP=$(curl -sS -X POST https://slack.com/api/chat.postMessage \
                      -H "Authorization: Bearer ${SLACK_BOT_OAUTH_TOKEN}" \
                      -H 'Content-type: application/json; charset=utf-8' \
                      --data "$PAYLOAD" || echo '{}')
                  if ! echo "$RESP" | jq -e '.ok' >/dev/null 2>&1; then
                      echo "::warning::chat.postMessage failed: $(echo "$RESP" | jq -r '.error // "no response"')"
                      exit 0
                  fi
                  echo "$RESP" | jq -c '{channel, ts}' > ci-failure-slack.json

            - name: Upload CI-failure Slack thread anchor
              if: failure() && steps.failure_alert.outcome == 'success' && hashFiles('ci-failure-slack.json') != ''
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: ci-failure-slack
                  path: ci-failure-slack.json
                  retention-days: 7

            - name: Slack Notification (recovery)
              # Only announce a return to green, not every routine pass, so a daily
              # "still fine" ping doesn't become noise.
              if: success() && steps.prev_run.outputs.conclusion == 'failure'
              uses: rtCamp/action-slack-notify@33ca3be66c6f378fe1610fd1d5258632dbed5e58 # v2.4.0
              env:
                  SLACK_COLOR: good
                  SLACK_TITLE: Integrated Charts Pre-Integration Test Recovered
                  SLACK_MESSAGE: >
                      The ag-grid integration build check is passing again after a
                      previous failure.
                      ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
