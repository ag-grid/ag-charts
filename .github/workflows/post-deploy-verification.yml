name: Post-Deploy Page Verification

on:
    workflow_run:
        workflows: ['CI']
        types: [completed]
        branches: ['latest']
    workflow_dispatch:
        inputs:
            staging_url:
                description: 'URL to test against (leave blank to use charts-staging.ag-grid.com)'
                required: false
                default: ''

env:
    CI: true

permissions:
    contents: read
    actions: write

jobs:
    page-verification:
        runs-on: ubuntu-latest
        name: Page Verification (Staging)
        # For manual dispatch: always run.
        # For workflow_run: only proceed if triggered by a push to this repo (not a fork PR),
        # and only if the upstream CI run succeeded. This guards against the untrusted-checkout
        # risk flagged by OSSF/Scorecard for workflow_run triggers.
        if: >
            github.event_name == 'workflow_dispatch' ||
            (github.event.workflow_run.conclusion == 'success' &&
             github.event.workflow_run.event == 'push' &&
             github.event.workflow_run.head_repository.full_name == github.repository)
        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                  # Use github.sha (the branch HEAD) rather than workflow_run.head_sha to
                  # avoid the untrusted-input pattern flagged by the OpenSSF Scorecard.
                  ref: ${{ github.sha }}
                  fetch-depth: 1
                  submodules: true

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version-file: '.nvmrc'

            - name: Install test dependencies
              working-directory: packages/ag-charts-website
              run: npm install --no-save @playwright/test@1.59.1 glob playwright-ctrf-json-reporter@0.0.29

            - name: Install Playwright Chromium
              working-directory: packages/ag-charts-website
              run: npx --yes playwright@1.59.1 install chromium --with-deps

            - name: Run page verification tests
              id: run_tests
              working-directory: packages/ag-charts-website
              env:
                  PUBLIC_SITE_URL: ${{ inputs.staging_url || 'https://charts-staging.ag-grid.com' }}
              run: npx --yes playwright@1.59.1 test --config playwright.staging.config.ts --project=chromium

            - name: Publish CTRF Report
              if: always()
              uses: ctrf-io/github-test-reporter@v1
              with:
                  report-path: 'reports/ag-charts-page-verification.json'

            - name: Upload test results
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: page-verification-results
                  path: |
                      packages/ag-charts-website/playwright-report/
                      packages/ag-charts-website/test-results/
                  retention-days: 14

            - name: Check previous run status
              id: prev_run
              if: always()
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  # The current run is still in_progress, so --status completed gives us
                  # the last finished run — i.e. the one before this one.
                  PREV=$(gh run list \
                    --workflow post-deploy-verification.yml \
                    --branch latest \
                    --status completed \
                    --limit 1 \
                    --json headSha,conclusion \
                    --jq '.[0] // {}')

                  PREV_SHA=$(echo "$PREV" | jq -r '.headSha // ""')
                  PREV_CONCLUSION=$(echo "$PREV" | jq -r '.conclusion // ""')
                  CURRENT="${{ steps.run_tests.outcome }}"

                  echo "sha=${PREV_SHA}" >> $GITHUB_OUTPUT

                  if [ "$PREV_CONCLUSION" != "$CURRENT" ]; then
                    echo "changed=true" >> $GITHUB_OUTPUT
                  else
                    echo "changed=false" >> $GITHUB_OUTPUT
                  fi

            # - name: Notify Slack
            #   if: always() && steps.prev_run.outputs.changed == 'true'
            #   uses: ./external/ag-shared/github/actions/slack-integration
            #   with:
            #       AG_LIBRARY: charts
            #       SLACK_BOT_OAUTH_TOKEN: ${{ secrets.SLACK_BOT_OAUTH_TOKEN }}
            #       SLACK_CHANNEL: '#charts_teamcity_status'
