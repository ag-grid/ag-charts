name: Post-Deploy Page Verification

on:
    workflow_run:
        workflows: ['CI']
        types: [completed]
        branches: ['latest']
    workflow_dispatch:
        inputs:
            staging_url:
                description: 'URL to test against (leave blank to use charts-staging.ag-grid.com)'
                required: false
                default: ''

env:
    # Disable git's post-fetch background gc/maintenance for every git invocation
    # (injected via git's GIT_CONFIG_* protocol). Otherwise it rewrites .git/shallow
    # concurrently with the next chained `git fetch --depth 1`, intermittently failing
    # job setup with "fatal: shallow file has changed since we read it".
    GIT_CONFIG_COUNT: 2
    GIT_CONFIG_KEY_0: gc.auto
    GIT_CONFIG_VALUE_0: '0'
    GIT_CONFIG_KEY_1: maintenance.auto
    GIT_CONFIG_VALUE_1: 'false'
    CI: true

concurrency:
    group: post-deploy-verification-${{ github.ref }}
    cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

permissions:
    contents: read
    # read is sufficient: the only actions-scope consumer is `gh run list` below.
    actions: read

jobs:
    page-verification:
        runs-on: ubuntu-latest
        name: Page Verification (Staging)
        # For manual dispatch: always run.
        # For workflow_run: only proceed if triggered by a push to this repo (not a fork PR),
        # and only if the upstream CI run succeeded. This guards against the untrusted-checkout
        # risk flagged by OSSF/Scorecard for workflow_run triggers.
        if: >
            github.event_name == 'workflow_dispatch' ||
            (github.event.workflow_run.conclusion == 'success' &&
             github.event.workflow_run.event == 'push' &&
             github.event.workflow_run.head_repository.full_name == github.repository)
        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                  # Use github.sha (the branch HEAD) rather than workflow_run.head_sha to
                  # avoid the untrusted-input pattern flagged by the OpenSSF Scorecard.
                  ref: ${{ github.sha }}
                  fetch-depth: 0
                  submodules: true

            - name: Align gallery data to deployed commit
              # page-verification.spec.ts reads data.json from the local checkout to
              # discover which gallery examples to test. When two commits land in quick
              # succession, github.sha (HEAD) may be ahead of what was actually deployed,
              # causing tests to reference examples that don't exist on staging yet.
              if: github.event_name != 'workflow_dispatch' && github.event.workflow_run.head_sha != ''
              env:
                  DEPLOYED_SHA: ${{ github.event.workflow_run.head_sha }}
              run: |
                  git show "${DEPLOYED_SHA}:packages/ag-charts-website/src/content/gallery/data.json" \
                    > packages/ag-charts-website/src/content/gallery/data.json

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version-file: '.nvmrc'

            - name: Install Playwright
              run: |
                  npm init -y --prefix /tmp/pw
                  npm install --prefix /tmp/pw @playwright/test@1.59.1 glob playwright-ctrf-json-reporter@0.0.29
                  ln -s /tmp/pw/node_modules packages/ag-charts-website/node_modules
                  /tmp/pw/node_modules/.bin/playwright install chromium --with-deps

            - name: Resolve staging URL
              id: staging_url
              run: |
                  URL=$(node -e "
                    const src = require('fs').readFileSync('./packages/ag-charts-website/src/constants.ts', 'utf8');
                    console.log(src.match(/export const STAGING_SITE_URL\s*=\s*'([^']+)'/)[1]);
                  ")
                  echo "url=${URL}" >> $GITHUB_OUTPUT
                  echo "Resolved staging URL: ${URL}"

            - name: Run page verification tests
              id: run_tests
              working-directory: packages/ag-charts-website
              env:
                  PUBLIC_SITE_URL: ${{ inputs.staging_url || steps.staging_url.outputs.url }}
              run: /tmp/pw/node_modules/.bin/playwright test --config playwright.staging.config.ts --project=chromium

            - name: Publish CTRF Report
              if: always()
              uses: ctrf-io/github-test-reporter@v1
              with:
                  report-path: 'reports/ag-charts-page-verification.json'

            - name: Upload test results
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: page-verification-results
                  path: |
                      packages/ag-charts-website/playwright-report/
                      packages/ag-charts-website/test-results/
                  retention-days: 14

            - name: Check previous run status
              id: prev_run
              if: always()
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  # The current run is still in_progress, so --status completed gives us
                  # the last finished run — i.e. the one before this one.
                  PREV=$(gh run list \
                    --workflow post-deploy-verification.yml \
                    --branch latest \
                    --status completed \
                    --limit 1 \
                    --json headSha,conclusion \
                    --jq '.[0] // {}')

                  echo "sha=$(echo "$PREV" | jq -r '.headSha // ""')" >> $GITHUB_OUTPUT
                  echo "outcome=$(echo "$PREV" | jq -r '.conclusion // ""')" >> $GITHUB_OUTPUT

            - name: Notify Slack
              # Always notify on failure. On success, only notify if the previous run
              # failed - a "back to green" signal - so a routine passing run doesn't
              # spam the channel.
              if: >
                  always() &&
                  (steps.run_tests.outcome == 'failure' ||
                   (steps.run_tests.outcome == 'success' && steps.prev_run.outputs.outcome == 'failure'))
              uses: ./external/ag-shared/github/actions/slack-integration
              with:
                  AG_LIBRARY: charts
                  SLACK_BOT_OAUTH_TOKEN: ${{ secrets.SLACK_BOT_OAUTH_TOKEN }}
                  SLACK_CHANNEL: '#charts_teamcity_status'
                  CTRF_REPORT_FILE: reports/ag-charts-page-verification.json
                  CURRENT_COMMIT_SHA: ${{ github.sha }}
                  PREV_COMMIT_SHA: ${{ steps.prev_run.outputs.sha }}
                  IS_SUCCESS: ${{ steps.run_tests.outcome == 'success' }}
