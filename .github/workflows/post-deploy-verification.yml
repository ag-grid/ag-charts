name: Post-Deploy Page Verification

on:
    workflow_run:
        workflows: ['CI']
        types: [completed]
        branches: ['latest']
    workflow_dispatch:
        inputs:
            staging_url:
                description: 'URL to test against (leave blank to use charts-staging.ag-grid.com)'
                required: false
                default: ''
            csp_dry_run:
                description: 'Log the CSP Slack message instead of posting it'
                required: false
                type: boolean
                default: false

env:
    # Disable git's post-fetch background gc/maintenance for every git invocation
    # (injected via git's GIT_CONFIG_* protocol). Otherwise it rewrites .git/shallow
    # concurrently with the next chained `git fetch --depth 1`, intermittently failing
    # job setup with "fatal: shallow file has changed since we read it".
    GIT_CONFIG_COUNT: 2
    GIT_CONFIG_KEY_0: gc.auto
    GIT_CONFIG_VALUE_0: '0'
    GIT_CONFIG_KEY_1: maintenance.auto
    GIT_CONFIG_VALUE_1: 'false'
    CI: true

concurrency:
    group: post-deploy-verification-${{ github.ref }}
    cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

permissions:
    contents: read
    # read is sufficient: the actions-scope consumers are `gh run list` and the previous
    # run's artifact download, both read-only.
    actions: read

jobs:
    page-verification:
        runs-on: ubuntu-latest
        name: Page Verification (Staging)
        # For manual dispatch: always run.
        # For workflow_run: only proceed if triggered by a push to this repo (not a fork PR),
        # and only if the upstream CI run succeeded. This guards against the untrusted-checkout
        # risk flagged by OSSF/Scorecard for workflow_run triggers.
        if: >
            github.event_name == 'workflow_dispatch' ||
            (github.event.workflow_run.conclusion == 'success' &&
             github.event.workflow_run.event == 'push' &&
             github.event.workflow_run.head_repository.full_name == github.repository)
        steps:
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  # Use github.sha (the branch HEAD) rather than workflow_run.head_sha to
                  # avoid the untrusted-input pattern flagged by the OpenSSF Scorecard.
                  ref: ${{ github.sha }}
                  fetch-depth: 0
                  submodules: true

            - name: Align gallery data to deployed commit
              # page-verification.spec.ts reads data.json from the local checkout to
              # discover which gallery examples to test. When two commits land in quick
              # succession, github.sha (HEAD) may be ahead of what was actually deployed,
              # causing tests to reference examples that don't exist on staging yet.
              if: github.event_name != 'workflow_dispatch' && github.event.workflow_run.head_sha != ''
              env:
                  DEPLOYED_SHA: ${{ github.event.workflow_run.head_sha }}
              run: |
                  git show "${DEPLOYED_SHA}:packages/ag-charts-website/src/content/gallery/data.json" \
                    > packages/ag-charts-website/src/content/gallery/data.json

            - name: Setup Node
              uses: actions/setup-node@v7
              with:
                  node-version-file: '.nvmrc'

            - name: Install Playwright
              run: |
                  npm init -y --prefix /tmp/pw
                  npm install --prefix /tmp/pw @playwright/test@1.59.1 glob playwright-ctrf-json-reporter@0.0.29
                  ln -s /tmp/pw/node_modules packages/ag-charts-website/node_modules
                  /tmp/pw/node_modules/.bin/playwright install chromium --with-deps

            - name: Resolve staging URL
              id: staging_url
              run: |
                  URL=$(node -e "
                    const src = require('fs').readFileSync('./packages/ag-charts-website/src/constants.ts', 'utf8');
                    console.log(src.match(/export const STAGING_SITE_URL\s*=\s*'([^']+)'/)[1]);
                  ")
                  echo "url=${URL}" >> $GITHUB_OUTPUT
                  echo "Resolved staging URL: ${URL}"

            - name: Run page verification tests
              id: run_tests
              working-directory: packages/ag-charts-website
              env:
                  PUBLIC_SITE_URL: ${{ inputs.staging_url || steps.staging_url.outputs.url }}
              run: /tmp/pw/node_modules/.bin/playwright test --config playwright.staging.config.ts --project=chromium

            - name: Publish CTRF Report
              if: always()
              uses: ctrf-io/github-test-reporter@v1
              with:
                  report-path: 'reports/ag-charts-page-verification.json'

            - name: Upload test results
              if: always()
              uses: actions/upload-artifact@v7
              with:
                  name: page-verification-results
                  path: |
                      packages/ag-charts-website/playwright-report/
                      packages/ag-charts-website/test-results/
                  retention-days: 14

            # Kept as its own artifact so the csp-report job can pull just this file from the
            # previous run to compare against, rather than a bundle carrying every trace. A run
            # against a hand-given URL is not uploaded: it would become the next run's baseline
            # while describing a different site.
            - name: Upload CSP report
              if: always() && inputs.staging_url == ''
              uses: actions/upload-artifact@v7
              with:
                  name: csp-violations
                  path: reports/ag-charts-csp-violations.json
                  if-no-files-found: warn
                  retention-days: 30

            - name: Check previous run status
              id: prev_run
              if: always()
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  # The current run is still in_progress, so --status completed gives us
                  # the last finished run — i.e. the one before this one.
                  PREV=$(gh run list \
                    --workflow post-deploy-verification.yml \
                    --branch latest \
                    --status completed \
                    --limit 1 \
                    --json headSha,conclusion \
                    --jq '.[0] // {}')

                  echo "sha=$(echo "$PREV" | jq -r '.headSha // ""')" >> $GITHUB_OUTPUT
                  echo "outcome=$(echo "$PREV" | jq -r '.conclusion // ""')" >> $GITHUB_OUTPUT

            - name: Notify Slack
              # Always notify on failure. On success, only notify if the previous run
              # failed - a "back to green" signal - so a routine passing run doesn't
              # spam the channel.
              if: >
                  always() &&
                  (steps.run_tests.outcome == 'failure' ||
                   (steps.run_tests.outcome == 'success' && steps.prev_run.outputs.outcome == 'failure'))
              uses: ./external/ag-shared/github/actions/slack-integration
              with:
                  AG_LIBRARY: charts
                  SLACK_BOT_OAUTH_TOKEN: ${{ secrets.SLACK_BOT_OAUTH_TOKEN }}
                  SLACK_CHANNEL: '#charts_teamcity_status'
                  CTRF_REPORT_FILE: reports/ag-charts-page-verification.json
                  CURRENT_COMMIT_SHA: ${{ github.sha }}
                  PREV_COMMIT_SHA: ${{ steps.prev_run.outputs.sha }}
                  IS_SUCCESS: ${{ steps.run_tests.outcome == 'success' }}

    # CSP violations are reported, not gated: a hash in the site policy goes stale whenever a tag
    # is edited in Google Tag Manager, which breaks no page but does need fixing. Keeping this out
    # of the verification job means the team that owns the policy hears about it without the
    # regular channel seeing a failure nobody there can act on.
    csp-report:
        runs-on: ubuntu-latest
        name: CSP Report (non-gating)
        needs: page-verification
        # Report whatever the run observed, whether or not the page assertions passed. A skipped
        # or cancelled verification job has nothing to report.
        if: >
            always() &&
            needs.page-verification.result != 'skipped' &&
            needs.page-verification.result != 'cancelled'
        steps:
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  ref: ${{ github.sha }}
                  fetch-depth: 1
                  submodules: true

            - name: Setup Node
              uses: actions/setup-node@v7
              with:
                  node-version-file: '.nvmrc'

            - name: Download CSP report
              # Tolerated: the suite can die before writing one, and that failure is the
              # verification job's to report.
              continue-on-error: true
              uses: actions/download-artifact@v8
              with:
                  name: csp-violations
                  path: csp/current

            - name: Download previous CSP report
              # The baseline has to be a run that actually produced a report, so this walks back
              # over recent successful runs rather than trusting the newest: a dispatch against a
              # hand-given URL succeeds without uploading one, and a run predating this job has
              # none at all. Once the artifact is known to exist, a failed download is a real
              # error, so it fails this job rather than quietly reporting the site as all-new.
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  set -e
                  # The workflow run is still in progress, so this cannot select the current run.
                  CANDIDATES=$(gh run list \
                    --workflow post-deploy-verification.yml \
                    --branch latest \
                    --status success \
                    --limit 10 \
                    --json databaseId \
                    --jq '.[].databaseId')

                  BASELINE=""
                  for ID in $CANDIDATES; do
                    if ! ARTIFACTS=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$ID/artifacts" \
                      --jq '.artifacts[] | select(.expired == false) | .name'); then
                      echo "::warning title=CSP baseline::Could not list artifacts for run $ID; skipping it."
                      continue
                    fi
                    if grep -qx csp-violations <<<"$ARTIFACTS"; then
                      BASELINE=$ID
                      break
                    fi
                  done

                  if [ -z "$BASELINE" ]; then
                    echo "No recent successful run has a csp-violations artifact; treating this run as having no baseline."
                    exit 0
                  fi

                  gh run download "$BASELINE" \
                    --repo "$GITHUB_REPOSITORY" \
                    --name csp-violations \
                    --dir csp/previous
                  echo "Comparing against run $BASELINE."

            - name: Report CSP violations
              env:
                  CSP_REPORT_FILE: csp/current/ag-charts-csp-violations.json
                  PREVIOUS_CSP_REPORT_FILE: csp/previous/ag-charts-csp-violations.json
                  PROJECT_TITLE: AG Charts
                  SLACK_BOT_OAUTH_TOKEN: ${{ secrets.SLACK_BOT_OAUTH_TOKEN }}
                  SLACK_CHANNEL: '#dev-ops-status'
                  RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
                  COMMIT_SHA: ${{ github.sha }}
                  DRY_RUN: ${{ inputs.csp_dry_run || false }}
                  # A run that failed part way through sees fewer violations than the site has,
                  # which would otherwise read as a policy being fixed.
                  RUN_COMPLETE: ${{ needs.page-verification.result == 'success' }}
              run: node ./external/ag-shared/scripts/slack/notify-csp-violations.mjs
