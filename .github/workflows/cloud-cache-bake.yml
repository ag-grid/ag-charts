name: Cloud Cache Bake

# Thin wrapper. All behaviour lives in the shared composite action so ag-grid and
# ag-studio can adopt this by copying only this file.
#
# Publishes a fully-installed node_modules tarball as a release asset, keyed by
# sha256(yarn.lock), for Claude Code cloud environment setup to restore instead of
# running its own capped install. See the action for why it is a release asset and
# not a GitHub Actions artifact.
#
# Adopting this needs two things beyond the file itself: a CLOUD_CACHE_KEY repo
# secret, and the same value as AG_CLOUD_CACHE_KEY in each cloud environment. The
# bake fails rather than publishing a readable tree if the secret is missing.

on:
    push:
        branches:
            - 'latest'
        paths:
            - 'yarn.lock'
            # Re-bake when the bake logic changes, not only when dependencies do.
            # Otherwise a fix to the action sits unpublished until the next
            # unrelated lockfile change happens to pick it up.
            - '.github/workflows/cloud-cache-bake.yml'
            - 'external/ag-shared/github/actions/cloud-cache-bake/**'
    workflow_dispatch:
        inputs:
            force:
                description: 'Re-bake and overwrite even when an asset for this lockfile already exists.'
                type: boolean
                required: false
                default: false

permissions:
    contents: write

concurrency:
    # Two bakes racing would fight over the same release tag. Not cancel-in-progress:
    # a half-finished upload is worse than a queued one.
    group: cloud-cache-bake
    cancel-in-progress: false

jobs:
    bake:
        name: Bake node_modules cache
        runs-on: ubuntu-24.04
        # The base image for cloud sessions is Ubuntu 24.04 on x64 and .nvmrc pins a
        # single node version, so native binaries baked here match what the session
        # resolves. Changing the runner image would silently break that.
        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                  fetch-depth: 1

            - name: Bake and publish
              uses: ./external/ag-shared/github/actions/cloud-cache-bake
              with:
                  # Empty on a push event, which reads as "not forced".
                  force: ${{ inputs.force }}
                  # The payload is encrypted with this, and cloud environments
                  # decrypt with the same value in AG_CLOUD_CACHE_KEY. The action
                  # fails rather than publishing a readable tree if it is unset.
                  encryption-key: ${{ secrets.CLOUD_CACHE_KEY }}
                  # Where this release sorts on the releases page is a function of
                  # its TAGGED COMMIT, not its publication time — measured on this
                  # repo, and confirmed by a two-release probe in which the release
                  # published second, against an older commit, still sorted below
                  # the one published first against a newer commit. So aiming the
                  # tag at an old commit is the only lever on its position.
                  #
                  # This repo's first commit (2020-01-20), chosen because it
                  # predates every product release. Leave it set: --target applies
                  # only when the tag does not yet exist, which is exactly the case
                  # (a deleted tag) where an unset value would silently return the
                  # release to the top of the list.
                  release-target: d7e9df0d0d0b7304ab676f84a603f2f620c22cff
