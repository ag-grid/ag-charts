name: Benchmark

on:
    issue_comment:
        types: [created]
    workflow_dispatch:
        {}
        # schedule:
        #     - cron: '0 20 * * *'

env:
    NX_NO_CLOUD: true
    NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}
    NX_BRANCH: ${{ github.ref }}
    BRANCH_NAME: ${{ github.head_ref || github.ref_name }}

jobs:
    benchmark:
        runs-on: macos-benchmark
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'issue_comment' && github.event.comment.body == '/benchmarks')
        env:
            AG_SKIP_NATIVE_DEP_VERSION_CHECK: 1
            JOB_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        steps:
            - name: Notify start
              uses: actions/github-script@v6
              continue-on-error: true
              if: github.event_name == 'issue_comment'
              with:
                  script: |
                      github.rest.issues.createComment({
                        issue_number: context.issue.number,
                        owner: context.repo.owner,
                        repo: context.repo.repo,
                        body: `⏱️ Benchmark job running: ${process.env.JOB_URL}`
                      })

            - name: Checkout
              id: checkout
              uses: actions/checkout@v4
              with:
                  fetch-depth: 1

            - name: Setup
              id: setup
              uses: ./.github/actions/setup-nx
              with:
                  cache_mode: ro

            - name: nx benchmark
              id: benchmark
              if: steps.setup.outcome == 'success' || steps.setup.outcome == 'skipped'
              run: |
                  ./tools/benchmark/compare-latest.sh
                  echo "report<<EOF" >> $GITHUB_OUTPUT
                  cat ./reports/benchmark.log >> $GITHUB_OUTPUT
                  echo "EOF" >> $GITHUB_OUTPUT

            - name: Notify report
              uses: actions/github-script@v6
              continue-on-error: true
              if: github.event_name == 'issue_comment'
              with:
                  script: |
                      const body = `${process.env.JOB_URL}
                      \`\`\`
                      ${process.env.CONTENT}
                      \`\`\``;
                      github.rest.issues.createComment({
                        issue_number: context.issue.number,
                        owner: context.repo.owner,
                        repo: context.repo.repo,
                        body,
                      })

            - name: Perist benchmark results
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: benchmark-results
                  path: |
                      packages/ag-charts-website/src/content/docs/benchmarks/_examples/summary/*
