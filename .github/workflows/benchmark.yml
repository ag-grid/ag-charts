name: Benchmark

on:
    issue_comment:
        types: [created]
    workflow_dispatch:
        {}
        # schedule:
        #     - cron: '0 20 * * *'

env:
    NX_NO_CLOUD: true
    NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}
    NX_BRANCH: ${{ github.ref }}
    BRANCH_NAME: ${{ github.head_ref || github.ref_name }}

jobs:
    benchmark:
        runs-on: macos-benchmark
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'issue_comment' && github.event.comment.body == '/benchmarks')
        env:
            AG_SKIP_NATIVE_DEP_VERSION_CHECK: 1
            JOB_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        steps:
            - name: Notify start
              id: notify-start
              uses: actions/github-script@v7
              continue-on-error: true
              if: github.event_name == 'issue_comment'
              with:
                  result-encoding: string
                  script: |
                      const { data: comment } = await github.rest.issues.createComment({
                        issue_number: context.issue.number,
                        owner: context.repo.owner,
                        repo: context.repo.repo,
                        body: `⏱️ ${process.env.JOB_URL}`
                      })
                      return comment.id;

            - id: 'get-branch'
              if: github.event_name == 'issue_comment'
              run: |
                  echo "branch=$(gh pr view $PR_NO --repo $REPO --json headRefName --jq '.headRefName')" >> $GITHUB_OUTPUT
                  echo "base=$(gh pr view 3928 --json baseRefName --jq '.baseRefName')" >> $GITHUB_OUTPUT
              env:
                  REPO: ${{ github.repository }}
                  PR_NO: ${{ github.event.issue.number }}
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - name: Checkout
              uses: actions/checkout@v4
              with:
                  ref: ${{ steps.get-branch.outputs.branch }}
                  fetch-depth: 0

            - name: Fetch Refs
              if: github.event_name == 'issue_comment'
              run: |
                  set -x

                  git fetch --unshallow origin ${{ steps.get-branch.outputs.base }} || echo "Not a shallow ref?"

                  # Preemptively fail if merge-base is not found.
                  mergeBase=$(git merge-base HEAD origin/${{ steps.get-branch.outputs.base }} || echo "failed")

                  if [[ ${mergeBase} == "failed" ]] ; then
                    # Debugging
                    git log -n 1 --decorate HEAD
                    git log -n 20 --decorate origin/${{ steps.get-branch.outputs.base }}

                    # Allow for a few minutes for debugging
                    sleep 600
                  fi

            - name: Notify Progress
              uses: actions/github-script@v7
              continue-on-error: true
              if: github.event_name == 'issue_comment'
              with:
                  script: |
                      github.rest.issues.updateComment({
                        owner: context.repo.owner,
                        repo: context.repo.repo,
                        comment_id: ${{ steps.notify-start.outputs.result }},
                        body: `⏱️ ${process.env.JOB_URL} (running setup...)`
                      })

            - name: Setup
              id: setup
              uses: ./.github/actions/setup-nx
              with:
                  cache_mode: rw
                  base_ref: ${{ steps.get-branch.outputs.base }}

            - name: Notify Progress
              uses: actions/github-script@v7
              continue-on-error: true
              if: github.event_name == 'issue_comment'
              with:
                  script: |
                      github.rest.issues.updateComment({
                        owner: context.repo.owner,
                        repo: context.repo.repo,
                        comment_id: ${{ steps.notify-start.outputs.result }},
                        body: `⏱️ ${process.env.JOB_URL} (running benchmarks...)`
                      })

            - name: nx benchmark
              id: benchmark
              if: steps.setup.outcome == 'success' || steps.setup.outcome == 'skipped'
              run: |
                  ./tools/benchmark/compare-latest.sh ${{ steps.get-branch.outputs.base }}
                  echo "report<<EOF" >> $GITHUB_OUTPUT
                  cat ./reports/benchmark.log >> $GITHUB_OUTPUT
                  echo "EOF" >> $GITHUB_OUTPUT

            - name: Notify Success
              uses: actions/github-script@v7
              continue-on-error: true
              if: success() && github.event_name == 'issue_comment'
              env:
                  CONTENT: ${{ steps.benchmark.outputs.report}}
              with:
                  script: |
                      const body = `✅ ${process.env.JOB_URL}
                      \`\`\`
                      ${process.env.CONTENT}
                      \`\`\``;
                      github.rest.issues.updateComment({
                        owner: context.repo.owner,
                        repo: context.repo.repo,
                        comment_id: ${{ steps.notify-start.outputs.result }},
                        body,
                      })

            - name: Notify Failure
              uses: actions/github-script@v7
              continue-on-error: true
              if: failure() && github.event_name == 'issue_comment'
              with:
                  script: |
                      const body = `❌ ${process.env.JOB_URL}`
                      github.rest.issues.updateComment({
                        owner: context.repo.owner,
                        repo: context.repo.repo,
                        comment_id: ${{ steps.notify-start.outputs.result }},
                        body,
                      })

            - name: Perist benchmark results
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: benchmark-results
                  path: |
                      packages/ag-charts-website/src/content/docs/benchmarks/_examples/summary/*
