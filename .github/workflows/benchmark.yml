name: Benchmark

# Browser-based benchmark comparison on GitHub-hosted runners.
#
# Job graph:
#   resolve  — resolves head/base refs, computes the example shard matrix,
#              creates the PR progress comment for /benchmarks runs.
#   build    — builds the static website for head and base in parallel and
#              uploads pruned site artifacts.
#   benchmark — matrix of shards; each shard runs its example subset against
#              BOTH the head and base site on the SAME runner VM, so the
#              relative comparison stays valid despite heterogeneous shared
#              runner hardware.
#   report   — merges shard results, compares head vs base, posts the PR
#              comment table and/or Slack notification.

on:
    # TEMPORARY (remove before merge): push trigger to validate the reworked
    # pipeline pre-merge — issue_comment/workflow_dispatch run the workflow
    # file from the default branch, so they cannot exercise these changes yet.
    push:
        branches:
            - ag-16452/charts-switch-to-browser-based-benchmark
    issue_comment:
        types: [created]
    workflow_dispatch:
        inputs:
            compare-base:
                description: 'Branch name to compare against'
                type: string
                default: b12.1.1
                required: true
            notify:
                description: 'Notify Slack channel'
                type: boolean
                default: true
                required: true
    schedule:
        - cron: '0 0 * * *' # Run daily at midnight UTC

env:
    NX_NO_CLOUD: true
    NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}
    NX_BRANCH: ${{ github.ref }}
    BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
    AG_SHARD_COUNT: 4

permissions:
    contents: read

jobs:
    # Check permissions for issue_comment events
    check-permissions:
        runs-on: ubuntu-24.04
        outputs:
            allowed: ${{ steps.check.outputs.allowed }}
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Check user permissions
              id: check
              uses: ./external/ag-shared/github/actions/check-issue-comment-permissions
              with:
                  command: '/benchmarks'

    resolve:
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        permissions:
            pull-requests: write
        needs: check-permissions
        # Only run if permissions check passed (success) or was skipped (for non-issue_comment events)
        if: |
            needs.check-permissions.result == 'success' && (
                github.event_name == 'workflow_dispatch' ||
                github.event_name == 'schedule' ||
                github.event_name == 'push' ||
                (github.event_name == 'issue_comment' && needs.check-permissions.outputs.allowed == 'true')
            )
        env:
            JOB_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        outputs:
            branch: ${{ steps.get-branch.outputs.branch }}
            base: ${{ steps.get-branch.outputs.base }}
            shards: ${{ steps.shards.outputs.shards }}
            comment-id: ${{ steps.notify-start.outputs.result }}
        steps:
            - name: Notify start
              id: notify-start
              uses: actions/github-script@v7
              continue-on-error: true
              if: github.event_name == 'issue_comment'
              with:
                  result-encoding: string
                  script: |
                      const { data: comment } = await github.rest.issues.createComment({
                        issue_number: context.issue.number,
                        owner: context.repo.owner,
                        repo: context.repo.repo,
                        body: `⏱️ ${process.env.JOB_URL}`
                      })
                      return comment.id;

            - name: Checkout
              uses: actions/checkout@v4

            - id: 'get-branch'
              run: |
                  if [[ "${{ github.event_name }}" == "issue_comment" ]] ; then
                    # For PR comments, get the branch from the PR
                    echo "branch=$(gh pr view $PR_NO --repo $REPO --json headRefName --jq '.headRefName')" >> $GITHUB_OUTPUT
                    echo "base=$(gh pr view $PR_NO --repo $REPO --json baseRefName --jq '.baseRefName')" >> $GITHUB_OUTPUT
                  elif [[ "${{ github.event_name }}" == "schedule" ]] ; then
                    # For scheduled runs, get the most recent release branch matching exact 'bX.Y.Z' format
                    release=$(git ls-remote --heads origin | grep -E 'refs/heads/b[0-9]+\.[0-9]+\.[0-9]+$' | sort -t '/' -k 3 -V | tail -n 1 | sed 's/.*refs\/heads\///')
                    # Special case: b13.0.x series uses b13.0.0 as base due to circular dependency issues in b13.0.1+
                    if [[ "$release" =~ ^b13\.0\.[1-9] ]] ; then
                      release="b13.0.0"
                    fi
                    echo "branch=latest" >> $GITHUB_OUTPUT
                    echo "base=$release" >> $GITHUB_OUTPUT
                  elif [[ "${{ github.event_name }}" == "push" ]] ; then
                    # TEMPORARY pre-merge validation runs: compare against latest
                    echo "branch=${{ github.ref_name }}" >> $GITHUB_OUTPUT
                    echo "base=latest" >> $GITHUB_OUTPUT
                  else
                    # For manual workflow dispatch, use the current branch
                    echo "branch=${{ github.ref_name }}" >> $GITHUB_OUTPUT
                    echo "base=${{ inputs.compare-base }}" >> $GITHUB_OUTPUT
                  fi
              env:
                  REPO: ${{ github.repository }}
                  PR_NO: ${{ github.event.issue.number }}
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            # The head ref defines the example set; shards must match the pages
            # the head site artifact contains.
            - name: Checkout head ref
              uses: actions/checkout@v4
              with:
                  ref: ${{ steps.get-branch.outputs.branch }}

            - name: Compute shard matrix
              id: shards
              run: |
                  shards=$(node ./tools/benchmark/benchmark-examples.js --shards "$AG_SHARD_COUNT")
                  echo "shards=${shards}" >> $GITHUB_OUTPUT
                  echo "Shard matrix: ${shards}"

    build:
        runs-on: ubuntu-24.04
        timeout-minutes: 45
        needs: resolve
        strategy:
            matrix:
                # Example pages bake absolute library-script URLs from PUBLIC_SITE_URL
                # at build time, so each role is built for the fixed port the shard
                # jobs will serve it from.
                include:
                    - role: head
                      port: 4601
                    - role: base
                      port: 4602
        env:
            AG_SKIP_NATIVE_DEP_VERSION_CHECK: 1
        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                  ref: ${{ matrix.role == 'head' && needs.resolve.outputs.branch || needs.resolve.outputs.base }}

            - name: Setup
              uses: ./.github/actions/setup-nx
              with:
                  cache_mode: ${{ matrix.role == 'head' && 'rw' || 'ro' }}
                  fetch_base: skip

            - name: Build website
              env:
                  PUBLIC_SITE_URL: http://localhost:${{ matrix.port }}
                  PUBLIC_HTTPS_SERVER: 'false'
              run: yarn nx build ag-charts-website

            # Keep only what the benchmark pages need: the example pages
            # themselves, the dev-served library bundles, example-runner
            # boilerplate, and hashed astro assets.
            - name: Prune and package site
              run: |
                  cd dist/packages/ag-charts-website
                  keep=()
                  for d in vanilla/benchmarks dev example-runner _astro; do
                    [[ -d "$d" ]] && keep+=("$d")
                  done
                  if [[ ! -d vanilla/benchmarks ]]; then
                    echo "::error::vanilla/benchmarks missing from build output"
                    exit 1
                  fi
                  tar -czf "${RUNNER_TEMP}/site-${{ matrix.role }}.tar.gz" "${keep[@]}"
                  ls -lh "${RUNNER_TEMP}/site-${{ matrix.role }}.tar.gz"

            - name: Upload site artifact
              uses: actions/upload-artifact@v4
              with:
                  name: site-${{ matrix.role }}
                  path: ${{ runner.temp }}/site-${{ matrix.role }}.tar.gz
                  retention-days: 3

    benchmark:
        runs-on: ubuntu-24.04
        # Hosted runners are ~2x slower than the previous bare-metal runner;
        # the slowest examples (e.g. data-selection-zoom) need generous headroom.
        timeout-minutes: 45
        needs: [resolve, build]
        strategy:
            fail-fast: false
            matrix:
                examples: ${{ fromJSON(needs.resolve.outputs.shards) }}
        env:
            AG_SKIP_NATIVE_DEP_VERSION_CHECK: 1
            AG_BENCHMARK_SOFT_FAIL: 'true'
        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                  ref: ${{ needs.resolve.outputs.branch }}

            - name: Setup
              uses: ./.github/actions/setup-nx
              with:
                  cache_mode: ro
                  fetch_base: skip

            - name: Install Playwright Chromium
              run: npx playwright install chromium

            - name: Download site artifacts
              uses: actions/download-artifact@v4
              with:
                  pattern: site-*
                  path: ${{ runner.temp }}/sites

            - name: Unpack sites
              run: |
                  mkdir -p "${RUNNER_TEMP}/site-head" "${RUNNER_TEMP}/site-base"
                  tar -xzf "${RUNNER_TEMP}/sites/site-head/site-head.tar.gz" -C "${RUNNER_TEMP}/site-head"
                  tar -xzf "${RUNNER_TEMP}/sites/site-base/site-base.tar.gz" -C "${RUNNER_TEMP}/site-base"

            # Head and base run sequentially on this same VM so the relative
            # comparison cancels out per-runner hardware differences.
            - name: Run benchmarks (head then base)
              run: |
                  mkdir -p reports/browser-benchmarks/shards
                  run_one() {
                    local role=$1
                    local port=$2
                    ./tools/benchmark/serve-and-run.sh \
                        --dist "${RUNNER_TEMP}/site-${role}" \
                        --port "${port}" \
                        --output "reports/browser-benchmarks/shards/${role}-${{ strategy.job-index }}.json" \
                        -- --examples "${{ matrix.examples }}" --timeout 600000 || {
                      if [[ "${AG_BENCHMARK_SOFT_FAIL}" == "true" ]]; then
                        echo "::warning::${role} benchmarks had failures (soft-fail mode)"
                      else
                        return 1
                      fi
                    }
                  }
                  run_one head 4601
                  run_one base 4602

            - name: Upload shard results
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: bench-results-${{ strategy.job-index }}
                  path: reports/browser-benchmarks/shards/*
                  retention-days: 7

    report:
        runs-on: ubuntu-24.04
        timeout-minutes: 15
        needs: [resolve, benchmark]
        if: ${{ !cancelled() && needs.resolve.result == 'success' }}
        permissions:
            pull-requests: write
        env:
            AG_SKIP_NATIVE_DEP_VERSION_CHECK: 1
            JOB_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                  ref: ${{ needs.resolve.outputs.branch }}

            - name: Setup
              uses: ./.github/actions/setup-nx
              with:
                  cache_mode: ro
                  fetch_base: skip

            - name: Download shard results
              uses: actions/download-artifact@v4
              with:
                  pattern: bench-results-*
                  path: reports/browser-benchmarks/shards
                  merge-multiple: true

            - name: Merge shard results
              run: |
                  shopt -s nullglob
                  head_shards=(reports/browser-benchmarks/shards/head-*.json)
                  base_shards=(reports/browser-benchmarks/shards/base-*.json)
                  if [[ ${#head_shards[@]} -eq 0 || ${#base_shards[@]} -eq 0 ]]; then
                    echo "::error::Missing shard results (head: ${#head_shards[@]}, base: ${#base_shards[@]})"
                    exit 1
                  fi
                  node ./tools/benchmark/merge-browser-results.js --output reports/browser-benchmarks/head.json "${head_shards[@]}"
                  node ./tools/benchmark/merge-browser-results.js --output reports/browser-benchmarks/base.json "${base_shards[@]}"

            - name: Compare results
              id: compare
              run: |
                  mkdir -p reports
                  node ./tools/benchmark/compare-browser-results.js \
                      --base reports/browser-benchmarks/base.json \
                      --compare reports/browser-benchmarks/head.json \
                      --base-label "${{ needs.resolve.outputs.base }}" \
                      --compare-label "${{ needs.resolve.outputs.branch }}" \
                      --format table \
                      --report-only \
                      > reports/browser-benchmark.log
                  node ./tools/benchmark/compare-browser-results.js \
                      --base reports/browser-benchmarks/base.json \
                      --compare reports/browser-benchmarks/head.json \
                      --base-label "${{ needs.resolve.outputs.base }}" \
                      --compare-label "${{ needs.resolve.outputs.branch }}" \
                      --format json \
                      --report-only \
                      > reports/browser-benchmark.json
                  cat reports/browser-benchmark.log
                  echo "report<<EOF" >> $GITHUB_OUTPUT
                  cat reports/browser-benchmark.log >> $GITHUB_OUTPUT
                  echo "EOF" >> $GITHUB_OUTPUT

            - name: Notify Success
              uses: actions/github-script@v7
              continue-on-error: true
              if: success() && github.event_name == 'issue_comment'
              env:
                  BROWSER_CONTENT: ${{ steps.compare.outputs.report }}
              with:
                  script: |
                      const body = `✅ ${process.env.JOB_URL}\n\n**Browser Benchmarks**\n\`\`\`\n${process.env.BROWSER_CONTENT}\n\`\`\`\n`;
                      github.rest.issues.updateComment({
                        owner: context.repo.owner,
                        repo: context.repo.repo,
                        comment_id: ${{ needs.resolve.outputs.comment-id }},
                        body,
                      })

            - name: Notify Failure
              uses: actions/github-script@v7
              continue-on-error: true
              if: failure() && github.event_name == 'issue_comment'
              with:
                  script: |
                      const body = `❌ ${process.env.JOB_URL}`
                      github.rest.issues.updateComment({
                        owner: context.repo.owner,
                        repo: context.repo.repo,
                        comment_id: ${{ needs.resolve.outputs.comment-id }},
                        body,
                      })

            - name: Slack Notification (Browser)
              if: success() && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.notify == true))
              continue-on-error: true
              env:
                  SLACK_CHANNEL: '#charts-performance'
                  SLACK_ICON: 'https://avatars.slack-edge.com/2020-11-25/1527503386626_319578f21381f9641cd8_192.png'
                  SLACK_USERNAME: 'ag-charts CI'
                  SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
              run: |
                  node ./tools/benchmark/format-browser-slack-message.js > ./reports/browser-benchmark-slack.json
                  curl -X POST -H 'Content-type: application/json' ${{ secrets.SLACK_WEBHOOK }} --data @./reports/browser-benchmark-slack.json

            - name: Slack Notification (failure)
              if: failure() && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.notify == true))
              continue-on-error: true
              env:
                  SLACK_CHANNEL: '#charts-performance'
                  SLACK_ICON: 'https://avatars.slack-edge.com/2020-11-25/1527503386626_319578f21381f9641cd8_192.png'
                  SLACK_USERNAME: 'ag-charts CI'
                  SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
              run: |
                  mkdir -p reports
                  cat <<EOF > ./reports/benchmark-slack.json
                  {
                    "channel": "${SLACK_CHANNEL}",
                    "username": "${SLACK_USERNAME}",
                    "icon_url": "${SLACK_ICON}",
                    "blocks": [
                      {
                        "type": "section",
                        "text": {
                          "type": "mrkdwn",
                          "text": "❌ Benchmark failed: [Run #${{ github.run_id }}](${JOB_URL})"
                        }
                      }
                    ]
                  }
                  EOF
                  curl -X POST -H 'Content-type: application/json' ${{ secrets.SLACK_WEBHOOK }} --data @./reports/benchmark-slack.json

            - name: Persist benchmark results
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: benchmark-results
                  path: |
                      reports/browser-benchmarks/*
                      reports/browser-benchmark.*
