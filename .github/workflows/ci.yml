                    fi
                  done
                  echo "Failed to obtain ${PLAYWRIGHT_IMAGE}."
                  exit 1

            - name: playwright test ag-charts-demos
              id: demos_e2e
              run: |
                  docker run --rm --ipc=host --init \
                    -v "$(pwd)":/data \
                    -w /data/packages/ag-charts-demos \
                    -e CI \
                    ${PLAYWRIGHT_IMAGE} \
                    npx playwright test
              timeout-minutes: 15

            - name: Persist test results
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: test-results-demos-e2e
                  path: |
                      reports/
                      packages/ag-charts-demos/test-results/

    fw_pkg_test:
        runs-on: ubuntu-24.04
        name: Framework Package Tests (${{ matrix.framework }})
        permissions:
            contents: write
        needs: [detect-changes, init]
        strategy:
            fail-fast: false
            matrix: ${{ fromJson(needs.init.outputs.test_pkg_matrix )}}
        if: needs.detect-changes.outputs.run_full_ci == 'true' && (needs.init.outputs.build_type == 'latest' || needs.init.outputs.build_type == 'release' || needs.init.outputs.pkg_tests_modified == 'true')
        env:
            NX_BASE: ${{ needs.init.outputs.nx_base }}
        steps:
            - name: Checkout
              id: checkout
              if: matrix.framework != 'none'
              uses: actions/checkout@v4
              with:
                  fetch-depth: 1

            - name: Fetch Refs
              if: matrix.framework != 'none'
              run: |
                  git fetch origin --depth 1 latest next
                  git fetch origin --depth 1 tag latest-success next-success

            - name: Setup
              id: setup
              if: matrix.framework != 'none'
              uses: ./.github/actions/setup-nx
              with:
                  yarn_postinstall: no-install
                  cache_mode: ro
                  free_disk_space: false
                  base_ref: ${{ github.event.pull_request.base.ref || github.event.base_ref }}

            - name: nx package:test
              id: package-test
              if: matrix.framework != 'none'
              run: yarn nx run-many -t test:package -p ${{ matrix.framework }}-package-tests --configuration=update

            - name: Snapshot Branch
              if: matrix.framework != 'none'
              uses: ./.github/actions/snapshot-branch
              with:
                  path: tests/*-package-tests/e2e/*-snapshots/
                  source_branch: ${{ github.head_ref || github.ref_name }}
                  branch: ${{ needs.init.outputs.snapshot_branch }}
                  type: ${{ matrix.framework }}-package-tests:test:package

    bundle_tests:
        runs-on: ubuntu-24.04
        name: Bundle Tests (${{ matrix.name }})
        permissions:
            contents: write
        needs: [detect-changes, init]
        if: needs.detect-changes.outputs.run_full_ci == 'true'
        strategy:
            fail-fast: false
            matrix:
                include:
                    - name: treeshake-fast
                      target: bundle-treeshake-tests:test:bundle-treeshake
                      render_bundlers: ''
                      treeshake_bundlers: 'esbuild,vite'
                    - name: treeshake-webpack-1of2
                      target: bundle-treeshake-tests:test:bundle-treeshake
                      render_bundlers: ''
                      treeshake_bundlers: 'webpack'
                      treeshake_shard: '1/2'
                    - name: treeshake-webpack-2of2
                      target: bundle-treeshake-tests:test:bundle-treeshake
                      render_bundlers: ''
                      treeshake_bundlers: 'webpack'
                      treeshake_shard: '2/2'
                    - name: render-fast
                      target: bundle-render-tests:test:bundle-render
                      render_bundlers: 'esbuild,vite'
                      treeshake_bundlers: ''
                    - name: render-webpack-1of2
                      target: bundle-render-tests:test:bundle-render
                      render_bundlers: 'webpack'
                      render_shard: '1/2'
                      treeshake_bundlers: ''
                    - name: render-webpack-2of2
                      target: bundle-render-tests:test:bundle-render
                      render_bundlers: 'webpack'
                      render_shard: '2/2'
                      treeshake_bundlers: ''
        env:
            NX_BASE: ${{ needs.init.outputs.nx_base }}
            BUNDLE_RENDER_BUNDLERS: ${{ matrix.render_bundlers }}
            BUNDLE_RENDER_SHARD: ${{ matrix.render_shard }}
            BUNDLE_TREESHAKE_BUNDLERS: ${{ matrix.treeshake_bundlers }}
            BUNDLE_TREESHAKE_SHARD: ${{ matrix.treeshake_shard }}
        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                  fetch-depth: 1

            - name: Fetch Refs
              run: |
                  git fetch origin --depth 1 latest next
                  git fetch origin --depth 1 tag latest-success next-success

            - name: Setup
              id: setup
              uses: ./.github/actions/setup-nx
              with:
                  yarn_postinstall: no-install
                  cache_mode: ro
                  free_disk_space: false
                  base_ref: ${{ github.event.pull_request.base.ref || github.event.base_ref }}

            - name: nx test:bundle-${{ matrix.name }}
              run: yarn nx run ${{ matrix.target }}

    report:
        runs-on: ubuntu-24.04
        permissions:
            contents: write
            pull-requests: write
            statuses: write
            deployments: write
        needs:
            [
                detect-changes,
                init,
                lint,
                generate,
                build,
                validate,
                website_build,
                test,
                e2e,
                e2e_cross_browser,
                demos_e2e,
                sonarqube,
                fw_pkg_test,
                bundle_tests,
                playwright_image,
            ]
        if: cancelled() != true
        # SLACK_BOT_OAUTH_TOKEN is hoisted to job level on purpose: a step's OWN
        # env: block is not in scope for that same step's if: (the if is evaluated
        # before step env is applied). The Slack alert step below gates on
        # env.SLACK_BOT_OAUTH_TOKEN != '', so it must live here (and no-ops
        # cleanly when the secret is empty).
        env:
            SLACK_BOT_OAUTH_TOKEN: ${{ secrets.SLACK_BOT_OAUTH_TOKEN }}
        steps:
            - name: Checkout
              id: checkout
              uses: actions/checkout@v4
              with:
                  fetch-depth: 1

            - name: Fetch Refs
              run: |
                  git fetch origin --depth 1 latest next
                  git fetch origin --depth 1 tag latest-success
                  # Commit History below diffs against init's nx_base, which on a release branch is
                  # <branch>-success rather than latest-success. Tolerate its absence: a release
                  # branch has no success tag until its first green build.
                  git fetch origin --depth 1 tag "${BRANCH_NAME}-success" || true

            - uses: actions/download-artifact@v4
              with:
                  path: test-results/

            - name: Snapshot Notify
              id: snapshot-notify
              uses: ./.github/actions/snapshot-notify
              with:
                  branch: ${{ needs.init.outputs.snapshot_branch }}
                  github_token: ${{ secrets.GITHUB_TOKEN }}
                  slack_webhook: ${{ secrets.SLACK_WEBHOOK }}

            # Upsert or clear the snapshot-status section. When Snapshot Notify wrote a fragment
            # (snapshots regenerated) it is upserted; otherwise the section is removed so a stale
            # "snapshots regenerated" note from an earlier push can't linger after a fix.
            - name: Upsert snapshot-status section
              if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
              uses: ./.github/actions/pr-report-comment
              with:
                  pr_number: ${{ github.event.pull_request.number }}
                  github_token: ${{ secrets.GITHUB_TOKEN }}
                  # Clear snapshot-status when snapshots weren't regenerated, and clear snapshot-review
                  # when full CI (hence the snapshot_review job) didn't run — the report job is the
                  # always-running GC point for sections whose producing job was skipped this build.
                  remove_sections: >-
                      ${{ steps.snapshot-notify.outputs.updated != 'true' && 'snapshot-status' || '' }}
                      ${{ needs.detect-changes.outputs.run_full_ci != 'true' && 'snapshot-review' || '' }}

            - name: Merge JUnit Report XMLs
              if: needs.test.result != 'skipped' || needs.e2e.result != 'skipped' || needs.e2e_cross_browser.result != 'skipped' || needs.demos_e2e.result != 'skipped'
              continue-on-error: true
              run: |
                  yarn global add junit-report-merger
                  reports=$(find test-results/ -name \*.xml -type f -exec basename \{\} \; | sort | uniq)
                  mkdir -p reports/
                  echo "$reports" | (while read name ; do
                    yarn exec -s jrm reports/${name} "test-results/**/${name}"
                  done)

            - name: Test Report
              uses: dorny/test-reporter@v1
              if: needs.test.result == 'success' || needs.test.result == 'failure' || needs.demos_e2e.result == 'success' || needs.demos_e2e.result == 'failure'
              id: testReport
              continue-on-error: true
              with:
                  name: 'Tests Results'
                  path: reports/*.xml
                  reporter: jest-junit

            - name: Check last job status
              id: lastJobStatus
              if: always()
              run: |
                  WORKFLOW_STATUS="success"
                  if [[ "${{steps.snapshot-notify.outputs.updated}}" == 'true' ]] ; then
                    WORKFLOW_STATUS="failure"
                  elif [[ "${{ needs.lint.result }}" == "failure" ]] ; then
                    WORKFLOW_STATUS="failure"
                  elif [[ "${{ needs.generate.result }}" == "failure" ]] ; then
                    WORKFLOW_STATUS="failure"
                  elif [[ "${{ needs.build.result }}" == "failure" ]] ; then
                    WORKFLOW_STATUS="failure"
                  elif [[ "${{ needs.validate.result }}" == "failure" ]] ; then
                    WORKFLOW_STATUS="failure"
                  elif [[ "${{ needs.website_build.result }}" == "failure" ]] ; then
                    WORKFLOW_STATUS="failure"
                  elif [ "${{ needs.init.result }}" == "failure" ] ; then
                    WORKFLOW_STATUS="failure"
                  elif [ "${{ needs.test.result }}" == "failure" ] ; then
                    WORKFLOW_STATUS="failure"
                  elif [ "${{ needs.e2e.result }}" == "failure" ] ; then
                    WORKFLOW_STATUS="failure"
                  elif [ "${{ needs.e2e_cross_browser.result }}" == "failure" ] ; then
                    WORKFLOW_STATUS="failure"
                  elif [ "${{ needs.demos_e2e.result }}" == "failure" ] ; then
                    WORKFLOW_STATUS="failure"
                  elif [ "${{ needs.fw_pkg_test.result }}" == "failure" ] ; then
                    WORKFLOW_STATUS="failure"
                  elif [ "${{ needs.playwright_image.result }}" == "failure" ] ; then
                    WORKFLOW_STATUS="failure"
                  elif [ "${{ needs.sonarqube.result }}" == "failure" ] ; then
                    WORKFLOW_STATUS="partial"
                  fi
                  echo "workflowStatus=${WORKFLOW_STATUS}" >> $GITHUB_OUTPUT

                  LAST_WORKFLOW_STATUS=$(gh run list --workflow .github/workflows/ci.yml -b ${{ github.ref_name }} | grep -oh "completed.*" | grep -v "cancelled" | head -1 | awk '{print $2}')
                  if [ "$GITHUB_RUN_ATTEMPT" -ge 2 ]; then
                    # Handle re-run cases - there is no way to query the previous run status, so we assume the most
                    # common scenario will be re-run after failure.
                    LAST_WORKFLOW_STATUS="failure"
                  fi
                  if [ "$LAST_WORKFLOW_STATUS" != "$WORKFLOW_STATUS" ]; then
                    echo "status changed from $LAST_WORKFLOW_STATUS to $WORKFLOW_STATUS"
                    echo "changedState=true" >> $GITHUB_OUTPUT
                  else
                    echo "status is still $WORKFLOW_STATUS"
                    echo "changedState=false" >> $GITHUB_OUTPUT
                  fi
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - name: Commit History
              id: commits
              if: always() && job.status != 'cancelled' && needs.init.result == 'success' && needs.init.outputs.build_type != 'pr' && steps.lastJobStatus.outputs.changedState == 'true'
              run: |
                  # Fall back through the bases that may not exist in this shallow checkout, so a
                  # missing success tag degrades the Slack commit list rather than failing the job.
                  GIT_LOG=""
                  for base in "${{ needs.init.outputs.nx_base }}" latest-success ; do
                    if git rev-parse --verify --quiet "${base}^{commit}" > /dev/null ; then
                      GIT_LOG=$(git log HEAD "^${base}" --format="%an (%h) %s")
                      break
                    fi
                    echo "Base '${base}' not resolvable in this checkout, trying next."
                  done
                  if [[ -z "$GIT_LOG" ]] ; then
                    GIT_LOG=$(git log HEAD -1 --format="%an (%h) %s")
                  fi
                  echo "GIT_LOG<<EOF" >> $GITHUB_ENV
                  echo "$GIT_LOG" >> $GITHUB_ENV
                  echo "EOF" >> $GITHUB_ENV

            - name: Restore Website Build for Staging Deploy
              if: github.ref == 'refs/heads/latest' && needs.website_build.outputs.build == 'success' && steps.lastJobStatus.outputs.workflowStatus != 'failure'
              uses: actions/download-artifact@v4
              with:
                  name: website-staging-dist
                  path: dist/packages/ag-charts-website/

            - name: Deploy to Staging
              id: deploy_to_staging
              if: github.ref == 'refs/heads/latest' && needs.website_build.outputs.build == 'success' && steps.lastJobStatus.outputs.workflowStatus != 'failure'
              env:
                  SSH_PRIVATE_KEY: |
                      ${{ secrets.STAGING_SSH_KEY }}
                  SSH_HOST: ${{ secrets.STAGING_HOST }}
                  SSH_USER: ubuntu
                  SSH_KEY_LOCATION: ${{ github.workspace }}/staging.pem
                  WWW_ROOT_DIR: ${{ vars.WWW_ROOT_DIR }}
              run: |
                  echo "$SSH_PRIVATE_KEY" > $SSH_KEY_LOCATION
                  chmod 400 $SSH_KEY_LOCATION
                  ./tools/staging/createAndDeployDocsToTCGH.sh

            - name: Publish staging deploy status check
              # Surface the staging deploy as a distinct commit status so it's visible
              # from the commits view (hover over the status icon) without expanding the
              # CI report job. Only posted on `latest`, where the deploy is attempted.
              if: always() && job.status != 'cancelled' && github.ref == 'refs/heads/latest'
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  case "${{ steps.deploy_to_staging.outcome }}" in
                    success) state="success"; description="Deployed to staging" ;;
                    failure) state="failure"; description="Staging deploy failed" ;;
                    *)       state="error";   description="Not deployed to staging (CI did not pass)" ;;
                  esac
                  gh api --method POST \
                    -H "Accept: application/vnd.github+json" \
                    "/repos/${{ github.repository }}/statuses/${{ github.sha }}" \
                    -f state="${state}" \
                    -f context="Deploy to Staging" \
                    -f description="${description}" \
                    -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

            - name: Record staging deployment
              # Complements the commit status above with a GitHub deployment record, giving
              # a chronological "what is on staging, and what was before it" history at
              # /deployments/staging rather than one status per commit to trawl.
              #
              # Deliberately omits environment_url: this repository is public, so the
              # deployment record is world-readable and we do not advertise the staging
              # hostname here. Only runs when a deploy was actually attempted -- the
              # "CI did not pass, never tried" case stays out so the history is real deploys.
              #
              # continue-on-error for the same reason as the JIRA step below: `run:` blocks
              # execute under `bash -e`, so a transient gh api failure would abort the step
              # and redden a job whose deploy had already succeeded. The record is a
              # convenience, never worth failing a good deploy over.
              if: always() && job.status != 'cancelled' && github.ref == 'refs/heads/latest' && contains(fromJSON('["success", "failure"]'), steps.deploy_to_staging.outcome)
              continue-on-error: true
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  # required_contexts:[] is mandatory: without it the API refuses to create
                  # the deployment while any other check on this SHA is still pending. It has
                  # no shorthand in gh's -f/-F flags, hence the JSON body on stdin.
                  deployment_id=$(jq -n \
                      --arg ref "${{ github.sha }}" \
                      '{ref: $ref, environment: "staging", description: "AG Charts website", auto_merge: false, required_contexts: []}' \
                    | gh api --method POST \
                      -H "Accept: application/vnd.github+json" \
                      "/repos/${{ github.repository }}/deployments" \
                      --input - \
                      --jq '.id')

                  gh api --method POST \
                    -H "Accept: application/vnd.github+json" \
                    "/repos/${{ github.repository }}/deployments/${deployment_id}/statuses" \
                    -f state="${{ steps.deploy_to_staging.outcome }}" \
                    -f description="Staging deploy ${{ steps.deploy_to_staging.outcome }}" \
                    -f log_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

            - name: Tag Deployed Staging Commit
              # Moving tag so the commit currently live on staging shows as an inline chip
              # in the commits list, with no status icon to hover.
              if: always() && job.status != 'cancelled' && github.ref == 'refs/heads/latest' && steps.deploy_to_staging.outcome == 'success'
              uses: EndBug/latest-tag@latest
              with:
                  ref: staging
                  description: Commit currently deployed to the staging website.

            - name: Tag Latest Successful Commit
              if: success() && needs.init.result == 'success' && needs.init.outputs.build_type != 'pr' && steps.lastJobStatus.outputs.workflowStatus != 'failure'
              uses: EndBug/latest-tag@latest
              with:
                  ref: ${{ github.ref_name }}-success
                  description: Latest commit to pass GitHub Actions workflow on ${{ github.ref_name }} branch.

            - name: Find matching workflow
              if: always() && job.status != 'cancelled' && github.ref == 'refs/heads/latest' && steps.deploy_to_staging.outcome == 'success'
              id: find_latest_sha
              uses: SamhammerAG/last-successful-build-action@v4
              with:
                  branch: 'latest'
                  workflow: 'ci'
                  verify: false

            - name: Notify staging deploy
              if: always() && job.status != 'cancelled' && github.ref == 'refs/heads/latest' && steps.deploy_to_staging.outcome == 'success'
              shell: bash
              env:
                  SLACK_BOT_OAUTH_TOKEN: ${{ secrets.SLACK_BOT_OAUTH_TOKEN }}
                  NOTION_API_TOKEN: ${{ secrets.SLACK_USER_CONFIG_NOTION_API_TOKEN }}
                  NOTION_DATA_SOURCE_ID: ${{ secrets.SLACK_USER_CONFIG_NOTION_DATA_SOURCE_ID }}
                  AG_PROJECT: AgCharts
                  RUN_ID: ${{ github.run_id }}
                  CURRENT_SHA: ${{ github.sha }}
                  LAST_SUCCESSFUL_SHA: ${{ steps.find_latest_sha.outputs.sha }}
                  WEBSITE_STATUS_CHANNEL: ${{ secrets.WEBSITE_STATUS_CHANNEL }}
                  LIBRARY_WEBSITE_STATUS_CHANNEL: ${{ env.LIBRARY_WEBSITE_STATUS_CHANNEL }}
                  DEPLOY_TO_STAGING: 'true'
              run: node ./external/ag-shared/scripts/slack/notify-staging-deploy.mjs

            - name: Comment on deployed JIRA tickets
              # Tells each AG ticket in this deploy that it is live on staging, with the
              # verification link, so nobody has to reconstruct it by hand. Shares
              # find_latest_sha with the Slack notification above so both describe the
              # same commit range.
              #
              # continue-on-error: a JIRA outage or a token-scope problem must never turn
              # a successful deploy red. The script also swallows per-ticket failures, so
              # this only trips on a total failure (e.g. missing config).
              if: always() && job.status != 'cancelled' && github.ref == 'refs/heads/latest' && steps.deploy_to_staging.outcome == 'success'
              continue-on-error: true
              shell: bash
              env:
                  JIRA_EMAIL: ${{ secrets.JIRA_AI_BOT_EMAIL }}
                  JIRA_API_TOKEN: ${{ secrets.JIRA_AI_BOT_API_TOKEN }}
                  JIRA_SITE_URL: ${{ vars.JIRA_SITE_URL }}
                  # Reads the deployed commit range from the compare API, so the shallow
                  # checkout in this job does not matter. GITHUB_REPOSITORY is already in
                  # the default step environment.
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  AG_PROJECT: AgCharts
                  RUN_ID: ${{ github.run_id }}
                  RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
                  CURRENT_SHA: ${{ github.sha }}
                  LAST_SUCCESSFUL_SHA: ${{ steps.find_latest_sha.outputs.sha }}
              run: node ./tools/staging/notify-jira-staging-deploy.mjs

            # --- CI status alert (bot token — the single notification point) ----
            # THE Slack alert for every non-PR CI state change — success and
            # failure alike (this replaced the old rtCamp webhook post). Why bot
            # token rather than webhook: a webhook returns no ts, so it can't be
            # threaded; chat.postMessage yields {channel, ts}. On a `latest`
            # failure that anchor is handed to the ci-failure-handler workflow (as
            # the `ci-failure-slack` artifact) so the AI's live status + fix
            # summary reply IN-THREAD under this single alert — not as a second
            # message elsewhere.
            # Best-effort: a Slack hiccup never fails CI — the handler then posts
            # its own root message in the same channel instead. And because the
            # alert only fires on a state CHANGE, a HEAD that was already red posts
            # no anchor; the handler's fallback covers that case too.
            - name: Slack Notification (bot token, thread anchor)
              id: ci_failure_alert
              if: always() && job.status != 'cancelled' && needs.init.result == 'success' && needs.init.outputs.build_type != 'pr' && steps.lastJobStatus.outputs.changedState == 'true' && env.SLACK_BOT_OAUTH_TOKEN != '' && vars.CI_FAILURE_SLACK_CHANNEL != ''
              continue-on-error: true
              env:
                  # SLACK_BOT_OAUTH_TOKEN inherited from the job-level env above.
                  # CI_FAILURE_SLACK_CHANNEL: set to the SAME channel the webhook
                  # posted to (a channel ID is most robust) so alerts stay where the
                  # team already sees them; the bot must be a member of it.
                  # chat.postMessage returns the canonical ID the handler threads on.
                  SLACK_CHANNEL: ${{ vars.CI_FAILURE_SLACK_CHANNEL }}
                  REF_NAME: ${{ github.ref_name }}
                  WORKFLOW_STATUS: ${{ steps.lastJobStatus.outputs.workflowStatus }}
                  IS_LATEST: ${{ github.ref == 'refs/heads/latest' }}
                  RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
                  INIT_RESULT: ${{ needs.init.result }}
                  LINT_RESULT: ${{ needs.lint.outputs.lint }}
                  FORMAT_RESULT: ${{ needs.lint.outputs.format }}
                  GENERATE_RESULT: ${{ needs.generate.outputs.generate }}
                  BUILD_RESULT: ${{ needs.build.outputs.build }}
                  VALIDATE_RESULT: ${{ needs.validate.outputs.validate }}
                  WEBSITE_RESULT: ${{ needs.website_build.outputs.build }}
                  TEST_RESULT: ${{ needs.test.result }}
                  E2E_RESULT: ${{ needs.e2e.result }}
                  E2E_CROSS_BROWSER_RESULT: ${{ needs.e2e_cross_browser.result }}
                  DEMOS_E2E_RESULT: ${{ needs.demos_e2e.result }}
                  FW_PKG_RESULT: ${{ needs.fw_pkg_test.result }}
                  PLAYWRIGHT_RESULT: ${{ needs.playwright_image.result }}
                  SONAR_RESULT: ${{ needs.sonarqube.result }}
              run: |
                  set -euo pipefail
                  # `[[ … ]] && LINES+=(…)`: the [[ ]] is the left operand of &&, so
                  # a false test is exempt from set -e (it never exits the step).
                  if [[ "$WORKFLOW_STATUS" != "failure" && "$WORKFLOW_STATUS" != "partial" ]]; then
                      LINES=(":white_check_mark: *ag-charts CI completed successfully on \`${REF_NAME}\`*")
                  else
                      LINES=(":x: *ag-charts CI failed on \`${REF_NAME}\`*")
                  fi
                  [[ "$INIT_RESULT" == "failure" ]] && LINES+=("• Init")
                  [[ "$LINT_RESULT" == "failure" ]] && LINES+=("• Lint")
                  [[ "$FORMAT_RESULT" == "failure" ]] && LINES+=("• Format")
                  [[ "$GENERATE_RESULT" == "failure" ]] && LINES+=("• Generate")
                  [[ "$BUILD_RESULT" == "failure" ]] && LINES+=("• Build")
                  [[ "$VALIDATE_RESULT" == "failure" ]] && LINES+=("• Validate")
                  [[ "$WEBSITE_RESULT" == "failure" ]] && LINES+=("• Website")
                  [[ "$TEST_RESULT" == "failure" ]] && LINES+=("• Test")
                  [[ "$E2E_RESULT" == "failure" ]] && LINES+=("• E2E")
                  [[ "$E2E_CROSS_BROWSER_RESULT" == "failure" ]] && LINES+=("• E2E Cross-Browser")
                  [[ "$DEMOS_E2E_RESULT" == "failure" ]] && LINES+=("• Demos E2E")
                  [[ "$FW_PKG_RESULT" == "failure" ]] && LINES+=("• FW Pkg")
                  [[ "$PLAYWRIGHT_RESULT" == "failure" ]] && LINES+=("• Playwright Image")
                  [[ "$SONAR_RESULT" == "failure" ]] && LINES+=("• Sonar")
                  LINES+=("<${RUN_URL}|CI run>")
                  if [[ -n "${GIT_LOG:-}" ]]; then LINES+=("" "*Changes:*" "${GIT_LOG}"); fi
                  TEXT=$(printf '%s\n' "${LINES[@]}")
                  PAYLOAD=$(jq -nc --arg ch "$SLACK_CHANNEL" --arg text "$TEXT" '{channel:$ch, text:$text}')
                  RESP=$(curl -sS -X POST https://slack.com/api/chat.postMessage \
                      -H "Authorization: Bearer ${SLACK_BOT_OAUTH_TOKEN}" \
                      -H 'Content-type: application/json; charset=utf-8' \
                      --data "$PAYLOAD" || echo '{}')
                  if ! echo "$RESP" | jq -e '.ok' >/dev/null 2>&1; then
                      echo "::warning::chat.postMessage failed: $(echo "$RESP" | jq -r '.error // "no response"') — handler will post its own root message."
                      exit 0
                  fi
                  # The thread anchor only matters for the case the ci-failure
                  # handler picks up: a genuine failure on `latest`.
                  if [[ "$IS_LATEST" != "true" || "$WORKFLOW_STATUS" != "failure" ]]; then
                      exit 0
                  fi
                  CH=$(echo "$RESP" | jq -r '.channel // ""')
                  TS=$(echo "$RESP" | jq -r '.ts // ""')
                  # Only write the anchor when BOTH are non-empty: an artifact with
                  # an empty channel/ts would make the handler thread into nothing.
                  if [[ -n "$CH" && -n "$TS" ]]; then
                      jq -nc --arg c "$CH" --arg ts "$TS" '{channel:$c, ts:$ts}' > ci-failure-slack.json
                      echo "wrote ci-failure-slack.json: $(cat ci-failure-slack.json)"
                  else
                      echo "[ci-failure-alert] empty channel/ts from Slack — no anchor; handler will post its own root."
                  fi

            - name: Upload CI-failure Slack thread anchor
              if: always() && steps.ci_failure_alert.outcome == 'success' && hashFiles('ci-failure-slack.json') != ''
              uses: actions/upload-artifact@v4
              with:
                  name: ci-failure-slack
                  path: ci-failure-slack.json
                  retention-days: 7

            - name: Fail job if workflow failed
              if: success() && steps.lastJobStatus.outputs.workflowStatus == 'failure'
              run: |
                  echo "Workflow failed, failing the build."
                  exit 1

    # Asynchronous, NON-GATING snapshot review. Runs the /snapshot-review reports for the PR and
    # writes the `snapshot-review` section of the consolidated PR comment. `report` does NOT depend
    # on this job and it must be excluded from branch-protection required checks — merge never waits
    # on it. `continue-on-error` + `!cancelled()` keep it off the critical path (the snapshot jobs
    # deliberately exit 1 when they regenerate baselines, so this must tolerate their failure).
    snapshot_review:
        runs-on: ubuntu-24.04
        name: Snapshot Review
        continue-on-error: true
        needs: [detect-changes, init, test, e2e, e2e_cross_browser, fw_pkg_test]
        if: |
            !cancelled() &&
            github.event_name == 'pull_request' &&
            github.event.pull_request.head.repo.full_name == github.repository &&
            needs.detect-changes.outputs.run_full_ci == 'true'
        permissions:
            # write: the HTML reports are published to the gh-pages PR preview (pr-preview-publish
            # pushes with GITHUB_TOKEN, which is scoped by this job's permissions).
            contents: write
            pull-requests: write
            packages: read
            # scene-graph review (follow-up) downloads CI artifacts via gh — needs actions: read.
            actions: read
        # This job also publishes into the PR's pr-<N>/ preview, so it shares the
        # per-PR lock with `pr_preview` and `gh_pages_cleanup` — see the rationale on
        # `pr_preview`. Byte-identical group string across all three.
        concurrency:
            group: pr-preview-gh-pages-${{ github.event.pull_request.number }}
            cancel-in-progress: false
        env:
            # Report URLs are deterministic (snapshot-<slug>.html), so a previous run's deploy answers
            # 200 at the same URL while this run's is still propagating. Stamp each report with a
            # per-commit marker and gate the reachability check on it, so a stale deploy can't pass.
            REPORT_DEPLOY_MARKER: '<!-- snapshot-review-deploy ${{ github.event.pull_request.head.sha }} -->'
        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                  # Full history topology is needed for snapshot diffing, but blobs can be
                  # fetched lazily — a blob-less clone cuts checkout from ~80s to ~15s.
                  fetch-depth: 0
                  filter: blob:none

            # The review can only produce output when the PR touches committed baselines (PNGs)
            # or CI regenerated baselines onto the snapshot branch. Detecting that up front lets
            # the no-change path skip the ~65s of ImageMagick + dev-prompts installs.
            - name: Detect snapshot changes
              id: detect
              env:
                  SNAPSHOT_BRANCH: ${{ needs.init.outputs.snapshot_branch }}
                  BASE_BRANCH: ${{ github.base_ref }}
              run: |
                  set -uo pipefail
                  changed=false
                  if git ls-remote --exit-code --heads origin "$SNAPSHOT_BRANCH" >/dev/null 2>&1 ; then
                    changed=true
                    echo "Snapshot branch $SNAPSHOT_BRANCH exists on origin."
                  elif git diff --name-only "origin/${BASE_BRANCH}...HEAD" -- '*.png' | grep -q . ; then
                    changed=true
                    echo "PR diff touches committed PNG baselines."
                  else
                    echo "No snapshot changes detected; skipping review installs."
                  fi
                  echo "changed=${changed}" >> "$GITHUB_OUTPUT"

            - name: Install ImageMagick
              if: steps.detect.outputs.changed == 'true'
              shell: bash
              run: |
                  set -euo pipefail
                  # snapshot-collect.sh drives ImageMagick via the v7-style `magick <subcommand>`
                  # entrypoint (`magick identify`, `magick compare`). ubuntu-24.04 ships ImageMagick 6,
                  # which exposes those as standalone `identify`/`compare` and has no `magick` binary.
                  # Install v6 and provide a thin shim that dispatches `magick <sub> …` -> `<sub> …`
                  # (self-contained; no fragile AppImage download).
                  sudo apt-get update -qq
                  sudo apt-get install -y -qq imagemagick
                  printf '#!/usr/bin/env bash\nexec "$@"\n' | sudo tee /usr/local/bin/magick >/dev/null
                  sudo chmod +x /usr/local/bin/magick
                  magick identify -version | head -1

            - name: Install @ag-grid/dev-prompts
              if: steps.detect.outputs.changed == 'true'
              uses: ./external/ag-shared/github/actions/install-ag-dev-prompts
              with:
                  channel: canary

            - name: Generate snapshot-review reports
              if: steps.detect.outputs.changed == 'true'
              id: review
              uses: ./.github/actions/snapshot-review-run
              with:
                  snapshot_branch: ${{ needs.init.outputs.snapshot_branch }}
                  base_branch: ${{ github.base_ref }}
                  github_token: ${{ secrets.GITHUB_TOKEN }}
                  # Reports are published to the PR preview below; link straight to them (one click).
                  # Deterministic URL — the report filenames are snapshot-<slug>.html.
                  report_base_url: https://ag-grid.github.io/ag-charts/pr-${{ github.event.pull_request.number }}/

            # Post the summary immediately (the report link is a "publishing…" placeholder at this
            # point). Also the GC point: clears a stale section when this build produced no report.
            - name: Upsert snapshot-review section (summary)
              uses: ./.github/actions/pr-report-comment
              with:
                  pr_number: ${{ github.event.pull_request.number }}
                  github_token: ${{ secrets.GITHUB_TOKEN }}
                  remove_sections: ${{ steps.review.outputs.produced != 'true' && 'snapshot-review' || '' }}

            - name: Upload snapshot-review HTML reports
              if: steps.review.outputs.produced == 'true'
              uses: actions/upload-artifact@v4
              with:
                  name: snapshot-review-html
                  path: ${{ steps.review.outputs.html_dir }}/*.html
                  if-no-files-found: ignore

            # Stamp each report with the per-commit deploy marker, then resolve the file paths for the
            # PR-preview publish (the publish action takes explicit newline-separated paths, not a glob).
            - name: Stage report files
              id: reports
              if: steps.review.outputs.produced == 'true'
              shell: bash
              run: |
                  set -euo pipefail
                  files=$(find "${{ steps.review.outputs.html_dir }}" -maxdepth 1 -type f -name '*.html')
                  while IFS= read -r f; do
                      [[ -n "$f" ]] && printf '\n%s\n' "$REPORT_DEPLOY_MARKER" >> "$f"
                  done <<< "$files"
                  {
                      echo "files<<__FILES_EOF__"
                      echo "$files"
                      echo "__FILES_EOF__"
                  } >> "$GITHUB_OUTPUT"

            # Publish the self-contained reports under pr-<N>/ (served at
            # https://ag-grid.github.io/ag-charts/pr-<N>/snapshot-<slug>.html). Removed with the rest
            # of the PR preview when the PR closes.
            - name: Publish reports to PR preview
              id: publish
              if: steps.review.outputs.produced == 'true'
              uses: ./external/ag-shared/github/actions/pr-preview-publish
              with:
                  pr_number: ${{ github.event.pull_request.number }}
                  files: ${{ steps.reports.outputs.files }}
                  github_token: ${{ secrets.GITHUB_TOKEN }}

            # Wait for THIS run's reports to become reachable on gh-pages before linking them, so the
            # comment never carries a link that 404s while the deploy propagates. Gate on the deploy
            # marker (not status alone): a deterministic URL can answer 200 from a previous run's
            # deploy while this run's is still propagating. Best-effort — if the current deploy is
            # still not served after the budget, the pending check below decides between an
            # optimistic link and the artifact fallback.
            - name: Wait for published reports
              id: wait
              if: steps.review.outputs.produced == 'true'
              shell: bash
              run: |
                  set -uo pipefail
                  echo "started=$(date -u +%s)" >> "$GITHUB_OUTPUT"
                  base="https://ag-grid.github.io/ag-charts/pr-${{ github.event.pull_request.number }}"
                  reachable=true
                  for f in "${{ steps.review.outputs.html_dir }}"/*.html; do
                      url="${base}/$(basename "$f")"
                      echo "Waiting for ${url}"
                      for attempt in $(seq 1 40); do
                          if curl -sf "$url" 2>/dev/null | grep -qF "$REPORT_DEPLOY_MARKER"; then
                              echo "  reachable (current deploy)"; break
                          fi
                          if [[ "$attempt" == "40" ]]; then
                              echo "::warning::${url} did not serve this run's deploy after retries."
                              reachable=false
                          fi
                          sleep 5
                      done
                  done
                  echo "reachable=${reachable}" >> "$GITHUB_OUTPUT"

            # The wait budget is routinely shorter than Pages' propagation tail: `pages-build-deployment`
            # is single-flight, so every push to gh-pages cancels the in-flight build, and on a busy day
            # a report can take 10+ minutes to be served. Timing out therefore does NOT mean the publish
            # failed — the commit is already on gh-pages, and whichever build is still in flight (or its
            # successor) will serve it. Distinguish the two cases: a Pages build queued/running since our
            # push means "still propagating" (link optimistically, with a caveat); nothing in flight means
            # the deploy really is not coming (artifact fallback). Errs toward the fallback if the API
            # cannot be queried.
            - name: Check for in-flight Pages deploys
              id: pages
              if: always() && steps.review.outputs.produced == 'true' && steps.wait.outputs.reachable != 'true'
              shell: bash
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  # Grace window: the Pages build for our push is created a second or two after it, but
                  # allow for clock skew between the runner and the API timestamps.
                  WAIT_STARTED: ${{ steps.wait.outputs.started }}
              run: |
                  set -uo pipefail
                  pending=false
                  cutoff=$(( ${WAIT_STARTED:-0} - 60 ))
                  for status in queued in_progress; do
                      while IFS= read -r created; do
                          [[ -n "$created" ]] || continue
                          epoch=$(date -u -d "$created" +%s 2>/dev/null) || continue
                          if (( epoch >= cutoff )); then
                              echo "Pages build ${status} since ${created} — deploy still propagating."
                              pending=true
                          fi
                      done < <(gh run list --workflow=pages-build-deployment --status "$status" \
                                   --limit 20 --json createdAt --jq '.[].createdAt' 2>/dev/null)
                  done
                  if [[ "$pending" != "true" ]]; then
                      echo "No Pages build in flight since our push; treating the deploy as failed."
                  fi
                  echo "pending=${pending}" >> "$GITHUB_OUTPUT"

            # Replace the deferred-link sentinel. always(): even if upload/stage/publish/wait failed,
            # the sentinel MUST be resolved so the comment never sticks on "Publishing…". Link the live
            # report when it published AND is serving this run's deploy; link it with a propagation
            # caveat when Pages is still deploying; otherwise fall back to the run artifacts.
            - name: Finalize snapshot-review links
              if: always() && steps.review.outputs.produced == 'true'
              shell: bash
              env:
                  RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
              run: |
                  set -euo pipefail
                  frag="${RUNNER_TEMP}/pr-sections/25-snapshot-review.md"
                  [[ -f "$frag" ]] || exit 0
                  if [[ "${{ steps.publish.outcome }}" != "success" ]]; then
                      state=failed
                  elif [[ "${{ steps.wait.outputs.reachable }}" == "true" ]]; then
                      state=live
                  elif [[ "${{ steps.pages.outputs.pending }}" == "true" ]]; then
                      state=pending
                  else
                      state=failed
                  fi
                  # `|` delimiter throughout: RUN_URL carries a `#artifacts` fragment, which would
                  # terminate the s command early under a `#` delimiter.
                  case "$state" in
                      live)
                          sed -E -i 's|<!-- report-link href="([^"]+)" -->.*|[Open the full interactive report](\1)|' "$frag"
                          ;;
                      pending)
                          sed -E -i "s|<!-- report-link href=\"([^\"]+)\" -->.*|[Open the full interactive report](\1) — :hourglass_flowing_sand: _GitHub Pages was still deploying when CI finished. If the link 404s or shows an older comparison, retry in a few minutes; this run's copy is also in the \`snapshot-review-html\` artifact on the [workflow run](${RUN_URL}#artifacts)._|" "$frag"
                          ;;
                      failed)
                          sed -E -i "s|<!-- report-link href=\"[^\"]+\" -->.*|:warning: Report publish failed — download the \`snapshot-review-html\` artifact from the [workflow run](${RUN_URL}#artifacts).|" "$frag"
                          ;;
                  esac

            # Mirror the resolved section into the run's job summary. Same content as the PR comment,
            # but rendered inline on the run page and reachable with no Pages deploy at all — so the
            # ranked table is readable the moment the job ends even while the interactive report is
            # still propagating (or if it never publishes). Job summaries are sanitized GFM: script,
            # style and event handlers are stripped, so only the tables and links travel here. The
            # interactive report (embedded images, onion-skin/swipe/compare) stays on Pages.
            # Runs after Finalize so the link it carries is the resolved one, not the sentinel.
            - name: Write snapshot-review job summary
              if: always() && steps.review.outputs.produced == 'true'
              shell: bash
              run: |
                  set -euo pipefail
                  frag="${RUNNER_TEMP}/pr-sections/25-snapshot-review.md"
                  [[ -f "$frag" ]] || exit 0
                  # `## [warn] <title>` is the section-status convention pr-report-comment parses out
                  # into a <summary> icon. There is no such wrapper here, so render the icon inline
                  # rather than leaking the raw marker into the summary.
                  sed -E \
                      -e 's|^## \[ok\] |## :white_check_mark: |' \
                      -e 's|^## \[warn\] |## :warning: |' \
                      -e 's|^## \[error\] |## :x: |' \
                      "$frag" >> "$GITHUB_STEP_SUMMARY"

            # Re-upsert with the resolved report link (live or fallback) in place.
            - name: Upsert snapshot-review section (with report link)
              if: always() && steps.review.outputs.produced == 'true'
              uses: ./.github/actions/pr-report-comment
              with:
                  pr_number: ${{ github.event.pull_request.number }}
                  github_token: ${{ secrets.GITHUB_TOKEN }}

    sonarqube:
        # Org-scoped GHA variable kill-switch: set SONARCLOUD_ENABLED=false to
        # skip the scan (e.g. during a SonarCloud infra outage). Absent/any other
        # value keeps it running. Sonar is advisory, so a skip is not a failure.
        if: vars.SONARCLOUD_ENABLED != 'false'
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@v4
              with:
                  # Disabling shallow clones is recommended for improving the relevancy of reporting
                  fetch-depth: 0

            - name: SonarQube Scan
              uses: sonarsource/sonarqube-scan-action@master
              with:
                  args: >
                      -Dsonar.qualitygate.wait=true
              env:
                  SONAR_TOKEN: ${{ secrets.SONAR_LOGIN }}
                  SONAR_HOST_URL: https://sonarcloud.io
