name: CI

on:
    push:
        branches:
            - 'latest'
            - 'next'
            - 'b[0-9][0-9]?.[0-9][0-9]?.[0-9][0-9]?'
    pull_request:
    workflow_dispatch:
        inputs:
            clean_checkout:
                description: 'Disable all caching'
                type: 'choice'
                required: true
                default: 'false'
                options:
                    - 'true'
                    - 'false'
            nx_command:
                type: 'choice'
                required: true
                default: 'affected'
                options:
                    - 'affected'
                    - 'run-many'

env:
    IBM_TELEMETRY_DISABLED: 'true'
    # Disable git's post-fetch background gc/maintenance for every git invocation
    # (injected via git's GIT_CONFIG_* protocol). Otherwise it rewrites .git/shallow
    # concurrently with the next chained `git fetch --depth 1`, intermittently failing
    # job setup with "fatal: shallow file has changed since we read it".
    GIT_CONFIG_COUNT: 2
    GIT_CONFIG_KEY_0: gc.auto
    GIT_CONFIG_VALUE_0: '0'
    GIT_CONFIG_KEY_1: maintenance.auto
    GIT_CONFIG_VALUE_1: 'false'
    NX_NO_CLOUD: true
    NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}
    NX_BRANCH: ${{ github.ref }}
    NX_COMMAND_TYPE: ${{ github.event.inputs.nx_command }}
    BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
    AG_LIBRARY: charts
    AG_SKIP_NATIVE_DEP_VERSION_CHECK: 1
    AG_E2E_SHARD_COUNT: 32
    LIBRARY_WEBSITE_STATUS_CHANNEL: '#charts-website-status'

permissions:
    contents: read
    pull-requests: read

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: ${{ github.ref != 'refs/heads/latest' && github.ref != 'refs/heads/next' }}

jobs:
    detect-changes:
        runs-on: ubuntu-24.04
        name: Detect Changes
        outputs:
            run_full_ci: ${{ steps.decide.outputs.run_full_ci }}
            locale: ${{ steps.filter.outputs.locale }}
        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                  fetch-depth: 1

            - name: Detect file changes (PR only)
              id: filter
              if: github.event_name == 'pull_request'
              uses: dorny/paths-filter@v3
              with:
                  filters: |
                      code:
                        - 'packages/**'
                        - 'libraries/**'
                        - 'plugins/**'
                        - 'tests/**'
                        - 'tools/**'
                        - 'external/ag-website-shared/**'
                        - 'external/ag-shared/scripts/**'
                        - 'external/ag-shared/github/**'
                        - 'external/ag-shared/src/**'
                        - 'external/ag-shared/tools/**'
                        - 'external/ag-shared/*.json'
                        - 'examples/server-side-rendering/**'
                        - '*.json'
                        - '*.ts'
                        - '*.js'
                        - '*.cjs'
                        - '*.mjs'
                        - 'yarn.lock'
                        - 'nx.json'
                        - 'tsconfig.*.json'
                        - '**/vitest.config.ts'
                        - '**/vitest.setup.ts'
                      ci:
                        - '.github/**'
                      locale:
                        - 'packages/ag-charts-locale/src/**'

            - name: Decide what to run
              id: decide
              run: |
                  # Always run full CI for push events and manual triggers
                  if [[ "${{ github.event_name }}" != "pull_request" ]]; then
                    echo "run_full_ci=true" >> $GITHUB_OUTPUT
                    echo "Non-PR event (${{ github.event_name }}), running full CI"
                    exit 0
                  fi

                  # For PRs, check if code or CI files changed
                  if [[ "${{ steps.filter.outputs.code }}" == "true" ]] || \
                     [[ "${{ steps.filter.outputs.ci }}" == "true" ]]; then
                    echo "run_full_ci=true" >> $GITHUB_OUTPUT
                    echo "Code or CI changes detected (code=${{ steps.filter.outputs.code }}, ci=${{ steps.filter.outputs.ci }}), running full CI"
                  else
                    echo "run_full_ci=false" >> $GITHUB_OUTPUT
                    echo "Only non-code changes detected, running lint only"
                  fi

    init:
        runs-on: ubuntu-24.04
        name: Initialise Workflow
        needs: detect-changes
        if: needs.detect-changes.outputs.run_full_ci == 'true'
        permissions:
            contents: write
        env:
            AG_FORCE_ALL_TESTS: 1
        outputs:
            nx_base: ${{ steps.setup.outputs.base }}
            test_count: ${{ steps.matrix.outputs.test_count }}
            test_matrix: ${{ steps.matrix.outputs.test_matrix }}
            test_pkg_matrix: ${{ steps.matrix.outputs.pkg_matrix }}
            e2e_matrix: ${{ steps.matrix.outputs.e2e_matrix }}
            e2e_count: ${{ steps.matrix.outputs.e2e_count }}
            demos_affected: ${{ steps.matrix.outputs.demos_affected }}
            build_type: ${{ steps.setup.outputs.type }}
            snapshot_branch: ${{ steps.snapshot-prepare.outputs.branch }}
            pkg_tests_modified: ${{ steps.matrix.outputs.pkg_tests_modified }}
        steps:
            - name: Checkout
              id: checkout
              uses: actions/checkout@v4
              with:
                  fetch-depth: 1

            - name: Setup
              id: setup
              uses: ./.github/actions/setup-nx
              with:
                  cache_mode: ${{ github.event.inputs.clean_checkout == 'true' && 'off' || 'rw' }}
                  base_ref: ${{ github.event.pull_request.base.ref || github.event.base_ref || 'latest' }}

            - name: nx build and generate cacheable examples
              id: build
              if: steps.setup.outcome == 'success' || steps.setup.outcome == 'skipped'
              run: |
                  yarn nx run-many -t build,docs-resolved-interfaces,generate-example --exclude tag:skip-gha-cache,all
                  # Populate the (rw-cached) staging example outputs here so the ro website_build
                  # job restores them instead of regenerating all examples. Only latest builds the
                  # website with -c staging, so scope the extra generation to that branch.
                  if [[ "${{ github.ref }}" == "refs/heads/latest" ]]; then
                      yarn nx run-many -t generate-example -c staging --exclude tag:skip-gha-cache,all
                  fi

            - name: Build tests
              run: yarn nx run-many -t generate-test-files

            - name: Build non-cacheable examples
              run: |
                  # Get all non-benchmark non-Nx-cacheable examples for e2e tests
                  yarn nx graph --file=/tmp/graph.json
                  e2e_cacheable=$(jq -r '[.graph.nodes | to_entries[] | select(.value.data.tags | contains(["skip-gha-cache"]) and contains(["type:generated-example"])) | .key] | map(select(contains("benchmarks") | not)) | join(",")' /tmp/graph.json)

                  # Build all non-Nx-cacheable examples for e2e tests
                  yarn nx run-many -t generate-example -p ${e2e_cacheable} --excludeTaskDependencies --skip-nx-cache

            - name: Calculate test matrices
              id: matrix
              run: |
                  if [[ "${{ github.event.inputs.nx_command || 'affected' }}" == "run-many" ]] ; then
                    count=10
                  else
                    count=$(yarn -s nx show projects --affected --base ${{ steps.setup.outputs.base }} -t test | wc -l)
                  fi

                  matrix=$(node ./external/ag-shared/scripts/shard/calculate-shards.js eval --max 6 --ratio 1 --zero ${count})
                  echo "test_matrix=${matrix}" >> $GITHUB_OUTPUT
                  echo "test_count=${count}" >> $GITHUB_OUTPUT
                  echo "Test matrix determined to be: ${matrix} (test_count=${count})"

                  pkg_matrix=$(node ./external/ag-shared/scripts/shard/calculate-pkg-shards.js)
                  echo "pkg_matrix=${pkg_matrix}" >> $GITHUB_OUTPUT
                  echo "Package test matrix determined to be: ${pkg_matrix}"

                  e2e_nx_count=$(yarn -s nx show projects --affected --base ${{ steps.setup.outputs.base }} -t test:e2e | wc -l)
                  if [[ ${e2e_nx_count} -gt 0 ]] ; then
                    e2e_count=$(cd packages/ag-charts-website/ ; npx playwright test --list | grep -v '!!!SKIPPED!!!' | wc -l)
                  else
                    e2e_count=0
                  fi

                  e2e_matrix=$(node ./external/ag-shared/scripts/shard/calculate-shards.js eval --max ${{ env.AG_E2E_SHARD_COUNT }} ${e2e_count})
                  echo "e2e_matrix=${e2e_matrix}" >> $GITHUB_OUTPUT
                  echo "e2e_count=${e2e_count}" >> $GITHUB_OUTPUT
                  echo "E2E matrix determined to be: ${e2e_matrix} (e2e_test_count=${e2e_count})"

                  # Whether the demo-apps smoke should run (its own files or an upstream dep changed).
                  if [[ "${{ github.event.inputs.nx_command || 'affected' }}" == "run-many" ]] ; then
                    demos_affected=1
                  else
                    demos_affected=$(yarn -s nx show projects --affected --base ${{ steps.setup.outputs.base }} -t test:e2e | grep -Fxc 'ag-charts-demos' || true)
                  fi
                  echo "demos_affected=${demos_affected}" >> $GITHUB_OUTPUT
                  echo "Demos affected: ${demos_affected}"

                  # Check if package test files are directly modified in PR
                  pkg_tests_modified="false"
                  if git diff --name-only ${{ steps.setup.outputs.base }}...HEAD 2>/dev/null | grep -q "^tests/.*-package-tests/"; then
                    pkg_tests_modified="true"
                  fi
                  echo "pkg_tests_modified=${pkg_tests_modified}" >> $GITHUB_OUTPUT
                  echo "Package tests modified: ${pkg_tests_modified}"

            - name: Prepare Snapshot Branch
              uses: ./.github/actions/snapshot-prepare
              id: snapshot-prepare

            - name: Persist build outputs
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: e2e-init-outputs
                  path: |
                      dist/
                      packages/*/dist/
                      external/*/dist/
                      packages/ag-charts-website/e2e/generated/

    lint:
        runs-on: ubuntu-24.04
        name: Lint & Format Check
        needs: detect-changes
        outputs:
            lint: ${{ steps.lint.outcome || '' }}
            format: ${{ steps.format.outcome || '' }}
        steps:
            - name: Checkout
              id: checkout
              uses: actions/checkout@v4
              with:
                  fetch-depth: 1

            - name: Fetch Refs
              run: |
                  git fetch origin --depth 1 latest next
                  git fetch origin --depth 1 tag latest-success next-success

            - name: Setup
              id: setup
              uses: ./.github/actions/setup-nx
              with:
                  cache_mode: ro
                  base_ref: ${{ github.event.pull_request.base.ref || github.event.base_ref }}
                  free_disk_space: false

            - name: nx format:check
              id: format
              if: steps.setup.outcome == 'success' || steps.setup.outcome == 'skipped'
              run: |
                  if [[ "${{ github.event.inputs.nx_command || 'affected' }}" == "run-many" ]] ; then
                    yarn nx format:check --all
                  else
                    yarn nx format:check --base ${{ steps.setup.outputs.base }}
                  fi

            - name: nx lint
              id: lint
              if: steps.setup.outcome == 'success' || steps.setup.outcome == 'skipped'
              run: yarn nx ${{ github.event.inputs.nx_command || 'affected' }} -t lint --exclude all

    generate:
        runs-on: ubuntu-24.04
        name: Generate (${{ matrix.shard }}/${{ strategy.job-total }})
        needs: [detect-changes, init]
        if: needs.detect-changes.outputs.run_full_ci == 'true'
        strategy:
            fail-fast: false
            matrix:
                shard: [1, 2]
        outputs:
            generate: ${{ steps.generate.outcome || '' }}
        steps:
            - name: Checkout
              id: checkout
              uses: actions/checkout@v4
              with:
                  fetch-depth: 1

            - name: Fetch Refs
              run: |
                  git fetch origin --depth 1 latest next
                  git fetch origin --depth 1 tag latest-success next-success

            - name: Setup
              id: setup
              uses: ./.github/actions/setup-nx
              with:
                  cache_mode: ro
                  base_ref: ${{ github.event.pull_request.base.ref || github.event.base_ref }}

            - name: nx generate
              id: generate
              if: steps.setup.outcome == 'success' || steps.setup.outcome == 'skipped'
              run: |
                  projects=$(node ./external/ag-shared/scripts/shard/shard-projects.js -t generate -s ${{ matrix.shard }} --total ${{ strategy.job-total }} --command ${{ github.event.inputs.nx_command || 'affected' }})
                  if [ -n "$projects" ]; then
                    yarn nx run-many -t generate -c production -p ${projects}
                  fi

    build:
        runs-on: ubuntu-24.04
        name: Build
        needs: [detect-changes, init]
        if: needs.detect-changes.outputs.run_full_ci == 'true'
        outputs:
            build: ${{ steps.build.outcome || '' }}
        steps:
            - name: Checkout
              id: checkout
              uses: actions/checkout@v4
              with:
                  fetch-depth: 1

            - name: Fetch Refs
              run: |
                  git fetch origin --depth 1 latest next
                  git fetch origin --depth 1 tag latest-success next-success

            - name: Setup
              id: setup
              uses: ./.github/actions/setup-nx
              with:
                  cache_mode: ro
                  base_ref: ${{ github.event.pull_request.base.ref || github.event.base_ref }}

            - name: nx build
              id: build
              if: steps.setup.outcome == 'success' || steps.setup.outcome == 'skipped'
              run: |
                  yarn nx ${{ github.event.inputs.nx_command || 'affected' }} -t build --exclude all,ag-charts-website

            # The enterprise UMD loads ag-charts-community at runtime, so publish both even when `nx affected` rebuilt only one.
            - name: Build UMD bundles for PR preview
              id: build_umd
              if: github.event_name == 'pull_request' && steps.build.outcome == 'success'
              run: |
                  yarn nx run-many -t build:umd -p ag-charts-community ag-charts-enterprise

            - name: Upload UMD bundles for PR preview
              if: github.event_name == 'pull_request' && steps.build_umd.outcome == 'success'
              uses: actions/upload-artifact@v4
              with:
                  name: pr-preview-umd
                  if-no-files-found: ignore
                  retention-days: 14
                  path: |
                      packages/ag-charts-community/dist/umd/ag-charts-community.min.js
                      packages/ag-charts-community/dist/umd/ag-charts-community.min.js.map
                      packages/ag-charts-enterprise/dist/umd/ag-charts-enterprise.min.js
                      packages/ag-charts-enterprise/dist/umd/ag-charts-enterprise.min.js.map

    validate:
        runs-on: ubuntu-24.04
        name: Validate Examples
        needs: [detect-changes, init]
        if: needs.detect-changes.outputs.run_full_ci == 'true'
        outputs:
            validate: ${{ steps.validate.outcome || '' }}
        steps:
            - name: Checkout
              id: checkout
              uses: actions/checkout@v4
              with:
                  fetch-depth: 1

            - name: Fetch Refs
              run: |
                  git fetch origin --depth 1 latest next
                  git fetch origin --depth 1 tag latest-success next-success

            - name: Setup
              id: setup
              uses: ./.github/actions/setup-nx
              with:
                  cache_mode: ro
                  base_ref: ${{ github.event.pull_request.base.ref || github.event.base_ref }}
                  free_disk_space: false

            - name: nx run-many -t validate-examples
              id: validate
              if: steps.setup.outcome == 'success' || steps.setup.outcome == 'skipped'
              run: yarn nx ${{ github.event.inputs.nx_command || 'affected' }} -t validate-examples --exclude all

    pr_preview:
        runs-on: ubuntu-24.04
        name: PR Preview (UMD)
        needs: [build]
        # Same-repo PRs only — fork PRs get a read-only token from GitHub, so
        # the deploy-to-gh-pages and sticky-comment steps would fail. Mirrors
        # the fork-PR gate used in pr-review.yml.
        if: |
            github.event_name == 'pull_request' &&
            github.event.pull_request.head.repo.full_name == github.repository &&
            needs.build.outputs.build == 'success'
        permissions:
            contents: write
            pull-requests: write
        concurrency:
            group: pr-preview-gh-pages
            cancel-in-progress: false
        env:
            PR_NUMBER: ${{ github.event.pull_request.number }}
        steps:
            # Needed for the local shared action below; same-repo gate (job if) is the guard.
            - name: Checkout
              uses: actions/checkout@v4
              with:
                  fetch-depth: 1

            - name: Download UMD artifact
              id: download
              uses: actions/download-artifact@v4
              continue-on-error: true
              with:
                  name: pr-preview-umd
                  path: _umd

            - name: Resolve UMD bundle paths
              id: stage
              if: steps.download.outcome == 'success'
              run: |
                  set -euo pipefail
                  # upload-artifact@v4 strips the common path prefix, so find by filename.
                  COMMUNITY=$(find _umd -type f -name 'ag-charts-community.min.js' -print -quit)
                  ENTERPRISE=$(find _umd -type f -name 'ag-charts-enterprise.min.js' -print -quit)
                  if [ -z "$COMMUNITY" ] && [ -z "$ENTERPRISE" ]; then
                      echo "::warning No UMD bundles in artifact — likely tooling-only PR; skipping publish."
                      echo "publish=false" >> "$GITHUB_OUTPUT"
                      exit 0
                  fi
                  if [ -z "$COMMUNITY" ] || [ -z "$ENTERPRISE" ]; then
                      echo "::error exactly one UMD bundle present; expected both or neither." >&2
                      ls -laR _umd || true
                      exit 1
                  fi
                  {
                      echo "files<<__FILES_EOF__"
                      echo "$COMMUNITY"
                      echo "$ENTERPRISE"
                      echo "__FILES_EOF__"
                  } >> "$GITHUB_OUTPUT"
                  echo "publish=true" >> "$GITHUB_OUTPUT"

            - name: Publish PR preview to gh-pages
              if: steps.stage.outputs.publish == 'true'
              uses: ./external/ag-shared/github/actions/pr-preview-publish
              with:
                  pr_number: ${{ env.PR_NUMBER }}
                  files: ${{ steps.stage.outputs.files }}
                  github_token: ${{ secrets.GITHUB_TOKEN }}

            - name: Write live-test section
              if: steps.stage.outputs.publish == 'true'
              shell: bash
              run: |
                  mkdir -p "${RUNNER_TEMP}/pr-sections"
                  cat > "${RUNNER_TEMP}/pr-sections/10-preview.md" <<EOF
                  ## Live-test this PR in Plunker

                  Paste these two \`<script>\` tags into a Plunker (or any vanilla-JS host) to load the UMD bundles built from this PR:

                  \`\`\`html
                  <script src="https://ag-grid.github.io/ag-charts/pr-${PR_NUMBER}/ag-charts-community.min.js"></script>
                  <script src="https://ag-grid.github.io/ag-charts/pr-${PR_NUMBER}/ag-charts-enterprise.min.js"></script>
                  \`\`\`

                  Bundles are removed automatically when the PR is closed. Updated on every push.
                  EOF

            - name: Upsert live-test section
              if: steps.stage.outputs.publish == 'true'
              uses: ./.github/actions/pr-report-comment
              with:
                  pr_number: ${{ env.PR_NUMBER }}
                  github_token: ${{ secrets.GITHUB_TOKEN }}

    l10n_review:
        runs-on: ubuntu-24.04
        name: L10n Review
        # Advisory only — a review failure must never gate the build (mirrors the old standalone
        # workflow, which ran off the critical path).
        continue-on-error: true
        needs: [detect-changes]
        # Advisory semantic review of translation changes, folded into the consolidated PR
        # comment. Same-repo PRs that touched locale source only — never run repo code with the
        # API key in scope for a fork PR (mirrors the ci.yml/pr-review.yml fork gate). Deterministic
        # structural checks live in the package tests; this never gates the build.
        if: |
            github.event_name == 'pull_request' &&
            needs.detect-changes.outputs.locale == 'true' &&
            github.event.pull_request.head.repo.full_name == github.repository
        permissions:
            contents: read
            pull-requests: write
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - uses: actions/setup-node@v4
              with:
                  node-version: 22

            - name: Review translations
              env:
                  LOCALE_SRC_DIR: packages/ag-charts-locale/src
                  ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
                  BASE_SHA: ${{ github.event.pull_request.base.sha }}
                  HEAD_SHA: ${{ github.event.pull_request.head.sha }}
                  REPORT_PATH: l10n-review.md
              run: |
                  # Defense-in-depth: execute the review script as it exists at the base ref,
                  # never the PR head, so PR-controlled code can't run with the API key in scope.
                  script=external/ag-shared/scripts/l10n/review-translations.mjs
                  if git cat-file -e "$BASE_SHA:$script" 2>/dev/null; then
                      git show "$BASE_SHA:$script" > "$RUNNER_TEMP/review-translations.mjs"
                  else
                      echo "Script absent at base ref; using checked-out copy (the PR introducing it)."
                      cp "$script" "$RUNNER_TEMP/review-translations.mjs"
                  fi
                  node "$RUNNER_TEMP/review-translations.mjs"

            - name: Build L10n section
              run: |
                  mkdir -p "${RUNNER_TEMP}/pr-sections"
                  out="${RUNNER_TEMP}/pr-sections/30-l10n.md"
                  if [ -f l10n-review.md ]; then
                      # Drop the standalone marker the generator prepends (review-translations.mjs);
                      # the consolidated comment owns the parent marker. Prepend our section heading.
                      { echo '## Translation review'; echo; sed '/<!-- l10n-translation-review -->/d' l10n-review.md; } > "$out"
                  else
                      printf '## Translation review\n\nNo translation issues found.\n' > "$out"
                  fi

            - name: Upsert L10n section
              uses: ./.github/actions/pr-report-comment
              with:
                  pr_number: ${{ github.event.pull_request.number }}
                  github_token: ${{ secrets.GITHUB_TOKEN }}

    website_build:
        runs-on: ubuntu-24.04
        name: Website Build
        needs: [detect-changes, init]
        if: needs.detect-changes.outputs.run_full_ci == 'true'
        outputs:
            build: ${{ steps.build.outcome || '' }}
        steps:
            - name: Checkout
              id: checkout
              uses: actions/checkout@v4
              with:
                  fetch-depth: 1

            - name: Fetch Refs
              run: |
                  git fetch origin --depth 1 latest next
                  git fetch origin --depth 1 tag latest-success next-success

            - name: Setup
              id: setup
              uses: ./.github/actions/setup-nx
              with:
                  cache_mode: ro
                  base_ref: ${{ github.event.pull_request.base.ref || github.event.base_ref }}

            - name: nx build ag-charts-website
              id: build
              if: steps.setup.outcome == 'success' || steps.setup.outcome == 'skipped'
              run: |
                  if [[ "${{ github.ref }}" == "refs/heads/latest" ]]; then
                      yarn nx run ag-charts-website:build -c staging
                  else
                      yarn nx ${{ github.event.inputs.nx_command || 'affected' }} -t build --exclude='*,!ag-charts-website'
                  fi

            - name: Persist website build for staging deploy
              if: github.ref == 'refs/heads/latest' && steps.build.outcome == 'success'
              uses: actions/upload-artifact@v4
              with:
                  name: website-staging-dist
                  path: dist/packages/ag-charts-website/
                  # upload-artifact@v4 excludes hidden files by default, which would drop the
                  # generated .htaccess (CSP + redirects) before the deploy job zips it.
                  include-hidden-files: true
                  retention-days: 1

    test:
        runs-on: ubuntu-24.04
        name: Unit & Integration Tests (${{ matrix.shard }}/${{ strategy.job-total }})
        permissions:
            contents: write
        needs: [detect-changes, init]
        if: needs.detect-changes.outputs.run_full_ci == 'true' && needs.init.outputs.test_count > 0
        strategy:
            fail-fast: false
            matrix: ${{ fromJson(needs.init.outputs.test_matrix )}}
        env:
            NX_PARALLEL: 1
            NX_BASE: ${{ needs.init.outputs.nx_base }}
            # Scene-graph JSON capture: full dump on pushes to baseline branches (latest, next,
            # release bX.Y.Z — the only branches the `on.push` filter admits), dump-on-image-diff for
            # PRs and manual dispatch, for machine-readable snapshot-diff verification.
            AG_SCENE_SNAPSHOTS: ${{ github.event_name == 'push' && 'all' || 'diff' }}
        steps:
            - name: Checkout
              id: checkout
              uses: actions/checkout@v4
              with:
                  fetch-depth: 1

            - name: Fetch Refs
              run: |
                  git fetch origin --depth 1 latest next
                  git fetch origin --depth 1 tag latest-success next-success

            - name: Setup
              id: setup
              uses: ./.github/actions/setup-nx
              with:
                  cache_mode: ro
                  base_ref: ${{ github.event.pull_request.base.ref || github.event.base_ref }}

            - name: nx test
              if: matrix.shard != 0
              id: test
              run: yarn nx ${{ github.event.inputs.nx_command || 'affected' }} -t test --configuration=ci --exclude tag:no-sharding --exclude all --shard=${{ matrix.shard }}/$((${{ strategy.job-total }} - 1))
            - name: nx test (non-sharded)
              if: matrix.shard == 0
              id: test-no-shard
              run: yarn nx ${{ github.event.inputs.nx_command || 'affected' }} -t test --configuration=ci --exclude '*,!tag:no-sharding'
            - name: nx test:validate-size
              if: matrix.shard == 0
              id: test-no-shard-validate-size
              run: yarn nx ${{ github.event.inputs.nx_command || 'affected' }} -t test:validate-size --configuration=ci
            - name: nx pack:verify
              if: matrix.shard == 0
              id: pack-verify
              run: yarn nx ${{ github.event.inputs.nx_command || 'affected' }} -t pack:verify

            - name: Snapshot Branch
              uses: ./.github/actions/snapshot-branch
              with:
                  path: packages/ag-charts-{community,enterprise,server-side}/src/
                  source_branch: ${{ github.head_ref || github.ref_name }}
                  branch: ${{ needs.init.outputs.snapshot_branch }}
                  type: test (shard ${{matrix.shard}})

            - name: Persist test results
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: test-results-${{matrix.shard}}
                  path: |
                      reports/
                      packages/**/__diff_output__/*
                      packages/**/__scene_snapshots__/*

    playwright_image:
        runs-on: ubuntu-latest
        name: Playwright Image
        needs: [detect-changes]
        if: needs.detect-changes.outputs.run_full_ci == 'true'
        env:
            PLAYWRIGHT_IMAGE: mcr.microsoft.com/playwright:v1.60.0-jammy
            PLAYWRIGHT_CACHE_KEY: playwright-image-v1.60.0-jammy-v1
        steps:
            - name: Restore Playwright Image Cache
              id: pw_cache
              uses: actions/cache@v4
              with:
                  path: /tmp/playwright-docker-image.tar
                  key: ${{ env.PLAYWRIGHT_CACHE_KEY }}

            - name: Pull Playwright Image
              if: steps.pw_cache.outputs.cache-hit != 'true'
              run: |
                  pull_attempts=4
                  for attempt in $(seq 1 ${pull_attempts}) ; do
                    if docker pull ${PLAYWRIGHT_IMAGE} ; then
                      break
                    fi
                    if [[ ${attempt} -eq ${pull_attempts} ]] ; then
                      echo "Failed to pull ${PLAYWRIGHT_IMAGE} after ${pull_attempts} attempts."
                      exit 1
                    fi
                    backoff=$((attempt * 15))
                    jitter=$((RANDOM % 10))
                    echo "Pull attempt ${attempt} failed, retrying in $((backoff + jitter))s..."
                    sleep $((backoff + jitter))
                  done
                  docker save ${PLAYWRIGHT_IMAGE} -o /tmp/playwright-docker-image.tar

    e2e:
        runs-on: ubuntu-latest
        name: E2E Tests (${{ matrix.shard }}/${{ strategy.job-total }})
        permissions:
            contents: write
        needs: [detect-changes, init, playwright_image]
        if: needs.detect-changes.outputs.run_full_ci == 'true' && needs.init.outputs.e2e_count > 0
        strategy:
            fail-fast: false
            matrix: ${{ fromJson(needs.init.outputs.e2e_matrix )}}
        env:
            NX_BASE: ${{ needs.init.outputs.nx_base }}
            AG_FORCE_ALL_TESTS: 1
            # Scene-graph JSON capture alongside E2E screenshots: full dump on baseline-branch pushes,
            # dump-on-diff for PRs (for E2E, both capture — see expectChartScreenshot).
            AG_SCENE_SNAPSHOTS: ${{ github.event_name == 'push' && 'all' || 'diff' }}
        steps:
            - name: Checkout
              id: checkout
              uses: actions/checkout@v4

            - name: Restore Init Build Outputs
              uses: actions/download-artifact@v4
              with:
                  name: e2e-init-outputs

            - name: Setup
              id: setup
              uses: ./.github/actions/setup-nx
              with:
                  yarn_postinstall: no-install
                  nx_restore: false # Restored in previous step.
                  cache_mode: ro
                  base_ref: ${{ github.event.pull_request.base.ref || github.event.base_ref }}

            - name: Restore Playwright Image Cache
              uses: actions/cache/restore@v4
              with:
                  path: /tmp/playwright-docker-image.tar
                  key: playwright-image-v1.60.0-jammy-v1
                  fail-on-cache-miss: true

            - name: Load Playwright Image
              run: docker load -i /tmp/playwright-docker-image.tar

            - name: nx test:e2e
              id: test
              run: |
                  cd packages/ag-charts-website/

                  ./playwright.sh --host test -u changed --shard=${{ matrix.shard }}/${{ strategy.job-total }}
              timeout-minutes: 15

            - name: Snapshot Branch
              uses: ./.github/actions/snapshot-branch
              with:
                  path: packages/ag-charts-website/e2e/
                  source_branch: ${{ github.head_ref || github.ref_name }}
                  branch: ${{ needs.init.outputs.snapshot_branch }}
                  type: test:e2e (shard ${{matrix.shard}})

            - name: Persist test results
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: test-results-e2e-shard-${{matrix.shard}}
                  path: |
                      reports/
                      packages/ag-charts-website/**/__scene_snapshots__/*

    demos_e2e:
        runs-on: ubuntu-24.04
        name: Demo Apps Smoke
        needs: [detect-changes, init, playwright_image]
        if: needs.detect-changes.outputs.run_full_ci == 'true' && needs.init.outputs.demos_affected != '0'
        env:
            PLAYWRIGHT_IMAGE: mcr.microsoft.com/playwright:v1.60.0-jammy
        steps:
            - name: Checkout
              id: checkout
              uses: actions/checkout@v4
              with:
                  fetch-depth: 1

            - name: Restore Init Build Outputs
              uses: actions/download-artifact@v4
              with:
                  name: e2e-init-outputs

            - name: Setup
              id: setup
              uses: ./.github/actions/setup-nx
              with:
                  yarn_postinstall: no-install
                  nx_restore: false # Restored in previous step.
                  cache_mode: ro
                  base_ref: ${{ github.event.pull_request.base.ref || github.event.base_ref }}

            - name: Restore Playwright Image Cache
              uses: actions/cache/restore@v4
              with:
                  path: /tmp/playwright-docker-image.tar
                  key: playwright-image-v1.60.0-jammy-v1
                  fail-on-cache-miss: true

            - name: Load Playwright Image
              run: docker load -i /tmp/playwright-docker-image.tar

            - name: playwright test ag-charts-demos
              id: demos_e2e
              run: |
                  docker run --rm --ipc=host --init \
                    -v "$(pwd)":/data \
                    -w /data/packages/ag-charts-demos \
                    -e CI \
                    ${PLAYWRIGHT_IMAGE} \
                    npx playwright test
              timeout-minutes: 15

            - name: Persist test results
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: test-results-demos-e2e
                  path: |
                      reports/
                      packages/ag-charts-demos/test-results/

    fw_pkg_test:
        runs-on: ubuntu-24.04
        name: Framework Package Tests (${{ matrix.framework }})
        permissions:
            contents: write
        needs: [detect-changes, init]
        strategy:
            fail-fast: false
            matrix: ${{ fromJson(needs.init.outputs.test_pkg_matrix )}}
        if: needs.detect-changes.outputs.run_full_ci == 'true' && (needs.init.outputs.build_type == 'latest' || needs.init.outputs.build_type == 'release' || needs.init.outputs.pkg_tests_modified == 'true')
        env:
            NX_BASE: ${{ needs.init.outputs.nx_base }}
        steps:
            - name: Checkout
              id: checkout
              if: matrix.framework != 'none'
              uses: actions/checkout@v4
              with:
                  fetch-depth: 1

            - name: Fetch Refs
              if: matrix.framework != 'none'
              run: |
                  git fetch origin --depth 1 latest next
                  git fetch origin --depth 1 tag latest-success next-success

            - name: Setup
              id: setup
              if: matrix.framework != 'none'
              uses: ./.github/actions/setup-nx
              with:
                  cache_mode: ro
                  base_ref: ${{ github.event.pull_request.base.ref || github.event.base_ref }}

            - name: nx package:test
              id: package-test
              if: matrix.framework != 'none'
              run: yarn nx run-many -t test:package -p ${{ matrix.framework }}-package-tests --configuration=update

            - name: Snapshot Branch
              if: matrix.framework != 'none'
              uses: ./.github/actions/snapshot-branch
              with:
                  path: tests/*-package-tests/e2e/*-snapshots/
                  source_branch: ${{ github.head_ref || github.ref_name }}
                  branch: ${{ needs.init.outputs.snapshot_branch }}
                  type: ${{ matrix.framework }}-package-tests:test:package

    bundle_tests:
        runs-on: ubuntu-24.04
        name: Bundle Tests (${{ matrix.name }})
        permissions:
            contents: write
        needs: [detect-changes, init]
        if: needs.detect-changes.outputs.run_full_ci == 'true'
        strategy:
            fail-fast: false
            matrix:
                include:
                    - name: treeshake-fast
                      target: bundle-treeshake-tests:test:bundle-treeshake
                      render_bundlers: ''
                      treeshake_bundlers: 'esbuild,vite'
                    - name: treeshake-webpack-1of2
                      target: bundle-treeshake-tests:test:bundle-treeshake
                      render_bundlers: ''
                      treeshake_bundlers: 'webpack'
                      treeshake_shard: '1/2'
                    - name: treeshake-webpack-2of2
                      target: bundle-treeshake-tests:test:bundle-treeshake
                      render_bundlers: ''
                      treeshake_bundlers: 'webpack'
                      treeshake_shard: '2/2'
                    - name: render-fast
                      target: bundle-render-tests:test:bundle-render
                      render_bundlers: 'esbuild,vite'
                      treeshake_bundlers: ''
                    - name: render-webpack-1of2
                      target: bundle-render-tests:test:bundle-render
                      render_bundlers: 'webpack'
                      render_shard: '1/2'
                      treeshake_bundlers: ''
                    - name: render-webpack-2of2
                      target: bundle-render-tests:test:bundle-render
                      render_bundlers: 'webpack'
                      render_shard: '2/2'
                      treeshake_bundlers: ''
        env:
            NX_BASE: ${{ needs.init.outputs.nx_base }}
            BUNDLE_RENDER_BUNDLERS: ${{ matrix.render_bundlers }}
            BUNDLE_RENDER_SHARD: ${{ matrix.render_shard }}
            BUNDLE_TREESHAKE_BUNDLERS: ${{ matrix.treeshake_bundlers }}
            BUNDLE_TREESHAKE_SHARD: ${{ matrix.treeshake_shard }}
        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                  fetch-depth: 1

            - name: Fetch Refs
              run: |
                  git fetch origin --depth 1 latest next
                  git fetch origin --depth 1 tag latest-success next-success

            - name: Setup
              id: setup
              uses: ./.github/actions/setup-nx
              with:
                  cache_mode: ro
                  base_ref: ${{ github.event.pull_request.base.ref || github.event.base_ref }}

            - name: nx test:bundle-${{ matrix.name }}
              run: yarn nx run ${{ matrix.target }}

    report:
        runs-on: ubuntu-24.04
        permissions:
            contents: write
            pull-requests: write
            statuses: write
        needs:
            [
                detect-changes,
                init,
                lint,
                generate,
                build,
                validate,
                website_build,
                test,
                e2e,
                demos_e2e,
                sonarqube,
                fw_pkg_test,
                bundle_tests,
                playwright_image,
            ]
        if: cancelled() != true
        # SLACK_BOT_OAUTH_TOKEN is hoisted to job level on purpose: a step's OWN
        # env: block is not in scope for that same step's if: (the if is evaluated
        # before step env is applied). The Slack alert step below gates on
        # env.SLACK_BOT_OAUTH_TOKEN != '', so it must live here (and no-ops
        # cleanly when the secret is empty).
        env:
            SLACK_BOT_OAUTH_TOKEN: ${{ secrets.SLACK_BOT_OAUTH_TOKEN }}
        steps:
            - name: Checkout
              id: checkout
              uses: actions/checkout@v4
              with:
                  fetch-depth: 1

            - name: Fetch Refs
              run: |
                  git fetch origin --depth 1 latest next
                  git fetch origin --depth 1 tag latest-success

            - uses: actions/download-artifact@v4
              with:
                  path: test-results/

            - name: Snapshot Notify
              id: snapshot-notify
              uses: ./.github/actions/snapshot-notify
              with:
                  branch: ${{ needs.init.outputs.snapshot_branch }}
                  github_token: ${{ secrets.GITHUB_TOKEN }}
                  slack_webhook: ${{ secrets.SLACK_WEBHOOK }}

            # Upsert or clear the snapshot-status section. When Snapshot Notify wrote a fragment
            # (snapshots regenerated) it is upserted; otherwise the section is removed so a stale
            # "snapshots regenerated" note from an earlier push can't linger after a fix.
            - name: Upsert snapshot-status section
              if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
              uses: ./.github/actions/pr-report-comment
              with:
                  pr_number: ${{ github.event.pull_request.number }}
                  github_token: ${{ secrets.GITHUB_TOKEN }}
                  # Clear snapshot-status when snapshots weren't regenerated, and clear snapshot-review
                  # when full CI (hence the snapshot_review job) didn't run — the report job is the
                  # always-running GC point for sections whose producing job was skipped this build.
                  remove_sections: >-
                      ${{ steps.snapshot-notify.outputs.updated != 'true' && 'snapshot-status' || '' }}
                      ${{ needs.detect-changes.outputs.run_full_ci != 'true' && 'snapshot-review' || '' }}

            - name: Merge JUnit Report XMLs
              if: needs.test.result != 'skipped' || needs.e2e.result != 'skipped' || needs.demos_e2e.result != 'skipped'
              continue-on-error: true
              run: |
                  yarn global add junit-report-merger
                  reports=$(find test-results/ -name \*.xml -type f -exec basename \{\} \; | sort | uniq)
                  mkdir -p reports/
                  echo "$reports" | (while read name ; do
                    yarn exec -s jrm reports/${name} "test-results/**/${name}"
                  done)

            - name: Test Report
              uses: dorny/test-reporter@v1
              if: needs.test.result == 'success' || needs.test.result == 'failure' || needs.demos_e2e.result == 'success' || needs.demos_e2e.result == 'failure'
              id: testReport
              continue-on-error: true
              with:
                  name: 'Tests Results'
                  path: reports/*.xml
                  reporter: jest-junit

            - name: Check last job status
              id: lastJobStatus
              if: always()
              run: |
                  WORKFLOW_STATUS="success"
                  if [[ "${{steps.snapshot-notify.outputs.updated}}" == 'true' ]] ; then
                    WORKFLOW_STATUS="failure"
                  elif [[ "${{ needs.lint.result }}" == "failure" ]] ; then
                    WORKFLOW_STATUS="failure"
                  elif [[ "${{ needs.generate.result }}" == "failure" ]] ; then
                    WORKFLOW_STATUS="failure"
                  elif [[ "${{ needs.build.result }}" == "failure" ]] ; then
                    WORKFLOW_STATUS="failure"
                  elif [[ "${{ needs.validate.result }}" == "failure" ]] ; then
                    WORKFLOW_STATUS="failure"
                  elif [[ "${{ needs.website_build.result }}" == "failure" ]] ; then
                    WORKFLOW_STATUS="failure"
                  elif [ "${{ needs.init.result }}" == "failure" ] ; then
                    WORKFLOW_STATUS="failure"
                  elif [ "${{ needs.test.result }}" == "failure" ] ; then
                    WORKFLOW_STATUS="failure"
                  elif [ "${{ needs.e2e.result }}" == "failure" ] ; then
                    WORKFLOW_STATUS="failure"
                  elif [ "${{ needs.demos_e2e.result }}" == "failure" ] ; then
                    WORKFLOW_STATUS="failure"
                  elif [ "${{ needs.fw_pkg_test.result }}" == "failure" ] ; then
                    WORKFLOW_STATUS="failure"
                  elif [ "${{ needs.playwright_image.result }}" == "failure" ] ; then
                    WORKFLOW_STATUS="failure"
                  elif [ "${{ needs.sonarqube.result }}" == "failure" ] ; then
                    WORKFLOW_STATUS="partial"
                  fi
                  echo "workflowStatus=${WORKFLOW_STATUS}" >> $GITHUB_OUTPUT

                  LAST_WORKFLOW_STATUS=$(gh run list --workflow .github/workflows/ci.yml -b ${{ github.ref_name }} | grep -oh "completed.*" | grep -v "cancelled" | head -1 | awk '{print $2}')
                  if [ "$GITHUB_RUN_ATTEMPT" -ge 2 ]; then
                    # Handle re-run cases - there is no way to query the previous run status, so we assume the most
                    # common scenario will be re-run after failure.
                    LAST_WORKFLOW_STATUS="failure"
                  fi
                  if [ "$LAST_WORKFLOW_STATUS" != "$WORKFLOW_STATUS" ]; then
                    echo "status changed from $LAST_WORKFLOW_STATUS to $WORKFLOW_STATUS"
                    echo "changedState=true" >> $GITHUB_OUTPUT
                  else
                    echo "status is still $WORKFLOW_STATUS"
                    echo "changedState=false" >> $GITHUB_OUTPUT
                  fi
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - name: Commit History
              id: commits
              if: always() && job.status != 'cancelled' && needs.init.result == 'success' && needs.init.outputs.build_type != 'pr' && steps.lastJobStatus.outputs.changedState == 'true'
              run: |
                  GIT_LOG=$(git log HEAD ^${{ needs.init.outputs.nx_base }} --format="%an (%h) %s")
                  echo "GIT_LOG<<EOF" >> $GITHUB_ENV
                  echo "$GIT_LOG" >> $GITHUB_ENV
                  echo "EOF" >> $GITHUB_ENV

            - name: Restore Website Build for Staging Deploy
              if: github.ref == 'refs/heads/latest' && needs.website_build.outputs.build == 'success' && steps.lastJobStatus.outputs.workflowStatus != 'failure'
              uses: actions/download-artifact@v4
              with:
                  name: website-staging-dist
                  path: dist/packages/ag-charts-website/

            - name: Deploy to Staging
              id: deploy_to_staging
              if: github.ref == 'refs/heads/latest' && needs.website_build.outputs.build == 'success' && steps.lastJobStatus.outputs.workflowStatus != 'failure'
              env:
                  SSH_PRIVATE_KEY: |
                      ${{ secrets.STAGING_SSH_KEY }}
                  SSH_HOST: ${{ secrets.STAGING_HOST }}
                  SSH_USER: ubuntu
                  SSH_KEY_LOCATION: ${{ github.workspace }}/staging.pem
                  WWW_ROOT_DIR: ${{ vars.WWW_ROOT_DIR }}
              run: |
                  echo "$SSH_PRIVATE_KEY" > $SSH_KEY_LOCATION
                  chmod 400 $SSH_KEY_LOCATION
                  ./tools/staging/createAndDeployDocsToTCGH.sh

            - name: Publish staging deploy status check
              # Surface the staging deploy as a distinct commit status so it's visible
              # from the commits view (hover over the status icon) without expanding the
              # CI report job. Only posted on `latest`, where the deploy is attempted.
              if: always() && job.status != 'cancelled' && github.ref == 'refs/heads/latest'
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  case "${{ steps.deploy_to_staging.outcome }}" in
                    success) state="success"; description="Deployed to staging" ;;
                    failure) state="failure"; description="Staging deploy failed" ;;
                    *)       state="error";   description="Not deployed to staging (CI did not pass)" ;;
                  esac
                  gh api --method POST \
                    -H "Accept: application/vnd.github+json" \
                    "/repos/${{ github.repository }}/statuses/${{ github.sha }}" \
                    -f state="${state}" \
                    -f context="Deploy to Staging" \
                    -f description="${description}" \
                    -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

            - name: Tag Latest Successful Commit
              if: success() && needs.init.result == 'success' && needs.init.outputs.build_type != 'pr' && steps.lastJobStatus.outputs.workflowStatus != 'failure'
              uses: EndBug/latest-tag@latest
              with:
                  ref: ${{ github.ref_name }}-success
                  description: Latest commit to pass GitHub Actions workflow on ${{ github.ref_name }} branch.

            - name: Find matching workflow
              if: always() && job.status != 'cancelled' && github.ref == 'refs/heads/latest' && steps.deploy_to_staging.outcome == 'success'
              id: find_latest_sha
              uses: SamhammerAG/last-successful-build-action@v4
              with:
                  branch: 'latest'
                  workflow: 'ci'
                  verify: false

            - name: Notify staging deploy
              if: always() && job.status != 'cancelled' && github.ref == 'refs/heads/latest' && steps.deploy_to_staging.outcome == 'success'
              shell: bash
              env:
                  SLACK_BOT_OAUTH_TOKEN: ${{ secrets.SLACK_BOT_OAUTH_TOKEN }}
                  NOTION_API_TOKEN: ${{ secrets.SLACK_USER_CONFIG_NOTION_API_TOKEN }}
                  NOTION_DATA_SOURCE_ID: ${{ secrets.SLACK_USER_CONFIG_NOTION_DATA_SOURCE_ID }}
                  AG_PROJECT: AgCharts
                  RUN_ID: ${{ github.run_id }}
                  CURRENT_SHA: ${{ github.sha }}
                  LAST_SUCCESSFUL_SHA: ${{ steps.find_latest_sha.outputs.sha }}
                  WEBSITE_STATUS_CHANNEL: ${{ secrets.WEBSITE_STATUS_CHANNEL }}
                  LIBRARY_WEBSITE_STATUS_CHANNEL: ${{ env.LIBRARY_WEBSITE_STATUS_CHANNEL }}
                  DEPLOY_TO_STAGING: 'true'
              run: node ./external/ag-shared/scripts/slack/notify-staging-deploy.mjs

            # --- CI status alert (bot token — the single notification point) ----
            # THE Slack alert for every non-PR CI state change — success and
            # failure alike (this replaced the old rtCamp webhook post). Why bot
            # token rather than webhook: a webhook returns no ts, so it can't be
            # threaded; chat.postMessage yields {channel, ts}. On a `latest`
            # failure that anchor is handed to the ci-failure-handler workflow (as
            # the `ci-failure-slack` artifact) so the AI's live status + fix
            # summary reply IN-THREAD under this single alert — not as a second
            # message elsewhere.
            # Best-effort: a Slack hiccup never fails CI — the handler then posts
            # its own root message in the same channel instead. And because the
            # alert only fires on a state CHANGE, a HEAD that was already red posts
            # no anchor; the handler's fallback covers that case too.
            - name: Slack Notification (bot token, thread anchor)
              id: ci_failure_alert
              if: always() && job.status != 'cancelled' && needs.init.result == 'success' && needs.init.outputs.build_type != 'pr' && steps.lastJobStatus.outputs.changedState == 'true' && env.SLACK_BOT_OAUTH_TOKEN != '' && vars.CI_FAILURE_SLACK_CHANNEL != ''
              continue-on-error: true
              env:
                  # SLACK_BOT_OAUTH_TOKEN inherited from the job-level env above.
                  # CI_FAILURE_SLACK_CHANNEL: set to the SAME channel the webhook
                  # posted to (a channel ID is most robust) so alerts stay where the
                  # team already sees them; the bot must be a member of it.
                  # chat.postMessage returns the canonical ID the handler threads on.
                  SLACK_CHANNEL: ${{ vars.CI_FAILURE_SLACK_CHANNEL }}
                  REF_NAME: ${{ github.ref_name }}
                  WORKFLOW_STATUS: ${{ steps.lastJobStatus.outputs.workflowStatus }}
                  IS_LATEST: ${{ github.ref == 'refs/heads/latest' }}
                  RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
                  INIT_RESULT: ${{ needs.init.result }}
                  LINT_RESULT: ${{ needs.lint.outputs.lint }}
                  FORMAT_RESULT: ${{ needs.lint.outputs.format }}
                  GENERATE_RESULT: ${{ needs.generate.outputs.generate }}
                  BUILD_RESULT: ${{ needs.build.outputs.build }}
                  VALIDATE_RESULT: ${{ needs.validate.outputs.validate }}
                  WEBSITE_RESULT: ${{ needs.website_build.outputs.build }}
                  TEST_RESULT: ${{ needs.test.result }}
                  E2E_RESULT: ${{ needs.e2e.result }}
                  DEMOS_E2E_RESULT: ${{ needs.demos_e2e.result }}
                  FW_PKG_RESULT: ${{ needs.fw_pkg_test.result }}
                  PLAYWRIGHT_RESULT: ${{ needs.playwright_image.result }}
                  SONAR_RESULT: ${{ needs.sonarqube.result }}
              run: |
                  set -euo pipefail
                  # `[[ … ]] && LINES+=(…)`: the [[ ]] is the left operand of &&, so
                  # a false test is exempt from set -e (it never exits the step).
                  if [[ "$WORKFLOW_STATUS" != "failure" && "$WORKFLOW_STATUS" != "partial" ]]; then
                      LINES=(":white_check_mark: *ag-charts CI completed successfully on \`${REF_NAME}\`*")
                  else
                      LINES=(":x: *ag-charts CI failed on \`${REF_NAME}\`*")
                  fi
                  [[ "$INIT_RESULT" == "failure" ]] && LINES+=("• Init")
                  [[ "$LINT_RESULT" == "failure" ]] && LINES+=("• Lint")
                  [[ "$FORMAT_RESULT" == "failure" ]] && LINES+=("• Format")
                  [[ "$GENERATE_RESULT" == "failure" ]] && LINES+=("• Generate")
                  [[ "$BUILD_RESULT" == "failure" ]] && LINES+=("• Build")
                  [[ "$VALIDATE_RESULT" == "failure" ]] && LINES+=("• Validate")
                  [[ "$WEBSITE_RESULT" == "failure" ]] && LINES+=("• Website")
                  [[ "$TEST_RESULT" == "failure" ]] && LINES+=("• Test")
                  [[ "$E2E_RESULT" == "failure" ]] && LINES+=("• E2E")
                  [[ "$DEMOS_E2E_RESULT" == "failure" ]] && LINES+=("• Demos E2E")
                  [[ "$FW_PKG_RESULT" == "failure" ]] && LINES+=("• FW Pkg")
                  [[ "$PLAYWRIGHT_RESULT" == "failure" ]] && LINES+=("• Playwright Image")
                  [[ "$SONAR_RESULT" == "failure" ]] && LINES+=("• Sonar")
                  LINES+=("<${RUN_URL}|CI run>")
                  if [[ -n "${GIT_LOG:-}" ]]; then LINES+=("" "*Changes:*" "${GIT_LOG}"); fi
                  TEXT=$(printf '%s\n' "${LINES[@]}")
                  PAYLOAD=$(jq -nc --arg ch "$SLACK_CHANNEL" --arg text "$TEXT" '{channel:$ch, text:$text}')
                  RESP=$(curl -sS -X POST https://slack.com/api/chat.postMessage \
                      -H "Authorization: Bearer ${SLACK_BOT_OAUTH_TOKEN}" \
                      -H 'Content-type: application/json; charset=utf-8' \
                      --data "$PAYLOAD" || echo '{}')
                  if ! echo "$RESP" | jq -e '.ok' >/dev/null 2>&1; then
                      echo "::warning::chat.postMessage failed: $(echo "$RESP" | jq -r '.error // "no response"') — handler will post its own root message."
                      exit 0
                  fi
                  # The thread anchor only matters for the case the ci-failure
                  # handler picks up: a genuine failure on `latest`.
                  if [[ "$IS_LATEST" != "true" || "$WORKFLOW_STATUS" != "failure" ]]; then
                      exit 0
                  fi
                  CH=$(echo "$RESP" | jq -r '.channel // ""')
                  TS=$(echo "$RESP" | jq -r '.ts // ""')
                  # Only write the anchor when BOTH are non-empty: an artifact with
                  # an empty channel/ts would make the handler thread into nothing.
                  if [[ -n "$CH" && -n "$TS" ]]; then
                      jq -nc --arg c "$CH" --arg ts "$TS" '{channel:$c, ts:$ts}' > ci-failure-slack.json
                      echo "wrote ci-failure-slack.json: $(cat ci-failure-slack.json)"
                  else
                      echo "[ci-failure-alert] empty channel/ts from Slack — no anchor; handler will post its own root."
                  fi

            - name: Upload CI-failure Slack thread anchor
              if: always() && steps.ci_failure_alert.outcome == 'success' && hashFiles('ci-failure-slack.json') != ''
              uses: actions/upload-artifact@v4
              with:
                  name: ci-failure-slack
                  path: ci-failure-slack.json
                  retention-days: 7

            - name: Fail job if workflow failed
              if: success() && steps.lastJobStatus.outputs.workflowStatus == 'failure'
              run: |
                  echo "Workflow failed, failing the build."
                  exit 1

    # Asynchronous, NON-GATING snapshot review. Runs the /snapshot-review reports for the PR and
    # writes the `snapshot-review` section of the consolidated PR comment. `report` does NOT depend
    # on this job and it must be excluded from branch-protection required checks — merge never waits
    # on it. `continue-on-error` + `!cancelled()` keep it off the critical path (the snapshot jobs
    # deliberately exit 1 when they regenerate baselines, so this must tolerate their failure).
    snapshot_review:
        runs-on: ubuntu-24.04
        name: Snapshot Review
        continue-on-error: true
        needs: [detect-changes, init, test, e2e, fw_pkg_test]
        if: |
            !cancelled() &&
            github.event_name == 'pull_request' &&
            github.event.pull_request.head.repo.full_name == github.repository &&
            needs.detect-changes.outputs.run_full_ci == 'true'
        permissions:
            contents: read
            pull-requests: write
            packages: read
            # scene-graph review (follow-up) downloads CI artifacts via gh — needs actions: read.
            actions: read
        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Install ImageMagick
              shell: bash
              run: |
                  set -euo pipefail
                  # snapshot-collect.sh drives ImageMagick via the v7-style `magick <subcommand>`
                  # entrypoint (`magick identify`, `magick compare`). ubuntu-24.04 ships ImageMagick 6,
                  # which exposes those as standalone `identify`/`compare` and has no `magick` binary.
                  # Install v6 and provide a thin shim that dispatches `magick <sub> …` -> `<sub> …`
                  # (self-contained; no fragile AppImage download).
                  sudo apt-get update -qq
                  sudo apt-get install -y -qq imagemagick
                  printf '#!/usr/bin/env bash\nexec "$@"\n' | sudo tee /usr/local/bin/magick >/dev/null
                  sudo chmod +x /usr/local/bin/magick
                  magick identify -version | head -1

            - name: Install @ag-grid/dev-prompts
              uses: ./external/ag-shared/github/actions/install-ag-dev-prompts
              with:
                  channel: canary

            - name: Generate snapshot-review reports
              id: review
              uses: ./.github/actions/snapshot-review-run
              with:
                  snapshot_branch: ${{ needs.init.outputs.snapshot_branch }}
                  base_branch: ${{ github.base_ref }}
                  github_token: ${{ secrets.GITHUB_TOKEN }}

            - name: Upload snapshot-review HTML reports
              if: steps.review.outputs.produced == 'true'
              uses: actions/upload-artifact@v4
              with:
                  name: snapshot-review-html
                  path: ${{ steps.review.outputs.html_dir }}/*.html
                  if-no-files-found: ignore

            # Upsert the snapshot-review section when reports were produced; otherwise clear any
            # stale section from an earlier push (snapshots since fixed / no longer changed).
            - name: Upsert snapshot-review section
              uses: ./.github/actions/pr-report-comment
              with:
                  pr_number: ${{ github.event.pull_request.number }}
                  github_token: ${{ secrets.GITHUB_TOKEN }}
                  remove_sections: ${{ steps.review.outputs.produced != 'true' && 'snapshot-review' || '' }}

    sonarqube:
        # Org-scoped GHA variable kill-switch: set SONARCLOUD_ENABLED=false to
        # skip the scan (e.g. during a SonarCloud infra outage). Absent/any other
        # value keeps it running. Sonar is advisory, so a skip is not a failure.
        if: vars.SONARCLOUD_ENABLED != 'false'
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@v4
              with:
                  # Disabling shallow clones is recommended for improving the relevancy of reporting
                  fetch-depth: 0

            - name: SonarQube Scan
              uses: sonarsource/sonarqube-scan-action@master
              with:
                  args: >
                      -Dsonar.qualitygate.wait=true
              env:
                  SONAR_TOKEN: ${{ secrets.SONAR_LOGIN }}
                  SONAR_HOST_URL: https://sonarcloud.io
