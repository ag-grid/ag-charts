name: CI

on:
    push:
        branches:
            - 'latest'
            - 'next'
            - 'b[0-9][0-9]?.[0-9][0-9]?.[0-9][0-9]?'
    pull_request:
    workflow_dispatch:
        inputs:
            clean_checkout:
                description: 'Disable all caching'
                type: 'choice'
                required: true
                default: 'false'
                options:
                    - 'true'
                    - 'false'
            nx_command:
                type: 'choice'
                required: true
                default: 'affected'
                options:
                    - 'affected'
                    - 'run-many'

env:
    IBM_TELEMETRY_DISABLED: 'true'
    # Disable git's post-fetch background gc/maintenance for every git invocation
    # (injected via git's GIT_CONFIG_* protocol). Otherwise it rewrites .git/shallow
    # concurrently with the next chained `git fetch --depth 1`, intermittently failing
    # job setup with "fatal: shallow file has changed since we read it".
    GIT_CONFIG_COUNT: 2
    GIT_CONFIG_KEY_0: gc.auto
    GIT_CONFIG_VALUE_0: '0'
    GIT_CONFIG_KEY_1: maintenance.auto
    GIT_CONFIG_VALUE_1: 'false'
    NX_NO_CLOUD: true
    NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}
    NX_BRANCH: ${{ github.ref }}
    NX_COMMAND_TYPE: ${{ github.event.inputs.nx_command }}
    BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
    AG_LIBRARY: charts
    AG_SKIP_NATIVE_DEP_VERSION_CHECK: 1
    LIBRARY_WEBSITE_STATUS_CHANNEL: '#charts-website-status'

permissions:
    contents: read
    pull-requests: read

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: ${{ github.ref != 'refs/heads/latest' && github.ref != 'refs/heads/next' }}

jobs:
    detect-changes:
        runs-on: ubuntu-24.04
        name: Detect Changes
        outputs:
            run_full_ci: ${{ steps.decide.outputs.run_full_ci }}
            locale: ${{ steps.filter.outputs.locale }}
        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                  fetch-depth: 1

            - name: Detect file changes (PR only)
              id: filter
              if: github.event_name == 'pull_request'
              uses: dorny/paths-filter@v3
              with:
                  filters: |
                      code:
                        - 'packages/**'
                        - 'libraries/**'
                        - 'plugins/**'
                        - 'tests/**'
                        - 'tools/**'
                        - 'external/ag-website-shared/**'
                        - 'external/ag-shared/scripts/**'
                        - 'external/ag-shared/github/**'
                        - 'external/ag-shared/src/**'
                        - 'external/ag-shared/tools/**'
                        - 'external/ag-shared/*.json'
                        - 'examples/server-side-rendering/**'
                        - '*.json'
                        - '*.ts'
                        - '*.js'
                        - '*.cjs'
                        - '*.mjs'
                        - 'yarn.lock'
                        - 'nx.json'
                        - 'tsconfig.*.json'
                        - '**/vitest.config.ts'
                        - '**/vitest.setup.ts'
                      ci:
                        - '.github/**'
                      locale:
                        - 'packages/ag-charts-locale/src/**'

            - name: Decide what to run
              id: decide
              run: |
                  # Always run full CI for push events and manual triggers
                  if [[ "${{ github.event_name }}" != "pull_request" ]]; then
                    echo "run_full_ci=true" >> $GITHUB_OUTPUT
                    echo "Non-PR event (${{ github.event_name }}), running full CI"
                    exit 0
                  fi

                  # For PRs, check if code or CI files changed
                  if [[ "${{ steps.filter.outputs.code }}" == "true" ]] || \
                     [[ "${{ steps.filter.outputs.ci }}" == "true" ]]; then
                    echo "run_full_ci=true" >> $GITHUB_OUTPUT
                    echo "Code or CI changes detected (code=${{ steps.filter.outputs.code }}, ci=${{ steps.filter.outputs.ci }}), running full CI"
                  else
                    echo "run_full_ci=false" >> $GITHUB_OUTPUT
                    echo "Only non-code changes detected, running lint only"
                  fi

    init:
        runs-on: ubuntu-24.04
        name: Initialise Workflow
        # Deliberately does not wait for detect-changes (~20-30s off the critical path):
        # init consumes none of its outputs. On the rare docs-only PR this wastes one
        # init run — every downstream job is still gated by detect-changes.
        permissions:
            contents: write
        env:
            AG_FORCE_ALL_TESTS: 1
            # Docs-example sweeps cover only the vanilla variant of the examples this branch did not
            # touch; changed examples always sweep all six. Everything except PRs — pushes (the
            # on.push filter admits latest/next/bX.Y.Z only) and manual dispatches, which are run to
            # verify deliberately — keeps the full six-variant sweep. Must stay in step with the e2e
            # job below.
            AG_E2E_FRAMEWORKS: ${{ github.event_name != 'pull_request' && 'vanilla,typescript,reactFunctional,reactFunctionalTs,angular,vue3' || 'vanilla' }}
        outputs:
            nx_base: ${{ steps.setup.outputs.base }}
            test_count: ${{ steps.matrix.outputs.test_count }}
            test_matrix: ${{ steps.matrix.outputs.test_matrix }}
            test_pkg_matrix: ${{ steps.matrix.outputs.pkg_matrix }}
            e2e_matrix: ${{ steps.matrix.outputs.e2e_matrix }}
            e2e_count: ${{ steps.matrix.outputs.e2e_count }}
            demos_affected: ${{ steps.matrix.outputs.demos_affected }}
            build_type: ${{ steps.setup.outputs.type }}
            snapshot_branch: ${{ steps.snapshot-prepare.outputs.branch }}
            pkg_tests_modified: ${{ steps.matrix.outputs.pkg_tests_modified }}
        steps:
            - name: Checkout
              id: checkout
              uses: actions/checkout@v4
              with:
                  fetch-depth: 1

            - name: Setup
              id: setup
              uses: ./.github/actions/setup-nx
              with:
                  cache_mode: ${{ github.event.inputs.clean_checkout == 'true' && 'off' || 'rw' }}
                  free_disk_space: false
                  # Safe for init only: its own build step materialises all plugin outputs.
                  # Measured net win (~30s): the graph computation moves into the build step,
                  # but the plugin-build invocation's own fixed overhead is avoided.
                  skip_plugin_build: true
                  base_ref: ${{ github.event.pull_request.base.ref || github.event.base_ref || 'latest' }}

            - name: nx build and generate cacheable examples
              id: build
              if: steps.setup.outcome == 'success' || steps.setup.outcome == 'skipped'
              run: |
                  # generate-thumbnail is deliberately NOT built here. It cost ~80s on this
                  # critical-path job purely to populate the Nx cache for website_build — which no
                  # longer waits for init, so it cannot see this run's cache anyway and generates
                  # the thumbnails itself, in parallel, where it has slack.
                  yarn nx run-many -t build,docs-resolved-interfaces,generate-example --exclude tag:skip-gha-cache,all --parallel=12
                  # Populate the (rw-cached) staging example outputs here so the ro website_build
                  # job restores them instead of regenerating all examples. Only latest builds the
                  # website with -c staging, so scope the extra generation to that branch.
                  if [[ "${{ github.ref }}" == "refs/heads/latest" ]]; then
                      yarn nx run-many -t generate-example -c staging --exclude tag:skip-gha-cache,all
                  fi

            - name: Build tests
              run: yarn nx run-many -t generate-test-files

            - name: Build non-cacheable examples
              run: |
                  # Get all non-benchmark non-Nx-cacheable examples for e2e tests
                  yarn nx graph --file=/tmp/graph.json
                  e2e_cacheable=$(jq -r '[.graph.nodes | to_entries[] | select(.value.data.tags | contains(["skip-gha-cache"]) and contains(["type:generated-example"])) | .key] | map(select(contains("benchmarks") | not)) | join(",")' /tmp/graph.json)

                  # Build all non-Nx-cacheable examples for e2e tests
                  yarn nx run-many -t generate-example -p ${e2e_cacheable} --excludeTaskDependencies --skip-nx-cache

            - name: Calculate test matrices
              id: matrix
              run: |
                  if [[ "${{ github.event.inputs.nx_command || 'affected' }}" == "run-many" ]] ; then
                    count=10
                  else
                    count=$(yarn -s nx show projects --affected --base ${{ steps.setup.outputs.base }} -t test | wc -l)
                  fi

                  matrix=$(node ./external/ag-shared/scripts/shard/calculate-shards.js eval --max 6 --ratio 1 --zero ${count})
                  echo "test_matrix=${matrix}" >> $GITHUB_OUTPUT
                  echo "test_count=${count}" >> $GITHUB_OUTPUT
                  echo "Test matrix determined to be: ${matrix} (test_count=${count})"

                  pkg_matrix=$(node ./external/ag-shared/scripts/shard/calculate-pkg-shards.js)
                  echo "pkg_matrix=${pkg_matrix}" >> $GITHUB_OUTPUT
                  echo "Package test matrix determined to be: ${pkg_matrix}"

                  e2e_nx_count=$(yarn -s nx show projects --affected --base ${{ steps.setup.outputs.base }} -t test:e2e | wc -l)
                  if [[ ${e2e_nx_count} -gt 0 ]] ; then
                    e2e_count=$(cd packages/ag-charts-website/ ; npx playwright test --list | grep -v '!!!SKIPPED!!!' | wc -l)
                  else
                    e2e_count=0
                  fi

                  # Duration-balanced shard assignment (falls back to Playwright count-based
                  # --shard sharding if the committed timings file is missing or stale).
                  #
                  # The plan is sized by the workload's *shape*, not by the event type. A PR run
                  # normally sweeps only the vanilla example variant (see AG_E2E_FRAMEWORKS), so it
                  # is planned from the PR timings, and its lighter shards are packed into a
                  # narrower fan-out — fewer, fuller shards waste less on the ~45s of fixed
                  # per-shard setup. Pushes sweep all six variants with AG_SCENE_SNAPSHOTS=all,
                  # making their docs-example specs cost ~10x as much, so they need both the push
                  # timings and the wider fan-out.
                  #
                  # A change under the example generator plugin invalidates the output of every
                  # example, so the runtime sweeps escalate all of them to the full six-variant
                  # matrix even on a PR (see e2e/changed-examples.ts). Such a run is push-shaped
                  # and must be planned as one: the PR timings under-weight those specs ~3x, which
                  # packs them together until the bins overflow the 15-minute job timeout. The push
                  # timings over-weight them instead, by the snapshot capture a PR does not pay —
                  # the safe direction, since shards then finish early rather than time out.
                  e2e_full_sweep=1
                  if [[ "${{ github.event_name }}" == "pull_request" ]] ; then
                    if git diff --quiet ${{ steps.setup.outputs.base }} -- plugins/ag-charts-generate-example-files/ ; then
                      e2e_full_sweep=0
                    else
                      echo "Example generator changed - every example escalates to the full framework sweep; planning this PR run as push-shaped."
                    fi
                  fi

                  if [[ ${e2e_full_sweep} -eq 1 ]] ; then
                    e2e_timings=shard-timings.json
                    e2e_shards=32
                  else
                    e2e_timings=shard-timings.pr.json
                    e2e_shards=16
                  fi

                  e2e_matrix=$(node ./external/ag-shared/scripts/shard/assign-e2e-shards.js \
                    --max ${e2e_shards} \
                    --count ${e2e_count} \
                    --timings packages/ag-charts-website/e2e/${e2e_timings} \
                    --test-dir packages/ag-charts-website/e2e)
                  echo "e2e_matrix=${e2e_matrix}" >> $GITHUB_OUTPUT
                  echo "e2e_count=${e2e_count}" >> $GITHUB_OUTPUT
                  echo "E2E matrix determined to be: ${e2e_matrix} (e2e_test_count=${e2e_count})"

                  # Whether the demo-apps smoke should run (its own files or an upstream dep changed).
                  if [[ "${{ github.event.inputs.nx_command || 'affected' }}" == "run-many" ]] ; then
                    demos_affected=1
                  else
                    demos_affected=$(yarn -s nx show projects --affected --base ${{ steps.setup.outputs.base }} -t test:e2e | grep -Fxc 'ag-charts-demos' || true)
                  fi
                  echo "demos_affected=${demos_affected}" >> $GITHUB_OUTPUT
                  echo "Demos affected: ${demos_affected}"

                  # Check if package test files are directly modified in PR
                  pkg_tests_modified="false"
                  if git diff --name-only ${{ steps.setup.outputs.base }}...HEAD 2>/dev/null | grep -q "^tests/.*-package-tests/"; then
                    pkg_tests_modified="true"
                  fi
                  echo "pkg_tests_modified=${pkg_tests_modified}" >> $GITHUB_OUTPUT
                  echo "Package tests modified: ${pkg_tests_modified}"

            - name: Prepare Snapshot Branch
              uses: ./.github/actions/snapshot-prepare
              id: snapshot-prepare

            - name: Persist build outputs
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: e2e-init-outputs
                  # Mostly minified JS — heavier compression buys little and costs
                  # upload/download time on init and every e2e shard.
                  compression-level: 1
                  # Sourcemaps (~77MB across 264 files) are only ever fetched by devtools,
                  # so no e2e assertion depends on them — excluding them trims the upload
                  # here and the download on every shard.
                  path: |
                      dist/
                      packages/*/dist/
                      external/*/dist/
                      packages/ag-charts-website/e2e/generated/
                      !packages/*/dist/**/*.map

    lint:
        runs-on: ubuntu-24.04
        name: Lint & Format Check
        needs: detect-changes
        outputs:
            lint: ${{ steps.lint.outcome || '' }}
            format: ${{ steps.format.outcome || '' }}
        steps:
            - name: Checkout
              id: checkout
              uses: actions/checkout@v4
              with:
                  fetch-depth: 1

            - name: Fetch Refs
              run: |
                  git fetch origin --depth 1 latest next
                  git fetch origin --depth 1 tag latest-success next-success

            - name: Setup
              id: setup
              uses: ./.github/actions/setup-nx
              with:
                  cache_mode: ro
                  base_ref: ${{ github.event.pull_request.base.ref || github.event.base_ref }}
                  free_disk_space: false

            - name: nx format:check
              id: format
              if: steps.setup.outcome == 'success' || steps.setup.outcome == 'skipped'
              run: |
                  if [[ "${{ github.event.inputs.nx_command || 'affected' }}" == "run-many" ]] ; then
                    yarn nx format:check --all
                  else
                    yarn nx format:check --base ${{ steps.setup.outputs.base }}
                  fi

            - name: nx lint
              id: lint
              if: steps.setup.outcome == 'success' || steps.setup.outcome == 'skipped'
              run: yarn nx ${{ github.event.inputs.nx_command || 'affected' }} -t lint --exclude all

    generate:
        runs-on: ubuntu-24.04
        name: Generate (${{ matrix.shard }}/${{ strategy.job-total }})
        needs: [detect-changes, init]
        if: needs.detect-changes.outputs.run_full_ci == 'true'
        strategy:
            fail-fast: false
            matrix:
                # `generate -c production` is a separate pass from init's `generate-example`, so it
                # is real work (~940 tasks, almost no cache hits) rather than a cache replay.
                shard: [1, 2, 3, 4]
        outputs:
            generate: ${{ steps.generate.outcome || '' }}
        steps:
            - name: Checkout
              id: checkout
              uses: actions/checkout@v4
              with:
                  fetch-depth: 1

            - name: Fetch Refs
              run: |
                  git fetch origin --depth 1 latest next
                  git fetch origin --depth 1 tag latest-success next-success

            - name: Setup
              id: setup
              uses: ./.github/actions/setup-nx
              with:
                  yarn_postinstall: no-install
                  cache_mode: ro
                  free_disk_space: false
                  base_ref: ${{ github.event.pull_request.base.ref || github.event.base_ref }}

            - name: nx generate
              id: generate
              if: steps.setup.outcome == 'success' || steps.setup.outcome == 'skipped'
              run: |
                  projects=$(node ./external/ag-shared/scripts/shard/shard-projects.js -t generate -s ${{ matrix.shard }} --total ${{ strategy.job-total }} --command ${{ github.event.inputs.nx_command || 'affected' }})
                  if [ -n "$projects" ]; then
                    yarn nx run-many -t generate -c production -p ${projects}
                  fi

    build:
        runs-on: ubuntu-24.04
        name: Build
        needs: [detect-changes, init]
        if: needs.detect-changes.outputs.run_full_ci == 'true'
        outputs:
            build: ${{ steps.build.outcome || '' }}
        steps:
            - name: Checkout
              id: checkout
              uses: actions/checkout@v4
              with:
                  fetch-depth: 1

            - name: Fetch Refs
              run: |
                  git fetch origin --depth 1 latest next
                  git fetch origin --depth 1 tag latest-success next-success

            - name: Setup
              id: setup
              uses: ./.github/actions/setup-nx
              with:
                  yarn_postinstall: no-install
                  cache_mode: ro
                  free_disk_space: false
                  base_ref: ${{ github.event.pull_request.base.ref || github.event.base_ref }}

            - name: nx build
              id: build
              if: steps.setup.outcome == 'success' || steps.setup.outcome == 'skipped'
              run: |
                  yarn nx ${{ github.event.inputs.nx_command || 'affected' }} -t build --exclude all,ag-charts-website

            # The enterprise UMD loads ag-charts-community at runtime, so publish both even when `nx affected` rebuilt only one.
            - name: Build UMD bundles for PR preview
              id: build_umd
              if: github.event_name == 'pull_request' && steps.build.outcome == 'success'
              run: |
                  yarn nx run-many -t build:umd -p ag-charts-community ag-charts-enterprise

            - name: Upload UMD bundles for PR preview
              if: github.event_name == 'pull_request' && steps.build_umd.outcome == 'success'
              uses: actions/upload-artifact@v4
              with:
                  name: pr-preview-umd
                  if-no-files-found: ignore
                  retention-days: 14
                  path: |
                      packages/ag-charts-community/dist/umd/ag-charts-community.min.js
                      packages/ag-charts-community/dist/umd/ag-charts-community.min.js.map
                      packages/ag-charts-enterprise/dist/umd/ag-charts-enterprise.min.js
                      packages/ag-charts-enterprise/dist/umd/ag-charts-enterprise.min.js.map

    validate:
        runs-on: ubuntu-24.04
        name: Validate Examples
        needs: [detect-changes, init]
        if: needs.detect-changes.outputs.run_full_ci == 'true'
        outputs:
            validate: ${{ steps.validate.outcome || '' }}
        steps:
            - name: Checkout
              id: checkout
              uses: actions/checkout@v4
              with:
                  fetch-depth: 1

            - name: Fetch Refs
              run: |
                  git fetch origin --depth 1 latest next
                  git fetch origin --depth 1 tag latest-success next-success

            - name: Setup
              id: setup
              uses: ./.github/actions/setup-nx
              with:
                  cache_mode: ro
                  base_ref: ${{ github.event.pull_request.base.ref || github.event.base_ref }}
                  free_disk_space: false

            - name: nx run-many -t validate-examples
              id: validate
              if: steps.setup.outcome == 'success' || steps.setup.outcome == 'skipped'
              run: yarn nx ${{ github.event.inputs.nx_command || 'affected' }} -t validate-examples --exclude all

    pr_preview:
        runs-on: ubuntu-24.04
        name: PR Preview (UMD)
        needs: [build]
        # Same-repo PRs only — fork PRs get a read-only token from GitHub, so
        # the deploy-to-gh-pages and sticky-comment steps would fail. Mirrors
        # the fork-PR gate used in pr-review.yml.
        if: |
            github.event_name == 'pull_request' &&
            github.event.pull_request.head.repo.full_name == github.repository &&
            needs.build.outputs.build == 'success'
        permissions:
            contents: write
            pull-requests: write
        # Per-PR lock: stops this PR's publishers (the UMD bundles here and the
        # snapshot reports in `snapshot_review`) and its close-time cleanup from
        # running concurrently, which narrows the window in which a late publish
        # could re-create a pr-<N>/ that cleanup removed. (Job concurrency prevents
        # overlap but not strict ordering, so it narrows rather than closes that
        # window.) Cross-PR safety is NOT this lock's job — the push-retry loop in
        # pr-preview-publish resolves diverged refs between different PRs, so they no
        # longer contend. Keep this group string byte-identical to the ones in
        # `snapshot_review` (below) and `gh_pages_cleanup` (pr-cleanup.yml).
        concurrency:
            group: pr-preview-gh-pages-${{ github.event.pull_request.number }}
            cancel-in-progress: false
        env:
            PR_NUMBER: ${{ github.event.pull_request.number }}
        steps:
            # Needed for the local shared action below; same-repo gate (job if) is the guard.
            - name: Checkout
              uses: actions/checkout@v4
              with:
                  fetch-depth: 1

            - name: Download UMD artifact
              id: download
              uses: actions/download-artifact@v4
              continue-on-error: true
              with:
                  name: pr-preview-umd
                  path: _umd

            - name: Resolve UMD bundle paths
              id: stage
              if: steps.download.outcome == 'success'
              run: |
                  set -euo pipefail
                  # upload-artifact@v4 strips the common path prefix, so find by filename.
                  COMMUNITY=$(find _umd -type f -name 'ag-charts-community.min.js' -print -quit)
                  ENTERPRISE=$(find _umd -type f -name 'ag-charts-enterprise.min.js' -print -quit)
                  if [ -z "$COMMUNITY" ] && [ -z "$ENTERPRISE" ]; then
                      echo "::warning No UMD bundles in artifact — likely tooling-only PR; skipping publish."
                      echo "publish=false" >> "$GITHUB_OUTPUT"
                      exit 0
                  fi
                  if [ -z "$COMMUNITY" ] || [ -z "$ENTERPRISE" ]; then
                      echo "::error exactly one UMD bundle present; expected both or neither." >&2
                      ls -laR _umd || true
                      exit 1
                  fi
                  {
                      echo "files<<__FILES_EOF__"
                      echo "$COMMUNITY"
                      echo "$ENTERPRISE"
                      echo "__FILES_EOF__"
                  } >> "$GITHUB_OUTPUT"
                  echo "publish=true" >> "$GITHUB_OUTPUT"

            - name: Publish PR preview to gh-pages
              if: steps.stage.outputs.publish == 'true'
              uses: ./external/ag-shared/github/actions/pr-preview-publish
              with:
                  pr_number: ${{ env.PR_NUMBER }}
                  files: ${{ steps.stage.outputs.files }}
                  github_token: ${{ secrets.GITHUB_TOKEN }}

            - name: Write live-test section
              if: steps.stage.outputs.publish == 'true'
              shell: bash
              run: |
                  mkdir -p "${RUNNER_TEMP}/pr-sections"
                  cat > "${RUNNER_TEMP}/pr-sections/10-preview.md" <<EOF
                  ## [ok] Live-test this PR in Plunker

                  Paste these two \`<script>\` tags into a Plunker (or any vanilla-JS host) to load the UMD bundles built from this PR:

                  \`\`\`html
                  <script src="https://ag-grid.github.io/ag-charts/pr-${PR_NUMBER}/ag-charts-community.min.js"></script>
                  <script src="https://ag-grid.github.io/ag-charts/pr-${PR_NUMBER}/ag-charts-enterprise.min.js"></script>
                  \`\`\`

                  Bundles are removed automatically when the PR is closed. Updated on every push.
                  EOF

            - name: Upsert live-test section
              if: steps.stage.outputs.publish == 'true'
              uses: ./.github/actions/pr-report-comment
              with:
                  pr_number: ${{ env.PR_NUMBER }}
                  github_token: ${{ secrets.GITHUB_TOKEN }}

    l10n_review:
        runs-on: ubuntu-24.04
        name: L10n Review
        # Advisory only — a review failure must never gate the build (mirrors the old standalone
        # workflow, which ran off the critical path).
        continue-on-error: true
        needs: [detect-changes]
        # Advisory semantic review of translation changes, folded into the consolidated PR
        # comment. Same-repo PRs that touched locale source only — never run repo code with the
        # API key in scope for a fork PR (mirrors the ci.yml/pr-review.yml fork gate). Deterministic
        # structural checks live in the package tests; this never gates the build.
        if: |
            github.event_name == 'pull_request' &&
            needs.detect-changes.outputs.locale == 'true' &&
            github.event.pull_request.head.repo.full_name == github.repository
        permissions:
            contents: read
            pull-requests: write
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - uses: actions/setup-node@v4
              with:
                  node-version: 22

            - name: Review translations
              env:
                  LOCALE_SRC_DIR: packages/ag-charts-locale/src
                  ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
                  BASE_SHA: ${{ github.event.pull_request.base.sha }}
                  HEAD_SHA: ${{ github.event.pull_request.head.sha }}
                  REPORT_PATH: l10n-review.md
              run: |
                  # Defense-in-depth: execute the review script as it exists at the base ref,
                  # never the PR head, so PR-controlled code can't run with the API key in scope.
                  script=external/ag-shared/scripts/l10n/review-translations.mjs
                  if git cat-file -e "$BASE_SHA:$script" 2>/dev/null; then
                      git show "$BASE_SHA:$script" > "$RUNNER_TEMP/review-translations.mjs"
                  else
                      echo "Script absent at base ref; using checked-out copy (the PR introducing it)."
                      cp "$script" "$RUNNER_TEMP/review-translations.mjs"
                  fi
                  node "$RUNNER_TEMP/review-translations.mjs"

            - name: Build L10n section
              run: |
                  mkdir -p "${RUNNER_TEMP}/pr-sections"
                  out="${RUNNER_TEMP}/pr-sections/30-l10n.md"
                  if [ -f l10n-review.md ]; then
                      # Drop the standalone marker the generator prepends (review-translations.mjs);
                      # the consolidated comment owns the parent marker. Prepend our section heading.
                      # [warn]: the reviewer flagged translations to read before merge.
                      { echo '## [warn] Translation review'; echo; sed '/<!-- l10n-translation-review -->/d' l10n-review.md; } > "$out"
                  else
                      # [ok]: nothing to action.
                      printf '## [ok] Translation review\n\nNo translation issues found.\n' > "$out"
                  fi

            - name: Upsert L10n section
              uses: ./.github/actions/pr-report-comment
              with:
                  pr_number: ${{ github.event.pull_request.number }}
                  github_token: ${{ secrets.GITHUB_TOKEN }}

    website_build:
        runs-on: ubuntu-24.04
        name: Website Build
        # Deliberately does not wait for init: it consumes no init outputs, only the previous
        # baseline Nx cache (restore-keys), and rebuilds PR-affected tasks itself. Starting it
        # immediately takes ~4 minutes off the critical path on code-change PRs.
        needs: [detect-changes]
        if: needs.detect-changes.outputs.run_full_ci == 'true'
        outputs:
            build: ${{ steps.build.outcome || '' }}
        steps:
            - name: Checkout
              id: checkout
              uses: actions/checkout@v4
              with:
                  fetch-depth: 1

            - name: Fetch Refs
              run: |
                  git fetch origin --depth 1 latest next
                  git fetch origin --depth 1 tag latest-success next-success

            - name: Setup
              id: setup
              uses: ./.github/actions/setup-nx
              with:
                  yarn_postinstall: no-install
                  cache_mode: ro
                  free_disk_space: false
                  base_ref: ${{ github.event.pull_request.base.ref || github.event.base_ref }}

            - name: nx build ag-charts-website
              id: build
              if: steps.setup.outcome == 'success' || steps.setup.outcome == 'skipped'
              run: |
                  if [[ "${{ github.ref }}" == "refs/heads/latest" ]]; then
                      yarn nx run ag-charts-website:build -c staging
                  else
                      yarn nx ${{ github.event.inputs.nx_command || 'affected' }} -t build --exclude='*,!ag-charts-website'
                  fi

            - name: Persist website build for staging deploy
              if: github.ref == 'refs/heads/latest' && steps.build.outcome == 'success'
              uses: actions/upload-artifact@v4
              with:
                  name: website-staging-dist
                  path: dist/packages/ag-charts-website/
                  # upload-artifact@v4 excludes hidden files by default, which would drop the
                  # generated .htaccess (CSP + redirects) before the deploy job zips it.
                  include-hidden-files: true
                  retention-days: 1

    test:
        runs-on: ubuntu-24.04
        name: Unit & Integration Tests (${{ matrix.shard }}/${{ strategy.job-total }})
        permissions:
            contents: write
        needs: [detect-changes, init]
        if: needs.detect-changes.outputs.run_full_ci == 'true' && needs.init.outputs.test_count > 0
        strategy:
            fail-fast: false
            matrix: ${{ fromJson(needs.init.outputs.test_matrix )}}
        env:
            NX_PARALLEL: 1
            NX_BASE: ${{ needs.init.outputs.nx_base }}
            # Scene-graph JSON capture: full dump on pushes to baseline branches (latest, next,
            # release bX.Y.Z — the only branches the `on.push` filter admits), dump-on-image-diff for
            # PRs and manual dispatch, for machine-readable snapshot-diff verification.
            AG_SCENE_SNAPSHOTS: ${{ github.event_name == 'push' && 'all' || 'diff' }}
        steps:
            - name: Checkout
              id: checkout
              uses: actions/checkout@v4
              with:
                  fetch-depth: 1

            - name: Fetch Refs
              run: |
                  git fetch origin --depth 1 latest next
                  git fetch origin --depth 1 tag latest-success next-success

            - name: Setup
              id: setup
              uses: ./.github/actions/setup-nx
              with:
                  yarn_postinstall: no-install
                  cache_mode: ro
                  free_disk_space: false
                  base_ref: ${{ github.event.pull_request.base.ref || github.event.base_ref }}

            - name: nx test
              if: matrix.shard != 0
              id: test
              run: yarn nx ${{ github.event.inputs.nx_command || 'affected' }} -t test --configuration=ci --exclude tag:no-sharding --exclude all --shard=${{ matrix.shard }}/$((${{ strategy.job-total }} - 1))
            - name: nx test (non-sharded)
              if: matrix.shard == 0
              id: test-no-shard
              run: yarn nx ${{ github.event.inputs.nx_command || 'affected' }} -t test --configuration=ci --exclude '*,!tag:no-sharding'
            - name: nx test:validate-size
              if: matrix.shard == 0
              id: test-no-shard-validate-size
              run: yarn nx ${{ github.event.inputs.nx_command || 'affected' }} -t test:validate-size --configuration=ci
            - name: nx pack:verify
              if: matrix.shard == 0
              id: pack-verify
              run: yarn nx ${{ github.event.inputs.nx_command || 'affected' }} -t pack:verify

            - name: Snapshot Branch
              uses: ./.github/actions/snapshot-branch
              with:
                  path: packages/ag-charts-{community,enterprise,server-side}/src/
                  source_branch: ${{ github.head_ref || github.ref_name }}
                  branch: ${{ needs.init.outputs.snapshot_branch }}
                  type: test (shard ${{matrix.shard}})

            - name: Persist test results
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: test-results-${{matrix.shard}}
                  path: |
                      reports/
                      packages/**/__diff_output__/*
                      packages/**/__scene_snapshots__/*

    playwright_image:
        runs-on: ubuntu-latest
        name: Playwright Image
        needs: [detect-changes]
        if: needs.detect-changes.outputs.run_full_ci == 'true'
        permissions:
            packages: write
        env:
            PLAYWRIGHT_IMAGE: mcr.microsoft.com/playwright:v1.60.0-jammy
            GHCR_IMAGE: ghcr.io/ag-grid/ag-charts/playwright:v1.60.0-jammy
            PLAYWRIGHT_CACHE_KEY: playwright-image-v1.60.0-jammy-v1
        outputs:
            # 'true' when shards can `docker pull` the GHCR mirror instead of restoring
            # the tarball cache. Falls back to the tarball path for fork PRs, whose
            # tokens cannot push (and may not read) GHCR packages.
            ghcr_available: ${{ steps.mirror_check.outputs.exists == 'true' || steps.mirror_push.outcome == 'success' }}
        steps:
            - name: Log in to GHCR
              id: ghcr_login
              continue-on-error: true # Fork PR tokens lack packages access; fall back to the tarball cache.
              run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

            - name: Check GHCR Mirror
              id: mirror_check
              if: steps.ghcr_login.outcome == 'success'
              run: |
                  if docker manifest inspect "${GHCR_IMAGE}" >/dev/null 2>&1 ; then
                    echo "exists=true" >> "$GITHUB_OUTPUT"
                  else
                    echo "exists=false" >> "$GITHUB_OUTPUT"
                  fi

            # Tarball cache path — only needed until the GHCR mirror exists for this
            # Playwright version, and as the fallback for fork PRs.
            - name: Restore Playwright Image Cache
              id: pw_cache
              if: steps.mirror_check.outputs.exists != 'true'
              uses: actions/cache@v4
              with:
                  path: /tmp/playwright-docker-image.tar
                  key: ${{ env.PLAYWRIGHT_CACHE_KEY }}

            - name: Pull Playwright Image
              if: steps.mirror_check.outputs.exists != 'true' && steps.pw_cache.outputs.cache-hit != 'true'
              run: |
                  pull_attempts=4
                  for attempt in $(seq 1 ${pull_attempts}) ; do
                    if docker pull ${PLAYWRIGHT_IMAGE} ; then
                      break
                    fi
                    if [[ ${attempt} -eq ${pull_attempts} ]] ; then
                      echo "Failed to pull ${PLAYWRIGHT_IMAGE} after ${pull_attempts} attempts."
                      exit 1
                    fi
                    backoff=$((attempt * 15))
                    jitter=$((RANDOM % 10))
                    echo "Pull attempt ${attempt} failed, retrying in $((backoff + jitter))s..."
                    sleep $((backoff + jitter))
                  done
                  docker save ${PLAYWRIGHT_IMAGE} -o /tmp/playwright-docker-image.tar

            - name: Load Playwright Image
              if: steps.mirror_check.outputs.exists != 'true' && steps.pw_cache.outputs.cache-hit == 'true'
              run: docker load -i /tmp/playwright-docker-image.tar

            # Mirror the exact upstream image to GHCR (retag only — contents are
            # byte-identical) so shards can pull it instead of restoring the tarball.
            - name: Push GHCR Mirror
              id: mirror_push
              if: steps.ghcr_login.outcome == 'success' && steps.mirror_check.outputs.exists != 'true'
              continue-on-error: true # Push failure just means shards use the tarball cache.
              run: |
                  docker tag "${PLAYWRIGHT_IMAGE}" "${GHCR_IMAGE}"
                  docker push "${GHCR_IMAGE}"

    e2e:
        runs-on: ubuntu-latest
        name: E2E Tests (${{ matrix.shard }}/${{ strategy.job-total }})
        permissions:
            contents: write
            packages: read
        needs: [detect-changes, init, playwright_image]
        if: needs.detect-changes.outputs.run_full_ci == 'true' && needs.init.outputs.e2e_count > 0
        strategy:
            fail-fast: false
            matrix: ${{ fromJson(needs.init.outputs.e2e_matrix )}}
        env:
            PLAYWRIGHT_IMAGE: mcr.microsoft.com/playwright:v1.60.0-jammy
            GHCR_IMAGE: ghcr.io/ag-grid/ag-charts/playwright:v1.60.0-jammy
            NX_BASE: ${{ needs.init.outputs.nx_base }}
            AG_FORCE_ALL_TESTS: 1
            # Must hold the same value as the init job: init's `playwright test --list` count is what
            # sizes the shard plan, so a disagreement would plan shards for a workload never run.
            AG_E2E_FRAMEWORKS: ${{ github.event_name != 'pull_request' && 'vanilla,typescript,reactFunctional,reactFunctionalTs,angular,vue3' || 'vanilla' }}
            # Scene-graph JSON capture alongside E2E screenshots: full dump on baseline-branch pushes,
            # dump-on-diff for PRs (for E2E, both capture — see expectChartScreenshot).
            AG_SCENE_SNAPSHOTS: ${{ github.event_name == 'push' && 'all' || 'diff' }}
        steps:
            # Registry pull is faster than cache restore + docker load, and it needs
            # nothing from the working tree — only GITHUB_TOKEN. Running it first and in
            # the background hides its ~26s (login, layer download, decompression)
            # behind checkout, the artifact download and setup.
            - name: Start Playwright Image Pull (GHCR mirror)
              if: needs.playwright_image.outputs.ghcr_available == 'true'
              env:
                  GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  nohup bash -c '
                    status=1
                    for attempt in 1 2 3 ; do
                      # Login is inside the retry: under ~32 concurrent shards the GHCR
                      # token endpoint itself can time out transiently.
                      if echo "${GHCR_TOKEN}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin \
                          && docker pull "${GHCR_IMAGE}" ; then
                        # Retagging to the upstream name means playwright.sh finds the
                        # image locally and skips its own pull; the rendered environment
                        # is byte-identical either way.
                        docker tag "${GHCR_IMAGE}" "${PLAYWRIGHT_IMAGE}"
                        status=0
                        break
                      fi
                      if [ ${attempt} -lt 3 ] ; then
                        sleep $((attempt * 10))
                      fi
                    done
                    echo "${status}" > "${RUNNER_TEMP}/playwright-pull.status"
                  ' > "${RUNNER_TEMP}/playwright-pull.log" 2>&1 < /dev/null &
                  echo "GHCR pull running in the background as pid $!."

            - name: Checkout
              id: checkout
              uses: actions/checkout@v4

            - name: Restore Init Build Outputs
              uses: actions/download-artifact@v4
              with:
                  name: e2e-init-outputs

            - name: Setup
              id: setup
              uses: ./.github/actions/setup-nx
              with:
                  yarn_postinstall: no-install
                  nx_restore: false # Restored in previous step.
                  cache_mode: ro
                  free_disk_space: false
                  base_ref: ${{ github.event.pull_request.base.ref || github.event.base_ref }}

            # Backgrounded here — the earliest point at which node_modules and the built
            # packages both exist — so the dev server's boot and its cold compile of the
            # index overlap the image wait below and the test step's container start-up.
            # playwright.sh adopts the running server instead of spawning its own.
            - name: Start Astro Dev Server
              run: packages/ag-charts-website/playwright.sh --start-dev-server

            - name: Await Playwright Image
              id: await_image
              env:
                  GHCR_AVAILABLE: ${{ needs.playwright_image.outputs.ghcr_available }}
              run: |
                  pulled=false
                  if [ "${GHCR_AVAILABLE}" == "true" ] ; then
                    # The pull runs in a shell detached from an earlier step, so it is not
                    # a child of this one — poll for its status file rather than `wait`.
                    for _ in $(seq 1 300) ; do
                      if [ -f "${RUNNER_TEMP}/playwright-pull.status" ] ; then
                        break
                      fi
                      sleep 1
                    done
                    if docker image inspect "${PLAYWRIGHT_IMAGE}" >/dev/null 2>&1 ; then
                      pulled=true
                    else
                      # Registry flakiness must not fail the shard — the tarball cache below is the fallback.
                      echo "::warning::GHCR pull did not produce ${PLAYWRIGHT_IMAGE}; falling back to the tarball cache."
                      cat "${RUNNER_TEMP}/playwright-pull.log" 2>/dev/null || true
                    fi
                  fi
                  echo "pulled=${pulled}" >> "$GITHUB_OUTPUT"

            # Fallback for fork PRs (whose tokens cannot read GHCR) and for transient registry
            # failures. The tarball cache is only refreshed while the GHCR mirror does not yet
            # exist, so it may be absent — pull from upstream as a last resort rather than failing.
            - name: Restore Playwright Image Cache
              id: pw_tarball
              if: steps.await_image.outputs.pulled != 'true'
              uses: actions/cache/restore@v4
              with:
                  path: /tmp/playwright-docker-image.tar
                  key: playwright-image-v1.60.0-jammy-v1

            - name: Load Playwright Image
              if: steps.await_image.outputs.pulled != 'true'
              env:
                  TARBALL_HIT: ${{ steps.pw_tarball.outputs.cache-hit }}
              run: |
                  if [ "${TARBALL_HIT}" == "true" ] ; then
                    docker load -i /tmp/playwright-docker-image.tar
                    exit 0
                  fi
                  echo "No cached image tarball; pulling ${PLAYWRIGHT_IMAGE} from upstream."
                  for attempt in 1 2 3 4 ; do
                    if docker pull "${PLAYWRIGHT_IMAGE}" ; then
                      exit 0
                    fi
                    if [ ${attempt} -lt 4 ] ; then
                      sleep $((attempt * 15))
                    fi
                  done
                  echo "Failed to obtain ${PLAYWRIGHT_IMAGE}."
                  exit 1

            - name: nx test:e2e
              id: test
              run: |
                  cd packages/ag-charts-website/

                  # matrix.args is either an explicit duration-balanced spec-file list (optionally
                  # with an intra-file --shard split) or a plain --shard=n/m fallback.
                  ./playwright.sh --host test -u changed ${{ matrix.args }}
              timeout-minutes: 15

            - name: Snapshot Branch
              uses: ./.github/actions/snapshot-branch
              with:
                  path: packages/ag-charts-website/e2e/
                  source_branch: ${{ github.head_ref || github.ref_name }}
                  branch: ${{ needs.init.outputs.snapshot_branch }}
                  type: test:e2e (shard ${{matrix.shard}})

            - name: Persist test results
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: test-results-e2e-shard-${{matrix.shard}}
                  path: |
                      reports/
                      packages/ag-charts-website/**/__scene_snapshots__/*

    # Firefox + WebKit e2e coverage. Deliberately a job of its own rather than extra projects in the
    # sharded `e2e` plan above: the workload is a fixed handful of tests (a single spec, pinned to the
    # vanilla framework variant), so it wants one small budget instead of being smeared across a
    # duration-balanced plan sized from the Chromium sweep. It runs `playwright.cross-browser.config.ts`,
    # which holds the firefox/webkit projects and writes its reports under distinct filenames.
    e2e_cross_browser:
        runs-on: ubuntu-latest
        name: E2E Cross-Browser
        permissions:
            contents: write
            packages: read
        needs: [detect-changes, init, playwright_image]
        # Gated on run_full_ci only — NOT on init's e2e_count, which is derived from the *main*
        # config's test list and so no longer counts this job's workload at all.
        if: needs.detect-changes.outputs.run_full_ci == 'true'
        env:
            PLAYWRIGHT_IMAGE: mcr.microsoft.com/playwright:v1.60.0-jammy
            GHCR_IMAGE: ghcr.io/ag-grid/ag-charts/playwright:v1.60.0-jammy
            NX_BASE: ${{ needs.init.outputs.nx_base }}
            AG_FORCE_ALL_TESTS: 1
            # AG_E2E_FRAMEWORKS is deliberately absent: the framework pin for these browsers lives in
            # the spec (pinNonChromiumToVanilla), so it holds on pushes as well as pull requests.
            AG_SCENE_SNAPSHOTS: ${{ github.event_name == 'push' && 'all' || 'diff' }}
            # Points playwright.sh's flaky-test annotation at this config's report.
            AG_E2E_REPORT_JSON: ./reports/ag-charts-website-e2e-cross-browser.json
        steps:
            # See the identically-shaped step on the `e2e` job for why this is backgrounded first.
            - name: Start Playwright Image Pull (GHCR mirror)
              if: needs.playwright_image.outputs.ghcr_available == 'true'
              env:
                  GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  nohup bash -c '
                    status=1
                    for attempt in 1 2 3 ; do
                      if echo "${GHCR_TOKEN}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin \
                          && docker pull "${GHCR_IMAGE}" ; then
                        docker tag "${GHCR_IMAGE}" "${PLAYWRIGHT_IMAGE}"
                        status=0
                        break
                      fi
                      if [ ${attempt} -lt 3 ] ; then
                        sleep $((attempt * 10))
                      fi
                    done
                    echo "${status}" > "${RUNNER_TEMP}/playwright-pull.status"
                  ' > "${RUNNER_TEMP}/playwright-pull.log" 2>&1 < /dev/null &
                  echo "GHCR pull running in the background as pid $!."

            - name: Checkout
              id: checkout
              uses: actions/checkout@v4

            - name: Restore Init Build Outputs
              uses: actions/download-artifact@v4
              with:
                  name: e2e-init-outputs

            - name: Setup
              id: setup
              uses: ./.github/actions/setup-nx
              with:
                  yarn_postinstall: no-install
                  nx_restore: false # Restored in previous step.
                  cache_mode: ro
                  free_disk_space: false
                  base_ref: ${{ github.event.pull_request.base.ref || github.event.base_ref }}

            - name: Start Astro Dev Server
              run: packages/ag-charts-website/playwright.sh --start-dev-server

            - name: Await Playwright Image
              id: await_image
              env:
                  GHCR_AVAILABLE: ${{ needs.playwright_image.outputs.ghcr_available }}
              run: |
                  pulled=false
                  if [ "${GHCR_AVAILABLE}" == "true" ] ; then
                    for _ in $(seq 1 300) ; do
                      if [ -f "${RUNNER_TEMP}/playwright-pull.status" ] ; then
                        break
                      fi
                      sleep 1
                    done
                    if docker image inspect "${PLAYWRIGHT_IMAGE}" >/dev/null 2>&1 ; then
                      pulled=true
                    else
                      echo "::warning::GHCR pull did not produce ${PLAYWRIGHT_IMAGE}; falling back to the tarball cache."
                      cat "${RUNNER_TEMP}/playwright-pull.log" 2>/dev/null || true
                    fi
                  fi
                  echo "pulled=${pulled}" >> "$GITHUB_OUTPUT"

            - name: Restore Playwright Image Cache
              id: pw_tarball
              if: steps.await_image.outputs.pulled != 'true'
              uses: actions/cache/restore@v4
              with:
                  path: /tmp/playwright-docker-image.tar
                  key: playwright-image-v1.60.0-jammy-v1

            - name: Load Playwright Image
              if: steps.await_image.outputs.pulled != 'true'
              env:
                  TARBALL_HIT: ${{ steps.pw_tarball.outputs.cache-hit }}
              run: |
                  if [ "${TARBALL_HIT}" == "true" ] ; then
                    docker load -i /tmp/playwright-docker-image.tar
                    exit 0
                  fi
                  echo "No cached image tarball; pulling ${PLAYWRIGHT_IMAGE} from upstream."
                  for attempt in 1 2 3 4 ; do
                    if docker pull "${PLAYWRIGHT_IMAGE}" ; then
                      exit 0
                    fi
                    if [ ${attempt} -lt 4 ] ; then
                      sleep $((attempt * 15))
                    fi
                  done
                  echo "Failed to obtain ${PLAYWRIGHT_IMAGE}."
                  exit 1

            - name: nx test:e2e (firefox, webkit)
              id: test
              run: |
                  cd packages/ag-charts-website/
                  ./playwright.sh --host test -u changed --config playwright.cross-browser.config.ts
              timeout-minutes: 15

            - name: Snapshot Branch
              uses: ./.github/actions/snapshot-branch
              with:
                  path: packages/ag-charts-website/e2e/
                  source_branch: ${{ github.head_ref || github.ref_name }}
                  branch: ${{ needs.init.outputs.snapshot_branch }}
                  type: test:e2e (cross-browser)

            - name: Persist test results
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: test-results-e2e-cross-browser
                  path: |
                      reports/
                      packages/ag-charts-website/**/__scene_snapshots__/*

    demos_e2e:
        runs-on: ubuntu-24.04
        name: Demo Apps Smoke
