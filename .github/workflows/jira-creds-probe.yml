name: Jira creds probe (throwaway)

# TEMPORARY diagnostic — verifies the ag-grid org-level jira-ai-bot secrets
# reach this repo and which Jira REST auth form they work with (site-host +
# Basic vs api.atlassian.com/ex/jira/{cloudId} gateway, Basic vs Bearer).
# Delete this branch + file once the question is answered.

on:
    push:
        branches: [jira-creds-probe]

permissions:
    contents: read

jobs:
    probe:
        runs-on: ubuntu-latest
        steps:
            - name: Probe Jira auth forms
              env:
                  EMAIL_SECRET: ${{ secrets.JIRA_AI_BOT_API_EMAIL }}
                  EMAIL_VAR: ${{ vars.JIRA_AI_BOT_API_EMAIL }}
                  TOKEN: ${{ secrets.JIRA_AI_BOT_API_TOKEN }}
                  CLOUD_ID: 1565837d-d6d1-4228-bcb2-4cb74df700f2
                  SITE: https://ag-grid.atlassian.net
              run: |
                  set -uo pipefail
                  echo "email — secrets.JIRA_AI_BOT_API_EMAIL set: $([ -n "${EMAIL_SECRET:-}" ] && echo yes || echo NO)"
                  echo "email — vars.JIRA_AI_BOT_API_EMAIL    set: $([ -n "${EMAIL_VAR:-}" ] && echo yes || echo NO)"
                  echo "token — secrets.JIRA_AI_BOT_API_TOKEN set: $([ -n "${TOKEN:-}" ] && echo yes || echo NO)"
                  EMAIL="${EMAIL_SECRET:-}"; EMAIL_SRC="secrets"
                  if [ -z "$EMAIL" ]; then EMAIL="${EMAIL_VAR:-}"; EMAIL_SRC="vars"; fi
                  [ -n "$EMAIL" ] && echo "using email from: $EMAIL_SRC  value: ${EMAIL}" || echo "no email available — Basic-auth probes (A/C/E) will be SKIPPED"
                  BASIC=""
                  [ -n "$EMAIL" ] && [ -n "${TOKEN:-}" ] && BASIC=$(printf '%s:%s' "$EMAIL" "$TOKEN" | base64 | tr -d '\n')

                  probe() {
                      local label="$1" hdr="$2" url="$3"
                      local code
                      code=$(curl -s -o /tmp/body -w '%{http_code}' -H "$hdr" -H 'Accept: application/json' "$url")
                      echo "::group::[$label] HTTP $code"
                      echo "$url"
                      head -c 400 /tmp/body; echo
                      echo "::endgroup::"
                      echo "RESULT $label = $code"
                  }
                  basic_probe() {
                      if [ -z "$BASIC" ]; then echo "RESULT $1 = SKIP (no email)"; return; fi
                      probe "$@"
                  }

                  echo "===== A: site host + Basic (what the pipeline does today) ====="
                  basic_probe "A site+Basic /myself"     "Authorization: Basic $BASIC"  "$SITE/rest/api/3/myself"

                  echo "===== B: site cloudId (tenant_info, no auth) — must match $CLOUD_ID ====="
                  probe "B tenant_info"            "Accept: application/json"     "$SITE/_edge/tenant_info"

                  echo "===== C: gateway (cloudId path) + Basic ====="
                  basic_probe "C gateway+Basic /myself"  "Authorization: Basic $BASIC"  "https://api.atlassian.com/ex/jira/$CLOUD_ID/rest/api/3/myself"

                  echo "===== D: gateway (cloudId path) + Bearer — token only, no email ====="
                  probe "D gateway+Bearer /myself" "Authorization: Bearer $TOKEN" "https://api.atlassian.com/ex/jira/$CLOUD_ID/rest/api/3/myself"

                  echo "===== E: real read target — AG-15988 via site+Basic ====="
                  basic_probe "E site issue AG-15988"    "Authorization: Basic $BASIC"  "$SITE/rest/api/3/issue/AG-15988?fields=summary,status"
