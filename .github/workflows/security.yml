name: Security

env:
    SECURITY_SEVERITY_THRESHOLD: high

    # Ignore `project.json` as snyk thinks it is a dot net project
    SECURITY_BASE_IGNORE_LIST: '.nx,project.json,dist'

on:
    issue_comment:
        types: [created]
    workflow_dispatch:
    schedule:
        - cron: '0 0 * * *' # Run daily at midnight UTC
    push:
        branches: ['AG-15064-add-snyk']
    pull_request:
        branches: ['AG-15064-add-snyk']

jobs:
    security-all-projects:
        runs-on: ubuntu-latest
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'issue_comment' && github.event.comment.body == '/security') || github.event_name == 'schedule' || github.event_name == 'push' || github.event_name == 'pull_request'
        steps:
            - uses: actions/checkout@main
            - name: Echo ignore lists
              run: |
                  echo "SECURITY_BASE_IGNORE_LIST: ${{ env.SECURITY_BASE_IGNORE_LIST }}"
            - name: Run snyk to check for vulnerabilities on all projects
              uses: snyk/actions/node@master
              env:
                  SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
              with:
                  args: --yarn-workspaces --strict-out-of-sync=false --severity-threshold=${{ env.SECURITY_SEVERITY_THRESHOLD }} --exclude=${{ env.SECURITY_BASE_IGNORE_LIST }}

    code-security:
        runs-on: ubuntu-latest
        permissions:
            pull-requests: write
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'issue_comment' && github.event.comment.body == '/security') || github.event_name == 'schedule' || github.event_name == 'push' || github.event_name == 'pull_request'
        steps:
            - uses: actions/checkout@main
            - name: Run Snyk SAST security code scan
              uses: snyk/actions/node@master
              env:
                  SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
              with:
                  command: code test
                  args: --severity-threshold=${{ env.SECURITY_SEVERITY_THRESHOLD }}
