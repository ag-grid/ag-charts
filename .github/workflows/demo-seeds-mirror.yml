name: Mirror Demo Seeds

# One-way copy of packages/ag-charts-demos/seeds to ag-grid/ag-charts-demos, which the demo pages
# open in StackBlitz: importing a folder of this repository makes StackBlitz download all of it
# first, which takes minutes, where the mirror holds only the seeds.
#
# What each mirror ref holds, and what installs the AG Charts packages (see "Mirror refs and sync
# order" in packages/ag-charts-demos/tools/seeds/README.md):
#
# - `staging`: ag-charts `latest`, synced by ci.yml after a successful "Deploy to Staging" (it
#   calls this workflow with `target: staging`; there is no push trigger for `latest`). The seeds
#   pinned to the npm `latest` dist-tag are exported to install the package tarballs the staging
#   site serves, so a seed opened from staging runs the build staging was made from. A run for a
#   commit older than the one the branch already holds leaves it as it is (a re-run of a failed job
#   must not undo a newer deployment).
# - `bX.Y.Z`: a push to the release branch of the same name, exported to install the tarballs of
#   the archive deployed at <production site>/charts/archive/X.Y.Z/. It can be ahead of that archive between a
#   push and the next archive deploy: the links resolve only once the archive is deployed.
# - `release-X.Y.Z` tags: the tagged commit's seeds, which pin X.Y.Z (`pinSource` `release`) and so
#   are exported as they are, installing X.Y.Z from npm. The tag is on a commit on top of the
#   mirror's `bX.Y.Z` (the export names its ref, so it never equals the branch's own); it never
#   moves the branch itself, and a mirror tag that already holds different content fails the run rather than
#   being moved.
# - `latest`, the mirror's default branch: moves only on a release, to the tagged seeds (and only
#   when no newer release is already tagged there, checked again on every push attempt, so two tag
#   runs in flight cannot leave it on the older, and once npm serves the release's packages), so it
#   always installs from published packages.
#   It is never synced from a push to ag-charts `latest`.
#
# Each sync replaces the mirror branch's content with export-seed-mirror.mjs's output and commits
# only when something changed, so a run that does not change the seeds is a no-op. A new mirror
# branch starts from the mirror's `latest`. The mirror is never read back.

on:
    push:
        branches:
            - 'b[0-9][0-9]?.[0-9][0-9]?.[0-9][0-9]?'
        tags:
            - 'release-*'
    # ci.yml calls this after the staging deploy, for the commit that was deployed.
    workflow_call:
        inputs:
            target:
                description: 'What to sync from the calling ref: staging'
                type: string
                required: true
    # Re-syncs a release branch or a release tag from the ref the run is started on.
    workflow_dispatch:

# One run per ref at a time. A branch and its release tag can still sync the same mirror branch
# together; the push step rebuilds and retries when the other got there first. Named outright
# rather than from `github.workflow`, which is the caller's name ("CI") when ci.yml calls this and
# would put the called workflow in the caller's own group.
concurrency:
    group: demo-seeds-mirror-${{ inputs.target || github.ref }}
    cancel-in-progress: false

permissions:
    contents: read

env:
    DEPLOYMENT_APP_ID: 957224
    MIRROR_REPOSITORY: ag-grid/ag-charts-demos

jobs:
    mirror:
        if: github.repository == 'ag-grid/ag-charts'
        runs-on: ubuntu-latest
        timeout-minutes: 30
        steps:
            - name: Checkout the seeds
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 1
                  sparse-checkout-cone-mode: false
                  sparse-checkout: |
                      /.nvmrc
                      /packages/ag-charts-community/LICENSE.txt
                      /packages/ag-charts-demos/seeds/
                      /packages/ag-charts-demos/src/
                      /packages/ag-charts-demos/tools/seeds/
                      /packages/ag-charts-website/src/constants.ts

            - name: Resolve the mirror branch
              id: target
              env:
                  REF_TYPE: ${{ github.ref_type }}
                  REF_NAME: ${{ github.ref_name }}
                  TARGET: ${{ inputs.target }}
              run: |
                  set -euo pipefail
                  if [ ! -d packages/ag-charts-demos/seeds ]; then
                      echo "No seeds at ${REF_NAME}; nothing to mirror." | tee -a "$GITHUB_STEP_SUMMARY"
                      echo "skip=true" >> "$GITHUB_OUTPUT"
                      exit 0
                  fi
                  # The sites whose tarballs the seeds install, read from the website's constants
                  # rather than repeated here: staging's origin, and production's base (/charts).
                  constant() {
                      sed -n "s/^export const $1 = '\([^']*\)'.*/\1/p" packages/ag-charts-website/src/constants.ts
                  }
                  if [ "$REF_TYPE" = tag ]; then
                      # The tagged seeds pin the release, which npm serves: no tarballs.
                      echo "branch=b${REF_NAME#release-}" >> "$GITHUB_OUTPUT"
                      echo "tag=${REF_NAME}" >> "$GITHUB_OUTPUT"
                  elif [ "$TARGET" = staging ]; then
                      site=$(constant STAGING_SITE_URL)
                      [ -n "$site" ] || { echo "::error::Cannot read STAGING_SITE_URL from packages/ag-charts-website/src/constants.ts"; exit 1; }
                      echo "branch=staging" >> "$GITHUB_OUTPUT"
                      echo "charts-build=${site%/}/npm-packages" >> "$GITHUB_OUTPUT"
                  elif [ -n "$TARGET" ]; then
                      echo "::error::Unknown target '${TARGET}'; the only one is 'staging'."
                      exit 1
                  elif [[ "$REF_NAME" =~ ^b([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
                      site=$(constant PRODUCTION_CHARTS_SITE_URL)
                      [ -n "$site" ] || { echo "::error::Cannot read PRODUCTION_CHARTS_SITE_URL from packages/ag-charts-website/src/constants.ts"; exit 1; }
                      echo "branch=${REF_NAME}" >> "$GITHUB_OUTPUT"
                      echo "charts-build=${site%/}/archive/${BASH_REMATCH[1]}/npm-packages" >> "$GITHUB_OUTPUT"
                  else
                      echo "::error::Nothing to mirror from ${REF_NAME}: the mirror's staging is synced by CI after the staging deploy, its bX.Y.Z by a push to (or a run on) that release branch, and its release-X.Y.Z and latest by a release tag."
                      exit 1
                  fi

            - name: Setup Node
              if: steps.target.outputs.skip != 'true'
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version-file: '.nvmrc'

            - name: Export the mirror tree
              if: steps.target.outputs.skip != 'true'
              env:
                  REF_NAME: ${{ github.ref_name }}
                  CHARTS_BUILD: ${{ steps.target.outputs.charts-build }}
              run: |
                  set -euo pipefail
                  args=(--out "$RUNNER_TEMP/export" --ref "$REF_NAME")
                  if [ -n "$CHARTS_BUILD" ]; then
                      args+=(--charts-build "$CHARTS_BUILD")
                  fi
                  node packages/ag-charts-demos/tools/seeds/export-seed-mirror.mjs "${args[@]}"

            - name: Mint mirror push token
              if: steps.target.outputs.skip != 'true'
              id: push-token
              uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
              with:
                  app-id: ${{ env.DEPLOYMENT_APP_ID }}
                  private-key: ${{ secrets.DEPLOYMENT_APP_PRIVATE_KEY }}
                  owner: ${{ github.repository_owner }}
                  repositories: ag-charts-demos

            - name: Sync the mirror
              if: steps.target.outputs.skip != 'true'
              env:
                  GH_TOKEN: ${{ steps.push-token.outputs.token }}
                  # The mirror token reaches only the mirror; this one reads ag-charts.
                  SOURCE_TOKEN: ${{ github.token }}
                  MIRROR_BRANCH: ${{ steps.target.outputs.branch }}
                  MIRROR_TAG: ${{ steps.target.outputs.tag }}
                  SOURCE: ${{ github.repository }}@${{ github.sha }} (${{ github.ref_name }})
              run: |
                  set -euo pipefail
                  export="$RUNNER_TEMP/export"
                  remote="https://x-access-token:${GH_TOKEN}@github.com/${MIRROR_REPOSITORY}.git"
                  git clone --quiet "$remote" "$RUNNER_TEMP/mirror"
                  cd "$RUNNER_TEMP/mirror"
                  git config user.name 'github-actions[bot]'
                  git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

                  # Checks out mirror branch $1 (or where a new one starts), lays the export over it
                  # and commits the difference, if any. It does not fetch: it builds on what the
                  # caller's last fetch saw, so a check made after that fetch holds for the build's
                  # parent.
                  build() {
                      local branch="$1"
                      if git rev-parse --verify --quiet "refs/remotes/origin/${branch}" > /dev/null; then
                          git checkout --quiet -B "$branch" "origin/${branch}"
                      elif git rev-parse --verify --quiet refs/remotes/origin/latest > /dev/null; then
                          git checkout --quiet -B "$branch" origin/latest
                      else
                          # The mirror is still empty: this is its first commit.
                          git checkout --quiet --orphan "$branch"
                      fi
                      # --checksum: rsync's default quick check skips a file whose size and modification
                      # time (to the second) match, and a checkout just made can match an export
                      # written moments earlier.
                      rsync -a --checksum --delete --exclude .git "$export/" ./
                      git add -A
                      if git diff --cached --quiet && git rev-parse --verify --quiet HEAD > /dev/null; then
                          echo "Mirror ${branch} already matches ${SOURCE}."
                      else
                          git commit --quiet -m "Sync from ${SOURCE}"
                      fi
                  }

                  # The newest release (as a version) tagged in the mirror, as of the last fetch.
                  newest_release() {
                      git tag --list 'release-*' | sed 's/^release-//' | { grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' || true; } | sort -V | tail -n 1
                  }

                  # Whether mirror `staging` already holds a commit of ag-charts `latest` that is
                  # ahead of the one being synced. A re-run of an older commit's failed job would
                  # otherwise fast-forward staging back over a newer deployment, whose tarballs the
                  # site now serves in place of this commit's. The last synced commit is the one
                  # named in the mirror branch's head message; a run that changed nothing commits
                  # nothing, so that is the last commit that changed the seeds, which can only make
                  # this guard miss a stale run, never block a current one.
                  staging_is_ahead() {
                      local synced status
                      synced=$(git log -1 --format=%s "origin/${MIRROR_BRANCH}" 2> /dev/null | sed -n 's|^Sync from [^@]*@\([0-9a-f]\{40\}\) .*|\1|p')
                      if [ -z "$synced" ] || [ "$synced" = "$GITHUB_SHA" ]; then
                          return 1
                      fi
                      status=$(GH_TOKEN="$SOURCE_TOKEN" gh api "repos/${GITHUB_REPOSITORY}/compare/${GITHUB_SHA}...${synced}" --jq .status)
                      [ "$status" = ahead ]
                  }

                  # Builds mirror branch $1 and pushes it, rebuilding on the mirror's new head when
                  # another run got there first. With $2 set, the branch moves only while the release
                  # being synced is the newest tagged in the mirror, checked again on every attempt
                  # against the same fetch that the build then uses as its parent: a run for a newer
                  # release tags before it moves the branch, so either the fetch sees that tag, or the
                  # branch is still where the fetch saw it and a push over it is rejected once the
                  # newer run has moved it, which is followed by a check that sees the tag.
                  sync_branch() {
                      local branch="$1" only_if_newest="${2:-}" attempt newest
                      for attempt in 1 2 3; do
                          git fetch --quiet --prune --tags origin
                          if [ "$branch" = staging ] && staging_is_ahead; then
                              echo "Mirror staging left as it is: it already holds a commit newer than ${SOURCE}." | tee -a "$GITHUB_STEP_SUMMARY"
                              return 0
                          fi
                          if [ -n "$only_if_newest" ]; then
                              newest=$(newest_release)
                              if [ "$(printf '%s\n%s\n' "${MIRROR_TAG#release-}" "$newest" | sort -V | tail -n 1)" != "${MIRROR_TAG#release-}" ]; then
                                  echo "Mirror ${branch} left as it is: ${MIRROR_TAG} is older than the newest release tagged there (release-${newest})." | tee -a "$GITHUB_STEP_SUMMARY"
                                  return 0
                              fi
                          fi
                          build "$branch"
                          if git push --quiet origin "HEAD:refs/heads/${branch}"; then
                              break
                          fi
                          if [ "$attempt" = 3 ]; then
                              echo "::error::Could not push ${branch} to ${MIRROR_REPOSITORY} after 3 attempts"
                              exit 1
                          fi
                          echo "Push rejected; rebuilding on the mirror's new head (attempt ${attempt})."
                          sleep $((attempt * 5))
                      done
                      echo "Synced ${MIRROR_REPOSITORY} ${branch} to $(git rev-parse HEAD) from ${SOURCE}." >> "$GITHUB_STEP_SUMMARY"
                  }

                  if [ -z "$MIRROR_TAG" ]; then
                      sync_branch "$MIRROR_BRANCH"
                      exit 0
                  fi

                  # A tag run pushes the tag, and moves the mirror's default branch (below); it never
                  # moves the release branch, which may already carry fixes made after the release
                  # that re-running an older tag must not undo. The tag lands on the branch head if
                  # that happens to hold the tagged content, and on a commit on top of it otherwise. The
                  # tagged seeds pin the release, so the export is the same whether or not the
                  # branch's own push has synced them yet.
                  git fetch --quiet --prune --tags origin
                  build "$MIRROR_BRANCH"
                  head=$(git rev-parse HEAD)
                  existing=$(git ls-remote origin "refs/tags/${MIRROR_TAG}" | cut -f1)
                  if [ -n "$existing" ]; then
                      if [ "$(git rev-parse "${existing}^{tree}")" != "$(git rev-parse "HEAD^{tree}")" ]; then
                          echo "::error::${MIRROR_REPOSITORY} tag ${MIRROR_TAG} (${existing}) holds different content from ${SOURCE}; tags are never moved"
                          exit 1
                      fi
                      echo "Tag ${MIRROR_TAG} already holds ${SOURCE}."
                  else
                      git tag "$MIRROR_TAG" "$head"
                      git push --quiet origin "refs/tags/${MIRROR_TAG}"
                      echo "Tagged ${MIRROR_REPOSITORY} ${head} as ${MIRROR_TAG} from ${SOURCE}." >> "$GITHUB_STEP_SUMMARY"
                  fi

                  # The packages the tagged seeds install must be on npm before the default branch
                  # moves to them: this run starts with the tag, which prod-release.yml publishes from
                  # in parallel and takes minutes to build and validate first. If publication fails
                  # or is late the run fails with the branch untouched, and is re-run once it lands.
                  wait_for_npm() {
                      local version="${MIRROR_TAG#release-}" packages pending package attempt
                      packages=$({ grep -rhoE '"ag-charts-[a-z0-9-]+"[[:space:]]*:' "$export" --include=package.json || true; } | sed 's/^"\([^"]*\)".*$/\1/' | sort -u)
                      for attempt in $(seq 1 40); do
                          pending=""
                          for package in $packages; do
                              if [ -z "$(npm view "${package}@${version}" version 2> /dev/null)" ]; then
                                  pending="${pending} ${package}"
                              fi
                          done
                          if [ -z "$pending" ]; then
                              return 0
                          fi
                          echo "Waiting for npm to serve ${version} of:${pending} (attempt ${attempt} of 40)"
                          sleep 30
                      done
                      echo "::error::Mirror latest not moved: ${version} is not on npm for:${pending}. Re-run this job once the release is published."
                      exit 1
                  }

                  # The mirror's default branch moves only here, to the released seeds, so it always
                  # installs published packages. Only to the newest release tagged in the mirror: a
                  # hotfix tagged on an older line must not move it back, whichever of two runs for
                  # different releases gets here first. This also runs when the tag already existed,
                  # so a run that tagged but failed to move the branch can be re-run.
                  wait_for_npm
                  sync_branch latest newest
