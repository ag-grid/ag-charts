name: Jira Agent Pipeline

# ============================================================================
# End-to-end Jira -> GHA agent pipeline. Three stages, one workflow:
#
#   triage      — /fr --ci --phase 0..1 <KEY>            (intent / research / plan)
#   build       — /fr --ci --phase 2..5 --resume --draft-pr <KEY>
#   pr-iterate  — /fr --ci --pr-iterate <KEY>
#
# Each stage is its own job, gated on the dispatch event_type or the
# workflow_dispatch `stage` input. All three share the same access-chain
# setup (.github/actions/setup-jira-agent) and the same writeback wiring
# (status / state / cost / branch-PR).
#
# ----------------------------------------------------------------------------
# Trigger envelopes
# ----------------------------------------------------------------------------
#
#   workflow_dispatch:
#       gh workflow run jira-agent-pipeline.yml -f issue_key=AG-XXXXX -f stage=triage
#
#   repository_dispatch (from Jira Automation):
#       POST /repos/ag-grid/ag-charts/dispatches
#       Authorization: Bearer <installation-token>
#       Body:
#         {"event_type":"jira-triage",     "client_payload":{"issue_key":"AG-XXXXX"}}
#         {"event_type":"jira-build",      "client_payload":{"issue_key":"AG-XXXXX"}}
#         {"event_type":"jira-pr-iterate", "client_payload":{"issue_key":"AG-XXXXX"}}
#
# ----------------------------------------------------------------------------
# Custom-field mapping (operator-side already created)
# ----------------------------------------------------------------------------
#
#   customfield_10941  AI Cost      number       (read-modify-write per job)
#   customfield_10942  AI status    select       (triaging | awaiting-clarity |
#                                                  building | draft-pr-open  |
#                                                  pr-iterating | done | failed)
#   customfield_10943  AI research  textarea  <-> research.md
#   customfield_10944  AI intent    textarea  <-> intent.md
#   customfield_10945  AI plan      textarea  <-> plan.md
#   customfield_10946  AI branch    textfield    (build job populates)
#   customfield_10947  AI PR URL    textfield    (build job populates)
#
# ----------------------------------------------------------------------------
# Per-job step skeleton
# ----------------------------------------------------------------------------
#
#   setup-jira-agent            (composite — checkout + token + Nx + MCP)
#   jira-status-writeback       (mode: pre-job → triaging|building|pr-iterating)
#   jira-state-sync             (mode: pull   ← textarea fields → fr-state/)
#   anthropics/claude-code-action@v1
#   jira-state-sync             (mode: push   → fr-state/ → textarea fields; always)
#   jira-pr-writeback           (build only; always — branch + PR URL)
#   jira-cost-writeback         (always — total_cost_usd from trace)
#   jira-status-writeback       (mode: post-job → next-state OR failed; always)
#   upload-artifact             (claude trace; always)
#
# ----------------------------------------------------------------------------
# Operator pre-requisites
# ----------------------------------------------------------------------------
#
#   Repository secrets:
#       JIRA_AGENT_APP_PRIVATE_KEY  - GitHub App PEM
#       ANTHROPIC_API_KEY           - Anthropic Enterprise admin key
#       JIRA_API_TOKEN              - Atlassian API token (service account)
#       JIRA_EMAIL                  - Service-account email
#
#   Repository variables:
#       JIRA_AGENT_APP_ID           - GitHub App ID
#       JIRA_SITE_URL               - https://ag-grid.atlassian.net
#
#   GitHub App `ag-grid-jira-agents` installed on:
#       ag-grid/ag-charts            (contents:write, issues:write, pull-requests:write, actions:write)
#       ag-grid/ag-dev-prompts       (contents:read)
# ============================================================================

on:
    repository_dispatch:
        types: [jira-triage, jira-build, jira-pr-iterate]
    workflow_dispatch:
        inputs:
            issue_key:
                description: 'JIRA issue key (e.g. AG-12345)'
                type: string
                required: true
            stage:
                description: 'Pipeline stage to run'
                type: choice
                required: true
                default: triage
                options:
                    - triage
                    - build
                    - pr-iterate

permissions:
    contents: read

concurrency:
    group: claude-${{ github.event.client_payload.issue_key || inputs.issue_key }}
    cancel-in-progress: false

env:
    ISSUE_KEY: ${{ github.event.client_payload.issue_key || inputs.issue_key }}
    # Single source of truth for the stage discriminator used by `if:` gates
    # below. `repository_dispatch.action` is the event type name; workflow
    # dispatch has its own `stage` input. We can't compute this once into
    # a job-level output without an upstream job, so each gate evaluates
    # the same expression directly.

jobs:
    # -------------------------------------------------------------------- triage
    triage:
        if: |
            (github.event_name == 'repository_dispatch' && github.event.action == 'jira-triage') ||
            (github.event_name == 'workflow_dispatch'   && inputs.stage == 'triage')
        runs-on: ubuntu-latest
        timeout-minutes: 30
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 1

            - id: setup
              uses: ./.github/actions/setup-jira-agent
              with:
                  issue_key: ${{ env.ISSUE_KEY }}
                  jira_agent_app_id: ${{ vars.JIRA_AGENT_APP_ID }}
                  jira_agent_app_private_key: ${{ secrets.JIRA_AGENT_APP_PRIVATE_KEY }}
                  jira_email: ${{ secrets.JIRA_EMAIL }}
                  jira_api_token: ${{ secrets.JIRA_API_TOKEN }}
                  jira_site_url: ${{ vars.JIRA_SITE_URL }}

            - uses: ./.github/actions/jira-status-writeback
              with:
                  issue_key: ${{ env.ISSUE_KEY }}
                  mode: pre-job
                  stage: triage
                  jira_email: ${{ secrets.JIRA_EMAIL }}
                  jira_api_token: ${{ secrets.JIRA_API_TOKEN }}
                  jira_site_url: ${{ vars.JIRA_SITE_URL }}

            - uses: ./.github/actions/jira-state-sync
              with:
                  issue_key: ${{ env.ISSUE_KEY }}
                  mode: pull
                  jira_email: ${{ secrets.JIRA_EMAIL }}
                  jira_api_token: ${{ secrets.JIRA_API_TOKEN }}
                  jira_site_url: ${{ vars.JIRA_SITE_URL }}

            - name: Run /fr --ci --phase 0..1 (triage)
              id: claude
              uses: anthropics/claude-code-action@v1
              with:
                  anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
                  github_token: ${{ steps.setup.outputs.app_token }}
                  show_full_output: 'true'
                  plugin_marketplaces: https://github.com/ag-grid/ag-dev-prompts.git
                  plugins: |
                      ag-eng@ag-dev
                      ag-product@ag-dev
                  claude_args: |
                      --mcp-config ${{ steps.setup.outputs.mcp_config }}
                      --max-turns 12
                      --debug
                      --permission-mode acceptEdits
                      --allowed-tools mcp__atlassian__getJiraIssue,mcp__atlassian__addCommentToJiraIssue,mcp__atlassian__getTransitionsForJiraIssue,mcp__atlassian__transitionJiraIssue,mcp__atlassian__addAttachmentToJiraIssue
                  prompt: |
                      Invoke /fr --ci --phase 0..1 ${{ env.ISSUE_KEY }}

                      Context:
                        - JIRA ticket: ${{ env.ISSUE_KEY }}
                        - Actions run URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
                        - Prior-run state (if any) is in ${{ runner.temp }}/fr-state/
                          as intent.md / research.md / plan.md. Write any updated
                          state files to that same directory before exiting; the
                          workflow round-trips them to Jira textarea custom fields
                          (AI intent / AI research / AI plan) after you finish.
                          Do not call addAttachmentToJiraIssue for these files.
                        - The Atlassian MCP server is the in-repo shim — it
                          exposes the operation names referenced in modes/ci.md
                          (getJiraIssue, addCommentToJiraIssue,
                          getTransitionsForJiraIssue, transitionJiraIssue,
                          addAttachmentToJiraIssue). No other Jira tools are
                          available. Phases 2..5 are out of scope.

            - if: always()
              uses: ./.github/actions/jira-state-sync
              with:
                  issue_key: ${{ env.ISSUE_KEY }}
                  mode: push
                  jira_email: ${{ secrets.JIRA_EMAIL }}
                  jira_api_token: ${{ secrets.JIRA_API_TOKEN }}
                  jira_site_url: ${{ vars.JIRA_SITE_URL }}

            - if: always()
              uses: ./.github/actions/jira-cost-writeback
              with:
                  issue_key: ${{ env.ISSUE_KEY }}
                  jira_email: ${{ secrets.JIRA_EMAIL }}
                  jira_api_token: ${{ secrets.JIRA_API_TOKEN }}
                  jira_site_url: ${{ vars.JIRA_SITE_URL }}

            - if: always()
              uses: ./.github/actions/jira-status-writeback
              with:
                  issue_key: ${{ env.ISSUE_KEY }}
                  mode: post-job
                  stage: triage
                  outcome: ${{ job.status }}
                  jira_email: ${{ secrets.JIRA_EMAIL }}
                  jira_api_token: ${{ secrets.JIRA_API_TOKEN }}
                  jira_site_url: ${{ vars.JIRA_SITE_URL }}

            - name: Upload Claude trace artefact
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: claude-trace-${{ env.ISSUE_KEY }}-triage-${{ github.run_id }}
                  path: |
                      ${{ runner.temp }}/trace.json
                      ${{ runner.temp }}/claude-execution-output.json
                      ${{ runner.temp }}/claude-prompts/
                      ${{ runner.temp }}/fr-state/
                  if-no-files-found: warn
                  retention-days: 14

    # -------------------------------------------------------------------- build
    build:
        if: |
            (github.event_name == 'repository_dispatch' && github.event.action == 'jira-build') ||
            (github.event_name == 'workflow_dispatch'   && inputs.stage == 'build')
        runs-on: ubuntu-latest
        timeout-minutes: 60
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 1

            - id: setup
              uses: ./.github/actions/setup-jira-agent
              with:
                  issue_key: ${{ env.ISSUE_KEY }}
                  jira_agent_app_id: ${{ vars.JIRA_AGENT_APP_ID }}
                  jira_agent_app_private_key: ${{ secrets.JIRA_AGENT_APP_PRIVATE_KEY }}
                  jira_email: ${{ secrets.JIRA_EMAIL }}
                  jira_api_token: ${{ secrets.JIRA_API_TOKEN }}
                  jira_site_url: ${{ vars.JIRA_SITE_URL }}

            - uses: ./.github/actions/jira-status-writeback
              with:
                  issue_key: ${{ env.ISSUE_KEY }}
                  mode: pre-job
                  stage: build
                  jira_email: ${{ secrets.JIRA_EMAIL }}
                  jira_api_token: ${{ secrets.JIRA_API_TOKEN }}
                  jira_site_url: ${{ vars.JIRA_SITE_URL }}

            - uses: ./.github/actions/jira-state-sync
              with:
                  issue_key: ${{ env.ISSUE_KEY }}
                  mode: pull
                  jira_email: ${{ secrets.JIRA_EMAIL }}
                  jira_api_token: ${{ secrets.JIRA_API_TOKEN }}
                  jira_site_url: ${{ vars.JIRA_SITE_URL }}

            - name: Run /fr --ci --phase 2..5 --resume --draft-pr (build)
              id: claude
              uses: anthropics/claude-code-action@v1
              with:
                  anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
                  github_token: ${{ steps.setup.outputs.app_token }}
                  show_full_output: 'true'
                  plugin_marketplaces: https://github.com/ag-grid/ag-dev-prompts.git
                  plugins: |
                      ag-eng@ag-dev
                      ag-product@ag-dev
                  claude_args: |
                      --mcp-config ${{ steps.setup.outputs.mcp_config }}
                      --max-turns 60
                      --debug
                      --permission-mode acceptEdits
                      --allowed-tools mcp__atlassian__getJiraIssue,mcp__atlassian__addCommentToJiraIssue,mcp__atlassian__getTransitionsForJiraIssue,mcp__atlassian__transitionJiraIssue,mcp__atlassian__addAttachmentToJiraIssue
                  prompt: |
                      Invoke /fr --ci --phase 2..5 --resume --draft-pr ${{ env.ISSUE_KEY }}

                      Context:
                        - JIRA ticket: ${{ env.ISSUE_KEY }}
                        - Actions run URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
                        - Prior-run state is in ${{ runner.temp }}/fr-state/
                          (intent.md / research.md / plan.md). Use --resume.
                          Write any updates to the same files; the workflow
                          round-trips them to Jira after you exit. Do not call
                          addAttachmentToJiraIssue for these files.
                        - Phase 4 is skipped; --draft-pr opens the PR in draft.

            - if: always()
              uses: ./.github/actions/jira-state-sync
              with:
                  issue_key: ${{ env.ISSUE_KEY }}
                  mode: push
                  jira_email: ${{ secrets.JIRA_EMAIL }}
                  jira_api_token: ${{ secrets.JIRA_API_TOKEN }}
                  jira_site_url: ${{ vars.JIRA_SITE_URL }}

            - if: always()
              uses: ./.github/actions/jira-pr-writeback
              with:
                  issue_key: ${{ env.ISSUE_KEY }}
                  github_token: ${{ steps.setup.outputs.app_token }}
                  jira_email: ${{ secrets.JIRA_EMAIL }}
                  jira_api_token: ${{ secrets.JIRA_API_TOKEN }}
                  jira_site_url: ${{ vars.JIRA_SITE_URL }}

            - if: always()
              uses: ./.github/actions/jira-cost-writeback
              with:
                  issue_key: ${{ env.ISSUE_KEY }}
                  jira_email: ${{ secrets.JIRA_EMAIL }}
                  jira_api_token: ${{ secrets.JIRA_API_TOKEN }}
                  jira_site_url: ${{ vars.JIRA_SITE_URL }}

            - if: always()
              uses: ./.github/actions/jira-status-writeback
              with:
                  issue_key: ${{ env.ISSUE_KEY }}
                  mode: post-job
                  stage: build
                  outcome: ${{ job.status }}
                  jira_email: ${{ secrets.JIRA_EMAIL }}
                  jira_api_token: ${{ secrets.JIRA_API_TOKEN }}
                  jira_site_url: ${{ vars.JIRA_SITE_URL }}

            - name: Upload Claude trace artefact
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: claude-trace-${{ env.ISSUE_KEY }}-build-${{ github.run_id }}
                  path: |
                      ${{ runner.temp }}/trace.json
                      ${{ runner.temp }}/claude-execution-output.json
                      ${{ runner.temp }}/claude-prompts/
                      ${{ runner.temp }}/fr-state/
                  if-no-files-found: warn
                  retention-days: 14

    # ---------------------------------------------------------------- pr-iterate
    pr-iterate:
        if: |
            (github.event_name == 'repository_dispatch' && github.event.action == 'jira-pr-iterate') ||
            (github.event_name == 'workflow_dispatch'   && inputs.stage == 'pr-iterate')
        runs-on: ubuntu-latest
        timeout-minutes: 60
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 1

            - id: setup
              uses: ./.github/actions/setup-jira-agent
              with:
                  issue_key: ${{ env.ISSUE_KEY }}
                  jira_agent_app_id: ${{ vars.JIRA_AGENT_APP_ID }}
                  jira_agent_app_private_key: ${{ secrets.JIRA_AGENT_APP_PRIVATE_KEY }}
                  jira_email: ${{ secrets.JIRA_EMAIL }}
                  jira_api_token: ${{ secrets.JIRA_API_TOKEN }}
                  jira_site_url: ${{ vars.JIRA_SITE_URL }}

            - uses: ./.github/actions/jira-status-writeback
              with:
                  issue_key: ${{ env.ISSUE_KEY }}
                  mode: pre-job
                  stage: pr-iterate
                  jira_email: ${{ secrets.JIRA_EMAIL }}
                  jira_api_token: ${{ secrets.JIRA_API_TOKEN }}
                  jira_site_url: ${{ vars.JIRA_SITE_URL }}

            - uses: ./.github/actions/jira-state-sync
              with:
                  issue_key: ${{ env.ISSUE_KEY }}
                  mode: pull
                  jira_email: ${{ secrets.JIRA_EMAIL }}
                  jira_api_token: ${{ secrets.JIRA_API_TOKEN }}
                  jira_site_url: ${{ vars.JIRA_SITE_URL }}

            - name: Run /fr --ci --pr-iterate (pr-iterate)
              id: claude
              uses: anthropics/claude-code-action@v1
              with:
                  anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
                  github_token: ${{ steps.setup.outputs.app_token }}
                  show_full_output: 'true'
                  plugin_marketplaces: https://github.com/ag-grid/ag-dev-prompts.git
                  plugins: |
                      ag-eng@ag-dev
                      ag-product@ag-dev
                  claude_args: |
                      --mcp-config ${{ steps.setup.outputs.mcp_config }}
                      --max-turns 60
                      --debug
                      --permission-mode acceptEdits
                      --allowed-tools mcp__atlassian__getJiraIssue,mcp__atlassian__addCommentToJiraIssue,mcp__atlassian__getTransitionsForJiraIssue,mcp__atlassian__transitionJiraIssue,mcp__atlassian__addAttachmentToJiraIssue
                  prompt: |
                      Invoke /fr --ci --pr-iterate ${{ env.ISSUE_KEY }}

                      Context:
                        - JIRA ticket: ${{ env.ISSUE_KEY }}
                        - Actions run URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
                        - Prior-run state is in ${{ runner.temp }}/fr-state/
                          (intent.md / research.md / plan.md). Write any updates
                          to the same files; the workflow round-trips them to
                          Jira after you exit. Do not call addAttachmentToJiraIssue
                          for these files.

            - if: always()
              uses: ./.github/actions/jira-state-sync
              with:
                  issue_key: ${{ env.ISSUE_KEY }}
                  mode: push
                  jira_email: ${{ secrets.JIRA_EMAIL }}
                  jira_api_token: ${{ secrets.JIRA_API_TOKEN }}
                  jira_site_url: ${{ vars.JIRA_SITE_URL }}

            - if: always()
              uses: ./.github/actions/jira-pr-writeback
              with:
                  issue_key: ${{ env.ISSUE_KEY }}
                  github_token: ${{ steps.setup.outputs.app_token }}
                  jira_email: ${{ secrets.JIRA_EMAIL }}
                  jira_api_token: ${{ secrets.JIRA_API_TOKEN }}
                  jira_site_url: ${{ vars.JIRA_SITE_URL }}

            - if: always()
              uses: ./.github/actions/jira-cost-writeback
              with:
                  issue_key: ${{ env.ISSUE_KEY }}
                  jira_email: ${{ secrets.JIRA_EMAIL }}
                  jira_api_token: ${{ secrets.JIRA_API_TOKEN }}
                  jira_site_url: ${{ vars.JIRA_SITE_URL }}

            - if: always()
              uses: ./.github/actions/jira-status-writeback
              with:
                  issue_key: ${{ env.ISSUE_KEY }}
                  mode: post-job
                  stage: pr-iterate
                  outcome: ${{ job.status }}
                  jira_email: ${{ secrets.JIRA_EMAIL }}
                  jira_api_token: ${{ secrets.JIRA_API_TOKEN }}
                  jira_site_url: ${{ vars.JIRA_SITE_URL }}

            - name: Upload Claude trace artefact
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: claude-trace-${{ env.ISSUE_KEY }}-pr-iterate-${{ github.run_id }}
                  path: |
                      ${{ runner.temp }}/trace.json
                      ${{ runner.temp }}/claude-execution-output.json
                      ${{ runner.temp }}/claude-prompts/
                      ${{ runner.temp }}/fr-state/
                  if-no-files-found: warn
                  retention-days: 14
