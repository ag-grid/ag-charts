name: Jira Agent Pipeline

# ============================================================================
# End-to-end Jira -> GHA agent pipeline. Stages, one workflow:
#
#   triage              — /fr --ci --phase 0..1 <KEY>            (intent / research / plan)
#   build               — /fr --ci --phase 2..5 --resume --draft-pr <KEY>
#   pr-iterate          — /fr --ci --pr-iterate <KEY>                              (review-comment driven)
#   ci-failure-iterate  — /fr --ci --pr-iterate --ci-failure <run_url> <KEY>       (main-CI failure driven)
#   recycle             — /fr --ci --recycle --prior <merged|abandoned> <KEY>      (new -rN PR after prior PR merged/closed)
#
# A single `→ In Progress` JIRA rule dispatches `jira-resume`; the cheap
# `resume-preflight` job reads AI pr-url + the PR's GitHub state and routes to
# one of resume-build / resume-iterate / resume-recycle (no AI-status guard in
# the rule — the preflight does the disambiguation JIRA can't, since it can see
# whether the PR is open / merged / closed). See ag-dev-prompts
# docs/jira-agent-pipeline.md §"Re-engagement after Needs Review".
#
# Each stage is its own job, gated on the dispatch event_type, the
# workflow_dispatch `stage` input, the `resume-preflight` route output, or —
# for ci-failure-iterate — the `workflow_run.completed` event on main CI.
#
# The heavy lifting (App-token mint, MCP setup, status/state/PR/cost
# writebacks, Claude invocation, trace digest, artefact upload) lives in
# the shared `jira-pipeline` composite action under ag-dev-prompts. This
# workflow is the thin per-repo stub: it owns triggers, eligibility
# gating, and the consumer-local prerequisite (setup-nx, which renders
# .claude/settings.json for the shared action to verify).
#
# Consumption channel: ag-dev-prompts is a private repo, so the shared
# actions are pulled via the @ag-grid/dev-prompts npm package on GitHub
# Packages (see `install-ag-dev-prompts` and the `pr-review.yml` workflow
# which uses the same pattern). ag-charts tracks the `canary` dist-tag
# during the in-flight rollout; ag-grid + ag-studio will pin to `latest`.
#
# ----------------------------------------------------------------------------
# Trigger envelopes
# ----------------------------------------------------------------------------
#
#   workflow_dispatch:
#       gh workflow run jira-agent-pipeline.yml -f issue_key=AG-XXXXX -f stage=triage
#
#   repository_dispatch (from Jira Automation):
#       POST /repos/ag-grid/ag-charts/dispatches
#       Authorization: Bearer <installation-token>
#       Body:
#         {"event_type":"jira-triage",     "client_payload":{"issue_key":"AG-XXXXX"}}
#         {"event_type":"jira-build",      "client_payload":{"issue_key":"AG-XXXXX"}}
#         {"event_type":"jira-pr-iterate", "client_payload":{"issue_key":"AG-XXXXX"}}
#
#   workflow_run (auto — fires when the main CI workflow completes on
#       an agent-shaped branch. The `branches:` filter on the trigger
#       restricts firings to `ghabot-ag-*` so non-AI PRs don't create
#       skipped workflow runs in the history):
#       ci-failure-preflight → ci-failure-iterate (on conclusion=failure)
#       ci-success-handler                        (on conclusion=success)
#       Gates inside both jobs:
#         - workflow_run.head_branch matches 'ghabot-ag-<NNNNN>-<slug>'
#         - PR author == 'ag-jira-agent-ci[bot]'                   (agent-authored)
#         - issue's AI status ∈ {draft-pr-open, iterating, pr-iterating}
#
# ----------------------------------------------------------------------------
# Custom-field mapping (operator-side already created)
# ----------------------------------------------------------------------------
#
# The shared action's repo-config.yml maps `ag-grid/ag-charts` to the AG
# JIRA project's custom-field ids (customfield_10941..10988). See
# ag-grid/ag-dev-prompts → .github/actions/jira-pipeline/repo-config.yml.
#
# ----------------------------------------------------------------------------
# Operator pre-requisites
# ----------------------------------------------------------------------------
#
#   Repository secrets:
#       JIRA_AGENT_APP_PRIVATE_KEY  - GitHub App PEM
#       ANTHROPIC_API_KEY           - Anthropic Enterprise admin key
#       JIRA_API_TOKEN              - Atlassian API token (service account)
#       JIRA_EMAIL                  - Service-account email
#
#   Repository variables:
#       JIRA_AGENT_APP_ID           - GitHub App ID
#       JIRA_SITE_URL               - https://ag-grid.atlassian.net
#
#   GitHub App `ag-grid-jira-agents` installed on:
#       ag-grid/ag-charts            (contents:write, issues:write, pull-requests:write, actions:write)
#       ag-grid/ag-dev-prompts       (contents:read)
# ============================================================================

on:
    repository_dispatch:
        types: [jira-triage, jira-build, jira-pr-iterate, jira-resume]
    workflow_dispatch:
        inputs:
            issue_key:
                description: 'JIRA issue key (e.g. AG-12345)'
                type: string
                required: true
            stage:
                description: 'Pipeline stage to run'
                type: choice
                required: true
                default: triage
                options:
                    - triage
                    - build
                    - pr-iterate
                    - recycle
    workflow_run:
        # Auto-react when the main CI workflow completes on an agent-authored
        # branch — failure → ci-failure-iterate, success → ci-success-handler
        # (Needs-Review transition). The `branches:` filter restricts firings
        # at the trigger level so non-AI PR completions don't create skipped
        # workflow runs in the Actions history. The agent branch shape is
        # `ghabot-ag-<NNNNN>-<slug>` (see ag-dev-prompts modes/ci.md). Globs
        # are case-sensitive, but the agent always produces lowercase.
        workflows: [CI]
        types: [completed]
        branches: ['ghabot-ag-*']

permissions:
    contents: read

concurrency:
    # For workflow_run events the dispatch payloads are empty, so fall back
    # to the failing run's head branch (which encodes the issue key in the
    # agent branch shape: `ghabot-ag-<NNNNN>-<slug>`). Same group as the
    # dispatch-driven jobs so a fresh CI-failure iteration queues behind any
    # in-flight pr-iterate for the same ticket instead of interleaving.
    group: claude-${{ github.event.client_payload.issue_key || inputs.issue_key || github.event.workflow_run.head_branch }}
    cancel-in-progress: false

env:
    ISSUE_KEY: ${{ github.event.client_payload.issue_key || inputs.issue_key }}
    DEV_PROMPTS_CHANNEL: canary

jobs:
    # -------------------------------------------------------------------- triage
    triage:
        if: |
            (github.event_name == 'repository_dispatch' && github.event.action == 'jira-triage') ||
            (github.event_name == 'workflow_dispatch'   && inputs.stage == 'triage')
        runs-on: ubuntu-latest
        timeout-minutes: 30
        permissions:
            contents: read
            packages: read
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 1

            # Mint a read token for ag-dev-prompts so setup-nx's postinstall
            # (rulesync-fetch) can clone the private prompts repo and render
            # .claude/settings.json. The orchestrator mints its own token for
            # its own broader scopes; this one is read-only for fetch.sh.
            - name: Mint ag-dev-prompts read token
              id: prompts-token
              uses: actions/create-github-app-token@v1
              with:
                  app-id: ${{ vars.JIRA_AGENT_APP_ID }}
                  private-key: ${{ secrets.JIRA_AGENT_APP_PRIVATE_KEY }}
                  owner: ag-grid
                  repositories: ag-dev-prompts

            - name: Setup Nx (renders .claude/settings.json)
              uses: ./.github/actions/setup-nx
              env:
                  GITHUB_TOKEN: ${{ steps.prompts-token.outputs.token }}
              with:
                  cache_mode: ro
                  fetch_base: skip

            - name: Install @ag-grid/dev-prompts
              uses: ./.github/actions/install-ag-dev-prompts
              with:
                  channel: ${{ env.DEV_PROMPTS_CHANNEL }}

            - uses: ./.ag-dev-prompts/node_modules/@ag-grid/dev-prompts/.github/actions/jira-pipeline
              with:
                  stage: triage
                  issue_key: ${{ env.ISSUE_KEY }}
                  jira_agent_app_id: ${{ vars.JIRA_AGENT_APP_ID }}
                  jira_agent_app_private_key: ${{ secrets.JIRA_AGENT_APP_PRIVATE_KEY }}
                  anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
                  jira_email: ${{ secrets.JIRA_EMAIL }}
                  jira_api_token: ${{ secrets.JIRA_API_TOKEN }}
                  jira_site_url: ${{ vars.JIRA_SITE_URL }}

    # -------------------------------------------------------------------- build
    build:
        if: |
            (github.event_name == 'repository_dispatch' && github.event.action == 'jira-build') ||
            (github.event_name == 'workflow_dispatch'   && inputs.stage == 'build')
        runs-on: ubuntu-latest
        timeout-minutes: 60
        permissions:
            contents: read
            packages: read
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 1

            - name: Mint ag-dev-prompts read token
              id: prompts-token
              uses: actions/create-github-app-token@v1
              with:
                  app-id: ${{ vars.JIRA_AGENT_APP_ID }}
                  private-key: ${{ secrets.JIRA_AGENT_APP_PRIVATE_KEY }}
                  owner: ag-grid
                  repositories: ag-dev-prompts

            - name: Setup Nx (renders .claude/settings.json)
              uses: ./.github/actions/setup-nx
              env:
                  GITHUB_TOKEN: ${{ steps.prompts-token.outputs.token }}
              with:
                  cache_mode: ro
                  fetch_base: skip

            - name: Install @ag-grid/dev-prompts
              uses: ./.github/actions/install-ag-dev-prompts
              with:
                  channel: ${{ env.DEV_PROMPTS_CHANNEL }}

            - uses: ./.ag-dev-prompts/node_modules/@ag-grid/dev-prompts/.github/actions/jira-pipeline
              with:
                  stage: build
                  issue_key: ${{ env.ISSUE_KEY }}
                  jira_agent_app_id: ${{ vars.JIRA_AGENT_APP_ID }}
                  jira_agent_app_private_key: ${{ secrets.JIRA_AGENT_APP_PRIVATE_KEY }}
                  anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
                  jira_email: ${{ secrets.JIRA_EMAIL }}
                  jira_api_token: ${{ secrets.JIRA_API_TOKEN }}
                  jira_site_url: ${{ vars.JIRA_SITE_URL }}

    # ---------------------------------------------------------------- pr-iterate
    pr-iterate:
        if: |
            (github.event_name == 'repository_dispatch' && github.event.action == 'jira-pr-iterate') ||
            (github.event_name == 'workflow_dispatch'   && inputs.stage == 'pr-iterate')
        runs-on: ubuntu-latest
        timeout-minutes: 60
        permissions:
            contents: read
            packages: read
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 1

            - name: Mint ag-dev-prompts read token
              id: prompts-token
              uses: actions/create-github-app-token@v1
              with:
                  app-id: ${{ vars.JIRA_AGENT_APP_ID }}
                  private-key: ${{ secrets.JIRA_AGENT_APP_PRIVATE_KEY }}
                  owner: ag-grid
                  repositories: ag-dev-prompts

            - name: Setup Nx (renders .claude/settings.json)
              uses: ./.github/actions/setup-nx
              env:
                  GITHUB_TOKEN: ${{ steps.prompts-token.outputs.token }}
              with:
                  cache_mode: ro
                  fetch_base: skip

            - name: Install @ag-grid/dev-prompts
              uses: ./.github/actions/install-ag-dev-prompts
              with:
                  channel: ${{ env.DEV_PROMPTS_CHANNEL }}

            - uses: ./.ag-dev-prompts/node_modules/@ag-grid/dev-prompts/.github/actions/jira-pipeline
              with:
                  stage: pr-iterate
                  issue_key: ${{ env.ISSUE_KEY }}
                  jira_agent_app_id: ${{ vars.JIRA_AGENT_APP_ID }}
                  jira_agent_app_private_key: ${{ secrets.JIRA_AGENT_APP_PRIVATE_KEY }}
                  anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
                  jira_email: ${{ secrets.JIRA_EMAIL }}
                  jira_api_token: ${{ secrets.JIRA_API_TOKEN }}
                  jira_site_url: ${{ vars.JIRA_SITE_URL }}

    # -------------------------------------------------- resume-preflight
    # The `→ In Progress` router. A single JIRA rule dispatches `jira-resume`
    # on every transition to In Progress; this cheap job reads the ticket's
    # AI pr-url + the named PR's GitHub state and emits the route the three
    # resume-* jobs below gate on. No App token, no agent — mirrors
    # ci-failure-preflight. See ag-dev-prompts docs/jira-agent-pipeline.md
    # §"Re-engagement after Needs Review".
    resume-preflight:
        if: |
            (github.event_name == 'repository_dispatch' && github.event.action == 'jira-resume') ||
            (github.event_name == 'workflow_dispatch'   && inputs.stage == 'recycle')
        runs-on: ubuntu-latest
        timeout-minutes: 5
        permissions:
            contents: read
            pull-requests: read
            packages: read
        outputs:
            route: ${{ steps.gate.outputs.route }}
            prior_pr_outcome: ${{ steps.gate.outputs.prior_pr_outcome }}
            issue_key: ${{ steps.gate.outputs.issue_key }}
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 1

            - name: Install @ag-grid/dev-prompts
              uses: ./.github/actions/install-ag-dev-prompts
              with:
                  channel: ${{ env.DEV_PROMPTS_CHANNEL }}

            - id: gate
              uses: ./.ag-dev-prompts/node_modules/@ag-grid/dev-prompts/.github/actions/jira-resume-preflight
              with:
                  issue_key: ${{ env.ISSUE_KEY }}
                  jira_email: ${{ secrets.JIRA_EMAIL }}
                  jira_api_token: ${{ secrets.JIRA_API_TOKEN }}
                  jira_site_url: ${{ vars.JIRA_SITE_URL }}

    # -------------------------------------------------- resume-build
    # route == build → no PR yet, run the first build.
    resume-build:
        needs: resume-preflight
        if: needs.resume-preflight.outputs.route == 'build'
        runs-on: ubuntu-latest
        timeout-minutes: 60
        permissions:
            contents: read
            packages: read
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 1

            - name: Mint ag-dev-prompts read token
              id: prompts-token
              uses: actions/create-github-app-token@v1
              with:
                  app-id: ${{ vars.JIRA_AGENT_APP_ID }}
                  private-key: ${{ secrets.JIRA_AGENT_APP_PRIVATE_KEY }}
                  owner: ag-grid
                  repositories: ag-dev-prompts

            - name: Setup Nx (renders .claude/settings.json)
              uses: ./.github/actions/setup-nx
              env:
                  GITHUB_TOKEN: ${{ steps.prompts-token.outputs.token }}
              with:
                  cache_mode: ro
                  fetch_base: skip

            - name: Install @ag-grid/dev-prompts
              uses: ./.github/actions/install-ag-dev-prompts
              with:
                  channel: ${{ env.DEV_PROMPTS_CHANNEL }}

            - uses: ./.ag-dev-prompts/node_modules/@ag-grid/dev-prompts/.github/actions/jira-pipeline
              with:
                  stage: build
                  issue_key: ${{ needs.resume-preflight.outputs.issue_key }}
                  jira_agent_app_id: ${{ vars.JIRA_AGENT_APP_ID }}
                  jira_agent_app_private_key: ${{ secrets.JIRA_AGENT_APP_PRIVATE_KEY }}
                  anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
                  jira_email: ${{ secrets.JIRA_EMAIL }}
                  jira_api_token: ${{ secrets.JIRA_API_TOKEN }}
                  jira_site_url: ${{ vars.JIRA_SITE_URL }}

    # -------------------------------------------------- resume-iterate
    # route == iterate → an open PR exists, resume its branch.
    resume-iterate:
        needs: resume-preflight
        if: needs.resume-preflight.outputs.route == 'iterate'
        runs-on: ubuntu-latest
        timeout-minutes: 60
        permissions:
            contents: read
            packages: read
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 1

            - name: Mint ag-dev-prompts read token
              id: prompts-token
              uses: actions/create-github-app-token@v1
              with:
                  app-id: ${{ vars.JIRA_AGENT_APP_ID }}
                  private-key: ${{ secrets.JIRA_AGENT_APP_PRIVATE_KEY }}
                  owner: ag-grid
                  repositories: ag-dev-prompts

            - name: Setup Nx (renders .claude/settings.json)
              uses: ./.github/actions/setup-nx
              env:
                  GITHUB_TOKEN: ${{ steps.prompts-token.outputs.token }}
              with:
                  cache_mode: ro
                  fetch_base: skip

            - name: Install @ag-grid/dev-prompts
              uses: ./.github/actions/install-ag-dev-prompts
              with:
                  channel: ${{ env.DEV_PROMPTS_CHANNEL }}

            - uses: ./.ag-dev-prompts/node_modules/@ag-grid/dev-prompts/.github/actions/jira-pipeline
              with:
                  stage: pr-iterate
                  issue_key: ${{ needs.resume-preflight.outputs.issue_key }}
                  jira_agent_app_id: ${{ vars.JIRA_AGENT_APP_ID }}
                  jira_agent_app_private_key: ${{ secrets.JIRA_AGENT_APP_PRIVATE_KEY }}
                  anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
                  jira_email: ${{ secrets.JIRA_EMAIL }}
                  jira_api_token: ${{ secrets.JIRA_API_TOKEN }}
                  jira_site_url: ${{ vars.JIRA_SITE_URL }}

    # -------------------------------------------------- resume-recycle
    # route == recycle → prior PR merged/closed; cut a new -rN branch + PR.
    # prior_pr_outcome (merged | abandoned) drives the recycle stage.
    resume-recycle:
        needs: resume-preflight
        if: needs.resume-preflight.outputs.route == 'recycle'
        runs-on: ubuntu-latest
        timeout-minutes: 60
        permissions:
            contents: read
            packages: read
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 1

            - name: Mint ag-dev-prompts read token
              id: prompts-token
              uses: actions/create-github-app-token@v1
              with:
                  app-id: ${{ vars.JIRA_AGENT_APP_ID }}
                  private-key: ${{ secrets.JIRA_AGENT_APP_PRIVATE_KEY }}
                  owner: ag-grid
                  repositories: ag-dev-prompts

            - name: Setup Nx (renders .claude/settings.json)
              uses: ./.github/actions/setup-nx
              env:
                  GITHUB_TOKEN: ${{ steps.prompts-token.outputs.token }}
              with:
                  cache_mode: ro
                  fetch_base: skip

            - name: Install @ag-grid/dev-prompts
              uses: ./.github/actions/install-ag-dev-prompts
              with:
                  channel: ${{ env.DEV_PROMPTS_CHANNEL }}

            - uses: ./.ag-dev-prompts/node_modules/@ag-grid/dev-prompts/.github/actions/jira-pipeline
              with:
                  stage: recycle
                  issue_key: ${{ needs.resume-preflight.outputs.issue_key }}
                  recycle_from: ${{ needs.resume-preflight.outputs.prior_pr_outcome }}
                  jira_agent_app_id: ${{ vars.JIRA_AGENT_APP_ID }}
                  jira_agent_app_private_key: ${{ secrets.JIRA_AGENT_APP_PRIVATE_KEY }}
                  anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
                  jira_email: ${{ secrets.JIRA_EMAIL }}
                  jira_api_token: ${{ secrets.JIRA_API_TOKEN }}
                  jira_site_url: ${{ vars.JIRA_SITE_URL }}

    # -------------------------------------------------- ci-failure-iterate
    # Preflight is intentionally cheap: parse the branch, look up the PR
    # author via the default token, query AI status via Jira REST. No App
    # token mint, no agent invocation. A shallow checkout + npm install of
    # @ag-grid/dev-prompts is required to resolve the shared preflight
    # action; skipped runs (no eligible workflow_run) avoid this entirely.
    ci-failure-preflight:
        # The `branches: ['ghabot-ag-*']` filter on the workflow_run trigger
        # already constrains the branch shape, so the only gate left here is
        # the conclusion. The shared preflight action does the full
        # eligibility walk (PR author + AI status + Jira key extraction).
        if: |
            github.event_name == 'workflow_run' &&
            github.event.workflow_run.conclusion == 'failure'
        runs-on: ubuntu-latest
        timeout-minutes: 5
        permissions:
            contents: read
            pull-requests: read
            packages: read
        outputs:
            eligible: ${{ steps.gate.outputs.eligible }}
            issue_key: ${{ steps.gate.outputs.issue_key }}
            run_url: ${{ steps.gate.outputs.run_url }}
            head_sha: ${{ steps.gate.outputs.head_sha }}
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 1

            - name: Install @ag-grid/dev-prompts
              uses: ./.github/actions/install-ag-dev-prompts
              with:
                  channel: ${{ env.DEV_PROMPTS_CHANNEL }}

            - id: gate
              uses: ./.ag-dev-prompts/node_modules/@ag-grid/dev-prompts/.github/actions/jira-ci-failure-preflight
              with:
                  head_branch: ${{ github.event.workflow_run.head_branch }}
                  head_sha: ${{ github.event.workflow_run.head_sha }}
                  run_url: ${{ github.event.workflow_run.html_url }}
                  jira_email: ${{ secrets.JIRA_EMAIL }}
                  jira_api_token: ${{ secrets.JIRA_API_TOKEN }}
                  jira_site_url: ${{ vars.JIRA_SITE_URL }}

    ci-failure-iterate:
        needs: ci-failure-preflight
        if: needs.ci-failure-preflight.outputs.eligible == 'true'
        runs-on: ubuntu-latest
        timeout-minutes: 60
        permissions:
            contents: read
            packages: read
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 1

            - name: Mint ag-dev-prompts read token
              id: prompts-token
              uses: actions/create-github-app-token@v1
              with:
                  app-id: ${{ vars.JIRA_AGENT_APP_ID }}
                  private-key: ${{ secrets.JIRA_AGENT_APP_PRIVATE_KEY }}
                  owner: ag-grid
                  repositories: ag-dev-prompts

            - name: Setup Nx (renders .claude/settings.json)
              uses: ./.github/actions/setup-nx
              env:
                  GITHUB_TOKEN: ${{ steps.prompts-token.outputs.token }}
              with:
                  cache_mode: ro
                  fetch_base: skip

            - name: Install @ag-grid/dev-prompts
              uses: ./.github/actions/install-ag-dev-prompts
              with:
                  channel: ${{ env.DEV_PROMPTS_CHANNEL }}

            - uses: ./.ag-dev-prompts/node_modules/@ag-grid/dev-prompts/.github/actions/jira-pipeline
              with:
                  stage: ci-failure-iterate
                  issue_key: ${{ needs.ci-failure-preflight.outputs.issue_key }}
                  ci_failure_run_url: ${{ needs.ci-failure-preflight.outputs.run_url }}
                  jira_agent_app_id: ${{ vars.JIRA_AGENT_APP_ID }}
                  jira_agent_app_private_key: ${{ secrets.JIRA_AGENT_APP_PRIVATE_KEY }}
                  anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
                  jira_email: ${{ secrets.JIRA_EMAIL }}
                  jira_api_token: ${{ secrets.JIRA_API_TOKEN }}
                  jira_site_url: ${{ vars.JIRA_SITE_URL }}

    # -------------------------------------------------- ci-success-handler
    # Symmetric counterpart to ci-failure-preflight. Fires on the same
    # workflow_run trigger but when the upstream CI finished successfully.
    # No agent invocation — pure REST work: verify the run is still the
    # PR head, transition the JIRA workflow to Needs Review, mark AI
    # status: done, clear AI failure, zero the recovery counter. See the
    # shared action for the full eligibility walk.
    ci-success-handler:
        if: |
            github.event_name == 'workflow_run' &&
            github.event.workflow_run.conclusion == 'success'
        runs-on: ubuntu-latest
        timeout-minutes: 5
        permissions:
            contents: read
            pull-requests: read
            packages: read
        # Surfaced so the pr-plnkr job can gate on the first promoting green
        # (handled == 'true') and forward the issue key + PR number.
        outputs:
            handled: ${{ steps.handler.outputs.handled }}
            issue_key: ${{ steps.handler.outputs.issue_key }}
            pr_number: ${{ steps.handler.outputs.pr_number }}
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 1

            - name: Install @ag-grid/dev-prompts
              uses: ./.github/actions/install-ag-dev-prompts
              with:
                  channel: ${{ env.DEV_PROMPTS_CHANNEL }}

            - id: handler
              uses: ./.ag-dev-prompts/node_modules/@ag-grid/dev-prompts/.github/actions/jira-ci-success-handler
              with:
                  head_branch: ${{ github.event.workflow_run.head_branch }}
                  head_sha: ${{ github.event.workflow_run.head_sha }}
                  run_url: ${{ github.event.workflow_run.html_url }}
                  jira_email: ${{ secrets.JIRA_EMAIL }}
                  jira_api_token: ${{ secrets.JIRA_API_TOKEN }}
                  jira_site_url: ${{ vars.JIRA_SITE_URL }}
                  # Live-test snippet — the ci.yml `pr_preview` job publishes
                  # per-PR UMD bundles to gh-pages, so the reviewer can paste
                  # these two <script> tags into a vanilla-JS Plunker to
                  # exercise the actual built library from this PR.
                  success_comment_body: |
                      Live-test this PR in Plunker — paste these into a vanilla-JS sandbox:

                      <script src="https://ag-grid.github.io/ag-charts/pr-{PR_NUMBER}/ag-charts-community.min.js"></script>
                      <script src="https://ag-grid.github.io/ag-charts/pr-{PR_NUMBER}/ag-charts-enterprise.min.js"></script>

                      Bundles auto-cleanup on PR close. PR: {PR_URL}

    # -------------------------------------------------------------- pr-plnkr
    # Automates the manual "paste these <script> tags into a Plunker" step the
    # success comment above describes: clone the reporter's repro Plunker(s)
    # from the ticket and re-point their AG Charts <script src> tags at this
    # PR's per-PR UMD bundle, then post the fix-pinned links back to the ticket.
    #
    # Gated on ci-success-handler.handled — true ONLY on the first promoting
    # green (afterwards AI status is `done`, outside the handler's
    # eligible_statuses), so this runs exactly once per PR with no marker field.
    # Boots a focused agent (jira-pr-plnkr); orthogonal to AI status, so it does
    # NOT go through jira-pipeline.
    pr-plnkr:
        needs: ci-success-handler
        if: needs.ci-success-handler.outputs.handled == 'true'
        runs-on: ubuntu-latest
        timeout-minutes: 20
        permissions:
            contents: read
            packages: read
            # The agent posts a `<!-- pr-plnkr -->` marker comment on the PR
            # (idempotency guard against single-job re-runs) via the App token.
            pull-requests: write
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 1

            # Same read token + setup-nx prelude as the agent stages: setup-nx's
            # postinstall renders .claude/settings.json, which setup-jira-agent
            # (inside jira-pr-plnkr) verifies. No repo build runs in the agent.
            - name: Mint ag-dev-prompts read token
              id: prompts-token
              uses: actions/create-github-app-token@v1
              with:
                  app-id: ${{ vars.JIRA_AGENT_APP_ID }}
                  private-key: ${{ secrets.JIRA_AGENT_APP_PRIVATE_KEY }}
                  owner: ag-grid
                  repositories: ag-dev-prompts

            - name: Setup Nx (renders .claude/settings.json)
              uses: ./.github/actions/setup-nx
              env:
                  GITHUB_TOKEN: ${{ steps.prompts-token.outputs.token }}
              with:
                  cache_mode: ro
                  fetch_base: skip

            - name: Install @ag-grid/dev-prompts
              uses: ./.github/actions/install-ag-dev-prompts
              with:
                  channel: ${{ env.DEV_PROMPTS_CHANNEL }}

            - uses: ./.ag-dev-prompts/node_modules/@ag-grid/dev-prompts/.github/actions/jira-pr-plnkr
              with:
                  issue_key: ${{ needs.ci-success-handler.outputs.issue_key }}
                  pr_number: ${{ needs.ci-success-handler.outputs.pr_number }}
                  community_bundle_url: https://ag-grid.github.io/ag-charts/pr-${{ needs.ci-success-handler.outputs.pr_number }}/ag-charts-community.min.js
                  enterprise_bundle_url: https://ag-grid.github.io/ag-charts/pr-${{ needs.ci-success-handler.outputs.pr_number }}/ag-charts-enterprise.min.js
                  anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
                  jira_agent_app_id: ${{ vars.JIRA_AGENT_APP_ID }}
                  jira_agent_app_private_key: ${{ secrets.JIRA_AGENT_APP_PRIVATE_KEY }}
                  jira_email: ${{ secrets.JIRA_EMAIL }}
                  jira_api_token: ${{ secrets.JIRA_API_TOKEN }}
                  jira_site_url: ${{ vars.JIRA_SITE_URL }}
