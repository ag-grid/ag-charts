name: Jira Agent Pipeline

# ============================================================================
# End-to-end Jira -> GHA agent pipeline. Four stages, one workflow:
#
#   triage              — /fr --ci --phase 0..1 <KEY>            (intent / research / plan)
#   build               — /fr --ci --phase 2..5 --resume --draft-pr <KEY>
#   pr-iterate          — /fr --ci --pr-iterate <KEY>                              (review-comment driven)
#   ci-failure-iterate  — /fr --ci --pr-iterate --ci-failure <run_url> <KEY>       (main-CI failure driven)
#
# Each stage is its own job, gated on the dispatch event_type, the
# workflow_dispatch `stage` input, or — for ci-failure-iterate — the
# `workflow_run.completed` event on the main CI workflow.
#
# The heavy lifting (App-token mint, MCP setup, status/state/PR/cost
# writebacks, Claude invocation, trace digest, artefact upload) lives in
# the shared `jira-pipeline` composite action under ag-dev-prompts. This
# workflow is the thin per-repo stub: it owns triggers, eligibility
# gating, and the consumer-local prerequisite (setup-nx, which renders
# .claude/settings.json for the shared action to verify).
#
# Pin track: ag-charts consumes ag-dev-prompts@canary (i.e. AG Charts
# rolls with the canary track of the prompt repo; ag-grid + ag-studio
# pin to @latest). See ag-dev-prompts release docs.
#
# ----------------------------------------------------------------------------
# Trigger envelopes
# ----------------------------------------------------------------------------
#
#   workflow_dispatch:
#       gh workflow run jira-agent-pipeline.yml -f issue_key=AG-XXXXX -f stage=triage
#
#   repository_dispatch (from Jira Automation):
#       POST /repos/ag-grid/ag-charts/dispatches
#       Authorization: Bearer <installation-token>
#       Body:
#         {"event_type":"jira-triage",     "client_payload":{"issue_key":"AG-XXXXX"}}
#         {"event_type":"jira-build",      "client_payload":{"issue_key":"AG-XXXXX"}}
#         {"event_type":"jira-pr-iterate", "client_payload":{"issue_key":"AG-XXXXX"}}
#
#   workflow_run (auto — fires when the main CI workflow completes):
#       Gates inside the ci-failure-preflight job:
#         - workflow_run.conclusion == 'failure'
#         - workflow_run.head_branch starts with 'ag-'             (agent branch shape)
#         - PR author == 'ag-jira-agent-ci[bot]'                   (agent-authored)
#         - issue's AI status ∈ {draft-pr-open, iterating, pr-iterating}
#
# ----------------------------------------------------------------------------
# Custom-field mapping (operator-side already created)
# ----------------------------------------------------------------------------
#
# The shared action's repo-config.yml maps `ag-grid/ag-charts` to the AG
# JIRA project's custom-field ids (customfield_10941..10988). See
# ag-grid/ag-dev-prompts → .github/actions/jira-pipeline/repo-config.yml.
#
# ----------------------------------------------------------------------------
# Operator pre-requisites
# ----------------------------------------------------------------------------
#
#   Repository secrets:
#       JIRA_AGENT_APP_PRIVATE_KEY  - GitHub App PEM
#       ANTHROPIC_API_KEY           - Anthropic Enterprise admin key
#       JIRA_API_TOKEN              - Atlassian API token (service account)
#       JIRA_EMAIL                  - Service-account email
#
#   Repository variables:
#       JIRA_AGENT_APP_ID           - GitHub App ID
#       JIRA_SITE_URL               - https://ag-grid.atlassian.net
#
#   GitHub App `ag-grid-jira-agents` installed on:
#       ag-grid/ag-charts            (contents:write, issues:write, pull-requests:write, actions:write)
#       ag-grid/ag-dev-prompts       (contents:read)
# ============================================================================

on:
    repository_dispatch:
        types: [jira-triage, jira-build, jira-pr-iterate]
    workflow_dispatch:
        inputs:
            issue_key:
                description: 'JIRA issue key (e.g. AG-12345)'
                type: string
                required: true
            stage:
                description: 'Pipeline stage to run'
                type: choice
                required: true
                default: triage
                options:
                    - triage
                    - build
                    - pr-iterate
    workflow_run:
        # Auto-iterate when the main CI workflow fails on an agent-authored
        # draft PR. The ci-failure-preflight job applies the actual gates;
        # this trigger is intentionally wide so we don't miss eligible runs.
        workflows: [CI]
        types: [completed]

permissions:
    contents: read

concurrency:
    # For workflow_run events the dispatch payloads are empty, so fall back
    # to the failing run's head branch (which encodes the issue key:
    # `ag-NNNNN/...`). Same group as the dispatch-driven jobs so a fresh
    # CI-failure iteration queues behind any in-flight pr-iterate for the
    # same ticket instead of interleaving.
    group: claude-${{ github.event.client_payload.issue_key || inputs.issue_key || github.event.workflow_run.head_branch }}
    cancel-in-progress: false

env:
    ISSUE_KEY: ${{ github.event.client_payload.issue_key || inputs.issue_key }}

jobs:
    # -------------------------------------------------------------------- triage
    triage:
        if: |
            (github.event_name == 'repository_dispatch' && github.event.action == 'jira-triage') ||
            (github.event_name == 'workflow_dispatch'   && inputs.stage == 'triage')
        runs-on: ubuntu-latest
        timeout-minutes: 30
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 1

            - name: Setup Nx (renders .claude/settings.json)
              uses: ./.github/actions/setup-nx
              with:
                  cache_mode: ro
                  fetch_base: skip

            - uses: ag-grid/ag-dev-prompts/.github/actions/jira-pipeline@canary
              with:
                  stage: triage
                  issue_key: ${{ env.ISSUE_KEY }}
                  jira_agent_app_id: ${{ vars.JIRA_AGENT_APP_ID }}
                  jira_agent_app_private_key: ${{ secrets.JIRA_AGENT_APP_PRIVATE_KEY }}
                  anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
                  jira_email: ${{ secrets.JIRA_EMAIL }}
                  jira_api_token: ${{ secrets.JIRA_API_TOKEN }}
                  jira_site_url: ${{ vars.JIRA_SITE_URL }}

    # -------------------------------------------------------------------- build
    build:
        if: |
            (github.event_name == 'repository_dispatch' && github.event.action == 'jira-build') ||
            (github.event_name == 'workflow_dispatch'   && inputs.stage == 'build')
        runs-on: ubuntu-latest
        timeout-minutes: 60
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 1

            - name: Setup Nx (renders .claude/settings.json)
              uses: ./.github/actions/setup-nx
              with:
                  cache_mode: ro
                  fetch_base: skip

            - uses: ag-grid/ag-dev-prompts/.github/actions/jira-pipeline@canary
              with:
                  stage: build
                  issue_key: ${{ env.ISSUE_KEY }}
                  jira_agent_app_id: ${{ vars.JIRA_AGENT_APP_ID }}
                  jira_agent_app_private_key: ${{ secrets.JIRA_AGENT_APP_PRIVATE_KEY }}
                  anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
                  jira_email: ${{ secrets.JIRA_EMAIL }}
                  jira_api_token: ${{ secrets.JIRA_API_TOKEN }}
                  jira_site_url: ${{ vars.JIRA_SITE_URL }}

    # ---------------------------------------------------------------- pr-iterate
    pr-iterate:
        if: |
            (github.event_name == 'repository_dispatch' && github.event.action == 'jira-pr-iterate') ||
            (github.event_name == 'workflow_dispatch'   && inputs.stage == 'pr-iterate')
        runs-on: ubuntu-latest
        timeout-minutes: 60
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 1

            - name: Setup Nx (renders .claude/settings.json)
              uses: ./.github/actions/setup-nx
              with:
                  cache_mode: ro
                  fetch_base: skip

            - uses: ag-grid/ag-dev-prompts/.github/actions/jira-pipeline@canary
              with:
                  stage: pr-iterate
                  issue_key: ${{ env.ISSUE_KEY }}
                  jira_agent_app_id: ${{ vars.JIRA_AGENT_APP_ID }}
                  jira_agent_app_private_key: ${{ secrets.JIRA_AGENT_APP_PRIVATE_KEY }}
                  anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
                  jira_email: ${{ secrets.JIRA_EMAIL }}
                  jira_api_token: ${{ secrets.JIRA_API_TOKEN }}
                  jira_site_url: ${{ vars.JIRA_SITE_URL }}

    # -------------------------------------------------- ci-failure-iterate
    # Preflight is intentionally cheap: parse the branch, look up the PR
    # author via the default token, query AI status via Jira REST. No App
    # token mint, no checkout, no agent invocation. Skipped runs cost ~2s.
    ci-failure-preflight:
        if: |
            github.event_name == 'workflow_run' &&
            github.event.workflow_run.conclusion == 'failure' &&
            startsWith(github.event.workflow_run.head_branch, 'ag-')
        runs-on: ubuntu-latest
        timeout-minutes: 5
        permissions:
            contents: read
            pull-requests: read
        outputs:
            eligible: ${{ steps.gate.outputs.eligible }}
            issue_key: ${{ steps.gate.outputs.issue_key }}
            run_url: ${{ steps.gate.outputs.run_url }}
            head_sha: ${{ steps.gate.outputs.head_sha }}
        steps:
            - id: gate
              uses: ag-grid/ag-dev-prompts/.github/actions/jira-ci-failure-preflight@canary
              with:
                  head_branch: ${{ github.event.workflow_run.head_branch }}
                  head_sha: ${{ github.event.workflow_run.head_sha }}
                  run_url: ${{ github.event.workflow_run.html_url }}
                  jira_email: ${{ secrets.JIRA_EMAIL }}
                  jira_api_token: ${{ secrets.JIRA_API_TOKEN }}
                  jira_site_url: ${{ vars.JIRA_SITE_URL }}

    ci-failure-iterate:
        needs: ci-failure-preflight
        if: needs.ci-failure-preflight.outputs.eligible == 'true'
        runs-on: ubuntu-latest
        timeout-minutes: 60
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 1

            - name: Setup Nx (renders .claude/settings.json)
              uses: ./.github/actions/setup-nx
              with:
                  cache_mode: ro
                  fetch_base: skip

            - uses: ag-grid/ag-dev-prompts/.github/actions/jira-pipeline@canary
              with:
                  stage: ci-failure-iterate
                  issue_key: ${{ needs.ci-failure-preflight.outputs.issue_key }}
                  ci_failure_run_url: ${{ needs.ci-failure-preflight.outputs.run_url }}
                  jira_agent_app_id: ${{ vars.JIRA_AGENT_APP_ID }}
                  jira_agent_app_private_key: ${{ secrets.JIRA_AGENT_APP_PRIVATE_KEY }}
                  anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
                  jira_email: ${{ secrets.JIRA_EMAIL }}
                  jira_api_token: ${{ secrets.JIRA_API_TOKEN }}
                  jira_site_url: ${{ vars.JIRA_SITE_URL }}
