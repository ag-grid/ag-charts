name: Cleanup caches on PR close
on:
    pull_request:
        types:
            - closed

permissions:
    contents: read

jobs:
    cleanup:
        runs-on: ubuntu-24.04
        env:
            SNAPSHOT_BRANCH: 'gha/snapshots-${{ github.head_ref }}'
        permissions:
            contents: write
        steps:
            - name: Check out code
              uses: actions/checkout@v4

            - name: Cleanup
              run: |
                  gh extension install actions/gh-actions-cache

                  echo "SNAPSHOT_BRANCH: ${{env.SNAPSHOT_BRANCH}}"
                  REPO=${{ github.repository }}
                  BRANCH="refs/pull/${{ github.event.pull_request.number }}/merge"

                  echo "Fetching list of cache keys"
                  cacheKeysForPR=$(gh actions-cache list -R $REPO -B $BRANCH -L 100 | cut -f 1 )

                  ## Setting this to not fail the workflow while deleting cache keys.
                  set +e
                  echo "Deleting caches..."
                  for cacheKey in $cacheKeysForPR
                  do
                      echo "Deleting cache... $cacheKey"
                      gh actions-cache delete $cacheKey -R $REPO -B $BRANCH --confirm
                  done
                  echo "Done"

                  echo "Cleaning up any auto-generated branches."
                  if (git ls-remote --exit-code --heads origin ${{env.SNAPSHOT_BRANCH}} >/dev/null) ; then
                      git push -d origin ${{env.SNAPSHOT_BRANCH}}
                  fi
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    gh_pages_cleanup:
        runs-on: ubuntu-24.04
        name: Remove PR preview from gh-pages
        permissions:
            contents: write
        concurrency:
            group: pr-preview-gh-pages
            cancel-in-progress: false
        env:
            PR_NUMBER: ${{ github.event.pull_request.number }}
        steps:
            # Check out the PR's BASE (trusted) ref, not the default pull_request
            # ref: the latter can be the PR merge ref (PR-controlled code) and may
            # be unresolvable for closed-unmerged PRs. The action carries on the
            # base branch and operates on gh-pages via its own token-auth clone.
            - name: Checkout (trusted base ref)
              uses: actions/checkout@v4
              with:
                  ref: ${{ github.event.pull_request.base.ref }}
                  fetch-depth: 1

            # hashFiles() guards the bootstrap window before the shared action
            # exists on the base branch (no preview was published then either).
            - name: Remove PR preview from gh-pages
              if: hashFiles('external/ag-shared/github/actions/pr-preview-cleanup/action.yml') != ''
              uses: ./external/ag-shared/github/actions/pr-preview-cleanup
              with:
                  pr_number: ${{ env.PR_NUMBER }}
                  github_token: ${{ secrets.GITHUB_TOKEN }}
