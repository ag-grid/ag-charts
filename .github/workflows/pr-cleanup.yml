name: Cleanup caches on PR close
on:
    pull_request:
        types:
            - closed

permissions:
    contents: read

jobs:
    cleanup:
        runs-on: ubuntu-24.04
        env:
            SNAPSHOT_BRANCH: 'gha/snapshots-${{ github.head_ref }}'
        permissions:
            contents: write
        steps:
            - name: Check out code
              uses: actions/checkout@v4

            - name: Cleanup
              run: |
                  gh extension install actions/gh-actions-cache

                  echo "SNAPSHOT_BRANCH: ${{env.SNAPSHOT_BRANCH}}"
                  REPO=${{ github.repository }}
                  BRANCH="refs/pull/${{ github.event.pull_request.number }}/merge"

                  echo "Fetching list of cache keys"
                  cacheKeysForPR=$(gh actions-cache list -R $REPO -B $BRANCH -L 100 | cut -f 1 )

                  ## Setting this to not fail the workflow while deleting cache keys.
                  set +e
                  echo "Deleting caches..."
                  for cacheKey in $cacheKeysForPR
                  do
                      echo "Deleting cache... $cacheKey"
                      gh actions-cache delete $cacheKey -R $REPO -B $BRANCH --confirm
                  done
                  echo "Done"

                  echo "Cleaning up any auto-generated branches."
                  if (git ls-remote --exit-code --heads origin ${{env.SNAPSHOT_BRANCH}} >/dev/null) ; then
                      git push -d origin ${{env.SNAPSHOT_BRANCH}}
                  fi
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    gh_pages_cleanup:
        runs-on: ubuntu-24.04
        name: Remove PR preview from gh-pages
        # Same-repo PRs only — the repo-wide untrusted-PR convention (see
        # pr-review.yml + the ci.yml pr_preview job). Fork PRs never publish a
        # preview (that job is same-repo gated) so there is nothing to clean, and
        # they could not hold the contents:write token this needs anyway.
        if: github.event.pull_request.head.repo.full_name == github.repository
        permissions:
            contents: write
        concurrency:
            group: pr-preview-gh-pages
            cancel-in-progress: false
        env:
            PR_NUMBER: ${{ github.event.pull_request.number }}
        steps:
            # Plain checkout (consistent with the rest of ci.yml). The same-repo
            # gate above means this is trusted code; the action only needs to be
            # present to run — it operates on gh-pages via its own token-auth clone.
            - name: Checkout
              uses: actions/checkout@v4
              with:
                  fetch-depth: 1

            - name: Remove PR preview from gh-pages
              uses: ./external/ag-shared/github/actions/pr-preview-cleanup
              with:
                  pr_number: ${{ env.PR_NUMBER }}
                  github_token: ${{ secrets.GITHUB_TOKEN }}
