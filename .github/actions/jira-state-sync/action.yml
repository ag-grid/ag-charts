name: Jira AI-state sync
description: |
    Round-trip the `/fr --ci` state files between Jira textarea custom fields
    and `${GITHUB_WORKSPACE}/tmp/fr-state/<KEY>/`. The textareas are
    `customfieldtypes:textarea` with `schema.type: string` — Jira's update
    endpoint expects a plain string for those, so this action writes/reads
    the markdown verbatim. No ADF conversion: the Jira UI renders the field
    as plain text but the round-trip is exact and the skill's --resume path
    reads back the same bytes the agent wrote.

    Field mapping (matches `/fr --ci`'s six state files):
      customfield_10943 — AI research           <-> research.md
      customfield_10944 — AI intent             <-> intent.md
      customfield_10945 — AI plan               <-> plan.md
      customfield_10949 — AI decisions          <-> decisions.md
      customfield_11054 — AI progress (md)      <-> progress.md
      customfield_10951 — AI Review Feedback    <-> review-feedback.md

    Modes:
      `pull` — read each field; for every non-null value, write a file under
               the state dir.
      `push` — read whichever files exist under the state dir; build a single
               PUT body; write all fields in one request. Files the agent did
               not write this run are left untouched on the ticket.

    Truncation: textarea fields are bounded at 32,767 chars in Jira. Any file
    above that limit is truncated with a tail marker before upload.

inputs:
    issue_key:
        description: JIRA issue key (e.g. AG-12345).
        required: true
    mode:
        description: '`pull` or `push`.'
        required: true
    state_dir:
        description: Directory used for state files. Defaults to $GITHUB_WORKSPACE/tmp/fr-state/<KEY>.
        required: false
        default: ''
    jira_email:
        required: true
    jira_api_token:
        required: true
    jira_site_url:
        required: true

runs:
    using: composite
    steps:
        - name: Sync AI state
          shell: bash
          env:
              ISSUE_KEY: ${{ inputs.issue_key }}
              MODE: ${{ inputs.mode }}
              STATE_DIR_IN: ${{ inputs.state_dir }}
              JIRA_USER_EMAIL: ${{ inputs.jira_email }}
              JIRA_API_TOKEN: ${{ inputs.jira_api_token }}
              JIRA_SITE_URL: ${{ inputs.jira_site_url }}
          run: |
              set -euo pipefail
              : "${ISSUE_KEY:?}" "${MODE:?}"
              : "${JIRA_USER_EMAIL:?}" "${JIRA_API_TOKEN:?}" "${JIRA_SITE_URL:?}"

              STATE_DIR="$STATE_DIR_IN"
              if [[ -z "$STATE_DIR" ]]; then STATE_DIR="${GITHUB_WORKSPACE}/tmp/fr-state/${ISSUE_KEY}"; fi
              mkdir -p "$STATE_DIR"

              # Use /rest/api/2 for both GET and PUT. v3's update endpoint
              # requires ADF objects for textarea fields ("Operation value
              # must be an Atlassian Document") even though the field's own
              # schema declares type=string; v2 accepts plain strings, which
              # is what we want here. The Jira UI applies its own renderer
              # on display so markdown still shows styled.
              SITE="${JIRA_SITE_URL%/}"
              AUTH="$(printf '%s:%s' "$JIRA_USER_EMAIL" "$JIRA_API_TOKEN" | base64 | tr -d '\n')"
              MAX_CHARS=32767

              # field_id  filename
              FIELDS=(
                  "customfield_10943 research.md"
                  "customfield_10944 intent.md"
                  "customfield_10945 plan.md"
                  "customfield_10949 decisions.md"
                  "customfield_11054 progress.md"
                  "customfield_10951 review-feedback.md"
              )

              if [[ "$MODE" == "pull" ]]; then
                  PULL_FIELDS=""
                  for row in "${FIELDS[@]}"; do
                      [[ -n "$PULL_FIELDS" ]] && PULL_FIELDS+=","
                      PULL_FIELDS+="${row%% *}"
                  done
                  HTTP=$(curl -sS -o /tmp/state-pull.json -w '%{http_code}' \
                      -H "authorization: Basic $AUTH" \
                      -H 'accept: application/json' \
                      "$SITE/rest/api/2/issue/$ISSUE_KEY?fields=$PULL_FIELDS")
                  if [[ "$HTTP" != "200" ]]; then
                      echo "[state-sync pull] GET failed: HTTP $HTTP" >&2
                      cat /tmp/state-pull.json >&2 || true
                      exit 1
                  fi
                  echo "## AI state pull" >> "$GITHUB_STEP_SUMMARY"
                  echo "" >> "$GITHUB_STEP_SUMMARY"
                  echo "| File | Bytes |" >> "$GITHUB_STEP_SUMMARY"
                  echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
                  for row in "${FIELDS[@]}"; do
                      FIELD_ID="${row%% *}"
                      NAME="${row##* }"
                      VALUE=$(jq -r --arg f "$FIELD_ID" '.fields[$f] // empty' /tmp/state-pull.json)
                      if [[ -n "$VALUE" ]]; then
                          printf '%s' "$VALUE" > "$STATE_DIR/$NAME"
                          SIZE=$(wc -c < "$STATE_DIR/$NAME" | tr -d ' ')
                          echo "[state-sync pull] $NAME ($SIZE bytes) <- $FIELD_ID"
                          echo "| \`$NAME\` | $SIZE |" >> "$GITHUB_STEP_SUMMARY"
                      else
                          echo "[state-sync pull] $FIELD_ID empty — skipping $NAME"
                          echo "| \`$NAME\` | _(empty)_ |" >> "$GITHUB_STEP_SUMMARY"
                      fi
                  done
                  exit 0
              fi

              if [[ "$MODE" == "push" ]]; then
                  TMP_BODY=$(mktemp)
                  echo '{}' > "$TMP_BODY"
                  ANY_PUSHED=0
                  echo "## AI state push" >> "$GITHUB_STEP_SUMMARY"
                  echo "" >> "$GITHUB_STEP_SUMMARY"
                  echo "| File | Chars | Truncated |" >> "$GITHUB_STEP_SUMMARY"
                  echo "|---|---|---|" >> "$GITHUB_STEP_SUMMARY"
                  for row in "${FIELDS[@]}"; do
                      FIELD_ID="${row%% *}"
                      NAME="${row##* }"
                      P="$STATE_DIR/$NAME"
                      if [[ ! -f "$P" ]]; then
                          echo "[state-sync push] $NAME absent — leaving $FIELD_ID untouched"
                          echo "| \`$NAME\` | _(absent)_ | - |" >> "$GITHUB_STEP_SUMMARY"
                          continue
                      fi
                      # Jira's textarea limit is 32,767 *characters* (Unicode
                      # code points), not bytes. wc -m / head -c on UTF-8 can
                      # disagree and head -c can also split a multi-byte
                      # sequence mid-character. Measure and truncate in Node
                      # so non-ASCII state files round-trip correctly.
                      CHARS=$(node -e 'process.stdout.write(String(require("fs").readFileSync(process.argv[1],"utf8").length))' "$P")
                      SIZE=$(wc -c < "$P" | tr -d ' ')
                      TRUNC="no"
                      if (( CHARS > MAX_CHARS )); then
                          TRUNC="yes"
                          ORIG="$CHARS"
                          KEEP=$((MAX_CHARS - 120))
                          node -e '
                              const fs = require("fs");
                              const [src, dst, keep, orig] = process.argv.slice(1);
                              const head = fs.readFileSync(src, "utf8").slice(0, Number(keep));
                              fs.writeFileSync(dst, head + `\n\n---\n[truncated: original was ${orig} chars]\n`);
                          ' "$P" "$P.trunc" "$KEEP" "$ORIG"
                          mv "$P.trunc" "$P"
                          CHARS=$(node -e 'process.stdout.write(String(require("fs").readFileSync(process.argv[1],"utf8").length))' "$P")
                          SIZE=$(wc -c < "$P" | tr -d ' ')
                      fi
                      jq --arg f "$FIELD_ID" --rawfile body "$P" \
                          '. + { ($f): $body }' "$TMP_BODY" > "$TMP_BODY.next"
                      mv "$TMP_BODY.next" "$TMP_BODY"
                      ANY_PUSHED=1
                      echo "[state-sync push] $NAME ($CHARS chars / $SIZE bytes, truncated=$TRUNC) -> $FIELD_ID"
                      echo "| \`$NAME\` | $CHARS | $TRUNC |" >> "$GITHUB_STEP_SUMMARY"
                  done

                  if (( ANY_PUSHED == 0 )); then
                      echo "[state-sync push] no state files to upload"
                      exit 0
                  fi

                  # Several state files at 32 KiB each easily exceed Linux
                  # ARG_MAX when passed via `--data "$BODY"`. Write the JSON
                  # body to a file and use `--data @file` instead.
                  PUT_BODY_FILE=$(mktemp)
                  jq -n --slurpfile f "$TMP_BODY" '{ fields: $f[0] }' > "$PUT_BODY_FILE"
                  HTTP=$(curl -sS -o /tmp/state-push.out -w '%{http_code}' \
                      -X PUT \
                      -H "authorization: Basic $AUTH" \
                      -H 'accept: application/json' \
                      -H 'content-type: application/json' \
                      --data "@$PUT_BODY_FILE" \
                      "$SITE/rest/api/2/issue/$ISSUE_KEY")
                  if [[ "$HTTP" != "204" && "$HTTP" != "200" ]]; then
                      echo "[state-sync push] PUT failed: HTTP $HTTP" >&2
                      cat /tmp/state-push.out >&2 || true
                      exit 1
                  fi
                  exit 0
              fi

              echo "[state-sync] unknown mode: $MODE" >&2
              exit 1
