name: PR Report Comment
description: >-
    Upsert sections into the single consolidated PR comment. A thin wrapper over the shared
    `pr-report-comment` action in @ag-grid/dev-prompts, which owns the comment format, the
    conflict-tolerant upsert and the reader the AI Workflow pipeline uses. The Codex review
    (pr-review.yml, `summary-comment: section`) writes its section through the same code.
    This wrapper keeps the call sites in ci.yml unchanged and installs the package without
    setup-node, so it does not change the calling job's Node or npm configuration.
    The calling job needs `packages: read`.

inputs:
    sections_dir:
        description: >-
            Directory of this caller's section fragments, named `NN-<id>.md`; the first line of
            each is a `## [ok|warn|error] Title` heading. Defaults to `$RUNNER_TEMP/pr-sections`.
        required: false
        default: ''
    pr_number:
        description: 'PR number to comment on. When empty the action no-ops.'
        required: false
        default: ''
    remove_sections:
        description: >-
            Space/comma-separated section ids to remove. An id also written this run is kept. If
            removal empties the comment, the comment is deleted.
        required: false
        default: ''
    github_token:
        description: 'Token with pull-requests: write and packages: read.'
        required: true
    dev_prompts_channel:
        description: 'npm dist-tag of @ag-grid/dev-prompts to use. Keep in step with pr-review.yml.'
        required: false
        default: canary

runs:
    using: composite
    steps:
        # Advisory surface: if the package cannot be installed, skip the comment rather than
        # fail the job that produced real work.
        - name: Install @ag-grid/dev-prompts
          id: install
          if: inputs.pr_number != ''
          continue-on-error: true
          shell: bash
          env:
              NODE_AUTH_TOKEN: ${{ inputs.github_token }}
              CHANNEL: ${{ inputs.dev_prompts_channel }}
          run: |
              set -euo pipefail
              dir="$GITHUB_WORKSPACE/.ag-dev-prompts"
              if [ -f "$dir/node_modules/@ag-grid/dev-prompts/.github/actions/pr-report-comment/action.yml" ]; then
                  echo "Already installed (an earlier step in this job)."
                  exit 0
              fi
              mkdir -p "$dir"
              [ -f "$dir/package.json" ] || echo '{"name":"ag-dev-prompts-install","private":true}' > "$dir/package.json"
              # A private userconfig, so the registry and token reach this install only. The token
              # line is single-quoted on purpose: npm expands ${NODE_AUTH_TOKEN} from the env itself.
              npmrc="$RUNNER_TEMP/pr-report-comment.npmrc"
              printf '%s\n' '@ag-grid:registry=https://npm.pkg.github.com' '//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}' > "$npmrc"
              (cd "$dir" && npm install --userconfig "$npmrc" --no-save --no-audit --no-fund --silent "@ag-grid/dev-prompts@${CHANNEL}")
              rm -f "$npmrc"
              # A release without the action would make the next step's `uses:` fail the job.
              if [ ! -f "$dir/node_modules/@ag-grid/dev-prompts/.github/actions/pr-report-comment/action.yml" ]; then
                  echo "::warning::@ag-grid/dev-prompts@${CHANNEL} has no pr-report-comment action; PR comment not updated."
                  exit 1
              fi

        - name: Upsert consolidated PR comment sections
          if: steps.install.outcome == 'success'
          uses: ./.ag-dev-prompts/node_modules/@ag-grid/dev-prompts/.github/actions/pr-report-comment
          with:
              sections-dir: ${{ inputs.sections_dir }}
              pr-number: ${{ inputs.pr_number }}
              remove-sections: ${{ inputs.remove_sections }}
              github-token: ${{ inputs.github_token }}
