name: snapshot-branch

inputs:
    path:
        description: 'Path to snapshot files.'
        required: true
    source_branch:
        description: 'Source branch to use for snapshots.'
        required: true
    branch:
        description: 'Snapshot branch name to use.'
        required: true
    type:
        description: 'Type of snapshot to update.'
        required: false
        default: 'e2e'
outputs:
    updates:
        description: 'If any snapshots were updated.'
        value: ${{ steps.stash-snapshot-changes.outputs.updates }}

runs:
    using: 'composite'
    steps:
        - name: Stash Snapshot Changes
          id: stash-snapshot-changes
          shell: bash
          run: |
              set -eux

              # `playwright.sh` runs the test container as root over a bind mount, so any directory
              # it creates — a new spec's `<spec>.ts-snapshots/` — is root-owned. The runner user can
              # then rewrite files inside pre-existing directories but cannot unlink from a new one,
              # so `git stash push -S` below warns "Permission denied", leaves the files on disk, and
              # `git stash pop` on the snapshot branch aborts on "untracked working tree files would
              # be overwritten". Reclaim ownership first; a no-op where nothing ran as root.
              sudo -n chown -R "$(id -u):$(id -g)" ${{ inputs.path }} || true

              git add ${{ inputs.path }}
              git status
              if [[ $(git diff --cached --name-only | wc -l) -gt 0 ]] ; then
                  echo "Stashing changes."
                  git stash push -S
                  echo "updates=true" >> $GITHUB_OUTPUT
              else
                  echo "No changes to commit."
                  echo "updates=false" >> $GITHUB_OUTPUT
              fi

        - name: Push Snapshot Changes
          id: push-snapshot-changes
          if: steps.stash-snapshot-changes.outputs.updates == 'true'
          shell: bash
          run: |
              set -eux

              git fetch origin ${{inputs.source_branch}}
              git switch ${{inputs.source_branch}}

              git checkout -b ${{inputs.branch}}

              git stash pop
              git add ${{ inputs.path }}
              # Based on https://github.com/actions/checkout?tab=readme-ov-file#push-a-commit-using-the-built-in-token
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git commit -m "Update ${{ inputs.type }} snapshots."

              while ! (git push origin HEAD:${{inputs.branch}}) ; do
                  git pull origin ${{inputs.branch}} --rebase --autostash
              done

        - name: Fail if snapshot updates needed
          if: steps.stash-snapshot-changes.outputs.updates == 'true'
          shell: bash
          run: |
              echo "Snapshots were updated, failing this job so it can be retried individually."
              exit 1
