name: snapshot-notify

inputs:
    branch:
        description: 'Snapshot branch name to use.'
        required: true
    run_started_at:
        description: 'ISO timestamp when the workflow run started (github.run_started_at). Used to detect stale snapshot branches from previous attempts.'
        required: true
    github_token:
        description: 'GitHub token to use for PR creation.'
        required: true
    slack_webhook:
        description: 'Slack webhook to use for notification.'
        required: true
outputs:
    updated:
        description: 'If any snapshots were updated.'
        value: ${{ steps.snapshot_check.outputs.updated }}

runs:
    using: 'composite'
    steps:
        - name: Check for snapshot updates
          id: snapshot_check
          if: inputs.branch != ''
          shell: bash
          run: |
              set -eux

              branch=${{ inputs.branch }}
              run_started_at="${{ inputs.run_started_at }}"

              if (git ls-remote --exit-code --heads origin ${branch} >/dev/null) ; then
                  # Get the timestamp of the latest commit on the snapshot branch
                  git fetch origin ${branch} --depth=1
                  snapshot_commit_time=$(git log -1 --format=%cI FETCH_HEAD)

                  # Compare timestamps - if snapshot was created before this run, it's stale
                  # This handles the case where GitHub Actions reuses successful jobs on retry,
                  # so the init job (which cleans up snapshot branches) doesn't re-run.
                  if [[ "${snapshot_commit_time}" < "${run_started_at}" ]] ; then
                      echo "Snapshot branch exists but is stale (commit: ${snapshot_commit_time}, run started: ${run_started_at})"
                      echo "updated=false" >> $GITHUB_OUTPUT
                  else
                      echo "Snapshot branch has new updates (commit: ${snapshot_commit_time}, run started: ${run_started_at})"
                      echo "updated=true" >> $GITHUB_OUTPUT
                  fi
              else
                  echo "updated=false" >> $GITHUB_OUTPUT
              fi

        - name: Add PR Comment
          if: steps.snapshot_check.outputs.updated == 'true' && github.ref != 'refs/heads/latest'
          uses: actions/github-script@v7
          continue-on-error: true
          with:
              script: |
                  const baseSha = context.payload.pull_request.base.sha;
                  const headSha = context.payload.pull_request.head.sha;
                  const headRef = context.payload.pull_request.head.ref;
                  const snapshotBranch = "${{inputs.branch}}";
                  const repoUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}`;
                  const encodedHeadRef = encodeURIComponent(headRef);
                  const encodedSnapshotBranch = encodeURIComponent(snapshotBranch);
                  const snapshotDiffUrl = `${repoUrl}/compare/${encodedHeadRef}...${encodedSnapshotBranch}`;
                  let permalinkDiffUrl;

                  try {
                      const { data: snapshotRef } = await github.rest.git.getRef({
                          owner: context.repo.owner,
                          repo: context.repo.repo,
                          ref: `heads/${snapshotBranch}`,
                      });
                      const snapshotBranchSha = snapshotRef.object.sha;
                      permalinkDiffUrl = `${repoUrl}/compare/${baseSha}...${snapshotBranchSha}`;
                  } catch (error) {
                      const warningMessage = `Unable to resolve snapshot branch ref ${snapshotBranch}: ${error.message}`;
                      if (typeof core !== 'undefined' && typeof core.warning === 'function') {
                          core.warning(warningMessage);
                      } else {
                          console.warn(warningMessage);
                      }
                      permalinkDiffUrl = `${repoUrl}/compare/${baseSha}...${headSha}`;
                  }
                  github.rest.issues.createComment({
                      issue_number: context.issue.number,
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      body: [
                          'Snapshots automatically updated, please review before merge:',
                          `- [Merge snapshot changes into this PR](${snapshotDiffUrl})`,
                          `- [Permanent snapshot diff](${permalinkDiffUrl})`
                      ].join('\n')
                  })

        - name: Raise PR with Snapshot Changes on latest
          id: raise-pr
          if: steps.snapshot_check.outputs.updated == 'true' && github.ref == 'refs/heads/latest'
          env:
              GITHUB_TOKEN: ${{ inputs.github_token }}
          shell: bash
          run: |
              set -eux

              echo "url=https://github.com/ag-grid/ag-charts/compare/${{github.ref}}...${{inputs.branch}}" >> $GITHUB_OUTPUT

                # TODO: Uncomment this when we have a way to create PRs on the latest branch that GHA will run against.
                #   pr_count=$(
                #     gh pr list \
                #         --base ${{ github.ref }} \
                #         --head ${{ inputs.branch }} \
                #         --json title \
                #         --jq 'length'
                #   )

                #   if ((pr_count > 0)); then
                #       echo "Existing PRs for snapshots, skipping PR creation."
                #       echo "skip=true" >> "$GITHUB_OUTPUT"
                #       exit
                #   fi

                #   gh pr create \
                #     --base ${{ github.ref }} \
                #     --head ${{ inputs.branch }} \
                #     --title "Snapshot updates at $(date +%Y/%m/%d-%H:%M)" \
                #     --body "Automatically generated for review."

                #   url=$(
                #     gh pr view \
                #         ${{ inputs.branch }} \
                #         --json url | jq -r .url
                #   )

                #   echo "url=${url}" >> $GITHUB_OUTPUT

        - name: Slack Notification
          uses: rtCamp/action-slack-notify@v2
          if: steps.snapshot_check.outputs.updated == 'true' && github.ref == 'refs/heads/latest'
          env:
              SLACK_WEBHOOK: ${{ inputs.slack_webhook }}
              SLACK_COLOR: 'warning'
              SLACK_ICON: https://avatars.slack-edge.com/2020-11-25/1527503386626_319578f21381f9641cd8_192.png
              SLACK_USERNAME: ag-charts CI
              SLACK_FOOTER: ''
              SLACK_MESSAGE: >
                  New E2E Snapshot PR: ${{ steps.raise-pr.outputs.url }}
