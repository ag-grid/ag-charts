name: snapshot-notify

inputs:
    branch:
        description: 'Snapshot branch name to use.'
        required: true
    github_token:
        description: 'GitHub token to use for PR creation.'
        required: true
    slack_webhook:
        description: 'Slack webhook to use for notification.'
        required: true
outputs:
    updated:
        description: 'If any snapshots were updated.'
        value: ${{ steps.snapshot_check.outputs.updated }}

runs:
    using: 'composite'
    steps:
        - name: Check for snapshot updates
          id: snapshot_check
          if: inputs.branch != ''
          shell: bash
          env:
              GH_TOKEN: ${{ inputs.github_token }}
          run: |
              set -eux

              branch=${{ inputs.branch }}
              # Start time of the CURRENT attempt, so a snapshot branch pushed
              # during a previous attempt reads as stale on a rerun.
              run_started_at=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${GITHUB_RUN_ATTEMPT:-1}" --jq .run_started_at)
              if [[ -z "${run_started_at}" ]]; then
                  echo "::error::could not resolve run_started_at from the runs API"
                  exit 1
              fi

              if (git ls-remote --exit-code --heads origin ${branch} >/dev/null) ; then
                  # Get the timestamp of the latest commit on the snapshot branch
                  git fetch origin ${branch} --depth=1
                  snapshot_commit_time=$(git log -1 --format=%cI FETCH_HEAD)

                  # Compare timestamps - if snapshot was created before this run, it's stale
                  # This handles the case where GitHub Actions reuses successful jobs on retry,
                  # so the init job (which cleans up snapshot branches) doesn't re-run.
                  if [[ "${snapshot_commit_time}" < "${run_started_at}" ]] ; then
                      echo "Snapshot branch exists but is stale (commit: ${snapshot_commit_time}, run started: ${run_started_at})"
                      echo "updated=false" >> $GITHUB_OUTPUT
                  else
                      echo "Snapshot branch has new updates (commit: ${snapshot_commit_time}, run started: ${run_started_at})"
                      echo "updated=true" >> $GITHUB_OUTPUT
                  fi
              else
                  echo "updated=false" >> $GITHUB_OUTPUT
              fi

        # Writes the `snapshot-status` fragment into the shared pr-sections dir; the caller
        # (the CI `report` job) upserts it into the consolidated PR comment via
        # ./.github/actions/pr-report-comment. No comment is created here.
        - name: Write snapshot-status section
          if: steps.snapshot_check.outputs.updated == 'true' && github.ref != 'refs/heads/latest'
          uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
          continue-on-error: true
          with:
              script: |
                  const fs = require('fs');
                  const path = require('path');
                  const baseSha = context.payload.pull_request.base.sha;
                  const headSha = context.payload.pull_request.head.sha;
                  const headRef = context.payload.pull_request.head.ref;
                  const snapshotBranch = "${{inputs.branch}}";
                  const repoUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}`;
                  const encodedHeadRef = encodeURIComponent(headRef);
                  const encodedSnapshotBranch = encodeURIComponent(snapshotBranch);
                  const snapshotDiffUrl = `${repoUrl}/compare/${encodedHeadRef}...${encodedSnapshotBranch}`;
                  let permalinkDiffUrl;
                  let delta = '';

                  try {
                      const { data: snapshotRef } = await github.rest.git.getRef({
                          owner: context.repo.owner,
                          repo: context.repo.repo,
                          ref: `heads/${snapshotBranch}`,
                      });
                      const snapshotBranchSha = snapshotRef.object.sha;
                      permalinkDiffUrl = `${repoUrl}/compare/${baseSha}...${snapshotBranchSha}`;
                      // Best-effort changed-file count (compare API caps files at 300 — fine as an indicator).
                      try {
                          const { data: cmp } = await github.rest.repos.compareCommitsWithBasehead({
                              owner: context.repo.owner,
                              repo: context.repo.repo,
                              basehead: `${headSha}...${snapshotBranchSha}`,
                          });
                          const n = (cmp.files || []).length;
                          if (n) delta = `\n\n**${n}** snapshot file${n === 1 ? '' : 's'} differ from this PR's committed baselines.`;
                      } catch (e) {
                          core.info(`Snapshot delta count unavailable: ${e.message}`);
                      }
                  } catch (error) {
                      core.warning(`Unable to resolve snapshot branch ref ${snapshotBranch}: ${error.message}`);
                      permalinkDiffUrl = `${repoUrl}/compare/${baseSha}...${headSha}`;
                  }

                  const body = [
                      // [error]: regenerated snapshots block the build and must be pulled in before merge.
                      '## [error] Snapshot status',
                      '',
                      'Snapshots were automatically regenerated by CI — please review before merge:',
                      '',
                      `- [Merge snapshot changes into this PR](${snapshotDiffUrl})`,
                      `- [Permanent snapshot diff](${permalinkDiffUrl})`,
                  ].join('\n') + delta + '\n';

                  const dir = path.join(process.env.RUNNER_TEMP, 'pr-sections');
                  fs.mkdirSync(dir, { recursive: true });
                  fs.writeFileSync(path.join(dir, '20-snapshot-status.md'), body);
                  core.info('Wrote 20-snapshot-status.md');

        - name: Raise PR with Snapshot Changes on latest
          id: raise-pr
          if: steps.snapshot_check.outputs.updated == 'true' && github.ref == 'refs/heads/latest'
          env:
              GITHUB_TOKEN: ${{ inputs.github_token }}
          shell: bash
          run: |
              set -eux

              echo "url=https://github.com/ag-grid/ag-charts/compare/${{github.ref}}...${{inputs.branch}}" >> $GITHUB_OUTPUT

                # TODO: Uncomment this when we have a way to create PRs on the latest branch that GHA will run against.
                #   pr_count=$(
                #     gh pr list \
                #         --base ${{ github.ref }} \
                #         --head ${{ inputs.branch }} \
                #         --json title \
                #         --jq 'length'
                #   )

                #   if ((pr_count > 0)); then
                #       echo "Existing PRs for snapshots, skipping PR creation."
                #       echo "skip=true" >> "$GITHUB_OUTPUT"
                #       exit
                #   fi

                #   gh pr create \
                #     --base ${{ github.ref }} \
                #     --head ${{ inputs.branch }} \
                #     --title "Snapshot updates at $(date +%Y/%m/%d-%H:%M)" \
                #     --body "Automatically generated for review."

                #   url=$(
                #     gh pr view \
                #         ${{ inputs.branch }} \
                #         --json url | jq -r .url
                #   )

                #   echo "url=${url}" >> $GITHUB_OUTPUT

        - name: Slack Notification
          uses: rtCamp/action-slack-notify@33ca3be66c6f378fe1610fd1d5258632dbed5e58 # v2.4.0
          if: steps.snapshot_check.outputs.updated == 'true' && github.ref == 'refs/heads/latest'
          env:
              SLACK_WEBHOOK: ${{ inputs.slack_webhook }}
              SLACK_COLOR: 'warning'
              SLACK_ICON: https://avatars.slack-edge.com/2020-11-25/1527503386626_319578f21381f9641cd8_192.png
              SLACK_USERNAME: ag-charts CI
              SLACK_FOOTER: ''
              SLACK_MESSAGE: >
                  New E2E Snapshot PR: ${{ steps.raise-pr.outputs.url }}
