name: setup-nx

inputs:
    yarn_postinstall:
        description: 'Always ensure yarn postinstall is run.'
        required: false
        default: 'true'
        options:
            - 'true'
            - 'false'
            - 'no-install'
    fetch_base:
        description: 'Shallow fetch latest branch.'
        required: false
        default: 'shallow'
        options:
            - 'shallow'
            - 'full'
            - 'skip'
    nx_restore:
        description: 'Restore Nx Cache.'
        required: false
        default: 'true'
    base_ref:
        description: 'Base branch/SHA for diff detection'
        default: 'origin/latest'
        required: false
    cache_mode:
        description: 'Read/write mode for caches'
        require: false
        default: 'rw'
        options:
            - 'rw'
            - 'ro'
            - 'off'
outputs:
    base:
        description: 'Base branch/SHA for diff detection'
        value: ${{ steps.nx_config.outputs.base }}
    type:
        description: 'Type of job execution detected'
        value: ${{ steps.nx_config.outputs.type }}

runs:
    using: 'composite'
    steps:
        - name: Dump GitHub context
          env:
              GITHUB_CONTEXT: ${{ toJson(github) }}
          if: ${{ env.ACTIONS_STEP_DEBUG == 'true' }}
          shell: bash
          run: echo "$GITHUB_CONTEXT"

        - name: Set Nx parallelization
          shell: bash
          run: |
              if [ -z "${NX_PARALLEL}" ]; then
                # Get CPU count in a cross-platform way
                if command -v nproc >/dev/null 2>&1; then
                  CPUS=$(nproc)
                else
                  # macOS fallback
                  CPUS=$(sysctl -n hw.logicalcpu)
                fi
                echo "NX_PARALLEL=${CPUS}" >> $GITHUB_ENV
                echo "Setting NX_PARALLEL to ${CPUS}"
              else
                echo "NX_PARALLEL already set to ${NX_PARALLEL}, skipping"
              fi

        - name: Nx Affected SHA Setup
          id: nx_config
          shell: bash
          run: |
              set -x

              branch=$(git branch --show-current)
              if [[ ${branch} == 'latest' || ${branch} == 'next' ]] ; then
                # Latest
                echo "base=${branch}-success" >> $GITHUB_OUTPUT
                echo "NX_BASE=${branch}-success" >> $GITHUB_ENV
                echo "type=latest" >> $GITHUB_OUTPUT
                git fetch origin -f --depth 1 tag ${branch}-success
              elif [[ ${branch} =~ b[0-9][0-9]\..+ ]] ; then
                # Release
                # Try to use the -success tag if it exists, otherwise fall back to branch name
                if git fetch origin -f --depth 1 tag ${branch}-success 2>/dev/null; then
                  echo "base=${branch}-success" >> $GITHUB_OUTPUT
                  echo "NX_BASE=${branch}-success" >> $GITHUB_ENV
                else
                  echo "base=${branch}" >> $GITHUB_OUTPUT
                  echo "NX_BASE=${branch}" >> $GITHUB_ENV
                fi
                echo "type=release" >> $GITHUB_OUTPUT
              else
                # PR
                echo "base=origin/${{ inputs.base_ref }}" >> $GITHUB_OUTPUT
                echo "NX_BASE=origin/${{ inputs.base_ref }}" >> $GITHUB_ENV
                echo "type=pr" >> $GITHUB_OUTPUT
                if [[ ${{ inputs.fetch_base }} == 'shallow' ]] ; then
                  git fetch origin --depth 1 ${{ inputs.base_ref }}
                elif [[ ${{ inputs.fetch_base }} == 'full' ]] ; then
                  git fetch origin ${{ inputs.base_ref }}
                fi
              fi

              cat $GITHUB_OUTPUT
              cat $GITHUB_ENV

        - name: Restore node_modules
          if: inputs.cache_mode == 'ro'
          id: cache_ro
          uses: actions/cache/restore@v4
          with:
              path: |
                  node_modules/
                  packages/*/node_modules/
                  plugins/*/node_modules/
                  libraries/*/node_modules/
                  external/*/node_modules/
              key: node_modules-${{ runner.os }}-${{hashFiles('yarn.lock','patches/*.patch', 'packages/*/package.json', 'plugins/*/package.json', 'libraries/*/package.json', 'external/*/package.json')}}
              restore-keys: node_modules-${{ runner.os }}- # Take any latest cache if failed to find it for current yarn.lock
              # fail-on-cache-miss: true

        - name: Cache node_modules
          if: inputs.cache_mode == 'rw'
          id: cache_rw
          uses: actions/cache@v4
          with:
              path: |
                  node_modules/
                  packages/*/node_modules/
                  plugins/*/node_modules/
                  libraries/*/node_modules/
                  external/*/node_modules/
              key: node_modules-${{ runner.os }}-${{hashFiles('yarn.lock','patches/*.patch', 'packages/*/package.json', 'plugins/*/package.json', 'libraries/*/package.json', 'external/*/package.json')}}
              restore-keys: node_modules-${{ runner.os }}- # Take any latest cache if failed to find it for current yarn.lock

        - name: Cache Nx
          if: inputs.cache_mode == 'rw' && inputs.nx_restore != 'false'
          uses: actions/cache@v4
          with:
              path: |
                  .nx/cache
                  .nx/workspace-data
              key: cache-nx-v20-${{ hashFiles('yarn.lock','patches/*.patch', 'packages/*/package.json', 'plugins/*/package.json') }}-${{ github.sha }}
              restore-keys: cache-nx-v20-${{ hashFiles('yarn.lock','patches/*.patch', 'packages/*/package.json', 'plugins/*/package.json') }}-

        - name: Restore Nx
          if: inputs.cache_mode == 'ro' && inputs.nx_restore != 'false'
          id: cache_nx_ro
          uses: actions/cache/restore@v4
          with:
              path: |
                  .nx/cache
                  .nx/workspace-data
              key: cache-nx-v20-${{ hashFiles('yarn.lock','patches/*.patch', 'packages/*/package.json', 'plugins/*/package.json') }}-${{ github.sha }}
              restore-keys: cache-nx-v20-${{ hashFiles('yarn.lock','patches/*.patch', 'packages/*/package.json', 'plugins/*/package.json') }}-
              # fail-on-cache-miss: true

        - name: Tidy Nx Cache
          uses: ./.github/actions/tidy-nx-cache
          if: inputs.cache_mode == 'rw' && inputs.nx_restore != 'false'
          with:
              branch_type: ${{ steps.nx_config.outputs.type }}

        - name: MacOS Setup
          if: inputs.os == 'macos'
          shell: bash
          run: |
              brew install fontconfig libpng jpeg giflib librsvg

        - name: Setup Node.js
          id: setup_node
          uses: actions/setup-node@v4
          with:
              node-version-file: package.json

        - name: yarn install
          if: inputs.yarn_postinstall == 'true'
          id: yarn_install_slow
          shell: bash
          run: |
              if (yarn check --integrity) ; then
                yarn postinstall
              else
                yarn install --ci

                # Ensure that the integrity check passes after install to avoid
                # cache polution with entries that will fail future integrity checks.
                yarn check --integrity
              fi

        - name: yarn install (skipping postinstall)
          if: inputs.yarn_postinstall == 'false'
          id: yarn_install_fast
          shell: bash
          run: |
              yarn check --integrity || yarn install --ci

        - name: yarn install (skipping postinstall)
          if: inputs.yarn_postinstall == 'no-install' && steps.cache_ro.outputs.cache-hit != 'false'
          id: yarn_install_check
          shell: bash
          run: |
              yarn check --integrity
