name: Jira AI-branch / AI-PR-URL writeback
description: |
    Writes the branch name (customfield_10946 "AI branch") and the draft PR
    URL (customfield_10947 "AI PR URL") onto a Jira issue.

    Auto-discovery (when inputs are empty):
      branch  -> `git -C $GITHUB_WORKSPACE branch --show-current`
      pr_url  -> `gh pr list --head <branch> --state open --json url --jq '.[0].url // empty'`

    Fields are only updated when a value is resolved — empty or missing values
    leave the existing field untouched. Skipping rather than blanking means
    repeat invocations on a follow-up job (e.g. pr-iterate) don't lose state.

inputs:
    issue_key:
        description: JIRA issue key (e.g. AG-12345).
        required: true
    branch:
        description: Override the auto-detected branch name.
        required: false
        default: ''
    pr_url:
        description: Override the auto-detected PR URL.
        required: false
        default: ''
    github_token:
        description: Token used by `gh` to resolve the PR URL.
        required: true
    jira_email:
        required: true
    jira_api_token:
        required: true
    jira_site_url:
        required: true

runs:
    using: composite
    steps:
        - name: Write AI branch + AI PR URL
          shell: bash
          env:
              ISSUE_KEY: ${{ inputs.issue_key }}
              BRANCH_IN: ${{ inputs.branch }}
              PR_URL_IN: ${{ inputs.pr_url }}
              GH_TOKEN: ${{ inputs.github_token }}
              JIRA_USER_EMAIL: ${{ inputs.jira_email }}
              JIRA_API_TOKEN: ${{ inputs.jira_api_token }}
              JIRA_SITE_URL: ${{ inputs.jira_site_url }}
          run: |
              set -euo pipefail
              : "${ISSUE_KEY:?}" "${JIRA_USER_EMAIL:?}" "${JIRA_API_TOKEN:?}" "${JIRA_SITE_URL:?}"

              BRANCH="$BRANCH_IN"
              if [[ -z "$BRANCH" ]]; then
                  BRANCH="$(git -C "$GITHUB_WORKSPACE" branch --show-current 2>/dev/null || true)"
              fi

              PR_URL="$PR_URL_IN"
              if [[ -z "$PR_URL" && -n "$BRANCH" ]]; then
                  PR_URL="$(gh pr list --head "$BRANCH" --state open --json url --jq '.[0].url // empty' 2>/dev/null || true)"
              fi

              echo "[pr-writeback] branch='$BRANCH' pr_url='$PR_URL'"
              if [[ -z "$BRANCH" && -z "$PR_URL" ]]; then
                  echo "[pr-writeback] nothing to write — both branch and pr_url empty"
                  exit 0
              fi

              TMP=$(mktemp)
              echo '{}' > "$TMP"
              if [[ -n "$BRANCH" ]]; then
                  jq --arg v "$BRANCH" '. + { customfield_10946: $v }' "$TMP" > "$TMP.n" && mv "$TMP.n" "$TMP"
              fi
              if [[ -n "$PR_URL" ]]; then
                  jq --arg v "$PR_URL" '. + { customfield_10947: $v }' "$TMP" > "$TMP.n" && mv "$TMP.n" "$TMP"
              fi
              BODY=$(jq -n --slurpfile f "$TMP" '{ fields: $f[0] }')

              SITE="${JIRA_SITE_URL%/}"
              AUTH="$(printf '%s:%s' "$JIRA_USER_EMAIL" "$JIRA_API_TOKEN" | base64 | tr -d '\n')"
              HTTP=$(curl -sS -o /tmp/pr-write.out -w '%{http_code}' \
                  -X PUT \
                  -H "authorization: Basic $AUTH" \
                  -H 'accept: application/json' \
                  -H 'content-type: application/json' \
                  --data "$BODY" \
                  "$SITE/rest/api/3/issue/$ISSUE_KEY")
              if [[ "$HTTP" != "204" && "$HTTP" != "200" ]]; then
                  echo "[pr-writeback] PUT failed: HTTP $HTTP" >&2
                  cat /tmp/pr-write.out >&2 || true
                  exit 1
              fi

              {
                  echo "## AI branch / PR writeback"
                  echo ""
                  echo "| Issue | Branch | PR URL |"
                  echo "|---|---|---|"
                  echo "| \`$ISSUE_KEY\` | $([ -n "$BRANCH" ] && echo "\`$BRANCH\`" || echo '_(unchanged)_') | $([ -n "$PR_URL" ] && echo "$PR_URL" || echo '_(unchanged)_') |"
              } >> "$GITHUB_STEP_SUMMARY"
