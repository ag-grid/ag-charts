name: Jira AI-status writeback
description: |
    Owns the `AI status` (customfield_10942) and `AI failure` (customfield_10948)
    fields. Semantics:

    - `mode: pre-job` — set `AI status` to the in-progress value for the stage
      (`triaging` / `building` / `pr-iterating`). Doesn't touch `AI failure`.
    - `mode: post-job` + `outcome: success` — advance `AI status` to the next
      stable value (`awaiting-clarity` / `draft-pr-open` / `done`) AND clear
      `AI failure`.
    - `mode: post-job` + `outcome: failure | cancelled` — **leave `AI status`
      untouched** (stays at the in-progress value the pre-job step set), and
      write a failure reason into `AI failure`. Jira-side retry-action
      gating can read either field — failure detail is in `AI failure`, the
      stage discriminator is in `AI status`.

inputs:
    issue_key:
        description: JIRA issue key (e.g. AG-12345).
        required: true
    mode:
        description: '`pre-job` (set the in-progress value for this stage) or `post-job` (set the terminal value).'
        required: true
    stage:
        description: |
            Stage name — `triage` | `build` | `pr-iterate`. Drives the value-mapping table.
        required: true
    outcome:
        description: |
            For `mode: post-job` only. The job.status value from the surrounding
            job (`success` | `failure` | `cancelled`).
        required: false
        default: success
    jira_email:
        required: true
    jira_api_token:
        required: true
    jira_site_url:
        required: true

runs:
    using: composite
    steps:
        - name: Write AI status
          shell: bash
          env:
              ISSUE_KEY: ${{ inputs.issue_key }}
              MODE: ${{ inputs.mode }}
              STAGE: ${{ inputs.stage }}
              OUTCOME: ${{ inputs.outcome }}
              JIRA_USER_EMAIL: ${{ inputs.jira_email }}
              JIRA_API_TOKEN: ${{ inputs.jira_api_token }}
              JIRA_SITE_URL: ${{ inputs.jira_site_url }}
              RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          run: |
              set -euo pipefail
              : "${ISSUE_KEY:?}" "${MODE:?}" "${STAGE:?}"
              : "${JIRA_USER_EMAIL:?}" "${JIRA_API_TOKEN:?}" "${JIRA_SITE_URL:?}"

              in_progress_for() {
                  case "$1" in
                      triage)     echo "triaging" ;;
                      build)      echo "building" ;;
                      pr-iterate) echo "pr-iterating" ;;
                      *) echo "[status-writeback] unknown stage: $1" >&2; return 1 ;;
                  esac
              }
              next_for() {
                  case "$1" in
                      triage)     echo "awaiting-clarity" ;;
                      build)      echo "draft-pr-open" ;;
                      pr-iterate) echo "done" ;;
                      *) echo "[status-writeback] unknown stage: $1" >&2; return 1 ;;
                  esac
              }

              SITE="${JIRA_SITE_URL%/}"
              AUTH="$(printf '%s:%s' "$JIRA_USER_EMAIL" "$JIRA_API_TOKEN" | base64 | tr -d '\n')"

              put_fields() {
                  local body="$1"
                  local http
                  http=$(curl -sS -o /tmp/status-write.out -w '%{http_code}' \
                      -X PUT \
                      -H "authorization: Basic $AUTH" \
                      -H 'accept: application/json' \
                      -H 'content-type: application/json' \
                      --data "$body" \
                      "$SITE/rest/api/3/issue/$ISSUE_KEY")
                  if [[ "$http" != "204" && "$http" != "200" ]]; then
                      echo "[status-writeback] PUT failed: HTTP $http" >&2
                      cat /tmp/status-write.out >&2 || true
                      return 1
                  fi
              }

              if [[ "$MODE" == "pre-job" ]]; then
                  VAL="$(in_progress_for "$STAGE")"
                  echo "[status-writeback] $ISSUE_KEY: stage=$STAGE mode=pre-job -> AI status='$VAL'"
                  BODY=$(jq -n --arg v "$VAL" '{ fields: { customfield_10942: { value: $v } } }')
                  put_fields "$BODY"
                  exit 0
              fi

              if [[ "$MODE" == "post-job" ]]; then
                  if [[ "$OUTCOME" == "success" ]]; then
                      VAL="$(next_for "$STAGE")"
                      echo "[status-writeback] $ISSUE_KEY: stage=$STAGE mode=post-job outcome=success -> AI status='$VAL', AI failure=cleared"
                      # advance status + clear failure field in one PUT
                      BODY=$(jq -n --arg v "$VAL" '{ fields: { customfield_10942: { value: $v }, customfield_10948: null } }')
                      put_fields "$BODY"
                      exit 0
                  fi

                  # failure / cancelled — do NOT touch AI status (it stays at the
                  # in-progress value pre-job set, so retry-action gates work).
                  # Write the failure reason into AI failure (textarea).
                  REASON="[$STAGE] outcome=$OUTCOME on run $RUN_URL"
                  echo "[status-writeback] $ISSUE_KEY: stage=$STAGE mode=post-job outcome=$OUTCOME -> AI failure='$REASON' (AI status untouched)"
                  BODY=$(jq -n --arg r "$REASON" '{ fields: { customfield_10948: $r } }')
                  put_fields "$BODY"
                  exit 0
              fi

              echo "[status-writeback] unknown mode: $MODE" >&2
              exit 1
